<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120d2a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Nova Missions — NovaTitre</title>
<meta name="description" content="NovaTitre, l'école de Bourse qui s'apprend en jouant. Simulateur avec argent fictif uniquement : aucun ordre réel, aucun conseil en investissement.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/old.css">
</head>
<body>
<div id="app"></div>
<noscript>
  <p style="max-width:32rem;margin:3rem auto;padding:0 16px;font:16px/1.5 Inter,system-ui,sans-serif;color:#fff">
    NovaTitre a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, puis recharge la page.
    NovaTitre est une école : tout se fait avec de l'argent fictif.
  </p>
</noscript>

<!-- 1. Moteur pur (calculs, habilitations) : aucun accès réseau, aucun état. -->
<script src="js/engine/calc.js" defer></script>
<script src="js/engine/habilitations.js" defer></script>

<!-- 1 bis. Moteur 3D (Three.js r149, licence MIT) : points lumineux de l’ouverture, du temple et des vidéos. -->
<script src="js/vendor/three.min.js" defer></script>
<script src="js/gl.js" defer></script>

<!-- 2. Contenus de l'école. L'ordre compte : data.js crée les aides utilisées par les missions. -->
<script src="content/data.js" defer></script>
<script src="content/market-real.js" defer></script>
<script src="content/missions-1.js" defer></script>
<script src="content/missions-2.js" defer></script>
<script src="content/missions-3.js" defer></script>
<script src="content/missions-4.js" defer></script>
<script src="content/missions-5.js" defer></script>
<script src="content/missions-6.js" defer></script>
<script src="content/missions-7.js" defer></script>

<!-- 3. Graphiques, puis cours, examens, variantes, séances et actualité. -->
<script src="js/candles.js" defer></script>
<script src="content/cours.js" defer></script>
<script src="content/exams.js" defer></script>
<script src="content/variants.js" defer></script>
<script src="content/sessions.js" defer></script>
<script src="content/sessions-2.js" defer></script>
<script src="content/realdata.js" defer></script>

<!-- 4. Coach (sans clé dans le navigateur : il passe par /api/coach ou reste en mode local), puis l'application. -->
<script src="js/ai.js" defer></script>
<script src="js/app.js" defer></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));</script>
</body>
</html>
