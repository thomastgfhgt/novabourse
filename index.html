<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaBourse — Trois IA analysent les marchés. Vous décidez.</title>
<meta name="description" content="NovaBourse analyse les entreprises cotées avec trois intelligences artificielles et un score de qualité et de risque expliqué en clair.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
<style>
/* ============================================================
   NOVABOURSE — SYSTÈME VISUEL
   Clair, aéré, peu d'éléments par écran. Un accent, une couleur
   de hausse, une couleur de baisse. Rien d'autre.
   ============================================================ */
:root{
  /* ============================================================
     NOVABOURSE — DESIGN SYSTEM
     Direction : lumineuse, très aérée, bleu d'accent, grands arrondis.
     Un seul endroit définit couleurs, échelles, rayons et ombres :
     modifier un token propage le changement à toute l'application.
     ============================================================ */
  color-scheme:light;

  /* ---- Surfaces ---- */
  --bg:#ffffff;              /* fond principal */
  --bg-2:#f4f5f8;            /* grandes cartes, gris très clair */
  --bg-3:#eceef3;            /* survol, pistes, états pressés */
  --bg-4:#e3e6ed;            /* séparateurs appuyés, jauges */

  /* ---- Texte ---- */
  --ink:#0d1117;             /* titres et valeurs : anthracite, pas noir pur */
  --ink-2:#3d4453;           /* texte courant */
  --ink-3:#6b7385;           /* labels secondaires */
  --ink-4:#9aa1b1;           /* mentions discrètes */

  /* ---- Accent : le bleu devient l'identité ---- */
  --accent:#3557f6;
  --accent-hover:#2a48d8;
  --accent-press:#2440c0;
  --accent-soft:#eef2ff;     /* fonds d'accent très légers */
  --accent-ink:#ffffff;      /* texte sur accent */

  /* ---- Couleurs de sens financier ----
     Le vert et le rouge ne portent plus l'identité : ils portent une
     information. Hausse, baisse, risque — rien d'autre. */
  --up:#16a34a;   --up-soft:#e9f7ee;
  --down:#dc2626; --down-soft:#fdecec;
  --warn:#b45309; --warn-soft:#fdf4e7;

  /* ---- Bordures : presque invisibles ---- */
  --line:#e6e9f0;
  --line-2:#eef0f5;

  /* ---- Rayons : généreux ---- */
  --r-xs:8px; --r-s:12px; --r-m:18px; --r-l:24px; --r-xl:32px; --r-pill:999px;

  /* ---- Ombres : extrêmement discrètes ---- */
  --shadow-1:none;
  --shadow-2:0 1px 2px rgba(13,17,23,.04), 0 8px 24px rgba(13,17,23,.05);
  --shadow-3:0 2px 6px rgba(13,17,23,.06), 0 24px 48px rgba(13,17,23,.08);
  --shadow-accent:0 8px 24px rgba(53,87,246,.24);

  /* ---- Espacement : grille de 8 ---- */
  --space-2:8px;  --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px; --sp-6:80px;
  --space-xs:8px; --space-sm:16px; --space-md:24px; --space-lg:32px;

  /* ---- Échelle typographique ---- */
  --t-display:clamp(38px,7vw,60px);
  --t-title:clamp(26px,4vw,36px);
  --t-h2:21px;
  --t-h3:17px;
  --t-body:15.5px;
  --t-small:13.5px;
  --t-label:12.5px;
  --t-micro:11.5px;
  --lh-tight:1.06; --lh-title:1.15; --lh-body:1.6;

  /* ---- Cases d'icônes ---- */
  --icon-box:44px; --icon-gap:16px; --card-pad:24px;

  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.32,.72,0,1);
  --fast:.14s; --slow:.28s;
  --tap:44px;
}

/* Thème sombre : construit avec les MÊMES tokens, jamais par inversion.
   Le bleu est éclairci pour rester lisible sur fond foncé. */
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --bg-2:#161a21; --bg-3:#1d222b; --bg-4:#252b36;
  --ink:#f2f4f8; --ink-2:#c3c9d4; --ink-3:#8d95a4; --ink-4:#646c7c;
  --accent:#5b7cff; --accent-hover:#7590ff; --accent-press:#4568f0;
  --accent-soft:#161d33; --accent-ink:#0e1116;
  --up:#3ecf7f; --up-soft:#11251a; --down:#f87171; --down-soft:#2a1416;
  --warn:#e0a63a; --warn-soft:#2a2110;
  --line:#242a34; --line-2:#1b2028;
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-3:0 2px 6px rgba(0,0,0,.45), 0 24px 48px rgba(0,0,0,.45);
  --shadow-accent:0 8px 24px rgba(91,124,255,.22);
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html{background:var(--bg)}
/* Halos très faibles, fixes : la page a un relief que l'œil ne sait pas nommer. */
[data-theme="xxx"] body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 50% -8%, rgba(120,140,255,.07), transparent 70%),
    radial-gradient(50% 35% at 90% 12%, rgba(0,200,140,.05), transparent 70%),
    radial-gradient(70% 50% at 8% 60%, rgba(140,120,255,.035), transparent 70%);
}
/* La barre du bas et l'en-tête restent fixes dans les DEUX thèmes.
   Une ancienne règle les repassait en position relative en sombre : la
   navigation partait alors tout en bas de la page. */
body{
  background:var(--bg);color:var(--ink);max-width:100vw;
  /* forcé : empêche une inversion automatique de casser les contrastes */
  forced-color-adjust:none;font-family:var(--font);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em;
  transition:background .3s var(--spring),color .3s var(--spring);
}
button,input,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;transition:all .2s var(--spring)}
button:active{transform:scale(.97)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
.mono,.tabular-nums{font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  font-feature-settings:'tnum' 1,'cv01' 1}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---------- CENTRAGE DES ICÔNES ----------
   On n'utilise PAS le raccourci place-items : certains navigateurs mobiles
   l'ignorent sur les conteneurs grille, et l'icône se colle alors en haut à
   gauche de sa case. On déclare donc flex + align-items + justify-content,
   universellement gérés, et on ajoute margin:auto sur l'enfant en filet. */
.cap-i,.trio-i,.onb-i,.gate-i,.quick-ic,.empty-i,.ai-d,.flow-n,.onb-n,
.logo-m,.icon-btn,.star,.info,.x,.av,.sq-ic{
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:0;
  flex-shrink:0;
  overflow:hidden;
  padding:0;
  text-align:center
}
.cap-i>svg,.trio-i>svg,.onb-i>svg,.gate-i>svg,.quick-ic>svg,.empty-i>svg,
.logo-m>svg,.icon-btn>svg,.star>svg,.x>svg,.sq-ic>svg,.ai-d>svg{
  display:block;
  margin:auto;
  flex:0 0 auto
}
/* Les cases qui contiennent du texte (initiales, numéros) le recentrent aussi. */
.flow-n,.onb-n,.av,.ai-d,.info{line-height:1}

/* ---------- en-tête ---------- */
.top{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-2);
  padding-top:env(safe-area-inset-top);
}
[data-theme="dark"] .top{background:rgba(8,9,12,.72);border-bottom-color:rgba(255,255,255,.06)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;
  gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;
  letter-spacing:-.03em;flex:0 0 auto;white-space:nowrap}
.logo-m{width:28px;height:28px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.logo-m svg{width:16px;height:16px}
.top-nav{display:flex;gap:2px;margin-left:var(--sp-3)}
.top-nav a{padding:8px 14px;border-radius:100px;font-size:14.5px;font-weight:500;color:var(--ink-3)}
.top-nav a:hover{color:var(--ink);background:var(--bg-2)}
.top-nav a[aria-current]{color:var(--ink);font-weight:600;background:var(--bg-2)}
.top-act{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
#srcBadge{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--bg-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}

/* ---------- barre flottante mobile ---------- */
.dock{display:none}
@media (max-width:900px){
  .top-nav{display:none}
  .dock{
    display:flex;position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
    background:rgba(248,249,251,.86);backdrop-filter:saturate(180%) blur(24px);
    -webkit-backdrop-filter:saturate(180%) blur(24px);
    border:.5px solid rgba(0,0,0,.07);border-radius:100px;
    padding:7px;gap:2px;box-shadow:var(--shadow-3);max-width:calc(100vw - 24px)
  }
  [data-theme="dark"] .dock{background:rgba(28,31,35,.88);border-color:rgba(255,255,255,.09)}
  .dock button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-width:60px;padding:8px 6px 7px;border-radius:100px;color:var(--ink-3);
    font-size:10.5px;font-weight:600;letter-spacing:-.01em
  }
  .dock button svg{width:22px;height:22px}
  .dock button[aria-current]{background:var(--bg);color:var(--accent);box-shadow:var(--shadow-1)}
  [data-theme="dark"] .dock button[aria-current]{background:rgba(255,255,255,.1);color:var(--accent-2)}
}

/* ---------- mise en page ---------- */
.wrap{max-width:1120px;margin:0 auto;padding:var(--sp-4) 22px calc(var(--sp-6) + 40px)}
.section{margin-top:96px}
.section:first-child{margin-top:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-3)}

/* ---------- typographie ---------- */
.display{font-size:var(--t-display);font-weight:700;letter-spacing:-.04em;line-height:var(--lh-tight)}
.title{font-size:var(--t-title);font-weight:700;letter-spacing:-.032em;line-height:var(--lh-title)}
.h2{font-size:var(--t-h2);font-weight:650;letter-spacing:-.024em}
.h3{font-size:var(--t-h3);font-weight:600;letter-spacing:-.018em}
.lead{font-size:17px;color:var(--ink-3);line-height:var(--lh-body);letter-spacing:-.01em}
.small{font-size:var(--t-small);color:var(--ink-3);line-height:var(--lh-body)}
.tiny{font-size:var(--t-micro);color:var(--ink-4);line-height:1.5}
.eyebrow{font-size:var(--t-label);font-weight:600;letter-spacing:.02em;color:var(--accent);text-transform:none}
.center{text-align:center}
.measure{max-width:34ch}
.measure-l{max-width:58ch}

/* ---------- boutons : capsules, sans contour inutile ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:13px 26px;border-radius:var(--r-pill);
  font-size:var(--t-body);font-weight:600;letter-spacing:-.012em;white-space:nowrap;
  transition:background var(--fast) ease,color var(--fast) ease,
    box-shadow var(--fast) ease,transform var(--fast) ease,opacity var(--fast) ease}
.btn:active{transform:scale(.985)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px}

/* Action principale : bleu plein, texte blanc. */
.btn-a{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-accent)}
.btn-a:hover{background:var(--accent-hover)}
.btn-a:active{background:var(--accent-press)}

/* Action secondaire : surface claire, sans bordure. */
.btn-s{background:var(--bg-2);color:var(--ink)}
.btn-s:hover{background:var(--bg-3)}

/* Action tertiaire : contour d'un cheveu. */
.btn-g,.btn-ghost{background:transparent;color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--line)}
.btn-g:hover,.btn-ghost:hover{background:var(--bg-2);color:var(--ink)}

.btn-p{background:var(--ink);color:var(--bg)}
.btn-p:hover{opacity:.88}
.btn-sm{min-height:38px;padding:9px 18px;font-size:var(--t-small)}
.btn-lg{min-height:54px;padding:16px 32px;font-size:16.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- cartes : grandes, arrondies, sans bordure ---------- */
.card{background:var(--bg-2);border:none;border-radius:var(--r-l);
  padding:var(--card-pad);box-shadow:none}
.card-flat{background:var(--bg-2);border-radius:var(--r-l);padding:var(--card-pad)}
.card-lift{transition:background var(--slow) var(--ease)}
.card-lift:hover{background:var(--bg-3)}
.card-white{background:var(--bg);box-shadow:var(--shadow-2)}
.grid{display:grid;gap:var(--space-4)}
.g-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}

/* ---------- champs ---------- */
.field{width:100%;padding:15px 18px;border-radius:var(--r-s);background:var(--bg-2);
  border:1.5px solid transparent;min-height:var(--tap);font-size:var(--t-body);
  transition:border-color var(--fast) ease,background var(--fast) ease}
.field:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.field::placeholder{color:var(--ink-4)}
.field[aria-invalid="true"]{border-color:var(--down)}

/* ---------- sélecteurs segmentés ---------- */
.seg{display:inline-flex;padding:4px;background:var(--bg-2);border-radius:var(--r-pill);
  gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 18px;border-radius:var(--r-pill);font-size:var(--t-small);
  font-weight:550;color:var(--ink-3);white-space:nowrap;min-height:38px;
  transition:background var(--fast) ease,color var(--fast) ease}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;
  box-shadow:var(--shadow-2)}

/* ---------- interrupteur ---------- */
.sw{width:50px;height:30px;border-radius:var(--r-pill);background:var(--bg-4);
  position:relative;flex:0 0 auto;transition:background var(--slow) var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-2);transition:transform var(--slow) var(--ease)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(20px)}

/* ---------- séparateurs et états ---------- */
.divider{height:1px;background:var(--line-2);margin:var(--space-5) 0;border:none}
.sk{background:linear-gradient(90deg,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%);
  background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:var(--r-s);display:block}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:var(--r-xs)}

/* ---------- pastilles ---------- */
/* ---------- pastilles ---------- */
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;
  font-size:12.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.tag-up{background:var(--up-soft);color:var(--up)}
.tag-down{background:var(--down-soft);color:var(--down)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-neutral{background:var(--bg-3);color:var(--ink-3)}
.tag-accent{background:var(--accent-soft);color:var(--accent)}
.tag-violet{background:var(--violet-soft);color:var(--violet)}
.up-t{color:var(--up)} .down-t{color:var(--down)}

/* ---------- accueil ---------- */
.hero{padding:var(--sp-5) 0 var(--sp-4);text-align:center}
.hero .display{margin:0 auto;max-width:16ch}
.hero .lead{margin:var(--sp-3) auto 0;max-width:52ch}
.hero-btns{margin-top:var(--sp-4);display:flex;gap:var(--sp-1);justify-content:center;flex-wrap:wrap}
.hero-note{margin-top:var(--sp-2);font-size:12.5px;color:var(--ink-4)}

.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-2);
  margin-top:var(--sp-5)}
.trio-c{padding:var(--sp-3);border-radius:var(--r-m);background:var(--bg-2);text-align:center}
.trio-i{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-1);
  background:var(--bg);box-shadow:var(--shadow-1);color:var(--accent)}
.trio-i svg{width:21px;height:21px}
.trio-c b{display:block;font-size:15px;font-weight:650;letter-spacing:-.02em}
.trio-c span{display:block;font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.45}

/* ---------- recherche ---------- */
.search-btn{display:flex;align-items:center;gap:11px;width:100%;max-width:520px;margin:var(--sp-3) auto 0;
  padding:15px 20px;border-radius:100px;background:var(--bg-2);color:var(--ink-4);font-size:15.5px;
  text-align:left;border:1px solid transparent;transition:all .25s var(--spring)}
.search-btn:hover{background:var(--bg);border-color:var(--line);box-shadow:var(--shadow-2);
  transform:translateY(-2px)}
.search-btn:active{transform:scale(.99)}
.search-btn svg{width:18px;height:18px;flex:0 0 auto}
.search-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-btn kbd{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:7px;
  background:var(--bg-3);color:var(--ink-4)}
.field{width:100%;padding:14px 16px;border-radius:var(--r-s);background:var(--bg-2);
  border:1.5px solid transparent;min-height:var(--tap)}
.field:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.field::placeholder{color:var(--ink-4)}

/* ---------- listes ---------- */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--sp-2);width:100%;padding:14px 0;text-align:left;
  border-bottom:1px solid var(--line-2);min-height:var(--tap);min-width:0}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg-2);border-radius:var(--r-s);padding-left:10px;padding-right:10px;
  margin-left:-10px;margin-right:-10px;border-color:transparent}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:13px;font-weight:700;letter-spacing:-.03em;color:#fff}
.row-main{flex:1;min-width:0}
.row-t{font-size:15px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:12.5px;color:var(--ink-4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{flex:0 0 auto;text-align:right;display:flex;align-items:center;gap:10px;min-width:0}
.row-spark{flex:0 0 auto;width:78px;height:26px;overflow:hidden;display:block}
.row-spark svg{display:block;width:100%;height:100%}
/* Le graphique miniature disparaît quand la place manque, plutôt que de
   chevaucher le nom de l'entreprise. */
@media (max-width:560px){ .row-spark{display:none} }

/* ---------- score ---------- */
.score-hero{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--bg-3)}
.ring .fg{transition:stroke-dashoffset 1.4s var(--spring)}
.ring-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.ring-v{font-size:42px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.ring-l{font-size:11.5px;color:var(--ink-4);margin-top:3px}
.bars{margin-top:var(--sp-3)}
.bar{padding:13px 0;border-bottom:1px solid var(--line-2)}
.bar:last-child{border-bottom:none}
.bar-t{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.bar-n{font-size:14.5px;font-weight:550;letter-spacing:-.02em}
.bar-v{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;flex:0 0 auto}
.bar-track{height:6px;border-radius:100px;background:var(--bg-3);margin-top:9px;overflow:hidden}
.bar-fill{display:block;height:100%;width:0;border-radius:100px;transition:width 1.1s var(--spring)}
.bar-h{font-size:12.5px;color:var(--ink-4);margin-top:7px;line-height:1.45}
.bar.off .bar-n,.bar.off .bar-v{color:var(--ink-4)}

/* ---------- points forts / faibles ---------- */
.pts{list-style:none}
.pts li{display:flex;gap:10px;padding:8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.pts li i{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:13px;font-weight:700;margin-top:1px}
.pts.good li i{background:var(--up-soft);color:var(--up)}
.pts.bad li i{background:var(--down-soft);color:var(--down)}
.pts b{color:var(--ink);font-weight:600}

/* ---------- tarifs ---------- */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:var(--sp-2);
  margin-top:var(--sp-3)}
.plan{position:relative;padding:var(--sp-3);border-radius:var(--r-l);border:1.5px solid var(--line);
  display:flex;flex-direction:column;background:var(--bg);transition:all .3s var(--spring)}
.plan:hover{border-color:var(--ink-4)}
.plan.hot{border-color:var(--ink);box-shadow:var(--shadow-2)}
.plan-b{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:100px;
  background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:650;white-space:nowrap}
.plan-n{font-size:15px;font-weight:650;letter-spacing:-.02em}
.plan-p{font-size:40px;font-weight:700;letter-spacing:-.05em;margin-top:var(--sp-1);line-height:1}
.plan-p small{font-size:14.5px;font-weight:500;color:var(--ink-4);letter-spacing:-.01em}
.plan-d{font-size:13.5px;color:var(--ink-3);margin-top:8px;line-height:1.45;min-height:40px}
.plan ul{list-style:none;margin:var(--sp-3) 0;flex:1}
.plan li{display:flex;gap:9px;padding:6px 0;font-size:14px;color:var(--ink-2);line-height:1.45}
.plan li svg{width:16px;height:16px;flex:0 0 auto;margin-top:3px;color:var(--accent)}
.plan li.off{color:var(--ink-4)}
.plan li.off svg{color:var(--ink-4)}

/* ---------- IA ---------- */
.notice{padding:16px 18px;border-radius:var(--r-m);background:var(--warn-soft);
  font-size:13.5px;color:var(--ink-2);line-height:1.55}
.notice b{color:var(--warn)}


/* ---------- feuille modale ---------- */
.sheet-bg{position:fixed;inset:0;z-index:90;background:rgba(10,12,15,.4);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;padding:var(--sp-2)}
.sheet-bg.on{display:flex;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:520px;background:var(--bg);border-radius:var(--r-xl);padding:var(--sp-3);
  max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-3);animation:sheetIn .42s var(--spring)}
@keyframes sheetIn{from{transform:translateY(24px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.sheet-h{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.035em}
.sheet p{font-size:15px;color:var(--ink-3);line-height:1.55;margin-top:10px}
.x{width:34px;height:34px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);flex:0 0 auto}
.x:hover{background:var(--bg-3);color:var(--ink)}
.x svg{width:15px;height:15px}
@media (max-width:640px){
  .sheet-bg{align-items:flex-end;padding:0}
  .sheet{max-width:100%;border-radius:var(--r-xl) var(--r-xl) 0 0;max-height:92vh;
    padding-bottom:calc(var(--sp-3) + env(safe-area-inset-bottom));animation:sheetUp .42s var(--spring)}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:95;
  transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:13px 22px;
  border-radius:100px;font-size:14.5px;font-weight:550;opacity:0;pointer-events:none;
  transition:all .35s var(--spring);box-shadow:var(--shadow-3);max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- segments et filtres ---------- */
.seg{display:inline-flex;padding:3px;background:var(--bg-2);border-radius:100px;gap:2px;
  max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:8px 16px;border-radius:100px;font-size:14px;font-weight:550;color:var(--ink-3);
  white-space:nowrap;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;box-shadow:var(--shadow-1)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:9px 15px;border-radius:100px;background:var(--bg-2);font-size:13.5px;font-weight:550;
  color:var(--ink-3);min-height:38px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--bg-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- état vide ---------- */
.empty{text-align:center;padding:var(--sp-4) var(--sp-2)}
.empty-i{width:56px;height:56px;border-radius:18px;background:var(--bg-2);display:flex;align-items:center;justify-content:center;
  margin:0 auto var(--sp-2);color:var(--ink-4)}
.empty-i svg{width:26px;height:26px}
.empty h3{font-size:18px;font-weight:650;letter-spacing:-.025em}
.empty p{font-size:14.5px;color:var(--ink-3);margin:8px auto 0;max-width:38ch;line-height:1.5}

/* ---------- squelettes ---------- */
.sk{background:linear-gradient(90deg,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%);
  background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:8px;display:block}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* ---------- animations d'entrée ---------- */
.rise{opacity:0;transform:translateY(16px)}
.rise.seen{animation:rise .7s var(--spring) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.page-in{animation:pageIn .38s var(--spring)}
@keyframes pageIn{from{opacity:0;transform:translateY(12px) scale(.995)}to{opacity:1;transform:none}}
.page-in>*{animation:stagger .5s var(--spring) backwards}
.page-in>*:nth-child(1){animation-delay:.02s} .page-in>*:nth-child(2){animation-delay:.06s}
.page-in>*:nth-child(3){animation-delay:.1s}  .page-in>*:nth-child(4){animation-delay:.14s}
.page-in>*:nth-child(5){animation-delay:.18s} .page-in>*:nth-child(6){animation-delay:.22s}
@keyframes stagger{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.chart-line{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 1.3s var(--spring) forwards}
@keyframes draw{to{stroke-dashoffset:0}}




/* Repère de version, visible en permanence : il dit quelle version du fichier
   est réellement affichée par le navigateur. */
.build{display:inline-flex;align-items:center;padding:4px 8px;border-radius:100px;flex:0 0 auto;
  background:var(--bg-3);color:var(--ink-4);font-size:10.5px;font-weight:700;letter-spacing:.02em}

/* ---------- pastille de source ---------- */
.src{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:100px;
  font-size:11.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis}
.src i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
.src-live{background:var(--up-soft);color:var(--up)}
.src-live i{animation:srcPulse 2.2s ease-in-out infinite}
@keyframes srcPulse{0%,100%{opacity:1}50%{opacity:.3}}
.src-demo{background:var(--bg-3);color:var(--ink-3)}
.src-err{background:var(--warn-soft);color:var(--warn)}
/* Sous 760 px, la pastille de source se réduit à son point coloré : elle ne
   doit jamais pousser le logo ni les boutons hors de l'écran. */
@media (max-width:760px){
  .src{padding:6px;gap:0}
  .src-txt{display:none}
  .build{display:none}
  .top-in{padding:10px 14px;gap:8px}
  .logo span:last-child{font-size:16px}
}
@media (max-width:400px){ .top-act .btn{padding:7px 13px;font-size:13px} }




/* ---------- marque ---------- */
/* Le logo est posé directement sur le fond : aucun carré, aucune pastille.
   Il prend simplement la couleur du texte, donc noir sur clair et blanc sur
   sombre. */
.logo-m{width:30px;height:30px;background:none;color:var(--ink);box-shadow:none;border-radius:0}
.logo-m svg{width:26px;height:26px}

.brand-orbit{position:relative;display:flex;align-items:center;justify-content:center;
  width:140px;height:140px;margin:0 auto}
.brand-ring{position:absolute;inset:0;width:100%;height:100%;color:var(--ink-4);opacity:.4;
  animation:ringSpin 9s linear infinite}
.brand-ring circle:last-child{animation:ringSpin 6s linear infinite reverse;transform-origin:60px 60px}
@keyframes ringSpin{to{transform:rotate(360deg)}}

.brand-mark{display:flex;align-items:center;justify-content:center;width:86px;height:86px;
  background:none;color:var(--ink);box-shadow:none;border-radius:0;
  animation:brandCycle 6s cubic-bezier(.65,0,.35,1) infinite}
.brand-mark svg{width:100%;height:100%}

/* Un tour, une pause, un tour en sens inverse, une pause. */
@keyframes brandCycle{
  0%   {transform:rotate(0deg)}
  30%  {transform:rotate(360deg)}
  50%  {transform:rotate(360deg)}
  80%  {transform:rotate(0deg)}
  100% {transform:rotate(0deg)}
}

/* Chargement d'une analyse : le même mouvement, plus rapide. */
.brand-spin{display:inline-flex;width:44px;height:44px;color:var(--ink);
  animation:brandCycle 2.6s cubic-bezier(.65,0,.35,1) infinite}
.brand-spin svg{width:100%;height:100%}
.spin-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 0}
.spin-txt{font-size:14px;color:var(--ink-3)}

@media (prefers-reduced-motion:reduce){
  .brand-mark,.brand-spin{animation:none}
  .brand-ring{animation-duration:24s}
}


.quota{margin-top:18px;padding:16px;border-radius:12px;background:var(--bg-2)}
.quota b{display:block;font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.quota span{display:block;font-size:14px;color:var(--ink-3);margin-top:6px}
.quota-bar{display:block;height:4px;border-radius:100px;background:var(--bg-3);margin-top:12px;overflow:hidden}
.quota-bar em{display:block;height:100%;background:var(--ink);border-radius:100px;
  transition:width .5s var(--spring)}



/* ---------- accueil ---------- */
.nb-hero{padding:var(--space-8) 0 var(--space-6);max-width:20ch}
.nb-hero-2{color:var(--ink-3);font-weight:600}
.nb-hero-sub{margin-top:var(--space-5);max-width:46ch}
.nb-hero-act{display:flex;gap:12px;margin-top:var(--space-6);flex-wrap:wrap}
.nb-split{display:grid;grid-template-columns:1fr 1.25fr;gap:var(--space-4);align-items:stretch}
.nb-pf{display:flex;flex-direction:column;min-height:220px}
.nb-pf-val{font-size:clamp(32px,4.6vw,44px);font-weight:700;letter-spacing:-.04em;
  line-height:1;margin-top:12px;font-variant-numeric:tabular-nums}
.nb-pf-var{font-size:var(--t-small);font-weight:600;margin-top:12px}
@media (max-width:820px){
  .nb-split{grid-template-columns:1fr}
  .nb-hero{max-width:none;padding-top:var(--space-6)}
}

/* ---------- ligne de marché ---------- */
.row-t{font-size:15px;font-weight:600;letter-spacing:-.01em}
.row-s{font-size:13px;color:var(--ink-3);margin-top:2px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.row-end{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto;min-width:92px}
.row-px{font-size:15.5px;font-weight:600;letter-spacing:-.02em}
.row-var{font-size:13px;font-weight:550}
.row-var.na{color:var(--ink-4)}
.row-spark{flex:0 0 auto;width:72px;height:26px;overflow:hidden;margin-right:14px}
@media (max-width:430px){ .row-spark{display:none} .row-end{min-width:80px} }


/* ---------- NovaScore, dans le résultat d'analyse ---------- */
.nsc{padding:18px;border-radius:14px;background:var(--bg-2);margin-bottom:20px}
.nsc-head{display:flex;align-items:center;gap:16px}
.nsc-val{font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1}
.nsc-val small{font-size:.4em;font-weight:600;color:var(--ink-4);margin-left:2px}
.nsc-meta b{display:block;font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.nsc-meta span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:4px}
.nsc-fam{margin-top:18px;display:grid;gap:9px}
.nsc-line{display:grid;grid-template-columns:1fr 90px 32px;align-items:center;gap:12px;font-size:13.5px}
.nsc-line i{display:block;height:4px;border-radius:100px;background:var(--bg-3);overflow:hidden}
.nsc-line em{display:block;height:100%;background:var(--ink);border-radius:100px}
.nsc-line b{text-align:right;font-weight:650}
@media (max-width:430px){ .nsc-line{grid-template-columns:1fr 56px 30px} }

/* ---------- accueil minimaliste ---------- */
.hm{padding:var(--space-lg) 0 var(--space-md);text-align:center}
.hm-lab{font-size:13.5px;color:var(--ink-3);font-weight:550}
.hm-big{font-size:clamp(46px,13vw,72px);font-weight:700;letter-spacing:-.055em;line-height:1;
  margin-top:10px;font-variant-numeric:tabular-nums}
.hm-var{font-size:15px;font-weight:600;margin-top:12px;font-variant-numeric:tabular-nums}
.hm-cta{margin-top:var(--space-lg);min-width:min(320px,100%)}
.hm-pulse{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;
  padding:18px 20px;border-radius:var(--r-l);background:var(--bg-2);text-align:left}
.hm-pulse:hover{background:var(--bg-3)}
.hm-pulse b{display:block;font-size:15px;font-weight:650;letter-spacing:-.02em}
.hm-pulse span span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px}
.hm-score{font-size:28px;font-weight:700;letter-spacing:-.04em;flex:0 0 auto}

/* ---------- parcours d'achat : un écran, un objectif ---------- */
.buy{text-align:center;padding:6px 0}
.buy-co{font-size:14px;color:var(--ink-3);font-weight:550}
.buy-title{font-size:24px;font-weight:700;letter-spacing:-.035em;margin-top:4px}
.buy-big{font-size:clamp(56px,17vw,84px);font-weight:700;letter-spacing:-.055em;line-height:1;
  margin-top:22px;font-variant-numeric:tabular-nums;color:var(--ink)}
.buy-big small{font-size:.42em;font-weight:600;margin-left:4px;opacity:.75}
.buy-sub{font-size:14.5px;color:var(--ink-3);margin-top:10px;font-variant-numeric:tabular-nums}
.buy-range{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:100px;
  background:var(--bg-3);margin:30px 0 22px;outline:none}
.buy-range::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--ink);border:4px solid var(--bg);box-shadow:var(--shadow-2);cursor:pointer}
.buy-range::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--accent);
  border:4px solid var(--bg);box-shadow:var(--shadow-2);cursor:pointer;border-radius:50%}
.buy-chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.buy-cash{font-size:13px;color:var(--ink-4);margin-top:18px}
.buy-cta{width:100%;margin-top:24px}
.buy-rows{margin-top:26px;text-align:left}
.buy-rows>div{display:flex;justify-content:space-between;align-items:baseline;gap:16px;
  padding:15px 0;border-bottom:1px solid var(--line-2)}
.buy-rows dt{font-size:14px;color:var(--ink-3)}
.buy-rows dd{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.buy-total{border-bottom:none!important;padding-top:18px!important}
.buy-total dt{font-size:15px;color:var(--ink)!important;font-weight:600}
.buy-total dd{font-size:24px;font-weight:700;letter-spacing:-.03em}
.buy-note{font-size:12.5px;color:var(--ink-4);margin-top:16px;line-height:1.5}

/* ---------- fiche : une action dominante ---------- */
.stk-cta{display:flex;gap:10px;margin-top:24px}
.stk-more{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.stk-more button:not(.star){display:inline-flex;align-items:center;gap:7px;padding:9px 15px;
  border-radius:100px;background:var(--bg-2);font-size:13.5px;font-weight:550;color:var(--ink-2);
  min-height:40px}
.stk-more button:not(.star):hover{background:var(--bg-3)}
.stk-more svg{width:15px;height:15px}

/* ---------- courbe de fond du hero ---------- */
/* Elle occupe tout le bloc d'accueil et passe DERRIÈRE le texte : c'est une
   toile de fond, jamais un obstacle à la lecture. */
.hero{position:relative;isolation:isolate}
.hero > *:not(.hero-chart){position:relative;z-index:1}
.hero-chart{
  position:absolute;top:-24px;bottom:-24px;
  left:50%;width:100vw;margin-left:-50vw;
  z-index:0;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);
}
.hero-chart svg{width:100%;height:100%;display:block}

.hc-grid line{stroke:var(--line);stroke-width:1;opacity:.6}
[data-theme="dark"] .hc-grid line{opacity:.42}

/* Le tracé se dessine, se maintient, puis repart : la courbe respire en
   permanence, sans jamais laisser l'écran vide. */
.hc-line{stroke-dasharray:3200;stroke-dashoffset:3200;
  animation:hcDraw 14s linear infinite}
@keyframes hcDraw{
  0%  {stroke-dashoffset:3200}
  92% {stroke-dashoffset:0;opacity:1}
  97% {stroke-dashoffset:0;opacity:0}
  98% {stroke-dashoffset:3200;opacity:0}
  100%{stroke-dashoffset:3200;opacity:1}
}
.hc-area{opacity:0;animation:hcArea 14s linear infinite}
@keyframes hcArea{
  0%,6%   {opacity:0}
  55%,92% {opacity:1}
  97%,100%{opacity:0}
}
/* La flèche apparaît quand le tracé l'atteint, et reste le temps de la pause.
   Elle marque la fin de la courbe : elle ne la parcourt pas. */
.hc-tip{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:hcTip 14s linear infinite}
@keyframes hcTip{
  0%,78% {opacity:0}
  88%    {opacity:1}
  94%    {opacity:1}
  97%,100%{opacity:0}
}
.hc-arrow{stroke-dasharray:100;stroke-dashoffset:100;
  animation:hcArrow 14s linear infinite}
@keyframes hcArrow{
  0%,80%  {stroke-dashoffset:100}
  90%,94% {stroke-dashoffset:0}
  97%,100%{stroke-dashoffset:100}
}
.hc-halo{animation:hcHalo 2.4s ease-in-out infinite}
@keyframes hcHalo{
  0%,100%{r:17;opacity:.16}
  50%    {r:27;opacity:.05}
}
@media (prefers-reduced-motion:reduce){
  .hc-line,.hc-area,.hc-tip,.hc-arrow,.hc-halo{animation:none;opacity:1;stroke-dashoffset:0}
}
.no-anim .hc-line,.no-anim .hc-area,.no-anim .hc-tip,.no-anim .hc-arrow,.no-anim .hc-halo{
  animation:none;opacity:1;stroke-dashoffset:0}

/* ---------- capacités ---------- */
.cap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:var(--sp-2)}
/* Icône et bloc texte forment deux colonnes centrées verticalement l'une par
   rapport à l'autre, quelle que soit la hauteur de la carte. La largeur de la
   case et l'écart sont partagés avec les cartes numérotées, pour que tous les
   titres du site démarrent au même X. */
.cap{display:flex;align-items:center;gap:var(--icon-gap);padding:var(--card-pad);
  border-radius:var(--r-l);background:var(--bg-2);
  transition:transform .35s var(--spring),background .35s var(--spring)}
.cap:hover{background:var(--bg-3)}
.cap-i{width:var(--icon-box);height:var(--icon-box);flex:0 0 var(--icon-box);
  border-radius:14px;background:var(--bg);color:var(--ink-2);box-shadow:var(--shadow-1)}
.cap-i svg{width:22px;height:22px}
.cap-txt{flex:1 1 auto;min-width:0;text-align:left}
.cap b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.02em}
.cap span{display:block;font-size:13.5px;color:var(--ink-3);margin-top:5px;line-height:1.5}

/* ---------- analyse Nova ---------- */
.nova-card{background:linear-gradient(160deg,var(--accent-soft),transparent 46%),var(--bg)}
.nova-head{display:flex;align-items:center;gap:16px;margin-bottom:var(--sp-3)}
.nova-orb{position:relative;width:52px;height:52px;flex:0 0 auto}
.nova-orb i{position:absolute;inset:0;border-radius:50%;opacity:.55;
  animation:orb 5.5s var(--spring) infinite}
.nova-orb i:nth-child(1){background:radial-gradient(circle at 30% 30%,#00c462,#00a651)}
.nova-orb i:nth-child(2){background:radial-gradient(circle at 70% 40%,#5b4ae0,#7c6cf0);animation-delay:-1.8s}
.nova-orb i:nth-child(3){background:radial-gradient(circle at 50% 70%,#0071e3,#3b9bff);animation-delay:-3.6s}
@keyframes orb{
  0%,100%{transform:translate(0,0) scale(.82)}
  33%{transform:translate(7px,-5px) scale(1)}
  66%{transform:translate(-6px,5px) scale(.9)}
}
.nova-t{font-size:12.5px;font-weight:650;color:var(--ink-3);margin:var(--sp-3) 0 2px}
.conf{display:flex;gap:6px;margin-bottom:var(--sp-1)}
.conf-b{flex:1;height:5px;border-radius:100px;background:var(--bg-3);transition:background .6s var(--spring)}
.conf-b.on{background:var(--accent)}

/* ---------- moyennes ---------- */
.avgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:9px;margin-top:var(--sp-3)}
.avg{padding:13px;border-radius:var(--r-m);background:var(--bg-2);min-width:0}
.avg-k{display:block;font-size:11.5px;color:var(--ink-3);letter-spacing:-.01em}
.avg-v{display:block;font-size:16.5px;font-weight:700;margin-top:5px;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ---------- acheter ---------- */
.buy-card{background:linear-gradient(150deg,var(--bg-2),var(--bg))}
.btn-lg{min-height:52px;padding:15px 28px;font-size:16px}
.btn-buy{position:relative;overflow:hidden}
.btn-buy::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,
  transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%)}
.btn-buy:hover::after{animation:sheen 1s var(--spring)}
@keyframes sheen{to{transform:translateX(100%)}}
.amounts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.save{background:var(--accent);color:#fff;padding:2px 8px;border-radius:100px;font-size:11px;
  font-weight:700;margin-left:6px}

/* ---------- barre flottante, effet verre ---------- */
@media (max-width:900px){
  .dock button{position:relative;transition:color .3s var(--spring)}
  .dock button[aria-current]::before{
    content:'';position:absolute;inset:0;border-radius:100px;
    background:var(--bg);box-shadow:var(--shadow-1);z-index:-1;
    animation:dockIn .45s var(--spring)
  }
  @keyframes dockIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
}


/* ---------- écran de connexion et premiers pas ---------- */
body.gated .top,body.gated .dock{display:none}
body.gated .wrap{padding:0;max-width:100%}
.gate{min-height:calc(100vh - 40px);display:flex;align-items:center;justify-content:center;padding:var(--space-md) 20px;
  background:radial-gradient(120% 90% at 50% 0%,var(--accent-soft),transparent 58%)}
.gate-card{width:100%;max-width:520px;text-align:center;animation:gateIn .7s var(--spring)}
@keyframes gateIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.gate-orb{position:relative;display:block;width:74px;height:74px;margin:0 auto}
.gate-orb i{position:absolute;inset:0;border-radius:50%;opacity:.6;animation:orb 5.5s var(--spring) infinite}
.gate-orb i:nth-child(1){background:radial-gradient(circle at 30% 30%,#00c462,#00a651)}
.gate-orb i:nth-child(2){background:radial-gradient(circle at 70% 40%,#5b4ae0,#7c6cf0);animation-delay:-1.8s}
.gate-orb i:nth-child(3){background:radial-gradient(circle at 50% 70%,#0071e3,#3b9bff);animation-delay:-3.6s}
.btn-google{width:100%;margin-top:var(--space-lg);min-height:56px;font-size:16px;font-weight:600;
  background:var(--bg);color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--shadow-1)}
.btn-google:hover{border-color:var(--ink-4);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.gate-pts{margin-top:var(--space-lg);text-align:left;display:grid;gap:var(--space-xs)}
.gate-pt{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-m);background:var(--bg-2)}
.gate-i{width:26px;height:26px;border-radius:50%;background:var(--bg-3);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.gate-i svg{width:14px;height:14px}
.gate-pt b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.02em}
.gate-pt span span{display:block;font-size:13px;color:var(--ink-3);margin-top:3px;line-height:1.45}

.onb{text-align:left}
.onb-dots{display:flex;gap:6px;justify-content:center;margin-bottom:var(--space-md)}
.onb-dots span{width:26px;height:4px;border-radius:100px;background:var(--bg-3);transition:background .4s var(--spring)}
.onb-dots span.on{background:var(--accent)}
.onb-list{display:grid;gap:var(--space-xs);margin-top:var(--space-md)}
.onb-c{display:flex;align-items:center;gap:12px;text-align:left;padding:18px;border-radius:var(--r-m);
  background:var(--bg-2);border:1.5px solid transparent;transition:all .28s var(--spring)}
.onb-c:hover{border-color:var(--accent);background:var(--bg);transform:translateX(3px)}
.onb-c b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.02em}
.onb-c span:not(.onb-a){display:block;font-size:13px;color:var(--ink-3);margin-top:3px}
.onb-c>b,.onb-c>span:first-of-type{flex:1;min-width:0}
.onb-a{color:var(--ink-4);flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:20px;height:20px}
.onb-a svg{width:16px;height:16px}
.onb-steps{display:grid;gap:var(--space-xs);margin-top:var(--space-md)}
.onb-step{display:flex;align-items:center;gap:12px;padding:16px;border-radius:var(--r-m);background:var(--bg-2)}
.onb-n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);
  font-size:13px;font-weight:700}
.onb-i{width:34px;height:34px;border-radius:11px;background:var(--bg);display:flex;align-items:center;justify-content:center;
  color:var(--accent);flex:0 0 auto;box-shadow:var(--shadow-1)}
.onb-i svg{width:17px;height:17px}
.onb-step b{display:block;font-size:14.5px;font-weight:650;letter-spacing:-.02em}
.onb-step span span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}



/* ---------- consensus multi-modèles ---------- */
.cons-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-md);
  flex-wrap:wrap;padding-bottom:var(--space-sm);border-bottom:1px solid var(--line-2);
  margin-bottom:var(--space-sm)}
.cons-agree{display:flex;flex-direction:column;min-width:0}
.cons-gauge{display:flex;flex-direction:column;gap:5px;min-width:150px}
.gauge{height:8px;border-radius:100px;background:var(--bg-3);overflow:hidden}
.gauge i{display:block;height:100%;width:0;border-radius:100px;background:var(--accent);
  transition:width 1.1s var(--spring);animation:gaugeIn 1.1s var(--spring) forwards}
@keyframes gaugeIn{from{width:0}}
.gauge-v{font-size:12.5px;font-weight:650;color:var(--accent);text-transform:capitalize}
.cons-body h3{margin-top:2px}

.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
  gap:var(--space-xs);margin-top:var(--space-md)}
.ai-card{background:var(--bg-2);border-radius:var(--r-m);padding:var(--space-sm);min-width:0;
  transition:transform .3s var(--spring),background .3s var(--spring)}
.ai-card:hover{transform:translateY(-2px);background:var(--bg-3)}
.ai-card-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ai-alias{font-size:14px;font-weight:650;letter-spacing:-.02em}
.ai-dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.ai-dot-1{background:var(--accent)} .ai-dot-2{background:var(--violet)} .ai-dot-3{background:var(--info)}
.ai-points{list-style:none;margin-top:12px}
.ai-points li{display:flex;gap:8px;padding:5px 0;font-size:12.8px;color:var(--ink-3);line-height:1.45}
.ai-points li i{flex:0 0 auto;width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:11px;font-weight:700;margin-top:1px}
.ai-points li i.p{background:var(--up-soft);color:var(--up)}
.ai-points li i.n{background:var(--down-soft);color:var(--down)}
@media (max-width:430px){ .cons-gauge{min-width:0;width:100%} }



/* ---------- réglages ---------- */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-md);
  padding:16px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.set-row:last-child{border-bottom:none}
.set-txt{flex:1;min-width:160px}
.set-txt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.02em}
.set-txt span{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.set-ctl{flex:0 0 auto}
.sw{width:48px;height:29px;border-radius:100px;background:var(--bg-3);position:relative;flex:0 0 auto;
  transition:background .28s var(--spring)}
.sw i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--bg);
  box-shadow:var(--shadow-1);transition:transform .28s var(--spring)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(19px)}
.export{margin-top:16px;padding:14px;border-radius:var(--r-m);background:var(--bg-2);font-size:11.5px;
  font-family:var(--mono);white-space:pre-wrap;word-break:break-word;max-height:44vh;overflow:auto;
  color:var(--ink-2)}
.no-anim *{animation:none!important;transition:none!important}
body.no-spark .row-spark{display:none}
@media (max-width:520px){ .set-row{align-items:flex-start} .set-ctl{width:100%} .seg{width:100%} }

/* ---------- axes prioritaires et nuances ---------- */
.ai-focus{background:var(--bg);border-radius:var(--r-s);padding:9px 11px;margin-top:11px}
.focus-l{display:block;font-size:10.5px;font-weight:650;letter-spacing:.03em;color:var(--ink-4);
  text-transform:uppercase}
.focus-v{display:block;font-size:13px;font-weight:650;letter-spacing:-.015em;margin-top:2px}
.bias{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:650;white-space:nowrap;
  border:1px solid transparent}
.bias-positif{background:var(--up-soft);color:var(--up);border-color:rgba(0,166,81,.22)}
.bias-neutre{background:var(--bg-3);color:var(--ink-2);border-color:var(--line)}
.bias-negatif{background:var(--down-soft);color:var(--down);border-color:rgba(224,39,59,.22)}
.bias-insuffisant{background:var(--warn-soft);color:var(--warn);border-color:rgba(184,119,10,.22)}

/* ---------- radar cinq piliers ---------- */
.radar-wrap{display:flex;gap:var(--space-md);align-items:center;flex-wrap:wrap}
.radar-box{flex:0 0 auto;width:100%;max-width:260px;margin:0 auto}
.radar-svg{width:100%;max-width:260px;height:auto;display:block;overflow:visible}
.radar-shape{opacity:0;transform-origin:130px 130px;transform:scale(.2);
  animation:radarIn .9s var(--spring) .15s forwards}
@keyframes radarIn{to{opacity:1;transform:scale(1)}}

/* ---------- comparateur ---------- */
.cmp{width:100%;border-collapse:collapse;min-width:420px}
.cmp th,.cmp td{padding:13px 12px;border-bottom:1px solid var(--line-2);text-align:center;
  font-size:14.5px;vertical-align:middle}
.cmp thead th{border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);padding-bottom:14px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp-t{display:block;font-size:11.5px;color:var(--ink-4);margin-top:2px;font-weight:500}
.cmp-k b{font-size:14px;font-weight:600}
.cmp-n{display:block;font-size:11.5px;color:var(--ink-4);margin-top:3px;font-weight:400;max-width:22ch}
.cmp-best{background:var(--up-soft);color:var(--up);font-weight:700;border-radius:8px}
.cmp-worst{background:var(--down-soft);color:var(--down);font-weight:600;border-radius:8px}
.cmp-na{color:var(--ink-4);font-size:13px}
@media (max-width:430px){
  .cmp th,.cmp td{padding:11px 8px;font-size:13.5px}
  .cmp-n{display:none}
}

/* ---------- prix principal ---------- */
.price{font-size:clamp(38px,7.2vw,48px);font-weight:900;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.price small{font-size:.58em;font-weight:600;opacity:.6;margin-left:2px}
.price-chg{font-size:14px;font-weight:600;margin-top:var(--space-xs);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:6px}

/* ---------- divers ---------- */
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);padding:13px 0;
  border-bottom:1px solid var(--line-2);min-width:0}
.kv:last-child{border-bottom:none}
.kv dt{font-size:14.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;min-width:0}
.kv dd{font-family:var(--mono);font-size:15px;font-weight:600;flex:0 0 auto}
.info{width:19px;height:19px;border-radius:50%;background:var(--bg-3);color:var(--ink-4);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.info:hover{background:var(--accent);color:#fff}
.star{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-4);flex:0 0 auto}
.star:hover{background:var(--bg-2)}
.star[aria-pressed="true"]{color:var(--warn)}
.star svg{width:20px;height:20px}
.stat{padding:var(--sp-2);border-radius:var(--r-m);background:var(--bg-2);min-width:0}
.stat-k{font-size:12.5px;color:var(--ink-3);letter-spacing:-.01em}
.stat-v{font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:5px;line-height:1.1}
.stat-n{font-size:12px;color:var(--ink-4);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.divider{height:1px;background:var(--line-2);margin:var(--sp-3) 0}
.flow{display:grid;gap:6px;margin-top:var(--sp-2)}
.flow-s{display:flex;align-items:center;gap:var(--icon-gap);padding:var(--card-pad);
  border-radius:var(--r-m);background:var(--bg-2)}
.flow-n{width:var(--icon-box);height:var(--icon-box);flex:0 0 var(--icon-box);
  border-radius:50%;background:var(--bg);font-size:15px;font-weight:700;
  box-shadow:var(--shadow-1);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.flow-txt{flex:1 1 auto;min-width:0;text-align:left}
.flow-s b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.flow-s span{display:block;font-size:12.5px;color:var(--ink-4);margin-top:2px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-4);padding:10px 10px 10px 0;
  border-bottom:1px solid var(--line)}
table.t td{padding:13px 10px 13px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
table.t td:last-child,table.t th:last-child{text-align:right;padding-right:0}

@media (max-width:900px){
  .wrap{padding:var(--sp-3) 18px calc(var(--sp-6) + 46px)}
  .section{margin-top:64px}
  .hero{padding:var(--sp-4) 0 var(--sp-3)}
}
@media (max-width:430px){
  /* Mobile : on réduit légèrement les mesures, mais la disposition reste
     icône à gauche, texte à droite, l'ensemble centré verticalement. */
  :root{--icon-box:42px; --icon-gap:14px; --card-pad:16px}
  .cap,.flow-s{align-items:center;flex-direction:row}
  body{font-size:15.5px}
  .card{padding:18px;border-radius:var(--r-m)}

  .ring-v{font-size:36px}

}

<script>
"use strict";
/* Repère de version : permet de savoir en une seconde si la page affichée est
   bien la dernière. Visible dans Réglages et dans la console du navigateur. */
const BUILD = 'v2-2';
console.log('%cNovaBourse ' + BUILD, 'color:#00a651;font-weight:700');

/* ============================================================
   1. OUTILS DE BASE
   ============================================================ */
function rng(seed){ let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647; }
const hashStr = (str) => { let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h); };

function escapeHTML(v){
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
const esc = escapeHTML;

const fmt = {
  /* Un nombre non fini n'est jamais affiché : on montre un tiret plutôt qu'un
     « NaN », qui trahirait un calcul cassé. */
  num:(v,d=2)=>Number.isFinite(Number(v))
    ? Number(v).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d}) : '—',
  int:(v)=>Number.isFinite(Number(v))?Number(v).toLocaleString('fr-FR',{maximumFractionDigits:0}):'—',
  pct:(v,d=2)=>(v>=0?'+':'−')+Number(Math.abs(v)).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})+' %',
  eur:(v)=>Number(v).toLocaleString('fr-FR',{maximumFractionDigits:0})+' €',
  cur:(v,c)=>fmt.num(v)+' '+(CUR_SYMBOL[c]||c),
  money:(v,c)=>fmt.cur(v,c),
};

/* ============================================================
   2. MOTEUR — conservé tel quel depuis la version précédente :
   barèmes, Nova Score, analyses, consensus, portefeuille.
   ============================================================ */
const COMPONENTS = [
  { key:'quality',    label:'Qualité',     weight:14, from:'marge opérationnelle',
    help:"Ce que l'entreprise garde sur 100 € de ventes après ses coûts d'exploitation." },
  { key:'growth',     label:'Croissance',  weight:13, from:'croissance du CA et du BPA',
    help:"Progression du chiffre d'affaires (60 %) et du bénéfice par action (40 %)." },
  { key:'profit',     label:'Rentabilité', weight:15, from:'ROE et marge',
    help:"Ce que l'entreprise gagne rapporté à l'argent confié par ses actionnaires." },
  { key:'debt',       label:'Dette',       weight:12, from:'dette / fonds propres',
    help:"Poids de la dette face aux fonds propres. Une note élevée = peu endettée." },
  { key:'valuation',  label:'Valorisation',weight:13, from:'PER',
    help:"Prix payé pour chaque euro de bénéfice. Une note élevée = prix raisonnable." },
  { key:'volatility', label:'Volatilité',  weight:12, from:'volatilité annualisée',

/* --- BARÈMES : conversion d'une mesure réelle en note sur 100 ---
   Courbes par paliers, publiées telles quelles dans la page Méthodologie.
   Interpolation linéaire entre deux points, plafonnement aux extrémités. */
const SCALES = {
  quality:    { unit:'%', metric:'Marge opérationnelle',
    pts:[[0,10],[5,32],[10,50],[18,68],[28,84],[42,95]] },
  growthRev:  { unit:'%', metric:'Croissance du chiffre d’affaires',
    pts:[[-25,0],[-10,20],[0,40],[6,58],[12,72],[25,88],[40,96]] },
  growthEps:  { unit:'%', metric:'Croissance du bénéfice par action',
    pts:[[-50,0],[-20,22],[0,42],[12,62],[28,80],[55,93]] },
  profitRoe:  { unit:'%', metric:'Rentabilité des capitaux propres (ROE)',
    pts:[[-10,0],[0,18],[6,38],[12,56],[18,70],[26,84],[38,95]] },
  debt:       { unit:'%', metric:'Dette rapportée aux fonds propres',
    pts:[[0,95],[30,82],[60,68],[100,50],[150,33],[220,15],[350,2]] },
  valuation:  { unit:'×', metric:'PER',
    pts:[[3,58],[8,86],[12,80],[18,63],[25,46],[35,29],[55,9]] },
  volatility: { unit:'%', metric:'Volatilité annualisée',
    pts:[[8,95],[15,80],[22,66],[30,50],[42,30],[60,12],[85,0]] },
  momentum:   { unit:'%', metric:'Performance sur six mois',
    pts:[[-40,6],[-20,26],[-5,44],[0,50],[10,64],[25,80],[50,92]] },
  dividend:   { unit:'%', metric:'Rendement du dividende',
    pts:[[0,15],[1,40],[2,58],[3.5,74],[5,86],[8,92]] },
  regularity: { unit:'%', metric:'Part de mois en hausse',
    pts:[[25,4],[38,28],[46,44],[52,58],[60,76],[72,92]] },
};
function piecewise(x, pts){
  if (x === null || x === undefined || Number.isNaN(x)) return null;
  if (x <= pts[0][0]) return pts[0][1];
  if (x >= pts[pts.length-1][0]) return pts[pts.length-1][1];
  for (let i = 1; i < pts.length; i++){
    const [x0,y0] = pts[i-1], [x1,y1] = pts[i];
    if (x <= x1) return y0 + ((x-x0)/(x1-x0))*(y1-y0);
  }
  return pts[pts.length-1][1];
}
function grade(scaleKey, x){
  const sc = SCALES[scaleKey];
  const v = piecewise(x, sc.pts);
  return v === null ? null : Math.max(0, Math.min(100, Math.round(v)));
}

/* Construit une société : fondamentaux d'abord, notes ensuite. */
function buildStock(row){
  const [name,ticker,sector,market,country,price,cur,cap,margin,roe,
         growthRev,growthEps,debt,per,dividend,vol,mom,upMonths,gap] = row;

  const f = { cap, margin, roe, revenueGrowth:growthRev, epsGrowth:growthEps,
    debtEquity:debt, per, dividend, volatility:vol, momentum:mom, upMonths };

  // Chaque note est calculée à partir de la mesure correspondante. Si la mesure
  // manque, la note vaut null — jamais une valeur de remplacement.
  const scores = {
    quality:    f.margin === null ? null : grade('quality', f.margin),
    growth:     (f.revenueGrowth === null && f.epsGrowth === null) ? null
      : Math.round(((f.revenueGrowth !== null ? grade('growthRev', f.revenueGrowth) * 0.6 : 0)
                  + (f.epsGrowth !== null ? grade('growthEps', f.epsGrowth) * 0.4 : 0))
                  / ((f.revenueGrowth !== null ? 0.6 : 0) + (f.epsGrowth !== null ? 0.4 : 0))),
    profit:     f.roe === null ? null
      : Math.round(grade('profitRoe', f.roe) * 0.7 + (f.margin !== null ? grade('quality', f.margin) : grade('profitRoe', f.roe)) * 0.3),
    debt:       f.debtEquity === null ? null : grade('debt', f.debtEquity),
    valuation:  (f.per === null || f.per <= 0) ? null : grade('valuation', f.per),
    volatility: f.volatility === null ? null : grade('volatility', f.volatility),
    momentum:   f.momentum === null ? null : grade('momentum', f.momentum),
    regularity: f.upMonths === null ? null : grade('regularity', f.upMonths),
  };
  if (gap === 'score'){ scores.volatility = null; scores.momentum = null; scores.regularity = null; }

  const avail = COMPONENTS.filter(c => scores[c.key] !== null);
  const wsum = avail.reduce((s,c) => s + c.weight, 0);
  const coverage = Math.round(wsum / WEIGHT_TOTAL * 100);
  const score = coverage < 40 ? null
    : Math.round(avail.reduce((s,c) => s + scores[c.key] * c.weight, 0) / wsum);

  // Variation du jour : déterministe, dérivée du momentum pour rester cohérente.
  const r = rng(hashStr(ticker) + 31);
  const change = +(((r() - 0.45) * 2.6) + (f.momentum ?? 0) * 0.02).toFixed(2);

  const volRisk = f.volatility === null ? null
    : f.volatility > 32 ? 'Élevé' : f.volatility > 22 ? 'Modéré' : 'Faible';

  return {
    id: ticker + '-' + market.slice(0,3).toUpperCase(),
    name, ticker, sector, market, country, price, cur,
    curSymbol: CUR_SYMBOL[cur], change,
    scores, score, coverage,
    partial: score !== null && coverage < 70,
    missing: COMPONENTS.filter(c => scores[c.key] === null).map(c => c.key),
    hasFundamentals: f.margin !== null,
    hasNews: gap !== 'news',
    volatility: f.volatility, momentum: f.momentum, volRisk,
    fundamentals: f,
    marketCapEUR: toEUR(cap, cur),
    seed: hashStr(ticker),
  };
}

/* --- validateur : aucune incohérence ne doit passer --- */
function validateStock(s){
  const errs = [];
  if (!(s.price > 0)) errs.push('cours non positif');
  if (!SECTORS.includes(s.sector)) errs.push('secteur inconnu : ' + s.sector);
  if (!FX[s.cur]) errs.push('devise inconnue : ' + s.cur);
  for (const c of COMPONENTS){
    const v = s.scores[c.key];
    if (v !== null && (v < 0 || v > 100 || !Number.isFinite(v))) errs.push('note hors bornes : ' + c.key);
  }
  if (s.score !== null && (s.score < 0 || s.score > 100)) errs.push('score hors bornes');
  if (s.score === null && s.coverage >= 40) errs.push('score absent malgré une couverture suffisante');
  if (s.score !== null && s.coverage < 40) errs.push('score publié sous le seuil de couverture');
  // cohérence : une note ne peut pas contredire sa mesure d'origine
  const f = s.fundamentals;
  if (f.roe !== null && f.roe < 10 && s.scores.profit > 70) errs.push('rentabilité incohérente');
  if (f.debtEquity !== null && f.debtEquity > 200 && s.scores.debt > 60) errs.push('dette incohérente');
  if (f.per !== null && f.per > 45 && s.scores.valuation > 55) errs.push('valorisation incohérente');
  return errs;
}

function analyzeStock(providerId, stock){
  const p = aiProviders[providerId];
  const base = { provider:p.id, label:p.label, model:p.model, at:new Date().toISOString() };

  if (stock.score === null){
    return { ...base, verdict:'insuffisant', uncertainty:'élevée',
      positive:[], negative:[], risks:[],
      summary:`Couverture des données de ${stock.coverage} % : trop de composantes manquent pour se prononcer.` };
  }

  const f = stock.fundamentals, sc = stock.scores, pos = [], neg = [], risks = [];

  if (sc.profit !== null && sc.profit >= 60) pos.push(`Rentabilité solide : ROE de ${f.roe} %.`);
  else if (sc.profit !== null && sc.profit < 45) neg.push(`Rentabilité limitée : ROE de ${f.roe} %.`);

  if (sc.quality !== null && sc.quality >= 60) pos.push(`Marge opérationnelle de ${f.margin} %.`);
  else if (sc.quality !== null && sc.quality < 40) neg.push(`Marge opérationnelle faible : ${f.margin} %.`);

  if (sc.growth !== null && sc.growth >= 60) pos.push(`Croissance du chiffre d'affaires de ${f.revenueGrowth} %.`);
  else if (sc.growth !== null && sc.growth < 42) neg.push(`Croissance en repli : chiffre d'affaires ${f.revenueGrowth} %, bénéfice ${f.epsGrowth} %.`);

  if (sc.debt !== null && sc.debt >= 65) pos.push(`Endettement contenu : ${f.debtEquity} % des fonds propres.`);
  else if (sc.debt !== null && sc.debt < 45){ neg.push(`Endettement élevé : ${f.debtEquity} % des fonds propres.`);
    risks.push('Un endettement de ce niveau réduit la marge de manœuvre en cas de retournement.'); }

  const valScore = sc.valuation === null ? null : Math.round(sc.valuation / p.bias.valuation);
  if (valScore !== null && valScore >= 60) pos.push(`Valorisation raisonnable : PER de ${f.per}.`);
  else if (valScore !== null && valScore < 48){ neg.push(`Valorisation exigeante : PER de ${f.per}.`);
    risks.push('À ce niveau de valorisation, une déception sur les résultats se paie cher.'); }

  if (sc.volatility !== null && sc.volatility >= 62) pos.push(`Cours relativement calme : ${f.volatility} % de volatilité annualisée.`);
  else if (sc.volatility !== null && sc.volatility < 45){ neg.push(`Volatilité de ${f.volatility} % par an.`);
    risks.push('Des variations de cette ampleur peuvent être difficiles à supporter.'); }

  if (sc.momentum !== null && sc.momentum >= 62) pos.push(`Tendance favorable sur six mois : ${f.momentum} %.`);
  else if (sc.momentum !== null && sc.momentum < 42) neg.push(`Tendance négative sur six mois : ${f.momentum} %.`);

  if (stock.coverage < 100) risks.push(`Couverture de ${stock.coverage} % : une partie de l'analyse repose sur des données absentes.`);

  // Verdict : somme pondérée des notes, ajustée par la sensibilité du modèle.
  const w = (k, mult=1) => sc[k] === null ? null : sc[k] * mult;
  const parts = [w('profit'), w('quality'), w('growth', p.bias.growth),
                 w('debt'), valScore, w('volatility', p.bias.volatility), w('momentum')]
                 .filter(v => v !== null);
  const avg = parts.reduce((a,b) => a+b, 0) / parts.length;
  const verdict = avg >= 63 ? 'positif' : avg >= 48 ? 'neutre' : 'negatif';

  const uncertainty = stock.coverage < 70 ? 'élevée'
    : (sc.volatility !== null && sc.volatility < 45) ? 'modérée'
    : Math.abs(avg - 55) < 6 ? 'modérée' : 'faible';

  const summary = verdict === 'positif'
    ? `Les critères mesurés sont majoritairement favorables${neg.length ? `, avec une réserve sur ${neg[0].split(' :')[0].toLowerCase()}` : ''}.`
    : verdict === 'negatif'
      ? `Plusieurs critères mesurés sont défavorables${pos.length ? `, malgré ${pos[0].split(' :')[0].toLowerCase()}` : ''}.`
      : `Les critères favorables et défavorables s'équilibrent sur les données disponibles.`;

  return { ...base, verdict, uncertainty, summary,
    positive:pos.slice(0,3), negative:neg.slice(0,3), risks:risks.slice(0,2) };
}

/* --- CONSENSUS : accord qualifié, points d'accord et de désaccord, aucune probabilité --- */
function consensus(list){
  const usable = list.filter(a => a.verdict !== 'insuffisant');
  if (usable.length < 2){
    return { published:false, label:'Synthèse indisponible',
      message:`Une synthèse exige au moins 2 avis exploitables ; ${usable.length} disponible(s).`,
      votes:{}, agreementPoint:null, disagreementPoint:null };
  }
  const votes = { positif:0, neutre:0, negatif:0 };
  usable.forEach(a => votes[a.verdict]++);
  const ranked = Object.entries(votes).sort((a,b) => b[1]-a[1]);
  const tie = ranked[0][1] === ranked[1][1];
  const opposed = votes.positif > 0 && votes.negatif > 0;
  const level = ranked[0][1] === usable.length ? 'Accord unanime'
    : opposed ? 'Avis divergents'
    : ranked[0][1] / usable.length >= 0.66 ? 'Accord modéré' : 'Avis partagés';

  // Point d'accord : un facteur cité par tous. Point de désaccord : cité par un seul.
  const count = {};
  usable.forEach(a => [...a.positive, ...a.negative].forEach(txt => {
    const key = txt.split(' :')[0];
    (count[key] ||= { n:0, who:[] }); count[key].n++; count[key].who.push(a.label);
  }));
  const entries = Object.entries(count);
  const shared = entries.filter(([,v]) => v.n === usable.length).map(([k]) => k);
  const solo   = entries.filter(([,v]) => v.n === 1);

  return { published:true, label:level, votes, total:usable.length,
    majority: tie ? null : ranked[0][0], count: ranked[0][1],
    agreementPoint: shared.length ? `Les ${usable.length} modèles relèvent le même point : ${shared[0].toLowerCase()}.` : null,
    disagreementPoint: solo.length ? `${solo[0][1].who[0]} est le seul à relever : ${solo[0][0].toLowerCase()}.` : null };
}

/* --- séries de cours fictives --- */
const PERIODS = [
  { id:'1J', points:32,  label:"aujourd'hui" },
  { id:'1S', points:40,  label:'sur une semaine' },
  { id:'1M', points:44,  label:'sur un mois' },
  { id:'6M', points:60,  label:'sur six mois' },
  { id:'1A', points:80,  label:'sur un an' },
  { id:'5A', points:110, label:'sur cinq ans' },
];
function series(seed, n, drift, volatility){
  const r = rng(seed);
  let v = 100; const out = [];
  for (let i = 0; i < n; i++){ v *= 1 + drift + (r() - 0.5) * volatility; out.push(v); }
  const min = Math.min(...out), max = Math.max(...out);
  return { values: out, min, max };
}
function stockSeries(stock, periodId){
  const p = PERIODS.find(x => x.id === periodId) || PERIODS[2];
  const idx = PERIODS.indexOf(p);
  const s = series(stock.seed + idx * 7, p.points, 0.0009 * (idx + 1) * (stock.momentum > 0 ? 1 : -0.6), 0.006 + idx * 0.004);
  const k = stock.price / s.values[s.values.length - 1];
  return { ...s, values: s.values.map(v => v * k), period: p };
}

/* --- historique du Nova Score --- */
function scoreHistory(stock){
  if (stock.score === null) return [];
  const r = rng(stock.seed + 555);
  const months = ['mars','avr.','mai','juin','juil.','août'];
  let v = stock.score - Math.round(6 + r() * 12);
  return months.map(m => { v += Math.round((r() - 0.35) * 6); return { m, v: Math.max(20, Math.min(99, v)) }; })
    .map((p, i, arr) => i === arr.length - 1 ? { m:p.m, v:stock.score } : p);
}

/* Market Pulse : agrégat des données affichées.
   Chaque facteur est calculé, aucun n'est posé à la main. */
function marketPulse(){
  /* Chaque facteur ne porte que sur les sociétés qui disposent réellement de
     la mesure concernée. Le champ « volume » n'existe plus dans les données :
     il produisait un NaN qui se propageait jusqu'au score affiché. */
  const avg = (list, get) => {
    const vals = list.map(get).filter(v => typeof v === 'number' && Number.isFinite(v));
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const clamp = v => v === null ? null : Math.max(0, Math.min(100, Math.round(v)));

  const advancing = stocks.filter(s => typeof s.change === 'number' && s.change > 0).length;
  const rated     = stocks.filter(s => typeof s.change === 'number').length;
  const breadth   = rated ? clamp(advancing / rated * 100) : null;

  const avgVol  = avg(stocks, s => s.volatility);
  const avgMom  = avg(stocks, s => s.momentum);

  const avgCov  = avg(stocks, s => s.coverage);

  const factors = [
    { k:'Largeur du marché', v:breadth,
      d:`${advancing} sociétés en hausse sur ${rated}.` },
    { k:'Momentum', v:avgMom === null ? null : clamp(50 + avgMom * 1.4),
      d:'Moyenne des tendances à six mois.' },

    { k:'Couverture des données', v:clamp(avgCov),
      d:'Part des composantes réellement calculables.' },
    { k:'Volatilité', v:avgVol === null ? null : clamp(100 - avgVol * 1.6),
      d:avgVol === null ? 'Volatilité indisponible.'
        : `Volatilité moyenne de ${Math.round(avgVol)} %. Une note élevée signifie un marché calme.` },
  ].filter(f => f.v !== null);   // un facteur non calculable ne compte pas

  const score = factors.length ? Math.round(factors.reduce((a, f) => a + f.v, 0) / factors.length) : null;
  return { score, factors };
}

function portfolioValue(){
  // Chaque position est valorisée dans SA devise, puis convertie en euros.
  let value = 0, cost = 0;
  const lines = portfolio.positions.map(pos => {
    const st = byId[pos.id];
    if (!st) return null;
    const cours = prixDe(st);
    if (cours === null) return null;          // valeur non cotée : exclue, jamais estimée
    const localValue = cours * pos.qty;
    const localCost  = pos.avg  * pos.qty;
    const eurValue = toEUR(localValue, st.cur);
    const eurCost  = toEUR(localCost,  st.cur);
    value += eurValue; cost += eurCost;
    return { ...pos, stock:st, localValue, localCost, cur:st.cur,
      value:eurValue, cost:eurCost, gain:eurValue-eurCost,
      gainPct: eurCost ? (eurValue/eurCost-1)*100 : 0,
      fx: FX[st.cur] };
  }).filter(Boolean);
  const total = value + portfolio.cash;
  /* Capital engagé = liquidités restantes + prix d'achat des positions. La
     somme reste égale au capital de départ : acheter déplace de l'argent, cela
     n'en crée ni n'en détruit. Un portefeuille sans position affiche donc 0 %,
     et non une perte héritée d'une valeur de référence figée. */
  const invested = cost + portfolio.cash;
  const gain = total - invested;
  return { lines, value, cost, total, cash:portfolio.cash, invested,
    gain, gainPct: invested > 0 ? (gain / invested) * 100 : 0 };
}

/* La mesure d'origine, citée telle quelle : une note ne s'affiche jamais seule. */
function measureText(st, key){
  const f = st.fundamentals;
  switch(key){
    case 'quality':    return `marge opérationnelle de ${f.margin} %`;
    case 'growth':     return `chiffre d'affaires ${f.revenueGrowth > 0 ? '+' : ''}${f.revenueGrowth} %, bénéfice ${f.epsGrowth > 0 ? '+' : ''}${f.epsGrowth} %`;
    case 'profit':     return `ROE de ${f.roe} %`;
    case 'debt':       return `dette à ${f.debtEquity} % des fonds propres`;
    case 'valuation':  return `PER de ${f.per}`;
    case 'volatility': return `volatilité de ${f.volatility} % par an`;
    case 'momentum':   return `${f.momentum > 0 ? '+' : ''}${f.momentum} % sur six mois`;
    case 'regularity': return `${f.upMonths} % de mois en hausse`;
    default: return '';
  }
}
function plainFundamentals(st){
  const f = st.fundamentals;
  const bits = [];
  if (f.margin !== null) bits.push(`sur 100 € de ventes, il reste environ ${Math.round(f.margin)} € avant impôts et frais financiers`);
  if (f.debtEquity !== null) bits.push(f.debtEquity > 150
    ? `la dette dépasse largement les fonds propres, ce qui limite la marge de manœuvre`
    : f.debtEquity > 80 ? `la dette est du même ordre que les fonds propres` : `la dette reste modérée`);
  if (f.per !== null) bits.push(`vous payez ${Math.round(f.per)} années de bénéfices au cours actuel`);
  return esc(bits.join(' ; ')) + '.';
}

function runNovaTests(){
  const results = [];
  const ok = (name, cond, detail='') => results.push({ name, pass:Boolean(cond), detail });

  ok('les poids somment à 100', WEIGHT_TOTAL === 100, 'total = ' + WEIGHT_TOTAL);
  ok('tous les scores sont dans 0-100',
    stocks.every(s => s.score === null || (s.score >= 0 && s.score <= 100)));
  ok('les composantes absentes valent null, jamais 0',
    stocks.every(s => COMPONENTS.every(c => s.scores[c.key] === null || s.scores[c.key] > 0)));
  ok('aucun score sous le seuil de couverture',
    stocks.every(s => s.score === null ? s.coverage < 40 : s.coverage >= 40));
  ok('les scores partiels sont signalés',
    stocks.every(s => s.score === null || s.partial === (s.coverage < 70)));

  const errs = stocks.flatMap(s => validateStock(s).map(e => s.ticker + ' : ' + e));
  ok('validateStock ne relève aucune incohérence', errs.length === 0, errs.slice(0,3).join(' | '));

  // cohérence note / mesure
  ok('une faible rentabilité ne donne pas une bonne note',
    stocks.every(s => s.fundamentals.roe === null || !(s.fundamentals.roe < 8 && s.scores.profit > 65)));
  ok('une dette élevée ne donne pas une bonne note',
    stocks.every(s => s.fundamentals.debtEquity === null || !(s.fundamentals.debtEquity > 200 && s.scores.debt > 55)));

  // conversion de devises
  ok('conversion USD vers EUR', Math.abs(toEUR(100, 'USD') - 92) < 0.01);
  ok('la devise EUR reste inchangée', toEUR(100, 'EUR') === 100);
  const pf = portfolioValue();
  ok('le portefeuille additionne des euros', pf.lines.every(l => l.value === toEUR(l.localValue, l.cur)));
  ok('la valeur totale inclut les liquidités', Math.abs(pf.total - (pf.value + pf.cash)) < 0.01);

  // watchlist — l'état est sauvegardé puis restauré : le test ne dépend
  // pas de ce que l'utilisateur suit déjà.
  const snapshot = [...state.watchlist];
  state.watchlist.length = 0;
  toggleWatch('AAPL-NAS'); const added = state.watchlist.length === 1;
  toggleWatch('AAPL-NAS'); const removed = state.watchlist.length === 0;
  state.watchlist.push(...snapshot);
  ok('la watchlist ajoute puis retire', added && removed);

  // consensus
  const full = byId['MSFT-NAS'], none = stocks.find(s => s.score === null);
  ok('consensus refusé sous le quorum', consensus(aiAnalyses(none)).published === false);
  ok('consensus publié avec trois avis', consensus(aiAnalyses(full)).published === true);
  ok('aucune probabilité dans le consensus',
    !/probabilit|%\s*de\s*chances/i.test(JSON.stringify(consensus(aiAnalyses(full)))));
  ok('les IA ne citent que des chiffres existants',
    aiAnalyses(full).every(a => [...a.positive, ...a.negative].every(txt => {
      const nums = txt.match(/-?\d+[.,]?\d*/g) || [];
      const known = Object.values(full.fundamentals).filter(v => v !== null).map(v => String(v));
      return nums.every(n => known.includes(n) || known.includes(n.replace(',', '.')));
    })), 'chaque nombre cité doit exister dans les fondamentaux');

  const passed = results.filter(r => r.pass).length;
  console.group(`NovaBourse — tests internes : ${passed}/${results.length}`);
  results.forEach(r => console[r.pass ? 'log' : 'error'](
    `${r.pass ? '✔' : '✘'} ${r.name}${r.detail ? ' — ' + r.detail : ''}`));
  console.groupEnd();
  return { passed, total:results.length, results };
}
