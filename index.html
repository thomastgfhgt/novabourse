/* Graphique de cours : trois états possibles, aucun quatrième. */
/* Volatilité annualisée et régularité (% de mois en hausse), calculées à
   partir de l'historique RÉEL déjà chargé (HIST) — jamais une nouvelle
   requête, jamais une estimation. Écart-type des rendements quotidiens
   annualisé (convention standard : ×√252), et pourcentage de mois dont
   la clôture est supérieure à celle du mois précédent. Retourne null (pas
   0) si l'historique est absent/insuffisant — l'appelant affiche alors
   "—", jamais une valeur fabriquée. */
function volatiliteAnnualisee(points){
  if (!Array.isArray(points) || points.length < 10) return null;
  const rendements = [];
  for (let i = 1; i < points.length; i++){
    const prev = points[i - 1].close, cur = points[i].close;
    if (Number.isFinite(prev) && Number.isFinite(cur) && prev > 0) rendements.push(cur / prev - 1);
  }
  if (rendements.length < 10) return null;
  const moyenne = rendements.reduce((a, b) => a + b, 0) / rendements.length;
  const variance = rendements.reduce((a, b) => a + (b - moyenne) ** 2, 0) / (rendements.length - 1);
  return Math.sqrt(variance) * Math.sqrt(252) * 100;
}

function pourcentageMoisHausse(points){
  if (!Array.isArray(points) || points.length < 20) return null;
  const parMois = new Map();
  for (const p of points){
    if (!p.date || !Number.isFinite(p.close)) continue;
    parMois.set(p.date.slice(0, 7), p.close);   // dernière clôture rencontrée pour ce mois (points triés croissant)
  }
  const mois = [...parMois.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  if (mois.length < 3) return null;   // au moins 2 transitions mois-à-mois
  let hausses = 0, total = 0;
  for (let i = 1; i < mois.length; i++){
    total++;
    if (mois[i][1] > mois[i - 1][1]) hausses++;
  }
  return total >= 2 ? (hausses / total) * 100 : null;
}

/* ============================================================
   GRAPHIQUE PROFESSIONNEL — rendu (Lightweight Charts)
   ============================================================ */

function chartSkeleton(){
  return `<div class="sk chart-skel" aria-hidden="true"></div>
    <p class="small" style="text-align:center;margin-top:14px;color:var(--ink-4)">Chargement des cours…</p>`;
}

function formatDateAffichage(date, kind){
  const d = new Date(date);
  if (!Number.isFinite(d.getTime())) return date;
  return kind === 'intraday'
    ? d.toLocaleString('fr-FR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })
    : d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
}

/* Statistiques réelles de LA PÉRIODE ACTUELLEMENT AFFICHÉE (pts = entry.data
   de cette période précise, jamais l'historique complet HIST) — recalculées
   entièrement à chaque changement de période via CHART_PERIODS, jamais
   réutilisées d'une période à l'autre. Formules retenues, explicites :
 *   moyenne du cours   = somme des clôtures de la période / nombre de clôtures ;
 *   volume moyen       = somme des volumes connus / nombre de barres à volume connu ;
 *   volatilité période = écart-type (non biaisé) des rendements barre-à-barre
 *     (clôture[i]/clôture[i-1] - 1), exprimé en %, NON annualisé — distinct de
 *     volatiliteAnnualisee() ci-dessus, qui porte sur l'historique quotidien
 *     complet (~1 an) et annualise par ×√252 : les deux mesurent des choses
 *     différentes et ne doivent jamais être confondues dans l'affichage ;
 *   séances +/-         = nombre de barres dont la clôture est strictement
 *     supérieure/inférieure à la clôture de la barre précédente (égalité :
 *     ne compte dans aucun des deux, jamais arrondie vers l'un ou l'autre).
 * Renvoie null pour toute métrique dont les données réelles sont insuffisantes
 * — jamais une estimation ni un zéro qui laisserait croire à une vraie mesure. */
function statsPeriode(pts){
  const closes = pts.map(p => p.close).filter(Number.isFinite);
  const volumes = pts.map(p => p.volume).filter(v => Number.isFinite(v) && v >= 0);

  const average = closes.length ? closes.reduce((a, b) => a + b, 0) / closes.length : null;
  const avgVolume = volumes.length ? volumes.reduce((a, b) => a + b, 0) / volumes.length : null;

  const rendements = [];
  let positives = 0, negatives = 0;
  for (let i = 1; i < pts.length; i++){
    const prev = pts[i - 1].close, cur = pts[i].close;
    if (!Number.isFinite(prev) || !Number.isFinite(cur) || prev <= 0) continue;
    rendements.push(cur / prev - 1);
    if (cur > prev) positives++;
    else if (cur < prev) negatives++;
  }

  let volatility = null;
  if (rendements.length >= 2){
    const m = rendements.reduce((a, b) => a + b, 0) / rendements.length;
    const variance = rendements.reduce((a, b) => a + (b - m) ** 2, 0) / (rendements.length - 1);
    volatility = Math.sqrt(variance) * 100;
  }

  return { average, avgVolume, volatility, positives, negatives, sessions: rendements.length };
}

/* Coquille HTML du graphique : barre d'info (prix/variation, mise à jour en
   direct par le crosshair via mountChartPro), bascule courbe/chandeliers
   (seulement si l'OHLC complet est réellement disponible — jamais affichée
   pour forcer un mode que la donnée ne permet pas), conteneur du graphique
   lui-même (rempli par Lightweight Charts, pas par ce template), puis les
   statistiques réelles de la période (haut/bas/ouverture/clôture/volume/
   moyenne/volatilité/séances +/-, voir statsPeriode ci-dessus). */
function chartProShell(stock, period, entry){
  const pts = entry.data;
  const first = pts[0], last = pts[pts.length - 1];
  const hausse = last.close >= first.close;
  const varAbs = last.close - first.close;
  const varPct = first.close ? (varAbs / first.close) * 100 : null;
  const highs = pts.map(p => p.high).filter(Number.isFinite);
  const lows = pts.map(p => p.low).filter(Number.isFinite);
  const hasOHLC = pts.every(p => Number.isFinite(p.open) && Number.isFinite(p.high) && Number.isFinite(p.low));
  const hasVolume = pts.some(p => Number.isFinite(p.volume) && p.volume > 0);
  const volTotal = pts.reduce((s, p) => s + (Number.isFinite(p.volume) ? p.volume : 0), 0);
  const closesValides = pts.map(p => p.close).filter(Number.isFinite);
  /* Repli sur les clôtures quand haut/bas intra-barre n'existent pas (ex.
     CoinGecko, qui ne fournit qu'un prix ponctuel par horodatage, jamais
     d'OHLC) : le plus haut/bas des CLÔTURES réellement reçues reste une
     donnée réelle, jamais une estimation — seulement moins précis qu'un
     vrai haut/bas intra-séance. */
  const plusHaut = highs.length ? Math.max(...highs) : (closesValides.length ? Math.max(...closesValides) : null);
  const plusBas = lows.length ? Math.min(...lows) : (closesValides.length ? Math.min(...closesValides) : null);
  const st = statsPeriode(pts);

  return `
    <div class="chart-toolbar">
      <div class="chart-info" id="cpInfo">
        <span class="cp-price tabular-nums">${fmt.num(last.close, 2)} ${esc(stock.curSymbol || '')}</span>
        <span class="cp-var tabular-nums ${hausse ? 'up-t' : 'down-t'}">${varAbs >= 0 ? '+' : ''}${fmt.num(varAbs, 2)}
          (${varPct === null ? '—' : (varPct >= 0 ? '+' : '') + fmt.num(varPct, 2) + ' %'})</span>
        <span class="cp-date tiny">${esc(formatDateAffichage(last.date, entry.kind))}</span>
      </div>
      ${hasOHLC ? `<div class="seg chart-mode">
        <button data-chart-mode="line" aria-pressed="${state.ui.chartMode !== 'candle'}">Courbe</button>
        <button data-chart-mode="candle" aria-pressed="${state.ui.chartMode === 'candle'}">Chandeliers</button>
      </div>` : ''}
    </div>
    <div id="chart-pro" class="chart-pro" data-key="${esc(cleHISTP(stock.id, period))}"
      data-hausse="${hausse ? '1' : '0'}"></div>
    <div class="chart-stats">
      <div><span class="tiny">Ouverture</span><b class="tabular-nums">${fmt.num(Number.isFinite(first.open) ? first.open : first.close, 2)}</b></div>
      <div><span class="tiny">Plus haut</span><b class="tabular-nums">${plusHaut !== null ? fmt.num(plusHaut, 2) : '—'}</b></div>
      <div><span class="tiny">Plus bas</span><b class="tabular-nums">${plusBas !== null ? fmt.num(plusBas, 2) : '—'}</b></div>
      <div><span class="tiny">Clôture</span><b class="tabular-nums">${fmt.num(last.close, 2)}</b></div>
      ${hasVolume ? `<div><span class="tiny">Volume</span><b class="tabular-nums">${fmt.int(volTotal)}</b></div>` : ''}
      <div><span class="tiny">Cours moyen sur la période</span><b class="tabular-nums">${st.average !== null ? fmt.num(st.average, 2) : '—'}</b></div>
      ${hasVolume ? `<div><span class="tiny">Volume moyen</span><b class="tabular-nums">${st.avgVolume !== null ? fmt.int(st.avgVolume) : '—'}</b></div>` : ''}
      <div><span class="tiny">Volatilité période</span><b class="tabular-nums">${st.volatility !== null ? fmt.num(st.volatility, 2) + ' %' : '—'}</b></div>
      <div><span class="tiny">${entry.kind === 'intraday' ? 'Barres' : 'Séances'} +/−</span><b class="tabular-nums"><span class="up-t">${st.positives}</span> / <span class="down-t">${st.negatives}</span></b></div>
    </div>
    <p class="tiny" style="margin-top:10px;color:var(--ink-4)">${pts.length} ${entry.kind === 'intraday' ? 'barres' : 'séances'} réelles
      · ${entry.kind === 'intraday' ? 'intraday ' + esc(entry.interval || '') : 'quotidien'} · source ${esc(entry.source || '—')}</p>`;
}

/* --- cycle de vie du graphique (canvas, pas du HTML string) ---
   view.innerHTML est remplacé à CHAQUE render() (navigation, tick vivant
   toutes les 8s, etc.) : le conteneur #chart-pro est donc un NOUVEAU noeud
   DOM à chaque fois. On détruit proprement l'instance précédente puis on
   en recrée une, en restaurant le zoom/scroll (visibleLogicalRange)
   uniquement quand il s'agit du même instrument+période qu'avant (un vrai
   changement de période/instrument repart, lui, sur la vue complète). */
let chartPro = null; // { chart, series, volumeSeries, key }

function chartTheme(){
  const cs = getComputedStyle(document.documentElement);
  const v = (name, repli) => { const val = cs.getPropertyValue(name); return val ? val.trim() : repli; };
  return {
    text: v('--ink-3', '#8d95a4'),
    grid: v('--line-2', '#1b2028'),
    up: v('--up', '#3ecf7f'),
    down: v('--down', '#f87171'),
  };
}

function detruireChartPro(){
  if (chartPro){
    try { chartPro.chart.remove(); } catch {}
    chartPro = null;
  }
}

function mountChartPro(){
  const el = document.getElementById('chart-pro');
  if (!el || typeof LightweightCharts === 'undefined'){ detruireChartPro(); return; }

  const key = el.dataset.key;
  const entry = HISTP.get(key);
  if (!entry || entry.status !== 'ready' || entry.data.length < 2){ detruireChartPro(); return; }

  let rangeAConserver = null;
  if (chartPro && chartPro.key === key){
    try { rangeAConserver = chartPro.chart.timeScale().getVisibleLogicalRange(); } catch {}
  }
  detruireChartPro();

  const theme = chartTheme();
  const hausse = el.dataset.hausse === '1';
  const couleur = hausse ? theme.up : theme.down;
  const candle = state.ui.chartMode === 'candle'
    && entry.data.every(p => Number.isFinite(p.open) && Number.isFinite(p.high) && Number.isFinite(p.low));
  const hasVolume = entry.data.some(p => Number.isFinite(p.volume) && p.volume > 0);

  let chart;
  try {
    chart = LightweightCharts.createChart(el, {
      layout: { background:{ color:'transparent' }, textColor: theme.text,
        fontFamily: getComputedStyle(document.body).fontFamily },
      grid: { vertLines:{ color: theme.grid }, horzLines:{ color: theme.grid } },
      rightPriceScale: { borderColor: theme.grid },
      timeScale: { borderColor: theme.grid, timeVisible: entry.kind === 'intraday', secondsVisible:false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      autoSize: true,
    });
  } catch { return; } // bibliothèque indisponible (ex. CDN bloqué) : pas de graphique plutôt qu'un plantage

  const timeDe = p => entry.kind === 'intraday'
    ? Math.floor(new Date(p.date).getTime() / 1000)
    : p.date.slice(0, 10);

  let series;
  if (candle){
    series = chart.addSeries(LightweightCharts.CandlestickSeries, {
      upColor: theme.up, downColor: theme.down, borderVisible:false,
      wickUpColor: theme.up, wickDownColor: theme.down,
    });
    series.setData(entry.data.map(p => ({ time:timeDe(p), open:p.open, high:p.high, low:p.low, close:p.close })));
  } else {
    series = chart.addSeries(LightweightCharts.AreaSeries, {
      lineColor: couleur, topColor: couleur + '33', bottomColor: couleur + '00', lineWidth:2,
    });
    series.setData(entry.data.map(p => ({ time:timeDe(p), value:p.close })));
  }

  let volumeSeries = null;
  if (hasVolume){
    volumeSeries = chart.addSeries(LightweightCharts.HistogramSeries, {
      priceFormat:{ type:'volume' }, priceScaleId:'volume', color: couleur + '55',
    });
    try { chart.priceScale('volume').applyOptions({ scaleMargins:{ top:.82, bottom:0 } }); } catch {}
    volumeSeries.setData(entry.data.filter(p => Number.isFinite(p.volume))
      .map(p => ({ time:timeDe(p), value:p.volume,
        color: (Number.isFinite(p.open) ? p.close >= p.open : true) ? theme.up + '66' : theme.down + '66' })));
  }

  chart.timeScale().fitContent();
  if (rangeAConserver){ try { chart.timeScale().setVisibleLogicalRange(rangeAConserver); } catch {} }

  const info = document.getElementById('cpInfo');
  const premier = entry.data[0].close;
  chart.subscribeCrosshairMove(param => {
    if (!info) return;
    const prixEl = info.querySelector('.cp-price'), varEl = info.querySelector('.cp-var'), dateEl = info.querySelector('.cp-date');
    if (!param || param.time === undefined || !param.seriesData || !param.seriesData.has(series)){
      const dernier = entry.data[entry.data.length - 1];
      const vAbs = dernier.close - premier, vPct = premier ? (vAbs / premier) * 100 : null;
      prixEl.textContent = `${fmt.num(dernier.close, 2)} `; prixEl.style.color = '';
      varEl.textContent = `${vAbs >= 0 ? '+' : ''}${fmt.num(vAbs, 2)} (${vPct === null ? '—' : (vPct >= 0 ? '+' : '') + fmt.num(vPct, 2) + ' %'})`;
      varEl.className = 'cp-var tabular-nums ' + (vAbs >= 0 ? 'up-t' : 'down-t');
      dateEl.textContent = formatDateAffichage(dernier.date, entry.kind);
      return;
    }
    const d = param.seriesData.get(series);
    const prix = candle ? d.close : d.value;
    if (!Number.isFinite(prix)) return;
    const vAbs = prix - premier, vPct = premier ? (vAbs / premier) * 100 : null;
    const vol = volumeSeries && param.seriesData.has(volumeSeries) ? param.seriesData.get(volumeSeries).value : null;
    const dateAff = typeof param.time === 'number'
      ? new Date(param.time * 1000).toLocaleString('fr-FR', entry.kind === 'intraday'
          ? { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }
          : { day:'2-digit', month:'2-digit', year:'numeric' })
      : String(param.time);
    prixEl.textContent = fmt.num(prix, 2) + ' ';
    varEl.textContent = `${vAbs >= 0 ? '+' : ''}${fmt.num(vAbs, 2)} (${vPct === null ? '—' : (vPct >= 0 ? '+' : '') + fmt.num(vPct, 2) + ' %'})`;
    varEl.className = 'cp-var tabular-nums ' + (vAbs >= 0 ? 'up-t' : 'down-t');
    dateEl.textContent = dateAff + (vol != null ? ' · vol. ' + fmt.int(vol) : '');
  });

  chartPro = { chart, series, volumeSeries, key };
}

<script>/* ============================================================
   AUTHENTIFICATION — état à trois valeurs
   ------------------------------------------------------------
   auth.status vaut 'loading' | 'guest' | 'authenticated'.
   Supabase est la SEULE source de vérité de la session : aucune donnée
   restaurée depuis novabourse_state_v1 ne peut faire passer ce statut à
   'authenticated' (voir loadState, qui réinitialise systématiquement auth).
   Tant que status !== 'authenticated', renderGate/renderApp/render
   refusent explicitement d'afficher quoi que ce soit de privé.
   ============================================================ */
let sbClient = null;
let AUTH_ERROR = null;
let CONFIG = { supabaseUrl:null, supabaseAnonKey:null, marketConnected:false,
  aiConnected:false, annualBilling:false, appleEnabled:false };

async function loadConfig(){
  try {
    const r = await fetch('/api/config');
    if (r.ok) CONFIG = { ...CONFIG, ...(await r.json()) };
  } catch { /* configuration indisponible : on reste en mode invité strict */ }
  return CONFIG;
}

async function initAuth(){
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseAnonKey){
    state.auth.status = 'guest'; state.auth.signedIn = false;
    renderGate();
    return null;
  }
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  /* detectSessionInUrl:true INCHANGÉ (voir correctif juste plus bas,
     `if (url.searchParams.get('code'))`) : nécessaire aussi au flux
     e-mail (confirmation d'inscription/réinitialisation de mot de passe,
     signUp()/resetPasswordForEmail() plus bas, tokens en #hash) — le
     désactiver casserait ces deux flux, pas seulement Google. */
  sbClient = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true,
            flowType:'pkce', storage:window.localStorage,
            storageKey:'novabourse-auth' },
  });

  /* CORRECTIF (2026-09-24, trouvé EN TESTANT le bouton Apple en direct
     sur la prod) : quand un provider OAuth n'est pas activé côté
     Supabase, signInWithOAuth() ne renvoie PAS une erreur exploitable
     côté client — il redirige (window.location) vers l'URL /authorize
     de Supabase, qui répond alors une page JSON brute
     ({"code":400,"error_code":"validation_failed","msg":"Unsupported
     provider..."}) en dehors de l'app, jamais renvoyée à applySession/
     AUTH_ERROR. Un vrai visiteur cliquant "Continuer avec Apple" avant
     la configuration Apple Developer/Supabase tomberait donc sur une
     page d'erreur brute illisible plutôt que de revenir dans l'app.
     /auth/v1/settings est un endpoint PUBLIC de Supabase (pas besoin de
     jeton) qui liste les providers OAuth réellement activés — vérifié
     une fois ici, le bouton Apple ne s'affiche que s'il est vraiment
     prêt (voir gateScreen()). Se met à jour tout seul le jour où Apple
     est configuré côté tableau de bord, sans changement de code. */
  try {
    const r = await fetch(CONFIG.supabaseUrl + '/auth/v1/settings');
    if (r.ok){ const s = await r.json(); CONFIG.appleEnabled = !!(s.external && s.external.apple); }
  } catch { /* réglages indisponibles : le bouton Apple reste caché par prudence */ }

  try {
    const url = new URL(window.location.href);
    const err = url.searchParams.get('error_description') || url.searchParams.get('error')
      || new URLSearchParams(window.location.hash.slice(1)).get('error_description');
    if (err){
      AUTH_ERROR = decodeURIComponent(err).replace(/\+/g, ' ');
      url.searchParams.delete('error'); url.searchParams.delete('error_description');
      window.history.replaceState({}, '', url.pathname);
    }
    if (url.searchParams.get('code')){
      /* CORRECTIF (2026-09-29, retour utilisateur : "on nous demande
         parfois de nous connecter 2 fois à Google") : cet appel manuel
         à exchangeCodeForSession() faisait DOUBLE EMPLOI avec la
         détection automatique de detectSessionInUrl:true (client créé
         juste au-dessus), qui traite déjà ce même `code` PKCE en
         interne dès sa création — un vrai bug de course documenté par
         Supabase (un code PKCE n'est échangeable qu'UNE SEULE FOIS,
         5 minutes de validité) : selon l'ordre d'arrivée entre les deux
         tentatives, l'une des deux échouait silencieusement ("code
         already used"/"invalid grant"), laissant parfois l'utilisateur
         en 'guest' après un premier clic sur "Continuer avec Google"
         pourtant réussi côté Google — d'où la nécessité de recliquer.
         Retiré au profit d'une simple attente (même principe que la
         branche #access_token juste en dessous, qui s'appuyait déjà
         SEULEMENT sur la détection automatique, jamais sur un appel
         manuel) avant de nettoyer l'URL. */
      await new Promise(r => setTimeout(r, 60));
      url.searchParams.delete('code');
      url.searchParams.delete('state');
      window.history.replaceState({}, '', url.pathname + url.search + url.hash);
    } else if (window.location.hash.includes('access_token')){
      await new Promise(r => setTimeout(r, 60));
      window.history.replaceState({}, '', url.pathname + url.search);
    }
  } catch (e){
    console.warn('[auth]', e);
    AUTH_ERROR = "L'échange du code de connexion a échoué : " + (e.message || e);
  }

  /* applySession peut être invoquée par onAuthStateChange ET par le premier
     getSession() ci-dessous. Elle est rendue idempotente via un jeton de
     "génération" : seul le dernier appel en cours a le droit d'écrire l'état
     et de déclencher le rendu, ce qui évite les doubles /api/me et les
     rendus contradictoires en cas d'appels quasi simultanés. */
  sbClient.auth.onAuthStateChange((_e, session) => { applySession(session); });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && sbClient && state.auth.status !== 'authenticated'){
      const { data } = await sbClient.auth.getSession();
      if (data.session) applySession(data.session);
    }
  });
  const { data } = await sbClient.auth.getSession();
  await applySession(data.session);
  return sbClient;
}

async function authFetch(url, options = {}){
  const { data } = sbClient ? await sbClient.auth.getSession() : { data:{} };
  const token = data?.session?.access_token;
  return fetch(url, { ...options, headers: {
    'Content-Type':'application/json',
    ...(token ? { Authorization:'Bearer ' + token } : {}),
    ...(options.headers || {}),
  }});
}

let _sessionGen = 0;
async function applySession(session){
  const gen = ++_sessionGen;

  if (!session){
    if (gen !== _sessionGen) return;
    state.auth = { status:'guest', signedIn:false, name:null, email:null, since:null };
    state.settings.plan = 'free';
    state.account = null;
    saveState(); renderGate(); return;
  }

  state.auth = {
    status:'authenticated',
    signedIn: true,
    name: session.user.user_metadata?.full_name || session.user.email,
    email: session.user.email,
    avatar: session.user.user_metadata?.avatar_url || null,
    since: session.user.created_at || null,
  };
  saveState();
  await refreshAccount();
  if (gen !== _sessionGen) return;   // une session plus récente a déjà pris le relais
  syncPortfolio();   // asynchrone, non bloquant : ne re-render() que si la fusion change quelque chose

  if (state.account && state.account.onboarded === false && !state.onboarding.done){
    state.onboarding.step = state.onboarding.step || 1;
    saveState(); renderGate(); return;
  }
  if (state.account && state.account.onboarded){
    state.onboarding.done = true;
    saveState();
  }
  renderGate();
}

function quotaLigne(){
  const a = state.account;
  if (!a || typeof a.used !== 'number') return '';
  const nom = esc(a.planLabel || a.plan || '');
  if (a.unlimited) return `<div class="quota"><b>${nom}</b><span>Analyses incluses</span></div>`;
  const pct = a.limit ? Math.min(100, Math.round(a.used / a.limit * 100)) : 0;
  return `<div class="quota">
    <b>${nom}</b>
    <span class="tabular-nums">${a.used} / ${a.limit} analyses utilisées ce mois-ci</span>
    <i class="quota-bar"><em style="width:${pct}%"></em></i>
  </div>`;
}

async function refreshAccount(){
  try {
    const r = await authFetch('/api/me');
    if (!r.ok) return;
    const me = await r.json();
    state.settings.plan = me.plan || 'free';
    state.account = me;
    if (me.profileSetup){
      const p = me.profileSetup;
      if (p.level) state.onboarding.level = p.level;
      if (p.goal) state.onboarding.goal = p.goal;
      if (p.interests) state.onboarding.interests = p.interests;
    }
    saveState();
  } catch {}
}

function setCapital(amount){
  const v = Math.max(100, Math.min(10000000, Math.round(amount)));
  state.wallet = { cash:v, invested:v, positions:[], realizedPnL:0 };
  /* Un nouveau portefeuille repart d'un historique VIDE, jamais celui d'un
     portefeuille précédent : la période "MAX" de la courbe recommence
     honnêtement à cet instant précis (voir snapshotPortfolio). */
  state.walletHistory = [];
  state.onboarding.capital = v;
  state.onboarding.step = 4;
  snapshotPortfolio('open');
  flushSaveState();
  renderGate();
  toast(`Portefeuille ouvert avec ${fmt.eur(v)}`);
}

async function signIn(){
  if (!sbClient){
    toast("Connexion indisponible : configuration du serveur incomplète.");
    return;
  }
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/',
               queryParams: { prompt:'select_account' } },
  });
  if (error) toast('Connexion impossible : ' + error.message);
}
/* Apple (2026-09-24, "modernise la page de connexion") — même client
   sbClient, même méthode signInWithOAuth que Google juste au-dessus,
   seul le provider change : c'est tout ce que Supabase Auth demande
   côté code pour un provider OAuth supplémentaire. Ce qui reste HORS de
   ce fichier (et hors de ce que le code peut garantir) : le provider
   Apple doit être activé côté tableau de bord Supabase (Authentication
   → Providers → Apple) avec un Services ID, Team ID, Key ID et une clé
   privée générés depuis un compte Apple Developer payant, plus l'URL de
   callback Supabase déclarée dans ce Services ID côté Apple. Tant que
   ce n'est pas fait, Supabase répond une erreur explicite ("Unsupported
   provider..."), traduite comme les autres erreurs d'auth ci-dessous —
   jamais un faux succès. */
async function signInApple(){
  if (!sbClient){
    toast("Connexion indisponible : configuration du serveur incomplète.");
    return;
  }
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'apple',
    options: { redirectTo: window.location.origin + '/' },
  });
  if (error) toast('Connexion impossible : ' + traduireErreurAuth(error.message));
}
/* Connexion par e-mail/mot de passe (2026-09-24) — Supabase Auth
   directement (signInWithPassword/signUp/resetPasswordForEmail), aucune
   route API maison : c'est exactement pour ça que Supabase Auth a été
   choisi à l'origine. État du formulaire (mode ouvert, erreur, en
   cours) gardé en variables de module plutôt que dans `state` : c'est
   de l'UI éphémère, jamais une donnée applicative à sauvegarder — même
   principe que templeIntroPlayed/searchIntent ailleurs dans ce fichier. */
let gateEmailMode = null;      // null (fermé) | 'signin' | 'signup' | 'reset'
let gateEmailBusy = false;
let gateEmailNotice = null;    // { kind:'error'|'success', text }

function traduireErreurAuth(msg){
  const m = (msg || '').toLowerCase();
  if (m.includes('invalid login credentials')) return 'Adresse e-mail ou mot de passe incorrect.';
  if (m.includes('already registered') || m.includes('already exists'))
    return 'Un compte existe déjà avec cette adresse — connectez-vous plutôt.';
  if (m.includes('password should be at least') || m.includes('password is too short'))
    return 'Le mot de passe doit contenir au moins 6 caractères.';
  if (m.includes('rate limit')) return 'Trop de tentatives : réessayez dans quelques minutes.';
  if (m.includes('email not confirmed'))
    return "Confirmez d'abord votre adresse e-mail (lien envoyé à l'inscription) avant de vous connecter.";
  if (m.includes('unable to validate email') || m.includes('invalid email')) return 'Adresse e-mail invalide.';
  if (m.includes('unsupported provider') || m.includes('provider is not enabled'))
    return "Cette méthode de connexion n'est pas encore activée côté serveur.";
  return msg || 'Une erreur est survenue.';
}
function openGateEmail(mode){
  gateEmailMode = mode || 'signin'; gateEmailNotice = null; renderGate();
  requestAnimationFrame(() => document.getElementById('gateEmail')?.focus());
}
function closeGateEmail(){ gateEmailMode = null; gateEmailNotice = null; renderGate(); }
function toggleGateEmailMode(){
  gateEmailMode = gateEmailMode === 'signup' ? 'signin' : 'signup';
  gateEmailNotice = null; renderGate();
  requestAnimationFrame(() => document.getElementById('gateEmail')?.focus());
}
function openGateEmailReset(){
  gateEmailMode = 'reset'; gateEmailNotice = null; renderGate();
  requestAnimationFrame(() => document.getElementById('gateEmail')?.focus());
}
function readGateEmailFields(){
  return {
    email: (document.getElementById('gateEmail')?.value || '').trim(),
    password: document.getElementById('gatePassword')?.value || '',
  };
}
function submitGateEmail(){
  if (gateEmailBusy) return;
  if (gateEmailMode === 'reset') return emailReset();
  if (gateEmailMode === 'signup') return emailSignUp();
  return emailSignIn();
}
async function emailSignIn(){
  if (!sbClient){ gateEmailNotice = { kind:'error', text:'Connexion indisponible : configuration du serveur incomplète.' }; renderGate(); return; }
  const { email, password } = readGateEmailFields();
  if (!email || !password){ gateEmailNotice = { kind:'error', text:'Adresse e-mail et mot de passe requis.' }; renderGate(); return; }
  gateEmailBusy = true; gateEmailNotice = null; renderGate();
  const { error } = await sbClient.auth.signInWithPassword({ email, password });
  gateEmailBusy = false;
  if (error){ gateEmailNotice = { kind:'error', text: traduireErreurAuth(error.message) }; renderGate(); return; }
  /* Pas de renderGate() ici en cas de succès : onAuthStateChange (câblé
     dans initAuth()) reçoit la nouvelle session et appelle déjà
     applySession() -> renderGate() — un second appel ici peindrait un
     état transitoire incohérent entre les deux. */
}
async function emailSignUp(){
  if (!sbClient){ gateEmailNotice = { kind:'error', text:'Connexion indisponible : configuration du serveur incomplète.' }; renderGate(); return; }
  const { email, password } = readGateEmailFields();
  if (!email || !password){ gateEmailNotice = { kind:'error', text:'Adresse e-mail et mot de passe requis.' }; renderGate(); return; }
  if (password.length < 6){ gateEmailNotice = { kind:'error', text:'Le mot de passe doit contenir au moins 6 caractères.' }; renderGate(); return; }
  gateEmailBusy = true; gateEmailNotice = null; renderGate();
  const { data, error } = await sbClient.auth.signUp({
    email, password, options: { emailRedirectTo: window.location.origin + '/' },
  });
  gateEmailBusy = false;
  if (error){ gateEmailNotice = { kind:'error', text: traduireErreurAuth(error.message) }; renderGate(); return; }
  if (data?.session) return;   // auto-confirmé : onAuthStateChange prend le relais, comme emailSignIn()
  /* Confirmation par e-mail requise (comportement par défaut de
     Supabase Auth, aucune session tant que le lien n'est pas cliqué) :
     le dire honnêtement plutôt que de laisser croire à une connexion
     immédiate qui n'a pas eu lieu. */
  gateEmailMode = 'signin';
  gateEmailNotice = { kind:'success',
    text:`Compte créé. Vérifiez votre boîte mail (${email}) et cliquez sur le lien de confirmation avant de vous connecter.` };
  renderGate();
}
async function emailReset(){
  if (!sbClient){ gateEmailNotice = { kind:'error', text:'Connexion indisponible : configuration du serveur incomplète.' }; renderGate(); return; }
  const { email } = readGateEmailFields();
  if (!email){ gateEmailNotice = { kind:'error', text:'Indiquez votre adresse e-mail.' }; renderGate(); return; }
  gateEmailBusy = true; gateEmailNotice = null; renderGate();
  const { error } = await sbClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/' });
  gateEmailBusy = false;
  if (error){ gateEmailNotice = { kind:'error', text: traduireErreurAuth(error.message) }; renderGate(); return; }
  gateEmailMode = 'signin';
  /* Supabase ne révèle jamais si l'adresse existe réellement (sécurité,
     évite l'énumération de comptes) — "si un compte existe" reflète
     honnêtement ce que la réponse garantit, jamais plus. */
  gateEmailNotice = { kind:'success', text:`E-mail de récupération envoyé à ${email}, si un compte existe avec cette adresse.` };
  renderGate();
}

async function startCheckout(plan){
  if (plan === 'free'){ toast("L'offre Découverte est déjà active."); return; }
  if (state.auth.status !== 'authenticated'){ toast('Connectez-vous pour souscrire.'); return; }
  toast('Ouverture du paiement sécurisé…');
  try {
    const r = await authFetch('/api/stripe/create-checkout-session', {
      method:'POST', body: JSON.stringify({ plan }),
    });
    const d = await r.json();
    if (d.url){ window.location.href = d.url; return; }
    toast(d.error === 'prix_absent' ? "Cette offre n'est pas encore configurée."
      : d.error === 'stripe_non_configure' ? 'Paiement indisponible pour le moment.'
      : 'Paiement impossible.');
  } catch { toast('Paiement indisponible pour le moment.'); }
}

async function openPortal(){
  try {
    const r = await authFetch('/api/stripe/create-portal-session', { method:'POST' });
    const d = await r.json();
    if (d.url){ window.location.href = d.url; return; }
    toast(d.error === 'aucun_abonnement' ? "Aucun abonnement rattaché à ce compte."
      : 'Espace de gestion indisponible.');
  } catch { toast('Espace de gestion indisponible.'); }
}

async function signOut(){
  _sessionGen++;   // invalide toute résolution de session encore en vol
  if (sbClient) await sbClient.auth.signOut();
  state.auth = { status:'guest', signedIn:false, name:null, email:null, since:null };
  state.settings.plan = 'free';
  state.account = null;
  saveState(); renderGate();
}

/* Écran neutre pendant la vérification de session : aucune information

/* Refonte 2026-09-24 ("elle n'est plus à jour avec le produit actuel")
   — trois changements demandés explicitement :
   1) Message principal et sous-texte réécrits.
   2) Les 3 lignes .gate-pt (liste verticale) deviennent .gate-cards
      (grille compacte 3 colonnes, voir CSS) — même esprit que les
      cartes Nova de l'accueil/portefeuille/fiche action de cette même
      session, cohérence plutôt qu'un style isolé propre à cette page.
   3) Google + Apple + e-mail (voir gateEmailFormHTML ci-dessous) —
      Apple utilise le même sbClient/la même méthode que Google, prêt
      côté code ; ce qui reste à faire vit côté tableau de bord
      Supabase, voir la note sur signInApple() plus haut.
   Page nettement plus courte qu'avant (§4 du brief : "le bouton de
   connexion doit apparaître rapidement") : brand-orbit réduit (voir
   CSS), h1/marges resserrés, plus de "Connexion sécurisée par Google"
   spécifique à un seul provider. Les 3 cartes ET le texte légal restent
   présents mais après les boutons, jamais avant — priorité au geste

function renderGate(){

  const el = document.getElementById('view');
  if (state.auth.status === 'loading'){
    el.innerHTML = loadingScreen();
  } else if (state.auth.status === 'guest'){
    el.innerHTML = gateScreen();
  } else if (!state.onboarding.done){
    el.innerHTML = onboardingScreen();
  } else {
    renderApp();
    return;
  }
  animate();
}
function renderApp(){
  /* Garde-fou : l'application privée ne s'ouvre jamais tant que la session
     n'est pas confirmée par Supabase, quel que soit l'appelant. */
  if (state.auth.status !== 'authenticated' || !state.onboarding.done){
    renderGate();
    return;
  }
  document.body.classList.remove('gated');
  route = { page:'home', arg:null };
  render();
}

/* ============================================================
   NAVIGATION, ÉVÉNEMENTS, DÉMARRAGE
   ============================================================ */
/* Explorer fusionnée dans Marchés le 2026-09-23 (recherche + bouton
   Filtres remplacent le "mur" de puces secteur/pays affiché en
   permanence) — 6 destinations -> 5. Voir PAGES.markets(). */
const NAV = [
  { id:'home',      label:'Accueil',      icon:ICON.home },
  { id:'markets',   label:'Marchés',      icon:ICON.chart },
  { id:'radar',     label:'Radar',        icon:ICON.radar },
  { id:'portfolio', label:'Portefeuille', icon:ICON.wallet },
  { id:'account',   label:'Compte',       icon:ICON.user },
];
let route = { page:'home', arg:null };
let history_ = [];

/* Motion system — pilule glissante du dock (2026-09-21) : le dock lui-même
   n'est construit qu'UNE SEULE FOIS (dockBuilt). Le reconstruire à chaque
   render() (comme avant) détruisait et recréait la pilule à chaque fois :
   un nœud DOM tout neuf n'a pas d'état "avant" dont transitionner, la
   transition CSS ne pouvait donc jamais réellement s'animer — elle
   "sautait" directement à sa position finale. En ne touchant plus que
   aria-current + la position de la pilule persistante, le transform/width
   change sur un élément qui existait déjà l'instant d'avant, et la
   transition (.45s var(--spring)) s'exécute pour de vrai. */
let dockBuilt = false;
let topNavBuilt = false;
/* setAttribute/removeAttribute seulement quand l'état CHANGE vraiment
   (2026-09-23, ajouté avec les animations de la nav — "vraiment
   beaucoup d'animation") : paintNav() tourne à CHAQUE render(), pas
   seulement à la navigation (aussi à chaque tick de rafraîchissement
   vivant) — reposer aria-current inconditionnellement sur les 5/6
   boutons à chaque fois, même sur ceux qui ne changent pas, risquait de
   redéclencher les animations CSS liées à [aria-current] (rebond de
   l'icône, pilule) en continu plutôt que seulement au vrai changement
   d'onglet. Ne toucher l'attribut QUE quand il change réellement
   élimine ce risque à la source. */
function syncActiveAttr(el, shouldBeActive){
  const isActive = el.hasAttribute('aria-current');
  if (shouldBeActive && !isActive) el.setAttribute('aria-current', 'page');
  else if (!shouldBeActive && isActive) el.removeAttribute('aria-current');
}
function paintNav(){
  paintSource();
  /* Nova Explain (2026-09-28) : reflète le niveau choisi à l'onboarding
     sur <html>, pour toute règle CSS [data-nova-level="..."] future —
     paintNav() tourne à chaque render(), donc toujours à jour dès que
     state.settings.mode change (segmenté Simple/Détaillé compris). */
  document.documentElement.setAttribute('data-nova-level', novaLevel());
  const topNav = document.getElementById('topNav');
  if (!topNavBuilt){
    topNav.innerHTML = `<span class="top-nav-pill" aria-hidden="true"></span>` + NAV.map(n=>`
      <a href="#" data-go="${n.id}">${n.label}</a>`).join('');
    topNavBuilt = true;
  }
  topNav.querySelectorAll('a[data-go]').forEach(a => syncActiveAttr(a, a.dataset.go === route.page));
  positionTopNavPill();
  const dock = document.getElementById('dock');
  if (!dockBuilt){
    dock.innerHTML = `<span class="dock-pill" aria-hidden="true"></span>` + NAV.map(n=>`
      <button data-go="${n.id}" aria-label="${n.label}">${svg(n.icon)}<span>${n.label}</span></button>`).join('');
    dockBuilt = true;
  }
  dock.querySelectorAll('button[data-go]').forEach(b => syncActiveAttr(b, b.dataset.go === route.page));
  positionDockPill();
  document.querySelector('[data-search]').innerHTML = svg(ICON.search);
  document.querySelector('[data-theme-toggle]').innerHTML =
    svg(state.settings.theme === 'dark' ? ICON.sun : ICON.moon);
}
function positionDockPill(){
  const dock = document.getElementById('dock');
  const pill = dock.querySelector('.dock-pill');
  const active = dock.querySelector('button[aria-current]');
  if (!pill) return;
  if (!active){ pill.style.width = '0px'; return; }
  pill.style.transform = `translateX(${active.offsetLeft}px)`;
  pill.style.width = active.offsetWidth + 'px';
}
/* Même mécanique FLIP que .dock-pill juste au-dessus (nœud persistant,
   seules transform/width bougent d'un render à l'autre) appliquée à la
   nav du haut (desktop) — jusqu'ici elle recréait ses liens à chaque
   paintNav() (voir topNavBuilt plus haut, même correctif que dockBuilt
   en son temps) : une pilule sur des nœuds recréés en continu n'aurait
   jamais pu réellement glisser. */
function positionTopNavPill(){
  const topNav = document.getElementById('topNav');
  const pill = topNav.querySelector('.top-nav-pill');
  const active = topNav.querySelector('a[aria-current]');
  if (!pill) return;
  if (!active){ pill.style.width = '0px'; return; }
  pill.style.transform = `translateX(${active.offsetLeft}px)`;
  pill.style.width = active.offsetWidth + 'px';
}
/* La position mesurée en pixels ne survit pas à une rotation d'écran ou à
   l'ouverture du clavier (qui redimensionne le viewport sur mobile) —
   sans ce listener, la pilule resterait figée à ses anciennes coordonnées
   jusqu'au prochain changement d'onglet. */
window.addEventListener('resize', () => {
  const dockPill = document.querySelector('.dock-pill');
  if (dockPill){
    dockPill.classList.add('no-anim');
    positionDockPill();
    requestAnimationFrame(() => dockPill.classList.remove('no-anim'));
  }
  const topPill = document.querySelector('.top-nav-pill');
  if (topPill){
    topPill.classList.add('no-anim');
    positionTopNavPill();
    requestAnimationFrame(() => topPill.classList.remove('no-anim'));
  }
});

/* Fondus progressifs au scroll (2026-09-23, en 2 temps le même jour) —
   voir --top-fade dans le CSS de .top et --temple-fade dans celui de
   .nova-temple. Un seul écouteur/throttle partagé pour les deux plutôt
   que deux séparés : même coût qu'un seul.
   - Header : posé une fois au démarrage, jamais par page — le header
     (<header class="top">) est dans le HTML statique, en dehors de
     #view, donc déjà partagé par toutes les routes. Fondu simplement
     lié à la position de scroll globale (0 → 160px).
   - Temple : n'existe que sur l'accueil (PAGES.home), donc recherché à
     chaque calcul plutôt que mis en cache — absent ailleurs, la
     fonction sort tôt sans rien faire. Fondu lié à SA PROPRE position
     réelle (getBoundingClientRect) plutôt qu'à une distance de scroll
     fixe : "s'efface quand on le dépasse" doit rester correct quel que
     soit la hauteur du temple (mobile vs desktop, tailles d'écran
     différentes) — une distance fixe se serait déclenchée trop tôt ou
     trop tard selon l'écran.
   requestAnimationFrame plutôt qu'un calcul direct dans le handler de
   scroll : évite de recalculer le style à chaque événement natif (qui
   peut se déclencher bien plus souvent qu'une fois par frame), un seul
   throttling déjà éprouvé ailleurs dans ce fichier pour d'autres
   écouteurs fréquents. updateScrollFades() exposée (pas dans une IIFE)
   pour être aussi appelée depuis render() : sans ça, arriver sur
   l'accueil par navigation (scroll remis à 0 par render() lui-même)
   pourrait laisser le temple visuellement figé à l'ancien niveau de
   fondu jusqu'au prochain scroll. */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function updateScrollFades(){
  const HEADER_FADE_DISTANCE = 160;  // px de scroll pour atteindre le minimum
  const HEADER_FADE_FLOOR = .15;     // jamais totalement invisible (lisibilité)
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  const ht = Math.min(1, y / HEADER_FADE_DISTANCE);
  const headerFade = 1 - ht * (1 - HEADER_FADE_FLOOR);
  document.documentElement.style.setProperty('--top-fade', headerFade.toFixed(3));

  const temple = document.querySelector('.nova-temple-section');
  if (temple){
    /* CORRECTIF (2026-09-25, retour utilisateur : "le temple ne s'efface
       pas entièrement") : plancher retiré (était .08, soit ~4,4% visible
       en permanence une fois défilé — .55 de base × .08). Le temple
       atteint maintenant réellement 0 à la fin de sa zone de fondu,
       jamais un résidu visible. */
    const TEMPLE_FADE_FLOOR = 0;
    const rect = temple.getBoundingClientRect();
    // Commence à s'effacer dès qu'il entame son ascension sous le
    // header (start), atteint le plancher une fois un peu plus de la
    // moitié de sa hauteur passée sous le haut de l'écran (end).
    const start = rect.height * .15;
    const end = -rect.height * .55;
    const tt = Math.min(1, Math.max(0, (start - rect.top) / (start - end)));
    const templeFade = 1 - tt * (1 - TEMPLE_FADE_FLOOR);
    document.documentElement.style.setProperty('--temple-fade', templeFade.toFixed(3));
    /* CORRECTIF (2026-09-25, retour utilisateur : "j'ai mal compris" — un
       zoom sur seulement 2 colonnes ne suffisait pas, "je voudrais que
       TOUT LE TEMPLE fasse un gros zoom") : gros zoom (jusqu'à 2×) sur le
       temple ENTIER, lié au MÊME `tt` que le fondu ci-dessus — remonter
       dézoome donc automatiquement à l'inverse, une seule variable
       continue pilote les deux sens. Combiné avec le parallaxe existant
       dans UN SEUL transform sur .nova-temple-section (le parent de
       .nova-temple), jamais sur .nova-temple lui-même qui a déjà sa
       propre animation CSS sur `transform` (deux sources sur le même
       nœud se marcheraient dessus). Sauté sous prefers-reduced-motion,
       même choix que le reste des effets purement décoratifs d'ici. */
    if (!REDUCED_MOTION){
      const TEMPLE_ZOOM_MAX = 2;
      const zoom = 1 + tt * (TEMPLE_ZOOM_MAX - 1);
      const parallax = Math.max(-26, -y * .08);
      temple.style.transform = `translateY(${parallax.toFixed(1)}px) scale(${zoom.toFixed(3)})`;
    }
  }
}
(function wireScrollFades(){
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateScrollFades(); });
  }, { passive:true });
  window.addEventListener('resize', updateScrollFades, { passive:true });
  updateScrollFades();
})();

/* Curseur glissant des .seg — technique FLIP (voir le commentaire CSS sur
   .seg-pill). SEG_FROM(key) posée par le handler de clic ci-dessus ;
   consommée une seule fois ici, jamais réappliquée à un render() qui
   suit sans nouveau clic sur ce .seg précis. */
function syncSegPill(seg){
  if (!seg) return;
  let pill = seg.querySelector(':scope > .seg-pill');
  if (!pill){
    pill = document.createElement('span');
    pill.className = 'seg-pill';
    pill.setAttribute('aria-hidden', 'true');
    seg.insertBefore(pill, seg.firstChild);
  }
  const active = seg.querySelector('button[aria-pressed="true"]');
  if (!active){ pill.style.width = '0px'; return; }
  const key = seg.dataset.seg;
  const depart = key ? SEG_FROM.get(key) : null;
  if (depart){
    SEG_FROM.delete(key);
    pill.style.transition = 'none';
    pill.style.transform = `translateX(${depart.left}px)`;
    pill.style.width = depart.width + 'px';
    pill.offsetHeight; // force le reflow avant d'écrire la position d'arrivée
    pill.style.transition = '';
  }
  pill.style.transform = `translateX(${active.offsetLeft}px)`;
  pill.style.width = active.offsetWidth + 'px';
}
function syncAllSegPills(){
  document.querySelectorAll('.seg[data-seg]').forEach(syncSegPill);
}

function render(navigated = false){
  /* Filet de sécurité : tant que la session n'est pas confirmée et
     l'onboarding terminé, jamais de contenu privé. */
  if (state.auth.status !== 'authenticated' || !state.onboarding.done){
    renderGate();
    return;
  }
  document.body.classList.remove('gated');

  const view = document.getElementById('view');
  let html;
  try {
    html = route.page === 'stock' ? PAGES.stock(route.arg)
      : route.page === 'listDetail' ? PAGES.listDetail(route.arg)
      : (PAGES[route.page] || PAGES.home)();
  } catch (err){
    console.error('[NovaTitre]', err);
    html = `<div class="card">${emptyState('Cette section n’a pas pu s’afficher',
      'Le reste de l’application reste utilisable.', { go:'home', label:'Revenir à l’accueil' })}
      <p class="tiny" style="margin-top:18px;text-align:center;word-break:break-word">
        ${esc(route.page)} · ${esc(err && err.message ? err.message : String(err))} · ${esc(BUILD)}</p>
    </div>`;
  }
  view.innerHTML = html;
  /* CORRECTIF (2026-09-23, signalé "je vois le temple sur mon PC mais pas
     sur mon téléphone") : bug WebKit/mobile connu — une animation CSS
     posée sur des éléments insérés d'un coup via innerHTML (comme ici)
     peut ne jamais démarrer si le navigateur ne recalcule pas la mise en
     page ENTRE l'insertion et l'application de l'animation ; l'élément
     reste alors figé à son état de départ (.temple-part part d'opacity:0
     pour l'effet d'apparition en cascade) — invisible en permanence sur
     les navigateurs concernés, alors que Chrome desktop ne montre pas ce
     souci. Lire une propriété de mise en page (offsetHeight) force ce
     recalcul avant que l'animation ne soit évaluée, ce qui est le
     correctif standard pour ce bug. */
  void view.offsetHeight;
  /* Fond ambiant par section (2026-09-21, palette officielle) : voir les
     règles body[data-bg=...] sur .aurora-bg — portfolio penche vert+orange,
     compte/réglages restent neutres, tout le reste garde le défaut
     orange+bleu. Un simple attribut plutôt qu'une classe : une seule
     source de vérité, jamais désynchronisée d'un toggle CSS séparé. */
  document.body.dataset.bg = (route.page === 'portfolio') ? 'portfolio'
    : (route.page === 'account' || route.page === 'settings') ? 'account'
    : 'default';
  /* Le scroll ne repart en haut que lors d'une VRAIE navigation (go()/back()),
     jamais lors d'un simple rafraîchissement déclenché par l'arrivée d'une
     quote ou d'un historique en tâche de fond. */
  if (navigated){
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
  /* Recalcule les fondus header/temple (voir updateScrollFades() plus
     bas) après CHAQUE rendu, pas seulement au scroll : sans ça, arriver
     sur l'accueil par navigation laisserait le temple visuellement figé
     au niveau de fondu de la page précédente jusqu'au prochain scroll
     (le DOM du temple vient d'être recréé, --temple-fade ne le "sait"
     pas tout seul). */
  updateScrollFades();
  /* Filet de sécurité (2026-09-23, même correctif "temple invisible sur
     téléphone" que ci-dessus) : au cas où le recalcul forcé plus haut ne
     suffirait pas sur un navigateur/appareil imprévu, force l'état final
     visible après le délai maximum que l'animation d'apparition peut
     prendre (dernier délai .42s + durée .35s ≈ 0,77s, marge prise à
     1000ms — cascade resserrée le 2026-09-29, voir templePartIn/CSS).
     Ne change rien de visible quand l'animation CSS a normalement joué
     (elle est déjà à opacity:1 à ce moment-là) ; rattrape seulement le
     cas où elle ne s'est jamais déclenchée. */
  if (document.querySelector('.temple-part')){
    setTimeout(() => {
      document.querySelectorAll('.temple-part').forEach(el => { el.style.opacity = '1'; });
    }, 1000);
  }
  paintNav();
  syncAllSegPills();
  /* Chargement à la demande : l'accueil/watchlist n'entraîne plus aucun
     appel history/fondamentaux (seules les quotes, déjà séparées, restent
     automatiques). L'ouverture d'une fiche n'en déclenche plus non plus —
     l'utilisateur doit cliquer "Voir le graphique"/"Voir les chiffres".
     Seul Comparer reste un déclenchement automatique légitime : ouvrir une
     comparaison EST une demande explicite de graphique et de chiffres pour
     les sociétés choisies (validé explicitement). Chaque fonction protège
     déjà contre une société déjà chargée ou en cours de chargement. */
  if (route.page === 'compare'){
    const comparees = state.compare.map(id => byId[id]).filter(Boolean);
    comparees.forEach(chargerGraphique);
    /* Les fondamentaux n'ont de sens que pour les actions (CMP_ROWS :
       PER/ROE/marge...) — inutile d'appeler /api/market/fundamentals pour
       une paire Forex ou une crypto, qui n'en auront jamais. Le tableau
       affiche déjà "indisponible" proprement dans ce cas ; ceci évite
       simplement l'appel réseau inutile. */
    comparees.filter(s => s.type === 'stock').forEach(chargerFondamentaux);
  }
  if (route.page === 'radar')   document.getElementById('radarOut').innerHTML = radarResults();
  /* Pose/complète le relevé du jour à chaque visite réelle de la page
     Portefeuille — jamais un minuteur en tâche de fond (voir
     assurerRelevéQuotidien). */
  if (route.page === 'portfolio') assurerRelevéQuotidien();

  /* Rafraîchissement vivant — uniquement les instruments réellement
     visibles sur la page courante, jamais tout le catalogue. Une page
     sans instrument pertinent (compte, réglages...) coupe le
     rafraîchissement. */
  /* Cotations : n'appeler assurerCotations() que sur ce qui est
     RÉELLEMENT affiché à l'écran pour cette route — jamais la catégorie
     entière, jamais tout le catalogue. C'est la même liste, scopée par
     page, qui sert aussi de base au rafraîchissement vivant juste après. */
  const listesParRoute = {
    stock: () => [byId[route.arg]].filter(Boolean),
    compare: () => state.compare.map(id => byId[id]).filter(Boolean),
    markets: () => marketsListeVisible(),
    watchlist: () => state.watchlist.map(id => byId[id]).filter(Boolean),
    home: () => [...state.watchlist.map(id => byId[id]), ...stocks.slice(0, 6)].filter(Boolean),
    portfolio: () => state.wallet.positions.map(p => byId[p.id]).filter(Boolean),
  };
  const liveParRoute = {
    stock: () => [route.arg],
    compare: () => state.compare,
    markets: () => marketsListeVisible().slice(0, LIVE_MAX_SYMBOLES).map(s => s.id),
    watchlist: () => state.watchlist,
    home: () => state.watchlist.slice(0, 6),
    portfolio: () => state.wallet.positions.map(p => p.id),
  };
  const listeVisible = (listesParRoute[route.page] || (() => []))();
  /* Alertes actives (2026-09-23) : ajoutées à la liste suivie en direct
     QUELLE QUE SOIT la page courante — une alerte doit continuer à être
     vérifiée même si l'utilisateur navigue ailleurs, pas seulement
     quand la fiche du titre concerné est affichée. demarrerRafraichis-
     sementVivant() déduplique déjà et plafonne à LIVE_MAX_SYMBOLES ;
     limite honnête assumée (voir DEFAULT_STATE.alerts) : au-delà de ce
     plafond partagé avec le reste de la page, les alertes en surplus
     patientent jusqu'à ce qu'une place se libère. */
  const idsAlertesActives = [...new Set(state.alerts.filter(a => !a.triggered).map(a => a.stockId))];
  const idsVisibles = [...(liveParRoute[route.page] || (() => []))(), ...idsAlertesActives];
  /* Ne jamais redemander via assurerCotations() ce que le rafraîchissement
     vivant s'apprête de toute façon à obtenir tout de suite (son tick
     immédiat) — sinon les mêmes premiers symboles partent deux fois dans
     le même cycle (confirmé en test : "OR@PA"/"MC@PA" comptés deux fois).
     assurerCotations() ne comble donc que le RESTE de la page visible,
     au-delà des LIVE_MAX_SYMBOLES suivis en direct. */
  const idsVivantsSet = new Set(idsVisibles);
  const resteACombler = listeVisible.filter(s => s && !idsVivantsSet.has(s.id));
  if (resteACombler.length) assurerCotations(resteACombler);
  if (idsVisibles.length) demarrerRafraichissementVivant(idsVisibles);
  else arreterRafraichissementVivant();

  /* Sparklines de la grille Marché (bug réel confirmé en test : stockRow()
     sait dessiner une mini-courbe depuis longtemps via opts.spark, mais
     RIEN dans toute l'application ne passait jamais spark:true — la
     grille Marché n'affichait donc jamais aucune courbe, quel que soit
     l'instrument). Même philosophie "à la demande" que assurerCotations()
     ci-dessus : uniquement les lignes RÉELLEMENT visibles de la page
     courante, jamais tout le catalogue.
     Période "1j" (intraday 5min, voir PERIOD_SPECS côté history.js) et
     non le défaut ~260 séances/1 an de chargerGraphique() (celui-ci
     reste réservé à Comparer/volatilité, voir son propre commentaire) :
     demande explicite de l'utilisateur, la mini-courbe doit représenter
     la séance du JOUR, jamais une tendance longue qui pourrait aller à
     l'encontre de sa propre couleur (verte/rouge selon varPct du jour).
     chargerGraphiquePeriode() dédoublonne déjà lui-même (HISTP_ENCOURS/
     HISTP) — un ré-appel sur un instrument déjà chargé ou en cours ne
     redéclenche aucune requête réseau.
     CORRECTIF (fluidité, bug réel trouvé en test) : marketsListeVisible()
     n'est PAS plafonnée à 20 — "Voir plus" fait grimper marketsVisibles
     sans limite (confirmé en test : 140 après quelques clics), et
     contrairement à assurerCotations() juste au-dessus (lots de 8, par
     vagues plafonnées), cette boucle partait sans AUCUN plafond : 140
     lignes visibles -> 140 requêtes /api/market/history simultanées.
     Plafonné à CHARGEMENT_MASSE_MAX_SYMBOLES (même constante que le
     chargement de masse ci-dessous) : au-delà, les lignes les plus bas
     dans la page restent simplement sans sparkline plutôt que de
     surcharger le réseau pour des cartes hors ou presque hors écran. */
  if (route.page === 'markets') marketsListeVisible().slice(0, CHARGEMENT_MASSE_MAX_SYMBOLES)
    .forEach(s => { if (s) chargerGraphiquePeriode(s, '1j'); });

  /* Chargement du catalogue mondial (audit performance, 2026-09-29) :
     plus jamais chargé au démarrage (voir boot()) — seules les routes
     qui en ont réellement besoin le déclenchent ici, à la demande. */
  if (route.page === 'markets' || route.page === 'radar') assurerCatalogueGlobal();
  if (route.page === 'home') assurerApercuAccueil();

  /* view.innerHTML vient de remplacer tout le DOM : #chart-pro (s'il existe
     dans la page courante) est un nouveau noeud, l'éventuelle instance
     Lightweight Charts précédente est donc déjà orpheline. requestAnimationFrame
     laisse le navigateur terminer la mise en page avant de mesurer le
     conteneur (nécessaire à `autoSize`). mountChartPro() se charge elle-même
     de détruire proprement toute instance ancienne. */
  requestAnimationFrame(() => mountChartPro());

  animate();
}
function animate(){
  const view = document.getElementById('view');
  requestAnimationFrame(() => {
    view.querySelectorAll('.bar-fill[data-w]').forEach(b => b.style.width = b.dataset.w + '%');
    view.querySelectorAll('.ring .fg[data-ring]').forEach(c => c.style.strokeDashoffset = c.dataset.ring);
  });
  if (!('IntersectionObserver' in window)){
    view.querySelectorAll('.rise').forEach(e => e.classList.add('seen')); return;
  }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('seen'); io.unobserve(e.target); }
  }), { rootMargin:'0px 0px -8% 0px' });
  view.querySelectorAll('.rise').forEach(e => io.observe(e));
}
function go(page, arg){
  if (route.page !== page || route.arg !== arg) history_.push({ ...route });
  route = { page, arg: arg ?? null };
  state.page = page; state.stockId = arg ?? null; saveState();
  /* CORRECTIF (2026-09-25, retour utilisateur : "rien n'est affiché" sur
     Nova News) : chargerNovaNewsMonde() lui-même reste "chargé à la
     demande" (jamais appelé DEPUIS PAGES.novanews(), qui provoquerait un
     render() imbriqué — voir le commentaire à sa définition), mais un
     visiteur qui arrive sur la page voit sinon UNIQUEMENT un bouton
     "Voir les actualités", jamais un article, ce qui ressemble à une
     page vide/cassée pour une fonctionnalité demandée "en temps réel".
     Déclenché ICI, depuis la navigation elle-même (jamais depuis le
     rendu), donc sans risque de render() imbriqué : chargerNovaNewsMonde()
     gère déjà son propre idle/loading/loaded, un appel répété (ex.
     revenir sur la page) ne redéclenche rien tant que déjà chargé. */
  if (page === 'novanews'){ chargerNovaNewsMonde(); demarrerRafraichissementNovaNews(); }
  else arreterRafraichissementNovaNews();
  render(true);
}
function back(){
  const prev = history_.pop();
  route = prev || { page:'home', arg:null };
  if (route.page !== 'novanews') arreterRafraichissementNovaNews();
  render(true);
}

function applySettings(){
  applyTheme();
  const r = document.documentElement;
  r.style.fontSize = state.settings.fontSize === 'large' ? '17.5px' : '';
  r.classList.toggle('no-anim', state.settings.animations === false);
  document.body.classList.toggle('no-spark', state.settings.sparklines === false);
}
function applyTheme(){
  const wanted = state.settings.theme === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : (state.settings.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', wanted);
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content', wanted === 'dark' ? '#0d0b14' : '#ffffff');
}

/* ---------- recherche ----------
   searchToken protège contre les réponses obsolètes : si l'utilisateur tape
   vite, seule la dernière requête a le droit de peindre le résultat. */
let searchTimer = null, hits = [], hi = 0, searchToken = 0;
/* Morph de la recherche (motion system, 2026-09-21) : la capsule d'où
   vient le clic (icône loupe de l'en-tête, bouton "Rechercher…" d'un
   état vide, etc.) sert de point de départ visuel — même technique FLIP
   que les .seg (voir plus haut) et le même constat que pour eux :
   .sheet est recréé à chaque ouverture, donc on écrit la position/échelle
   de départ en variable CSS, on force un reflow, puis on laisse
   l'animation "searchMorph" jouer vers la position naturelle. Sans clic
   d'origine (raccourci clavier "/"), repli sur l'icône de l'en-tête —
   si elle non plus n'existe pas (page gate), pas de morph, juste
   l'entrée standard des feuilles. */
function openSearch(origin){
  const originEl = origin || document.querySelector('[data-search]');
  const originRect = originEl ? originEl.getBoundingClientRect() : null;
  openSheet(`<h3 id="sheetTitle">Rechercher</h3>
    <input class="field" id="sq" type="search" placeholder="Entreprise, symbole, secteur…"
      autocomplete="off" aria-label="Rechercher" style="margin-top:16px">
    <div id="sqOut"></div>`);
  const sheetEl = document.getElementById('sheet');
  /* Le morph (mise à l'échelle depuis une icône) n'a de sens que pour la
     boîte de dialogue centrée du desktop — sous 641px, .sheet devient une
     feuille pleine largeur ancrée en bas (voir @media max-width:640px) :
     partir d'une icône de 38px en haut d'écran donnerait un étirement
     brutal plutôt qu'un morph. Le slide-up standard (sheetUp), déjà
     adapté au mobile, reste inchangé sous ce seuil. */
  if (originRect && sheetEl && window.innerWidth > 640){
    const sr = sheetEl.getBoundingClientRect();
    if (sr.width && sr.height){
      const dx = (originRect.left + originRect.width/2) - (sr.left + sr.width/2);
      const dy = (originRect.top + originRect.height/2) - (sr.top + sr.height/2);
      const sx = Math.max(.1, Math.min(1, originRect.width / sr.width));
      const sy = Math.max(.1, Math.min(1, originRect.height / sr.height));
      sheetEl.style.setProperty('--morph-from',
        `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`);
      sheetEl.style.animation = 'none';
      sheetEl.offsetHeight; // force le reflow avant d'activer l'animation
      sheetEl.style.animation = '';
      sheetEl.classList.add('sheet-morph');
    }
  }
  const i = document.getElementById('sq');
  i.focus(); paintSearch('');
  i.addEventListener('input', () => {
    clearTimeout(searchTimer);
    const out = document.getElementById('sqOut');
    if (out) out.innerHTML = `<div style="margin-top:16px">${'<div class="sk" style="height:56px;margin-top:8px"></div>'.repeat(3)}</div>`;
    searchTimer = setTimeout(() => paintSearch(i.value), 170);
  });
  i.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); hi = Math.max(0, Math.min(hits.length-1, hi + (e.key==='ArrowDown'?1:-1)));
      document.querySelectorAll('#sqOut .row').forEach((el,n)=>el.style.background = n===hi?'var(--bg-2)':'');
    } else if (e.key === 'Enter' && hits[hi]) pick(hits[hi]);
  });
}
function renderHits(q, remoteSettled){
  const out = document.getElementById('sqOut'); if (!out) return;
  if (!hits.length){
    out.innerHTML = remoteSettled
      ? `<p class="small" style="margin-top:18px">Aucun résultat pour « ${esc(q)} ».</p>`
      : `<p class="small" style="margin-top:18px">Aucun résultat local. Recherche en ligne…</p>`;
    return;
  }
  out.innerHTML = `<div class="rows" style="margin-top:12px">${hits.map((h,i)=>{
    const st = h.type === 'action' ? byId[h.id] : null;
    return `<button class="row" data-hit="${i}" style="${i===0?'background:var(--bg-2)':''}">
      ${st ? avatar(st) : `<span class="av" style="background:var(--ink-4)">${esc((h.title||'??').slice(0,2).toUpperCase())}</span>`}
      <span class="row-main"><span class="row-t">${esc(h.title)}</span>
        <span class="row-s">${esc(h.sub)}${h.remote && !st ? ' · en ligne' : ''}</span></span>
    </button>`; }).join('')}</div>`;
}

/* Peint d'abord les résultats du catalogue local (instantané, hors-ligne),
   puis complète avec /api/market/search si disponible : le catalogue local
   est un accélérateur, pas une limite. searchToken protège contre une
   réponse distante obsolète si l'utilisateur a retapé entre-temps. */
function paintSearch(q){
  const myToken = ++searchToken;
  const out = document.getElementById('sqOut'); if (!out) return;
  const localHits = searchAll(q);
  if (myToken !== searchToken) return;   // une frappe plus récente a pris le relais
  hits = localHits; hi = 0;

  if (!q.trim()){
    out.innerHTML = state.recent.length
      ? `<p class="tiny" style="margin:18px 0 6px;display:flex;justify-content:space-between">
          <span>Recherches récentes</span>
          <button class="tiny" data-clear-recent style="color:var(--accent);font-weight:600">Effacer</button></p>
         ${state.recent.map(r=>`<button class="row" data-recent="${esc(r)}">
           <span style="color:var(--ink-4)">${svg(ICON.search)}</span>
           <span class="row-main"><span class="row-t">${esc(r)}</span></span></button>`).join('')}`
      : `<p class="small" style="margin-top:16px">Essayez « Apple », « AAPL », « Luxe » ou « CAC 40 ».</p>`;
    return;
  }

  renderHits(q, false);

  searchRemote(q).then(remoteHits => {
    if (myToken !== searchToken) return;   // une frappe plus récente a pris le relais
    const localIds = new Set(hits.filter(h => h.type === 'action').map(h => h.id));
    const additions = remoteHits.filter(h => !localIds.has(h.id));
    if (additions.length) hits = [...hits, ...additions].slice(0, 12);
    renderHits(q, true);   // recherche distante terminée : le message "aucun résultat" est définitif
  });
}
/* Intention portée par les 4 raccourcis de l'accueil (2026-09-23) — voir
   NB_QUICK/PAGES.home. Consommée UNE SEULE FOIS ici : posée juste avant
   openSearch() (voir le handler [data-search]), remise à null dès que
   pick() ou l'abandon de la recherche (fermeture sans choix) l'a lue,
   pour qu'un search "normal" ultérieur ne réutilise jamais par erreur
   l'intention d'un raccourci précédent. */
let searchIntent = null;
function pick(h){
  pushRecent(h.title); closeSheet();
  const intent = searchIntent; searchIntent = null;
  if (h.type === 'action'){
    console.debug('[NovaTitre][pick] résultat cliqué', h);
    /* Une société venue de /api/market/search n'existe pas encore dans
       byId : on la matérialise (métadonnées seulement) avant d'ouvrir sa
       fiche, qui se comporte alors exactement comme pour le catalogue
       local — cours/historique/score restent à charger depuis le serveur. */
    const id = (h.remote && !byId[h.id] && h.meta) ? (ensureRuntimeStock(h.meta)?.id || h.id) : h.id;
    if (intent === 'analyze'){ runAnalysis(id); return; }
    if (intent === 'buy'){ const st = byId[id]; if (st) openBuyAmount(st); return; }
    if (intent === 'alert'){ const st = byId[id]; if (st) openCreateAlerte(st); return; }
    go('stock', id);
  } else toast(`${h.title} : page indice bientôt disponible.`);
}

/* Alerte de prix — voir DEFAULT_STATE.alerts pour le format retenu et
