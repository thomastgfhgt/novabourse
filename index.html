<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaBourse — Trois IA analysent les marchés. Vous décidez.</title>
<meta name="description" content="NovaBourse analyse les entreprises cotées avec trois intelligences artificielles et un score de qualité et de risque expliqué en clair.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
  <script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"></script><style>
:root{
  color-scheme:light;
  /* Palette officielle NovaBourse v2 (2026-09-23, retour utilisateur :
     "remplace le orange et le bleu par rose noir blanc gris et violet
     pour l'intégralité du site, vraiment tout") — remplace la précédente
     identité orange/bleu/vert (2026-09-21/22). Rose devient l'accent
     PRIMAIRE (rôle exact de l'ancien orange : --accent), violet l'accent
     SECONDAIRE (rôle exact de l'ancien bleu électrique : --blue-accent,
     nom de variable et des classes .btn-blue/.btn-blue-outline conservés
     tels quels — seul renommer risquait de casser des usages dispersés
     dans tout le fichier pour un gain cosmétique seul ; c'est la VALEUR
     qui compte ici, plus la couleur "bleu" du nom). Vert/rouge (hausse/
     baisse) et l'ambre d'avertissement ne sont PAS concernés : ce sont
     des couleurs sémantiques universelles en finance (gain/perte/alerte),
     jamais une couleur de marque décorative — les changer n'a pas été
     demandé et casserait une convention que l'utilisateur attend
     probablement ailleurs dans l'app. Échelles à 6 crans (50/100/300/
     500/700/900) conservées telles quelles, seules les valeurs changent. */
  --pink-50:#fdf2f8;  --pink-100:#fce7f3; --pink-300:#f9a8d4;
  --pink-500:#ec4899; --pink-700:#be185d; --pink-900:#831843;
  --pink-light:#f472b6;
  --violet-50:#f5f3ff;  --violet-100:#ede9fe; --violet-300:#c4b5fd;
  --violet-500:#8b5cf6; --violet-700:#6d28d9; --violet-900:#4c1d95;
  --green-50:#e7fbf4;  --green-100:#c3f5e3; --green-300:#6ee7b7;
  --green-500:#10b981; --green-700:#0d9268; --green-900:#065f46;
  --bg:#ffffff;
  --bg-2:#faf9f8;
  --bg-3:#f5f4f0;
  --bg-4:#ecece8;
  --ink:#0d1117;
  --ink-2:#3d4453;
  --ink-3:#6b7385;
  --ink-4:#9aa1b1;
  --accent:var(--pink-500);
  --accent-hover:var(--pink-700);
  --accent-press:#a3175f;
  --accent-soft:var(--pink-50);
  --accent-ink:#ffffff;
  /* Violet réservé aux boutons SECONDAIRES uniquement (jamais un accent
     général concurrent du rose) — voir .btn-blue plus bas (nom conservé,
     couleur désormais violette — voir note de palette ci-dessus). */
  --blue-accent:var(--violet-500); --blue-accent-soft:var(--violet-50);
  --up:var(--green-500);   --up-soft:var(--green-50);
  --down:#ef4444; --down-soft:#fef0ef;
  --warn:#b45309; --warn-soft:#fdf4e7;
  --line:#e6e9f0;
  --line-2:#eef0f5;
  --r-xs:8px; --r-s:12px; --r-m:18px; --r-l:24px; --r-xl:32px; --r-pill:999px;
  --shadow-1:none;
  --shadow-2:0 1px 2px rgba(13,17,23,.04), 0 8px 24px rgba(13,17,23,.05);
  --shadow-3:0 2px 6px rgba(13,17,23,.06), 0 24px 48px rgba(13,17,23,.08);
  --shadow-accent:0 8px 24px rgba(236,72,153,.24);
  --space-2:8px;  --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px; --sp-6:80px;
  /* CORRECTIF dock mobile (confirmé sur Safari iPhone réel, pas seulement en
     test automatisé) : --dock-h = hauteur réelle du dock flottant (padding
     7px haut+bas + bouton 8px/22px icône/3px gap/~13px texte/7px ≈ 67px,
     arrondi par prudence) ; --dock-gap = son décalage du bas de l'écran
     (bottom:14px dans .dock, hors safe-area). Utilisées ensemble avec
     env(safe-area-inset-bottom) — jamais une valeur fixe devinée — pour que
     le padding-bottom du contenu s'adapte à la VRAIE zone sûre de l'appareil
     (elle varie selon le modèle d'iPhone/Android et l'orientation). */
  /* Recalculé une 4e fois le 2026-09-23 (passe 2, finition visuelle
     après comparaison directe avec la capture Revolut de référence) :
     la passe précédente visait délibérément "90 à 110px" (cible initiale
     du tout premier brief) et le résultat était trop haut/compact —
     Revolut est une capsule bien plus HORIZONTALE. Nouvelle cible
     "70-82px", et le padding vertical du dock réduit en conséquence
     (18px → 10px). Mesuré en direct sur le palier par défaut (≥390px,
     écran 414/430px) à 79.6px ; 82px retenu ici avec une petite marge de
     sécurité plutôt que la valeur pile mesurée. Les 2 paliers responsive
     plus étroits (≤390px, ≤360px) donnent un dock encore moins haut
     (mesuré 76.1px et 70.6px) ; --dock-h garde la valeur du palier le
     PLUS haut par sécurité (mieux vaut un peu de padding-bottom en trop
     sur petit écran qu'un pixel de contenu caché derrière le dock).
     Toujours couplé à env(safe-area-inset-bottom) dans .wrap ci-dessous
     — ne JAMAIS ajuster l'un sans l'autre, c'est ce qui a évité que ce
     changement (comme les 3 précédents) ne fasse recouvrir du contenu
     par le dock. */
  --dock-h:82px; --dock-gap:12px;
  --space-xs:8px; --space-sm:16px; --space-md:24px; --space-lg:32px;
  --t-display:clamp(38px,7vw,60px);
  --t-title:clamp(26px,4vw,36px);
  --t-h2:21px;
  --t-h3:17px;
  --t-body:15.5px;
  --t-small:13.5px;
  --t-label:12.5px;
  --t-micro:11.5px;
  --lh-tight:1.06; --lh-title:1.15; --lh-body:1.6;
  --icon-box:44px; --icon-gap:16px; --card-pad:24px;
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.32,.72,0,1);
  --fast:.14s; --slow:.28s;
  --tap:44px;
}
[data-theme="dark"]{
  color-scheme:dark;
  /* Échelle noire v2 (2026-09-23, même passe "rose/noir/blanc/gris/
     violet partout" que la palette claire ci-dessus) : les crans
     #0A0E27 -> #1A3050 précédents avaient une dominante BLEU nuit
     (justement ce qui devait disparaître) — remplacés par un noir
     légèrement teinté violet plutôt qu'un gris neutre plat, pour garder
     une vraie personnalité de marque en sombre (même logique que la
     dominante bleue qu'ils remplacent, simplement reteintée). --line/
     --line-2 (bordures) alignées pour la même raison, elles avaient la
     même dominante bleu nuit. */
  --bg:#0d0b14; --bg-2:#141119; --bg-3:#1c1824; --bg-4:#26202f;
  --ink:#f3f4f6; --ink-2:#d1d5db; --ink-3:#9ca3af; --ink-4:#6b7280;
  /* Rose — MÊME teinte que le thème clair ("Primary = Rose toujours",
     palette imposée) : #EC4899 reste assez saturé pour rester lisible
     sur #0D0B14 sans le diluer (même raisonnement que l'orange qu'il
     remplace). */
  --accent:var(--pink-500); --accent-hover:var(--pink-light); --accent-press:#c9186d;
  --accent-soft:#2a1420; --accent-ink:#ffffff;
  /* Violet réservé aux boutons secondaires (même règle qu'en thème
     clair) — jamais un accent général. */
  --blue-accent:var(--violet-500); --blue-accent-soft:#1c1530;
  --up:#34d399; --up-soft:#0c2419; --down:#f87171; --down-soft:#2a1416;
  --warn:#e0a63a; --warn-soft:#2a2110;
  --line:#2a2433; --line-2:#1e1a26;
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-3:0 2px 6px rgba(0,0,0,.45), 0 24px 48px rgba(0,0,0,.45);
  --shadow-accent:0 8px 24px rgba(236,72,153,.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* overflow-x:hidden ajouté ici le 2026-09-23 (bug réel trouvé en testant
   le temple sur une vraie largeur étroite, pas simulée) : body a déjà
   cette règle, mais le débordement symétrique de quelques px du temple
   (width:min(98vw,...) — vw inclut parfois la largeur de la scrollbar
   verticale selon le navigateur, un écart de quelques px avec
   document.documentElement.clientWidth est un artefact CSS connu, pas
   un vrai bug de layout) restait scrollable horizontalement au niveau
   du document malgré body{overflow-x:hidden}. */
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
html{background:var(--bg)}
[data-theme="xxx"] body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 50% -8%, rgba(120,140,255,.07), transparent 70%),
    radial-gradient(50% 35% at 90% 12%, rgba(0,200,140,.05), transparent 70%),
    radial-gradient(70% 50% at 8% 60%, rgba(140,120,255,.035), transparent 70%);
}
body{
  /* CORRECTIF DESIGN (2026-09-17) : transparent plutôt que var(--bg) — le
     fond réel de la page est désormais .aurora-bg (voir plus bas), un
     calque fixe positionné SOUS le contenu. Chaque surface qui doit
     rester pleinement opaque (cartes, feuilles, nav) porte déjà sa propre
     couleur explicite (--bg/--bg-2/--bg-3) : rien ne dépendait du fond
     uni de body pour son opacité, vérifié avant ce changement. */
  background:transparent;color:var(--ink);max-width:100vw;
  forced-color-adjust:none;font-family:var(--font);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em;
  transition:background .3s var(--spring),color .3s var(--spring);
}
/* Fond animé (§2 du PRD : "un fond qui change de couleur, de belles
   transitions") — vérifié en direct sur www.novabourse.site, en clair ET
   en sombre, avant d'être intégré ici : les mêmes teintes fonctionnent
   dans les deux thèmes sans variante séparée. Fixe (jamais affecté par le
   scroll), z-index:0 : tout le contenu réel (nav, cartes, feuilles) reste
   au-dessus car aucun n'a de z-index négatif. Flou et opacité volontai-
   rement faibles : visible dans les espaces vides entre les éléments,
   jamais au point de nuire à la lisibilité d'une donnée financière —
   c'est un fond d'ambiance, pas un habillage qui prend le pas sur le
   contenu. prefers-reduced-motion coupe l'animation, jamais l'effet
   entier (le dégradé reste visible, simplement figé). */
.aurora-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
/* CORRECTIF (bug visuel réel et grave, signalé par l'utilisateur — la
   barre de navigation du bas "décrochait" de sa position fixe pendant
   le défilement) : la rotation de teinte était animée sur .aurora-bg
   lui-même, un calque position:fixed;inset:0 couvrant TOUT le viewport
   — animer `filter` sur un calque fixe aussi grand crée une charge de
   composition énorme, connue pour perturber le rendu d'AUTRES éléments
   position:fixed sur la même page (notamment combinés à backdrop-filter,
   comme le dock). Déplacée sur chaque tache (déjà floutée, bien plus
   petite) : même effet visuel de "fond qui change de couleur", sans
   jamais animer `filter` sur l'intégralité du viewport. */
/* Flou réduit 110px -> 65px (2026-09-24, retour utilisateur : "le site
   est super lent et manque énormément de fluidité") : ces 3 taches
   sont PRÉSENTES SUR TOUTE PAGE (le fond de l'app entière) et animent
   déjà transform en continu — un blur() aussi large, recalculé à
   chaque déplacement de la tache (translate/scale, pas juste posé une
   fois), est probablement le plus gros poste de coût GPU permanent de
   tout le site. Les taches elles-mêmes restent énormes (55/50/38vw,
   inchangé) : à cette échelle, 65px de flou garde le même effet "fond
   d'ambiance diffus", vérifié en direct clair et sombre — jamais des
   bords nets visibles. */
.aurora-bg::before,.aurora-bg::after,.aurora-bg .aurora-3{content:"";position:absolute;border-radius:50%;
  filter:blur(65px);opacity:.32;
  animation:auroraDrift 26s ease-in-out infinite, auroraHue 60s linear infinite;
  will-change:transform}
/* Couleurs en variables (mise à jour 2026-09-23 : "Primary = Rose
   toujours", violet réservé aux boutons secondaires — plus un accent
   général comme avant ; recoloré depuis orange/bleu, voir note de
   palette tout en haut du fichier). Le vert (déjà une couleur
   fonctionnelle "hausse" ailleurs) avait été gardé ici comme touche
   discrète lors de la première passe de recoloration — retiré à son
   tour (retour utilisateur : "retire le vert du fond") : rose (2 tons)
   domine, violet en 3e touche plutôt que vert, cohérent avec le reste
   de la nouvelle identité (boutons, temple...). Toujours personnalisable
   par section via body[data-bg=...] (paintNav()/render()). */
.aurora-bg::before{width:55vw;height:55vw;top:-18vw;left:-12vw;
  background:radial-gradient(circle,var(--aurora-1,#ec4899) 0%,var(--aurora-1b,#f472b6) 45%,transparent 72%)}
.aurora-bg::after{width:50vw;height:50vw;bottom:-22vw;right:-14vw;animation-delay:-13s;
  background:radial-gradient(circle,var(--aurora-2,#be185d) 0%,var(--aurora-2b,#ec4899) 40%,transparent 72%)}
.aurora-bg .aurora-3{width:38vw;height:38vw;top:38vh;left:32vw;animation-delay:-8s;
  animation-duration:32s;opacity:.24;
  background:radial-gradient(circle,var(--aurora-3,#6d28d9) 0%,var(--aurora-3b,#8b5cf6) 45%,transparent 72%)}
body[data-bg="portfolio"]{--aurora-1:#6d28d9;--aurora-1b:#8b5cf6;--aurora-2:#ec4899;--aurora-2b:#f472b6;
  --aurora-3:#be185d;--aurora-3b:#ec4899}
body[data-bg="account"]{--aurora-1:#8d95a4;--aurora-1b:#aeb4c0;--aurora-2:#646c7c;--aurora-2b:#9aa1b1;
  --aurora-3:#8d95a4;--aurora-3b:#aeb4c0}
@keyframes auroraDrift{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(5vw,3vw) scale(1.06)}
  66%{transform:translate(-3vw,5vw) scale(.97)}
}
/* CORRECTIF (2026-09-21, palette officielle) : une rotation complète sur
   360° promenait chaque tache à travers TOUTES les teintes (le bleu
   devenait vert, puis jaune, puis rouge...) — "un fond qui change de
   couleur" au sens du PRD, mais qui abandonnait l'identité orange/bleu/
   vert au fil du cycle. Oscillation resserrée (±18°) : le fond continue
   de "vivre" sans jamais quitter la famille de teinte de sa tache. */
@keyframes auroraHue{
  0%,100%{filter:blur(65px) hue-rotate(-18deg)}
  50%{filter:blur(65px) hue-rotate(18deg)}
}
@media (prefers-reduced-motion:reduce){
  .aurora-bg::before,.aurora-bg::after,.aurora-bg .aurora-3{animation:none}
}
button,input,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;transition:all .2s var(--spring)}
button:active{transform:scale(.97)}
.mono,.tabular-nums{font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  font-feature-settings:'tnum' 1,'cv01' 1}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
.cap-i,.trio-i,.onb-i,.gate-i,.quick-ic,.empty-i,.ai-d,.flow-n,.onb-n,
.logo-m,.icon-btn,.star,.info,.x,.av,.sq-ic{
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:0;
  flex-shrink:0;
  overflow:hidden;
  padding:0;
  text-align:center
}
.cap-i>svg,.trio-i>svg,.onb-i>svg,.gate-i>svg,.quick-ic>svg,.empty-i>svg,
.logo-m>svg,.icon-btn>svg,.star>svg,.x>svg,.sq-ic>svg,.ai-d>svg{
  display:block;
  margin:auto;
  flex:0 0 auto
}
.flow-n,.onb-n,.av,.ai-d,.info{line-height:1}
/* --top-fade (2026-09-23, "que le dessus s'efface progressivement en
   descendant dans la page") : custom property globale (posée sur
   documentElement par un seul écouteur de scroll, voir wireHeaderFade()
   en JS — pas par page, une fois pour toute l'app) qui va de 1 (haut de
   page) à ~.15 après ~160px de défilement. Seul le FOND du bandeau
   s'estompe — jamais le logo/la nav/les boutons, qui restent à opacité
   pleine : un header devenu illisible en scrollant serait un vrai
   défaut d'accessibilité, pas juste un détail esthétique. Le flou
   (backdrop-filter) reste constant pour garder le texte lisible même
   quand le fond est presque transparent. */
.top{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,calc(.72 * var(--top-fade,1)));
  /* Flou réduit 20px -> 14px (2026-09-24, retour utilisateur : "le site
     est super lent et manque énormément de fluidité") : le coût GPU
     d'un backdrop-filter croît avec le rayon de flou, et ce header
     sticky est présent sur TOUTE page — il recalcule ce flou à chaque
     frame de défilement, sur tout le contenu qui passe dessous.
     14px garde un effet "verre dépoli" net à l'œil (vérifié en direct),
     pour une fraction du coût. */
  backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line-2);
  padding-top:env(safe-area-inset-top);
  transition:background-color .1s linear;
  animation:topSlideIn .6s cubic-bezier(.22,1,.36,1) both;
}
/* Entrée au chargement (2026-09-23, retour utilisateur : "de la
   modernité et de l'animation, vraiment beaucoup" sur la nav) — courte
   et discrète (14px, pas un grand slide) pour ne pas retarder la
   lecture du contenu ; sticky+transform sont compatibles (le sticky ne
   régit que la position de scroll, pas le rendu du transform). */
@keyframes topSlideIn{ from{transform:translateY(-14px);opacity:0} to{transform:translateY(0);opacity:1} }
[data-theme="dark"] .top{background:rgba(8,9,12,calc(.72 * var(--top-fade,1)));border-bottom-color:rgba(255,255,255,.06)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;
  gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;
  letter-spacing:-.03em;flex:0 0 auto;white-space:nowrap}
/* Retour utilisateur (2026-09-23) : "le logo sans la case blanche" —
   auparavant un badge plein (background:var(--ink), icône en
   color:var(--bg), donc une case CLAIRE en thème sombre) ; l'icône
   utilise déjà fill="currentColor" sur ses <path> (voir le HTML du
   header), donc color:var(--ink) directement sur ce conteneur suffit à
   la faire correspondre au texte "NovaBourse" juste à côté, sans fond
   ni coin arrondi. */
.logo-m{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--ink);
  transition:transform .35s cubic-bezier(.22,1,.36,1)}
.logo-m svg{width:40px;height:40px}
.logo:hover .logo-m{transform:rotate(-10deg) scale(1.1)}
.logo:active .logo-m{transform:rotate(-4deg) scale(.94)}
/* CORRECTIF PERFORMANCE (2026-09-24, retour utilisateur : "le site est
   super lent et manque énormément de fluidité") : cette respiration
   animait box-shadow directement sur .logo-m — une propriété qui force
   un repaint à CHAQUE frame (jamais composée par le GPU), en boucle
   infinie, dans le header STICKY présent sur TOUTE page de l'app.
   Remplacé par un ::after dont le box-shadow est fixe (calculé une
   seule fois) et dont seule l'opacity est animée : opacity est une des
   deux propriétés (avec transform) que le navigateur peut animer sur
   son propre calque GPU sans jamais repeindre — même rendu visuel,
   coût de rendu proche de zéro au lieu d'un repaint continu partout
   dans l'app. */
.logo-m::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  box-shadow:0 0 0 5px rgba(236,72,153,.16);opacity:0;pointer-events:none;
  animation:logoGlow 4.5s ease-in-out infinite}
@keyframes logoGlow{ 0%,100%{opacity:0} 50%{opacity:1} }
@media (prefers-reduced-motion:reduce){ .logo-m::after{animation:none} }
@media (prefers-reduced-motion:reduce){ .top{animation:none} }
/* Nav desktop — pilule glissante (2026-09-23, même technique FLIP que
   .dock-pill plus bas dans ce fichier, voir positionTopNavPill() en JS)
   : jusqu'ici les liens n'avaient qu'un hover/actif statique (couleur +
   fond instantanés, sans transition). position:relative sur .top-nav
   sert de repère pour la pilule absolue ; les liens passent en z-index:1
   pour rester lisibles AU-DESSUS d'elle. */
.top-nav{display:flex;gap:2px;margin-left:var(--sp-3);position:relative}
.top-nav-pill{position:absolute;top:0;bottom:0;left:0;width:0;border-radius:100px;
  background:var(--bg-2);z-index:0;pointer-events:none;
  transition:transform .45s var(--spring),width .45s var(--spring)}
.top-nav-pill.no-anim{transition:none}

/* CORRECTIF (bug visuel réel, signalé par l'utilisateur : "on ne voit
   plus rien" sur la page Offres) : .rise démarre invisible et ne le
   redevient qu'après qu'un IntersectionObserver ajoute .seen — un point
   de défaillance de plus (timing, appareil, cycle de rendu) qu'une
   page de tarification n'a pas à courir. Retiré des .plan (voir
   pricingBlock ci-dessous) : ces cartes sont maintenant toujours
   visibles immédiatement, jamais conditionnées à un déclenchement JS
   après coup. La classe reste disponible pour du contenu non critique. */
.rise{opacity:0;transform:translateY(16px)}

   NE TOUCHAIT PAS animation-delay ni le fill-mode "backwards" de cette
   règle — combinaison qui, vérifiée en direct (navigateur avec réduction
   de mouvement activée), laissait le contenu de CHAQUE page (tout enfant
   direct de .page-in, donc le titre et tout le corps) bloqué à
   opacity:0, page entière invisible bien après la fin théorique de
   l'animation. Désactivée franchement ici, comme .aurora-bg plus haut :
   jamais de durée quasi nulle sur une animation "backwards", toujours
   animation:none. */

}

   Supprimé : la vraie définition est celle plus haut, ".logo-m{...

/* Rétréci (2026-09-24, "page beaucoup plus courte... le bouton de
   connexion doit apparaître rapidement sans devoir énormément
   descendre") : 140px/86px prenait à lui seul près d'un quart d'un

.brand-orbit{position:relative;display:flex;align-items:center;justify-content:center;

/* ============================================================
   ACCUEIL — refonte "temple" (2026-09-23)
   ============================================================
   Remplace l'ancien .nb-hero/.nb-top/.nb-split/.nb-pf (grille
   texte+cartes ajoutée le 2026-09-22 pour combler le vide desktop —
   devenue obsolète : la nouvelle hero a son propre fond et sa propre
   largeur bornée, plus besoin de ce mécanisme). Palette dédiée,
   indépendante du thème clair/sombre de l'app — même principe déjà
   établi pour .dock (bottom nav) : cette section garde son fond nuit
   même en thème clair, elle ne suit pas --bg/--accent (qui restent
   rose/clair-sombre partout ailleurs dans l'app, inchangés).
   RECOLORÉ (2026-09-23, retour utilisateur : "remets le fond original
   derrière le temple" + "remplace le orange et le bleu... vraiment
   tout") : les couleurs fournies à l'origine (#070B1D, #075BFF...)
   étaient un bleu nuit — exactement la teinte à faire disparaître.
   Plutôt que de rendre la section transparente (le texte blanc/les
   dégradés de cette hero ne fonctionnent qu'sur un fond sombre, quel
   que soit le thème de l'app — un fond clair casserait totalement la
   lisibilité), le principe "toujours sombre, one-off" d'origine est
   conservé tel quel — c'est ÇA le fond "original" à restaurer, pas une
   teinte bleue particulière — simplement reteint en noir/violet nuit
   pour rejoindre la nouvelle palette plutôt que de garder du bleu. */
/* CORRECTIF ordinateur (2026-09-23, retour utilisateur : "adapte ça
   aussi pour les ordinateurs") : les marges négatives fixes (-18px/
   -22px) n'annulaient QUE le padding propre de .wrap — suffisant tant
   que .wrap fait toute la largeur de l'écran (mobile/tablette), mais
   .wrap a aussi un max-width:1120px (voir sa règle plus haut) qui se
   centre avec des marges "auto" dès qu'un écran dépasse ~1160px : cette
   hero restait alors coincée à 1120px de large, comme un rectangle
   sombre flottant au milieu d'un océan de fond rose — jamais
   "adaptée" aux grands écrans, juste redimensionnée. width:100vw +
   margin left/right:calc(50% - 50vw) est la technique standard pour
   qu'un enfant d'un conteneur centré déborde jusqu'aux bords RÉELS du
   viewport quelle que soit la largeur de ce conteneur (ici 100% sur
   mobile, 1120px centré sur grand écran) — se réduit mathématiquement
   à l'ancienne valeur fixe sur mobile (vérifié : 50%-50vw avec le
   padding actuel de .wrap redonne bien -18px/-22px), donc rien ne
   change en dessous de ~1160px, seul le grand écran est corrigé. */
.nb-hero-v2{
  width:100vw;
  margin:calc(var(--sp-3) * -1) calc(50% - 50vw) 0;padding:14px 18px 28px;
  background:
    radial-gradient(circle at 50% 18%, rgba(139,92,246,.14), transparent 62%),
    linear-gradient(180deg,#14101f 0%,#0d0b14 55%,#120e1c 100%);
  position:relative
  /* PAS de overflow:hidden ici (bug réel trouvé le 2026-09-23, passe 2) :
     ça rognait silencieusement le temple, qui vise min(96vw,780px) —
     plus large que la boîte intérieure de .nb-hero-v2 (100% moins son
     propre padding). Le fond dégradé n'a pas besoin de cette découpe
     (un background n'a jamais débordé de sa propre boîte, overflow ne
     régit que les ENFANTS) ; measuré avant/après : le temple passait de
     ~88-90% de la largeur réellement disponible à ~96% une fois retiré. */
}
@media (min-width:900px){
  .nb-hero-v2{margin:calc(var(--sp-4) * -1) calc(50% - 50vw) 0;padding:20px 22px 36px}
}
/* Temple — PASSE 2 (2026-09-23, nouveau SVG fourni) : remplace le
   premier jet par la structure/coordonnées exactes données cette fois
   (fronton/entablement recalculés, colonnes déplacées, classes
   renommées temple-main/temple-secondary/temple-flute) et insère le
   VRAI logo NovaBourse (ICON.brand, déjà utilisé dans le header — voir
   .nova-temple-brand plus bas) au centre du fronton, à la place du
   triangle simplifié de la passe précédente. Dessin non modifié,
   classes/CSS repris tels quels. */
.nova-temple-section{width:100%;display:flex;justify-content:center;align-items:center;
  box-sizing:border-box;padding:0 4px;margin:0;overflow:visible;position:relative;z-index:1;
  /* CORRECTIF (2026-09-25, retour utilisateur : "parfait mais plus fluide") :
     updateScrollFades() (JS) recalcule translateY/scale à chaque frame de
     scroll rAF-throttled, mais SANS transition CSS le navigateur appliquait
     la nouvelle valeur instantanément à chaque appel — visible comme de
     petits à-coups sur un scroll saccadé (molette par crans, trackpad),
     plutôt qu'un mouvement continu. Cette transition fait "glisser" la
     valeur affichée vers la valeur cible entre deux frames au lieu d'un
     saut instantané. Durée courte (140ms) : assez pour lisser, assez
     court pour ne pas sembler "traîner" derrière un scroll rapide continu. */
  transition:transform .14s ease-out;will-change:transform}
@media (prefers-reduced-motion:reduce){
  .nova-temple-section{transition:none}
}
/* flex-shrink:0 (bug réel trouvé le 2026-09-23, passe 2) : .nova-temple-
   section est display:flex — sans ça, flexbox réduisait silencieusement
   la largeur du temple sous sa valeur voulue (min(96vw,780px)) pour le
   faire tenir dans son conteneur flex, exactement le comportement par
   défaut de flex-shrink:1 qu'aucune propriété ne neutralisait ici. */
/* opacity (2026-09-23, ajustée trois fois le même jour) : .82 → .55
   (retour "transparent comme les 4 boutons") → maintenant multipliée
   par --temple-fade (voir updateScrollFades() en JS, même mécanisme que
   --top-fade du header) : la base .55 reste la transparence "au repos"
   en haut de page, --temple-fade la réduit encore progressivement
   quand le temple défile hors champ ("qu'il s'efface progressivement
   quand on le dépasse en descendant"). */
.nova-temple{display:block;width:min(96vw,780px);height:auto;overflow:visible;flex-shrink:0;
  opacity:calc(.55 * var(--temple-fade,1));

     l'opacity cette fois (--temple-fade change à chaque frame de scroll) —
     transitionne UNIQUEMENT opacity : jamais transform/filter, déjà
     couverts par les animations templeScaleIn/templeGlowPulse plus bas,
     qu'une transition sur ces mêmes propriétés perturberait. */
  transition:opacity .14s ease-out;
  filter:drop-shadow(0 0 3px rgba(255,255,255,.20)) drop-shadow(0 0 11px rgba(139,92,246,.08))}

}
/* Trait légèrement violeté (2026-09-23, retour utilisateur initial : "un
   peu bleuté" — reteint la même passe en violet le même jour, retour
   utilisateur suivant : "remplace le bleu par... du violet... vraiment
   tout") — #e4d9ff plutôt que #ffffff blanc pur, un violet très clair
   qui reste lisible comme "blanc" à distance mais prend clairement une
   teinte violette de près, cohérent avec le glow violet désormais
   présent dans le filter ci-dessus (auparavant bleu). */
.temple-line{fill:none;stroke:#e4d9ff;stroke-linecap:round;stroke-linejoin:round;
  vector-effect:non-scaling-stroke}
.temple-main{stroke-width:7}
.temple-secondary{stroke-width:4.5}
.temple-flute{stroke-width:2.5;opacity:.90}
.nova-temple-brand{fill:#e4d9ff}
@media (max-width:600px){
  .nova-temple{width:98vw;max-width:none}
  /* Retour utilisateur (2026-09-23) : "le temple est un peu trop épais"
     sur téléphone. vector-effect:non-scaling-stroke (ci-dessus) garde
     l'épaisseur du trait CONSTANTE en pixels écran quelle que soit la
     taille d'affichage du temple — sur un petit écran, le temple
     lui-même rétrécit mais le trait garde EXACTEMENT la même épaisseur
     qu'en desktop, donc parait proportionnellement plus épais. D'où un
     correctif spécifique mobile plutôt qu'un changement global (qui
     aurait aussi amincin le temple sur ordinateur, non demandé) —
     réduction légère (~20%, "un tout petit peu"), mêmes proportions
     entre les 3 épaisseurs conservées. */
  .temple-main{stroke-width:5.5}
  .temple-secondary{stroke-width:3.5}
  .temple-flute{stroke-width:2}

/* Animations (2026-09-23, "un maximum d'animation autour de cette
   architecture romaine") — quatre effets combinés, chacun sur une
   propriété/un élément différent pour ne jamais se marcher dessus :
   1) .nova-temple : léger scale-in une fois au montage (transform),
      jamais l'opacity (déjà pilotée par --temple-fade au scroll — un
      keyframe qui toucherait aussi opacity écraserait cette valeur
      dynamique tant qu'il "tient" sa position finale via fill-mode).
   2) .temple-part (fronton/logo/4 colonnes/marches) : apparition en
      cascade au montage, delay posé en inline juste au-dessus dans le
      HTML — "le temple se construit" plutôt qu'un bloc unique.
   3) .nova-temple lui-même, une 2e animation (filter cette fois, pas
      transform) : respiration lente et continue du halo.
   Le parallaxe au scroll (--temple-parallax) est appliqué en JS sur
   .nova-temple-section, un ÉLÉMENT PARENT différent de .nova-temple :
   même raison, éviter que deux sources (CSS animation + JS scroll)
   ne s'affrontent sur la propriété transform d'un seul et même nœud.
   BUG RÉEL trouvé et retiré en testant (2026-09-23) : une pulsation
   continue (transform:scale) avait été ajoutée sur .nova-temple-brand
   avec transform-box:fill-box pour la faire tourner autour de son
   propre centre plutôt que l'origine du SVG — combinée à l'attribut
   transform SVG déjà présent sur ce même <g> (translate/scale pour son
   positionnement), ça faisait littéralement bondir UN SEUL des 3
   <path> du logo à une position aberrante (loin à droite du temple,
   visible en direct). Un vrai bug d'interaction CSS/SVG, pas un simple
   choix esthétique à ajuster — retirée entièrement plutôt que
   rafistolée : le logo garde son apparition en fondu (#2 ci-dessus),
   sans pulsation continue. */
@keyframes templeScaleIn{ from{transform:scale(.96)} to{transform:scale(1)} }
@keyframes templePartIn{ from{opacity:0} to{opacity:1} }
@keyframes templeGlowPulse{
  0%,100%{ filter:drop-shadow(0 0 3px rgba(255,255,255,.20)) drop-shadow(0 0 11px rgba(139,92,246,.08)) }
  50%{ filter:drop-shadow(0 0 7px rgba(255,255,255,.32)) drop-shadow(0 0 20px rgba(139,92,246,.20)) }
}
.nova-temple{
  animation:templeScaleIn .9s cubic-bezier(.22,1,.36,1) both,
    templeGlowPulse 4.5s ease-in-out 1s infinite}
.temple-part{opacity:0;animation:templePartIn .6s cubic-bezier(.22,1,.36,1) both}
/* Survol desktop uniquement (§ voir .nova-action-circle:hover plus haut

   décoratif, jamais nécessaire pour comprendre/utiliser la page. */
@media (hover:hover){

@media (prefers-reduced-motion:reduce){

}

.nova-temple.no-intro{animation:templeGlowPulse 4.5s ease-in-out 1s infinite}

   point d'appel (PAGES.stock) pour le contexte de la refonte. */
.stk-qa{display:flex;gap:22px;margin-top:20px}
.qa{display:flex;flex-direction:column;align-items:center;gap:7px;
  background:none;color:var(--ink-2);font-size:12.5px;font-weight:600}
.qa i{display:flex;align-items:center;justify-content:center;position:relative;
  width:52px;height:52px;border-radius:50%;background:var(--bg-2);color:var(--ink);
  transition:background .2s ease-out,color .2s ease-out}
.qa:hover i{background:var(--bg-3)}
.qa[aria-pressed="true"] i{background:var(--accent);color:var(--accent-ink)}
.qa svg{width:20px;height:20px}
.qa-badge{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;background:var(--accent);color:var(--accent-ink);
  font-size:10.5px;font-weight:700;line-height:17px;text-align:center;
  box-shadow:0 0 0 2.5px var(--bg)}
.hero{position:relative;isolation:isolate}
.hero > *:not(.hero-chart){position:relative;z-index:1}
.hero-chart{
  position:absolute;top:-24px;bottom:-24px;
  left:50%;width:100vw;margin-left:-50vw;
  z-index:0;pointer-events:none;overflow:hidden;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent);
}
.hero-chart svg{width:100%;height:100%;display:block}
.hc-grid line{stroke:var(--line);stroke-width:1;opacity:.6}
[data-theme="dark"] .hc-grid line{opacity:.42}
.hc-line{stroke-dasharray:3200;stroke-dashoffset:3200;
  animation:hcDraw 14s linear infinite}
@keyframes hcDraw{
  0%  {stroke-dashoffset:3200}
  92% {stroke-dashoffset:0;opacity:1}
  97% {stroke-dashoffset:0;opacity:0}
  98% {stroke-dashoffset:3200;opacity:0}
  100%{stroke-dashoffset:3200;opacity:1}
}
.hc-area{opacity:0;animation:hcArea 14s linear infinite}
@keyframes hcArea{
  0%,6%   {opacity:0}
  55%,92% {opacity:1}
  97%,100%{opacity:0}
}
.hc-tip{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:hcTip 14s linear infinite}
@keyframes hcTip{
  0%,78% {opacity:0}
  88%    {opacity:1}
  94%    {opacity:1}
  97%,100%{opacity:0}
}
.hc-arrow{stroke-dasharray:100;stroke-dashoffset:100;
  animation:hcArrow 14s linear infinite}
@keyframes hcArrow{
  0%,80%  {stroke-dashoffset:100}
  90%,94% {stroke-dashoffset:0}
  97%,100%{stroke-dashoffset:100}
}
.hc-halo{animation:hcHalo 2.4s ease-in-out infinite}
@keyframes hcHalo{
  0%,100%{r:17;opacity:.16}
  50%    {r:27;opacity:.05}
}
@media (prefers-reduced-motion:reduce){
  .hc-line,.hc-area,.hc-tip,.hc-arrow,.hc-halo{animation:none;opacity:1;stroke-dashoffset:0}
}
.no-anim .hc-line,.no-anim .hc-area,.no-anim .hc-tip,.no-anim .hc-arrow,.no-anim .hc-halo{
  animation:none;opacity:1;stroke-dashoffset:0}

/* CORRECTIF (audit de cohérence visuelle, 2026-09-21) : les 3 couleurs
   étaient encore l'ancien vert/violet/bleu générique — jamais mises à
   jour vers l'identité officielle orange/bleu/vert lors du changement

}

.buy-card{background:linear-gradient(150deg,var(--bg-2),var(--bg))}

/* (ancienne règle .dock button{transition:color .3s var(--spring)} ici

   durée différente à cause de l'ordre des règles ; voir la refonte

.bias{padding:4px 9px;border-radius:7px;font-size:11.5px;font-weight:650;white-space:nowrap;
  border:1px solid transparent}
.bias-positif{background:var(--up-soft);color:var(--up);border-color:rgba(0,166,81,.22)}
.bias-neutre{background:var(--bg-3);color:var(--ink-2);border-color:var(--line)}
.bias-negatif{background:var(--down-soft);color:var(--down);border-color:rgba(224,39,59,.22)}
.bias-insuffisant{background:var(--warn-soft);color:var(--warn);border-color:rgba(184,119,10,.22)}
.radar-wrap{display:flex;gap:var(--space-md);align-items:center;flex-wrap:wrap}
.radar-box{flex:0 0 auto;width:100%;max-width:260px;margin:0 auto}
.radar-svg{width:100%;max-width:260px;height:auto;display:block;overflow:visible}
.radar-shape{opacity:0;transform-origin:130px 130px;transform:scale(.2);
  animation:radarIn .9s var(--spring) .15s forwards}
@keyframes radarIn{to{opacity:1;transform:scale(1)}}
.cmp{width:100%;border-collapse:collapse;min-width:420px}
.cmp th,.cmp td{padding:13px 12px;border-bottom:1px solid var(--line-2);text-align:center;
  font-size:14.5px;vertical-align:middle}
.cmp thead th{border-bottom:1px solid var(--line);font-size:13px;color:var(--ink);padding-bottom:14px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp-t{display:block;font-size:11.5px;color:var(--ink-4);margin-top:2px;font-weight:500}
.cmp-k b{font-size:14px;font-weight:600}
.cmp-n{display:block;font-size:11.5px;color:var(--ink-4);margin-top:3px;font-weight:400;max-width:22ch}
.cmp-best{background:var(--up-soft);color:var(--up);font-weight:700;border-radius:8px}
.cmp-worst{background:var(--down-soft);color:var(--down);font-weight:600;border-radius:8px}
.cmp-na{color:var(--ink-4);font-size:13px}
@media (max-width:430px){
  .cmp th,.cmp td{padding:11px 8px;font-size:13.5px}
  .cmp-n{display:none}
}
.price{font-size:clamp(38px,7.2vw,48px);font-weight:900;line-height:1;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums}
.price small{font-size:.58em;font-weight:600;opacity:.6;margin-left:2px}
/* AnimatedFinancialNumber (motion system, 2026-09-21) : une ANIMATION
   (pas une transition) joue correctement même sur un élément recréé à
   chaque render() — contrairement à une transition/position mesurée en
   JS (voir le correctif du dock plus haut, MOTION_SYSTEM.md), qui exige
   un nœud DOM persistant. Posée par liveTick() uniquement quand le prix
   AFFICHÉ change réellement (jamais à l'ouverture de page ni sur un
   cycle réseau sans changement réel). Micro-surlignage bref, retour
   immédiat à la couleur normale — jamais un flash global de l'écran. */
.price.flash-up{animation:priceFlashUp .9s ease-out}
.price.flash-down{animation:priceFlashDown .9s ease-out}
@keyframes priceFlashUp{0%{color:var(--up)}100%{color:inherit}}
@keyframes priceFlashDown{0%{color:var(--down)}100%{color:inherit}}
@media (prefers-reduced-motion:reduce){ .price.flash-up,.price.flash-down{animation:none} }
.price-chg{font-size:14px;font-weight:600;margin-top:var(--space-xs);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;display:inline-flex;align-items:center;gap:6px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);padding:13px 0;
  border-bottom:1px solid var(--line-2);min-width:0}
.kv:last-child{border-bottom:none}
.kv dt{font-size:14.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px;min-width:0}
.kv dd{font-family:var(--mono);font-size:15px;font-weight:600;flex:0 0 auto}
.info{width:19px;height:19px;border-radius:50%;background:var(--bg-3);color:var(--ink-4);
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex:0 0 auto}
.info:hover{background:var(--accent);color:#fff}
.star{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-4);flex:0 0 auto}
.star:hover{background:var(--bg-2)}
.star[aria-pressed="true"]{color:var(--warn)}
.star svg{width:20px;height:20px}
.stat{padding:var(--sp-2);border-radius:var(--r-m);background:var(--bg-2);min-width:0}
.stat-k{font-size:12.5px;color:var(--ink-3);letter-spacing:-.01em}
.stat-v{font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:5px;line-height:1.1}
.stat-n{font-size:12px;color:var(--ink-4);margin-top:4px}
.chart{width:100%;height:auto;display:block}
.divider{height:1px;background:var(--line-2);margin:var(--sp-3) 0}
.flow{display:grid;gap:6px;margin-top:var(--sp-2)}
.flow-s{display:flex;align-items:center;gap:var(--icon-gap);padding:var(--card-pad);
  border-radius:var(--r-m);background:var(--bg-2)}
.flow-n{width:var(--icon-box);height:var(--icon-box);flex:0 0 var(--icon-box);
  border-radius:50%;background:var(--bg);font-size:15px;font-weight:700;
  box-shadow:var(--shadow-1);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.flow-txt{flex:1 1 auto;min-width:0;text-align:left}
.flow-s b{display:block;font-size:14.5px;font-weight:600;letter-spacing:-.02em}
.flow-s span{display:block;font-size:12.5px;color:var(--ink-4);margin-top:2px}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-4);padding:10px 10px 10px 0;
  border-bottom:1px solid var(--line)}
table.t td{padding:13px 10px 13px 0;border-bottom:1px solid var(--line-2);font-size:14.5px}
table.t td:last-child,table.t th:last-child{text-align:right;padding-right:0}
@media (max-width:900px){
  /* CORRECTIF dock mobile : ancienne valeur fixe (calc(80px+46px)=126px)
     ne tenait pas compte de env(safe-area-inset-bottom), qui varie selon
     l'appareil (ex. ~34px sur iPhone avec Face ID en portrait, différent
     en paysage ou sur d'autres modèles) — confirmé en constatant du
     contenu masqué derrière le dock sur un vrai iPhone Safari, pas
     seulement en supposition. Formule explicite : hauteur du dock +
     son décalage du bas + la VRAIE zone sûre de l'appareil + une marge
     de confort, plutôt qu'un nombre deviné. */
  .wrap{padding:var(--sp-3) 18px calc(var(--dock-h) + var(--dock-gap) + env(safe-area-inset-bottom, 0px) + 28px)}
  .section{margin-top:64px}
  .hero{padding:var(--sp-4) 0 var(--sp-3)}
}
@media (max-width:430px){
  :root{--icon-box:42px; --icon-gap:14px; --card-pad:16px}
  .cap,.flow-s{align-items:center;flex-direction:row}

  .card{padding:18px;border-radius:var(--r-m)}
  .ring{width:126px;height:126px}
  .ring-v{font-size:36px}

}

.chart-stats .tiny{display:block;color:var(--ink-4)}

@media (max-width:430px){ .chart-pro{height:260px} .chart-skel{height:260px} .cp-price{font-size:21px} }
</style>

<script>
"use strict";
/* CORRECTIF (bug réel, 2026-09-23, signalé par l'utilisateur : "on ne
   voit plus du tout le temple") : sur un rechargement (F5, retour
   après que Chrome ait déchargé l'onglet pour libérer de la mémoire,
   etc.), le NAVIGATEUR restaure lui-même l'ancienne position de scroll
   AVANT que le moindre JS de cette page ne s'exécute — confirmé en
   direct (history.scrollRestoration par défaut, scrollY non nul dès
   le tout premier tick après un location.reload() effectué en étant
   descendu dans la page). Le fondu du temple au scroll (--temple-fade,
   voir plus bas) se calculait alors immédiatement sur cette position
   restaurée, AVANT même que render() n'ait eu la chance de remettre le
   scroll à 0 (qu'il ne fait de toute façon que sur une navigation
   interne "navigated", pas sur un rechargement complet) — un
   utilisateur qui rechargeait la page après avoir déjà descendu la
   page d'accueil retrouvait donc le temple déjà fondu, parfois presque
   invisible (plancher .08 × opacité de base .55 ≈ 4%), sans jamais
   l'avoir vu apparaître normalement. 'manual' désactive cette
   restauration native : cette appli gère déjà elle-même son scroll
   (voir le "if (navigated)" dans render()), le navigateur n'a plus de
   raison de s'en mêler. Posé tout en haut du script, avant absolument
   tout le reste, pour laisser le minimum de fenêtre possible à une
   restauration native. */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
/* Filet de sécurité : sur ce rechargement PRÉCIS, le navigateur avait
   déjà restauré le scroll avant même d'atteindre cette ligne (confirmé
   en direct — 'manual' ci-dessus empêche les PROCHAINES restaurations,
   pas nécessairement celle déjà en cours). window.scrollTo(0,0) annule
   explicitement ce qui a pu être restauré, pour que le calcul initial
   de --temple-fade parte toujours d'un scroll à 0, comme un premier
   affichage normal. */
window.scrollTo(0, 0);
const BUILD = 'v2-9';
console.log('%cNovaBourse ' + BUILD, 'color:#00a651;font-weight:700');

/* ============================================================
   0. FONDATIONS RESTAURÉES
   ------------------------------------------------------------
   Ce bloc était manquant dans le fichier reçu (state, esc, fmt,
   toEUR, catalogue, PERIODS, etc. n'existaient nulle part alors
   que tout le reste du fichier les appelle). Il a été reconstruit
   ici a minima pour rendre le fichier exécutable, SANS fabriquer
   de données financières : le catalogue ci-dessous ne contient que
   des métadonnées stables (nom, ticker, place, secteur, devise).
   Aucun prix, variation, NovaScore, fondamentaux, volatilité ou
   momentum statique n'y figure — ces valeurs doivent provenir de
   QUOTES / HIST / d'un futur cache COMPANY alimenté par
   /api/market/company, jamais du catalogue.
   ============================================================ */

/* ---- échappement HTML ---- */
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}
/* CORRECTIF (audit sécurité, 2026-09-21) : esc() échappe les caractères
   HTML mais ne valide jamais le SCHÉMA d'une URL — un lien "javascript:"
   ou "data:" venu d'un fournisseur externe (actualités, site web d'une
   société) passerait esc() sans encombre et s'exécuterait au clic.
   safeHref() n'autorise que http(s), sinon renvoie null (jamais un lien
   cliquable dangereux, jamais un throw qui casserait le rendu). */
function safeHref(url){
  const v = String(url ?? '').trim();
  return /^https?:\/\//i.test(v) ? v : null;
}

/* ---- devises ---- */
const CUR_SYMBOL = { EUR:'€', USD:'$', GBP:'£', CHF:'CHF', JPY:'¥', HKD:'HK$' };
/* Taux indicatifs et fixes, utilisés uniquement pour agréger le portefeuille
   virtuel en euros. Ce ne sont PAS des taux de change en temps réel : le
   portefeuille reste une simulation et l'affiche comme telle. */
const FX = { EUR:1, USD:0.92, GBP:1.17, CHF:1.04, JPY:0.0061, HKD:0.118 };
function toEUR(amount, cur){
  if (!Number.isFinite(amount)) return 0;
  const rate = FX[cur];
  return Number.isFinite(rate) ? amount * rate : amount;
}

/* ---- formatage ---- */
const fmt = {
  num(v, d = 0){
    return Number.isFinite(v) ? v.toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d }) : '—';
  },
  int(v){
    return Number.isFinite(v) ? Math.round(v).toLocaleString('fr-FR') : '—';
  },
  eur(v){
    return Number.isFinite(v) ? v.toLocaleString('fr-FR', { minimumFractionDigits:0, maximumFractionDigits:0 }) + ' €' : '—';
  },
  cur(v, cur){
    if (!Number.isFinite(v)) return '—';
    const sym = CUR_SYMBOL[cur] || (cur ? cur + ' ' : '');
    return v.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' ' + sym;
  },
  pct(v, d = 2){
    return Number.isFinite(v) ? (v >= 0 ? '+' : '') + v.toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d }) + ' %' : '—';
  },
  /* Pour un ratio décimal réellement fourni par le backend (roe,
     profitMargin, operatingMargin : ex. 0.3322 = 33,22 %) — ×100 puis
     formaté. Ne jamais utiliser sur un champ dont l'unité n'est pas
     confirmée (ex. dividendYield, dont Finnhub renvoie une valeur déjà en
     points de pourcentage — voir plainFundamentals). '—' si non fini. */
  pctRatio(v, d = 1){
    return Number.isFinite(v) ? (v * 100).toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d }) + ' %' : '—';
  },
  /* Multiplicateur (PER, PriceToBook, EV/EBITDA…) : "27,5 ×", jamais
     "undefined ×" ni "NaN ×". */
  mult(v, d = 1){
    return Number.isFinite(v) ? v.toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d }) + ' ×' : '—';
  },
};

/* ---- état applicatif ---- */
const STORAGE_KEY = 'novabourse_state_v1';
const deepClone = (o) => JSON.parse(JSON.stringify(o));

/* auth est TOUJOURS ré-initialisé à 'loading' au démarrage (voir loadState) :
   aucune valeur restaurée depuis le stockage local ne doit pouvoir authentifier
   quelqu'un. Supabase est la seule source de vérité de la session. */
const DEFAULT_STATE = {
  page:'home',
  stockId:null,

  watchlist:[],
  recent:[],
  compare:[],

  /* Listes organisées (§9 du PRD) : DISTINCTES de `watchlist` ci-dessus
     (l'étoile rapide, comportement inchangé) — un dossier nommé/coloré
     dans lequel ranger des valeurs, plusieurs par société possibles.
     `items` = tableau d'id de `stocks`, jamais de doublon (contrôlé par
     toggleItemListe, jamais construit à la main ailleurs). */
  lists:[],

  /* Alertes de prix (2026-09-23, raccourci "Créer une alerte" de
     l'accueil) : { id, stockId, target, direction:'above'|'below',
     createdAt, triggered:false }. Vérifiées pendant que l'app est
     ouverte (voir verifierAlertes(), branchée sur le même mécanisme de
     rafraîchissement vivant que le reste du site) — HONNÊTETÉ : aucune
     notification push, aucun serveur ne surveille les prix en arrière-
     plan (aurait exigé un backend/webhook, explicitement hors périmètre
     de cette passe). Une alerte déclenchée reste consultable/déclenchée
     une seule fois, jamais répétée en boucle. */
  alerts:[],

  wallet:{
    cash:15480,
    invested:110000,
    positions:[],
    /* Somme cumulée des gains/pertes RÉALISÉS (positions vendues), en euros.
       Jamais recalculée depuis l'historique des positions (qui ne garde pas
       trace d'une position déjà entièrement vendue) : alimentée uniquement
       par sellStock() au moment de chaque vente, sur la méthode du coût
       moyen pondéré (pos.avg). */
    realizedPnL:0
  },

  /* Historique RÉEL du portefeuille : un point par événement (achat, vente,
     ouverture) plus au plus un point par jour (snapshot quotidien, voir
     snapshotPortfolio()). Jamais de passé reconstitué : si le portefeuille
     est ouvert aujourd'hui, cette liste commence aujourd'hui — la période
     "MAX" du graphique portefeuille reflète alors exactement ce fait,
     jamais une courbe antidatée. */
  walletHistory:[],

  /* Journal des transactions (§22-33/§30 du PRD, ajouté 2026-09-17) :
     une ligne par achat/vente réel, jamais reconstituée depuis
     walletHistory (qui ne garde que la VALEUR totale du portefeuille à
     un instant donné, pas le détail par titre). Fondation nécessaire à
     Nova Review et à "Et si je n'avais rien fait ?" — aucune des deux
     n'est possible sans savoir QUEL titre a été acheté/vendu, QUAND et
     à QUEL prix précisément. */
  transactions:[],

  /* Métadonnées (jamais de prix/score/fondamentaux) des sociétés créées à la
     volée par /api/market/search, pour pouvoir les rematérialiser via
     ensureRuntimeStock() après un rechargement — sans quoi une position ou
     une sélection Comparer sur une société hors catalogue deviendrait
     invisible tant que l'utilisateur ne la recherche pas à nouveau. */
  runtimeCatalog:{},

  /* NovaBot (LOT I, Étape 3, 2026-09-24) : SIMULATION UNIQUEMENT, jamais un
     ordre réel sur les marchés — voir evaluerNovaBot()/novabotAcheter()/
     novabotVendre() plus bas. wallet/transactions ISOLÉS de state.wallet/
     state.transactions (le portefeuille réel de l'utilisateur) : les mêler
     fausserait à la fois Nova Review (qui suppose que state.transactions ne
     contient que des décisions VOLONTAIRES) et la valorisation du
     portefeuille réel. N'agit QUE sur state.watchlist (jamais tout le
     catalogue), jamais en arrière-plan côté serveur — évalué uniquement
     pendant que la page NovaBot est consultée, même principe que le
     rafraîchissement vivant (LIVE_MAX_SYMBOLES) et les alertes de prix
     (verifierAlertes) : aucun serveur ne surveille les prix pour vous. */
  novabot:{
    enabled:false,
    scoreAchat:70,      // NovaScore minimum pour déclencher un achat simulé
    stopLossPct:10,     // vente simulée si une position perd ce pourcentage
    takeProfitPct:20,   // vente simulée si une position gagne ce pourcentage
    tradeAmountEUR:500, // montant simulé par achat
    wallet:{ cash:10000, invested:10000, positions:[], realizedPnL:0 },
    transactions:[],
    lastRunAt:null,
  },

  auth:{
    status:'loading',   // 'loading' | 'guest' | 'authenticated'
    signedIn:false,
    name:null,
    email:null,
    since:null
  },

  account:null,

  onboarding:{
    done:false,
    step:0,
    level:null,
    goal:null,
    interests:[],
    capital:null
  },

  settings:{
    level:'debutant',
    mode:'debutant',
    theme:'light',
    currency:'EUR',
    lang:'fr',
    plan:'free',
    cycle:'mensuel',
    animations:true,
    sparklines:true,
    showCoverage:true,
    fontSize:'normal',
    /* CONNU, VOLONTAIREMENT NON câblé (audit "réglage sans effet",
       2026-09-17) : ce réglage existe dans Réglages > Langue et région
       mais aucun formatage réel ne le lit — fmt.num/fmt.cur/fmt.pct
       utilisent 'fr-FR' en dur (9 occurrences). Le corriger toucherait
       l'objet `fmt`, utilisé partout où un prix/pourcentage s'affiche
       dans l'application entière — un risque de régression visuelle
       large que je ne peux pas vérifier sans navigateur dans cette
       session. Laissé en l'état plutôt que risqué à l'aveugle ou
       supprimé sans certitude que ce soit la bonne décision produit. */
    numFormat:'fr',
    notifScore:false,
    notifPrice:false,
    notifWeekly:false,
  },

  filters:{
    /* CORRECTIF (audit "tri Radar", 2026-09-17) : valait 'score' par défaut
       depuis le début, mais radarSort n'était lu nulle part — le tri réel
       était toujours "variation du jour". Mis à jour vers cette même valeur
       ('perf') pour que le comportement par défaut ne change PAS au moment
       où ce champ devient enfin réellement utilisé (voir radarResults) —
       un changement de tri par défaut n'est pas anodin pour un utilisateur
       déjà habitué à l'ordre actuel. 'score' reste un choix explicite
       disponible via le sélecteur, jamais imposé. */
    radarSort:'perf',
    radarSector:'tous',
    radarQ:'',
    radarMin:0,
    radarCountry:'tous',
    /* exploreSector/exploreCountry/exploreQ/exploreVisibles retirés le
       2026-09-23 (fusion Explorer -> Marchés, voir PAGES.markets) —
       remplacés par marketsSector/marketsCountry ci-dessous, un seul
       jeu de filtres et une seule pagination pour la page fusionnée. */
    marketsCategory:'tous',
    marketsRegion:'Monde',
    marketsSector:'tous',
    marketsCountry:'tous',
    marketsVisibles:20,
  },

  ui:{
    pfPeriod:'1A',

function loadState(){
  let merged;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw){
      merged = deepClone(DEFAULT_STATE);
    } else {
      const saved = JSON.parse(raw);
      merged = {
        ...deepClone(DEFAULT_STATE),
        ...saved,
        settings:{ ...DEFAULT_STATE.settings, ...(saved.settings || {}) },
        filters:{ ...DEFAULT_STATE.filters, ...(saved.filters || {}) },
        ui:{ ...DEFAULT_STATE.ui, ...(saved.ui || {}) },
        /* Fusion CHAMP PAR CHAMP, jamais un simple spread au niveau wallet :
           un wallet sauvegardé partiel/corrompu (ex. positions absent après
           une ancienne version, ou cash explicitement null) ne doit écraser
           que les champs réellement absents ou invalides, jamais un cash=0
           ou des positions=[] valides (0 et [] sont des valeurs légitimes,
           pas des indicateurs d'absence — d'où Number.isFinite/Array.isArray
           explicites plutôt qu'un `saved.wallet.cash || 15480`). */
        wallet:{
          cash: Number.isFinite(saved.wallet?.cash) ? saved.wallet.cash : DEFAULT_STATE.wallet.cash,
          invested: Number.isFinite(saved.wallet?.invested) ? saved.wallet.invested : DEFAULT_STATE.wallet.invested,
          positions: Array.isArray(saved.wallet?.positions) ? saved.wallet.positions : DEFAULT_STATE.wallet.positions,
          realizedPnL: Number.isFinite(saved.wallet?.realizedPnL) ? saved.wallet.realizedPnL : DEFAULT_STATE.wallet.realizedPnL,
        },
        walletHistory: Array.isArray(saved.walletHistory) ? saved.walletHistory : DEFAULT_STATE.walletHistory,
        /* Même garde-fou élément par élément que `lists` plus haut : une
           entrée corrompue/incomplète est retirée individuellement, jamais
           tout le journal. */
        transactions: Array.isArray(saved.transactions)
          ? saved.transactions.filter(t => t && typeof t.id === 'string' && (t.type === 'buy' || t.type === 'sell')
              && Number.isFinite(t.qty) && Number.isFinite(t.amountEUR) && typeof t.date === 'string')
          : [],
        /* Validation stricte élément par élément : un stockage corrompu/ancien
           (avant l'ajout de cette fonctionnalité) ne doit jamais produire une
           liste avec un id/name absent en aval (rendu, toggleItemListe). Un
           élément invalide est retiré silencieusement, jamais tout le tableau. */
        lists: Array.isArray(saved.lists)
          ? saved.lists.filter(l => l && typeof l.id === 'string' && typeof l.name === 'string')
            .map(l => ({
              id: l.id, name: l.name,
              color: typeof l.color === 'string' ? l.color : '#e67e22',
              icon: typeof l.icon === 'string' ? l.icon : 'star',
              items: Array.isArray(l.items) ? [...new Set(l.items.filter(x => typeof x === 'string'))] : [],
            }))
          : [],
        runtimeCatalog: (saved.runtimeCatalog && typeof saved.runtimeCatalog === 'object' && !Array.isArray(saved.runtimeCatalog))
          ? saved.runtimeCatalog : {},
        onboarding:{ ...DEFAULT_STATE.onboarding, ...(saved.onboarding || {}) },
        /* Même garde-fou champ-par-champ que `wallet` ci-dessus, appliqué au
           portefeuille papier ISOLÉ de NovaBot (voir DEFAULT_STATE.novabot). */
        novabot:{
          enabled: saved.novabot?.enabled === true,
          scoreAchat: Number.isFinite(saved.novabot?.scoreAchat) ? saved.novabot.scoreAchat : DEFAULT_STATE.novabot.scoreAchat,
          stopLossPct: Number.isFinite(saved.novabot?.stopLossPct) ? saved.novabot.stopLossPct : DEFAULT_STATE.novabot.stopLossPct,
          takeProfitPct: Number.isFinite(saved.novabot?.takeProfitPct) ? saved.novabot.takeProfitPct : DEFAULT_STATE.novabot.takeProfitPct,
          tradeAmountEUR: Number.isFinite(saved.novabot?.tradeAmountEUR) ? saved.novabot.tradeAmountEUR : DEFAULT_STATE.novabot.tradeAmountEUR,
          wallet:{
            cash: Number.isFinite(saved.novabot?.wallet?.cash) ? saved.novabot.wallet.cash : DEFAULT_STATE.novabot.wallet.cash,
            invested: Number.isFinite(saved.novabot?.wallet?.invested) ? saved.novabot.wallet.invested : DEFAULT_STATE.novabot.wallet.invested,
            positions: Array.isArray(saved.novabot?.wallet?.positions) ? saved.novabot.wallet.positions : DEFAULT_STATE.novabot.wallet.positions,
            realizedPnL: Number.isFinite(saved.novabot?.wallet?.realizedPnL) ? saved.novabot.wallet.realizedPnL : DEFAULT_STATE.novabot.wallet.realizedPnL,
          },
          transactions: Array.isArray(saved.novabot?.transactions)
            ? saved.novabot.transactions.filter(t => t && typeof t.id === 'string' && (t.type === 'buy' || t.type === 'sell')
                && Number.isFinite(t.qty) && Number.isFinite(t.amountEUR) && typeof t.date === 'string')
            : [],
          lastRunAt: Number.isFinite(saved.novabot?.lastRunAt) ? saved.novabot.lastRunAt : null,
        },
      };
    }
  } catch {
    merged = deepClone(DEFAULT_STATE);
  }

  /* Correction du bug d'authentification : même si un ancien
     novabourse_state_v1 contient un auth.signedIn=true, il ne doit JAMAIS
     être considéré comme une preuve de connexion. On repart toujours en
     'loading' ; seule la confirmation Supabase (voir applySession) peut
     ensuite passer l'état à 'authenticated' ou 'guest'. */
  merged.auth = {
    status:'loading',
    signedIn:false,
    name:null,
    email:null,
    since:null
  };

  if (!Array.isArray(merged.wallet.positions)) merged.wallet.positions = [];
  if (!Array.isArray(merged.walletHistory)) merged.walletHistory = [];

  return merged;
}

/* Corps réel de l'écriture, partagé par la version debouncée (saveState) et
   la version immédiate (flushSaveState). Rien ici ne change de comportement
   par rapport à avant : mêmes clés, auth toujours exclue. */
function writeStateNow(){
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      watchlist:state.watchlist,
      lists:state.lists,
      recent:state.recent,
      compare:state.compare,
      settings:state.settings,
      filters:state.filters,
      ui:state.ui,
      onboarding:state.onboarding,
      runtimeCatalog:state.runtimeCatalog,
      /* Le portefeuille virtuel est un état utilisateur réel (positions
         qu'il a lui-même prises), pas une donnée de marché : il est
         légitime de le conserver localement pour qu'il survive à un
         rechargement. Aucune valeur de marché n'est stockée ici, ni la
         session (voir auth, jamais sauvegardé). */
      wallet:state.wallet,
      /* Historique réel du portefeuille (voir snapshotPortfolio()) : même
         raisonnement que wallet ci-dessus — état utilisateur, pas donnée de
         marché, légitime à conserver localement. */
      walletHistory:state.walletHistory,
      /* Journal des transactions — même raisonnement, voir DEFAULT_STATE. */
      transactions:state.transactions,
    }));
  } catch {}
}

/* Version normale, debouncée (200ms) : évite de ré-écrire le stockage à
   chaque frappe/toggle. */
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(writeStateNow, 200);
}

/* Écriture IMMÉDIATE, sans attendre le debounce. Nécessaire pour deux cas :
   1) les actions financièrement significatives (achat/vente/capital initial)
      ne doivent jamais dépendre d'un setTimeout qui pourrait ne jamais se
      déclencher si l'utilisateur ferme l'onglet/l'app dans les 200ms qui
      suivent (scénario mobile très plausible : acheter puis quitter) ;
   2) un flush de sécurité sur pagehide/visibilitychange (voir plus bas)
      pour ne perdre aucune écriture encore en attente, quelle qu'elle soit. */
function flushSaveState(){
  clearTimeout(saveTimer);
  writeStateNow();
}

   (TICKER-CODE_MARCHÉ) pour que les deux sources produisent le même id pour
   la même société et ne créent jamais de doublon. */
function remoteId(ticker, exchangeCode){
  const t = String(ticker || '').toUpperCase().trim();
  const e = String(exchangeCode || '').toUpperCase().trim();
  return e ? `${t}-${e}` : t;
}

/* Transforme un résultat de recherche externe (métadonnées seulement) en
   objet "stock" exploitable par le reste du fichier (fiche, achat, watchlist,
   comparateur…), sans jamais fabriquer de prix, score ou fondamentaux : ces
   champs restent BLANK_FIELDS() et ne se rempliront que si QUOTES/HIST ou un
   futur cache COMPANY reçoivent une vraie réponse serveur pour cet id.
   Le catalogue local n'est donc plus une limite : c'est un noyau de départ,
   pas un plafond — toute société renvoyée par /api/market/search peut
   rejoindre `stocks`/`byId` à la demande. */
function ensureRuntimeStock(meta, persist = true){
  if (!meta || !meta.ticker) return null;
  /* L'id est TOUJOURS dérivé de ticker+exchangeCode, jamais d'un éventuel
     champ `meta.id` du backend : ça garantit que l'id calculé ici est
     identique à celui déjà calculé par searchRemote() pour le même résultat
     (déduplication, navigation, Comparer, portefeuille cohérents). */
  const code = pickExchangeCode(meta);
  const id = remoteId(meta.ticker, code);
  console.debug('[NovaBourse][ensureRuntimeStock]', { ticker:meta.ticker, rawExchange:meta.exchange,
    rawExchangeCode:meta.exchangeCode, codeRetenu:code, idCalcule:id, dejaConnue:!!byId[id] });
  if (byId[id]) return byId[id];
  const s = {
    id,
    name: meta.name || meta.ticker,
    ticker: String(meta.ticker).toUpperCase(),
    /* `market` = libellé lisible pour l'affichage uniquement.
       `exchangeCode` = code exact tel que renvoyé par /api/market/search,
       transmis TEL QUEL (sans passer par MARKET_CODE) à /api/market/history,
       /api/market/fundamentals et /api/market/quotes. C'est ce champ qui
       manquait pour les sociétés hors catalogue : voir chargerGraphique,
       chargerFondamentaux et symboleDe ci-dessous. */
    market: meta.market || meta.exchange || code || '—',
    exchangeCode: code,
    sector: meta.sector || 'Non classé',
    /* industry : conservée seulement si réellement fournie par le search
       (jamais déduite) — utile pour ne pas la renvoyer null à l'analyse
       alors que NovaBourse la connaît déjà (voir runAnalysis). */
    industry: meta.industry || null,
    country: meta.country || '—',
    cur: meta.currency || meta.cur || 'USD',
    curSymbol: CUR_SYMBOL[meta.currency || meta.cur] || (meta.currency || meta.cur || ''),
    ...BLANK_FIELDS(),
    /* assetType vient de search.js (typeInterne()) — 'stock' par défaut si
       absent, cohérent avec BLANK_FIELDS() et le comportement précédent. */
    type: meta.assetType || 'stock',
  };
  stocks.push(s);
  byId[s.id] = s;

  if (persist){
    /* Mémorise les SEULES métadonnées (jamais prix/score/fondamentaux) pour
       pouvoir recréer cette société au prochain chargement, sans quoi une
       position achetée ou une sélection Comparer sur une société hors
       catalogue redeviendrait invisible tant qu'elle n'est pas recherchée à
       nouveau. Écriture immédiate : peu fréquent, coût négligeable, et on ne
       veut pas perdre cette entrée si l'onglet se ferme juste après. */
    state.runtimeCatalog[id] = {
      ticker:s.ticker, name:s.name, exchangeCode:s.exchangeCode,
      market:s.market, sector:s.sector, industry:s.industry, country:s.country, cur:s.cur,
      assetType:s.type,
    };
    flushSaveState();
  }

  return s;
}

/* Recrée, au démarrage, toutes les sociétés hors catalogue déjà rencontrées
   (positions du portefeuille, sélection Comparer…) à partir des seules
   métadonnées persistées. Appelé une fois dans boot(), avant tout rendu, de
   sorte que byId soit complet avant que portfolioValue()/PAGES.compare()
   n'essaient de résoudre un id. persist:false : on ne fait que rejouer des
   entrées déjà enregistrées, pas la peine de les ré-écrire ni de reflush. */
function restoreRuntimeCatalog(){
  Object.values(state.runtimeCatalog || {}).forEach(meta => ensureRuntimeStock(meta, false));
}

/* --------------------------------------------------------------------
   CATALOGUE MONDIAL (Explorer/Marchés) — parcours par pages de 20, jamais
   la recherche comme seul point d'entrée. S'appuie sur
   /api/market/extra?kind=catalog (2026-09-24 : fusionnée avec news.js et
   health.js pour rester sous la limite de fonctions serverless du plan
   Vercel — voir la note en tête d'api/market/extra.js), lui-même
   alimenté par free-ticker-database.

   IMPORTANT — couverture réelle du dataset : uniquement 'stock' et 'etf'
   (colonnes asset_type constatées = Stock/ETF uniquement, aucune ligne
   forex/crypto/indice/matière première/obligation). Forex et Crypto
   restent donc sur leur liste statique existante (déjà 20 entrées chacune)
   : aucun appel catalogue n'est fait pour ces deux types, pour ne jamais
   laisser croire à une couverture qui n'existe pas dans la source.

   Chaque société matérialisée passe par ensureRuntimeStock(), exactement
   comme un résultat de recherche : même garantie qu'aucun prix/score n'est
   jamais fabriqué, seule l'identité (ticker/nom/ISIN/secteur/place) vient
   du catalogue — le cours reste à charger en direct via QUOTES. */
const CATALOG_TYPES = new Set(['stock', 'etf']);
const CATALOG_PAGE_SIZE = 20;

const catalogState = {};
function etatCatalogue(type){
  if (!catalogState[type]) catalogState[type] = { cursor:null, done:false, loading:false };
  return catalogState[type];
}

/* Charge UNE page (20 au plus) depuis le catalogue mondial et matérialise
   chaque résultat. Retourne le nombre de sociétés réellement ajoutées
   (0 si épuisé, en erreur, ou déjà en cours de chargement — jamais deux
   requêtes concurrentes pour le même type). N'est JAMAIS appelée pour
   forex/crypto (voir CATALOG_TYPES). */
async function chargerPageCatalogue(type){
  if (!CATALOG_TYPES.has(type)) return 0;
  const st = etatCatalogue(type);
  if (st.done || st.loading) return 0;
  st.loading = true;
  try {
    const url = '/api/market/extra?kind=catalog&type=' + encodeURIComponent(type)
      + '&limit=' + CATALOG_PAGE_SIZE
      + (st.cursor ? '&cursor=' + encodeURIComponent(st.cursor) : '');
    const r = await fetch(url);
    if (!r.ok) return 0;   // erreur transitoire : pas de `done`, un futur essai pourra réussir
    const d = await r.json();
    const results = Array.isArray(d.results) ? d.results : [];
    let ajoutees = 0;
    for (const x of results){
      if (!x || !x.ticker) continue;
      const avant = stocks.length;
      ensureRuntimeStock({ ...x, sector: SECTEUR_CATALOGUE[x.sector] || null });
      if (stocks.length > avant) ajoutees++;
    }
    st.cursor = d.nextCursor || null;
    if (!d.nextCursor) st.done = true;
    return ajoutees;
  } catch {
    return 0;   // hors-ligne/erreur réseau : pas de `done`, retentable plus tard
  } finally {
    st.loading = false;
  }
}

/* Charge des pages successives jusqu'à atteindre `minimum` instruments de
   ce type dans `stocks`, ou jusqu'à épuisement réel du catalogue (`done`).
   Ne boucle jamais indéfiniment : chaque page vide ou en erreur arrête la
   boucle immédiatement (voir chargerPageCatalogue). */
async function assurerCatalogueSuffisant(type, minimum){
  if (!CATALOG_TYPES.has(type)) return false;
  const st = etatCatalogue(type);
  let changement = false;
  while (!st.done && stocks.filter(s => s.type === type).length < minimum){
    const ajoutees = await chargerPageCatalogue(type);
    if (ajoutees > 0) changement = true;
    if (ajoutees === 0) break;
  }
  return changement;
}

function localTime(tz){

  catch { return '—'; }

/* Market Pulse : agrégat des seules données réellement disponibles (QUOTES).
   Si aucune quote n'est encore arrivée, chaque facteur reste indisponible et
   le score global est null plutôt que calculé sur du vide. */
function marketPulse(){
  const avg = (list, get) => {
    const vals = list.map(get).filter(v => Number.isFinite(v));
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const clamp = v => v === null ? null : Math.max(0, Math.min(100, Math.round(v)));

  const changesOf = s => { const q = QUOTES.get(s.id); return q && Number.isFinite(q.changePercent) ? q.changePercent : null; };
  const rated = stocks.map(changesOf).filter(v => v !== null);
  const advancing = rated.filter(v => v > 0).length;
  const breadth = rated.length ? clamp(advancing / rated.length * 100) : null;

  const factors = [
    { k:'Largeur du marché', v:breadth,
      d: breadth === null ? 'Cotations pas encore reçues.' : `${advancing} sociétés en hausse sur ${rated.length}.` },
  ].filter(f => f.v !== null);

  const score = factors.length ? Math.round(factors.reduce((a, f) => a + f.v, 0) / factors.length) : null;
  return { score, factors };
}

/* Recherche : catalogue local uniquement dans ce fichier. La recherche

     (type:'index', cotation/historique en direct via le même pipeline

/* Recherche distante : /api/market/search permet d'ouvrir une société absente
   du catalogue local, qui ne sert plus que de noyau rapide et hors-ligne.
   Contrat ASSUMÉ d'après la documentation de passation (non vérifié en
   exécution, aucun backend disponible ici) : GET /api/market/search?q=...
   -> { results: [{ ticker, name, exchange, exchangeCode, country, currency,
   sector }] }. Lecture défensive : accepte aussi `matches`/`items`, ignore
   tout élément sans ticker, et échoue silencieusement (recherche locale
   seule) si l'endpoint est absent, en erreur, ou renvoie autre chose. */
/* Reconnaissance élargie du code de place boursière dans un résultat de
   /api/market/search : le contrat exact de cet endpoint n'a jamais été
   vérifié contre une vraie réponse (contrairement à /api/market/company,
   confirmé par des réponses réelles). "exchangeCode"/"exchange" étaient une
   hypothèse ; on essaie ici plusieurs noms plausibles, dans l'ordre, sans
   jamais en inventer la valeur — seulement élargir où on va la chercher. */
function pickExchangeCode(x){
  if (!x) return '';
  return x.exchangeCode || x.exchange_code || x.exchangeMic || x.mic || x.micCode
    || x.exchangeShort || x.marketCode || x.exchange || '';
}

async function searchProviders(t){
  if (!CONFIG.marketConnected) return [];
  try {
    const r = await fetch('/api/market/search?q=' + encodeURIComponent(t));
    if (!r.ok) return [];
    const d = await r.json();
    const list = Array.isArray(d.results) ? d.results
      : Array.isArray(d.matches) ? d.matches
      : Array.isArray(d.items) ? d.items
      : [];
    /* Diagnostic temporaire, sans effet sur l'UI : permet de retrouver dans
       la console du navigateur la forme RÉELLE renvoyée par le backend pour
       confirmer/corriger ce mapping (voir rapport — jamais vérifié avant). */
    console.debug('[NovaBourse][searchProviders] réponse brute pour', JSON.stringify(t), ':', d);
    return list.filter(x => x && x.ticker).slice(0, 8).map(x => {
      const code = pickExchangeCode(x);
      return {
        type:'action', remote:true,
        id: remoteId(x.ticker, code),
        title: x.name || x.ticker,
        sub: `${x.ticker} · ${x.sector || 'Non classé'} · ${x.exchange || code || '—'}`,
        meta: x,
      };
    });
  } catch {
    return [];   // recherche locale conservée en repli, aucune erreur affichée
  }
}

/* Catalogue mondial (free-ticker-database, importé côté serveur — voir
   scripts/import-catalog.js) : identité seule (ticker/nom/ISIN/place),
   jamais de prix. Même mapping que searchProviders() pour que les deux
   sources produisent des résultats strictement interchangeables du point
   de vue de ensureRuntimeStock(). Un instrument sans exchangeCode reste
   affichable (cours "indisponible", comportement déjà existant) : aucune
   UI nouvelle n'est nécessaire pour ce cas. */
async function searchCatalog(t){
  try {
    const r = await fetch('/api/market/extra?kind=catalog&q=' + encodeURIComponent(t) + '&limit=8');
    if (!r.ok) return [];
    const d = await r.json();
    const list = Array.isArray(d.results) ? d.results : [];
    return list.map(x => {
      const code = pickExchangeCode(x);
      return {
        type:'action', remote:true,
        id: remoteId(x.ticker, code),
        title: x.name || x.ticker,
        sub: `${x.ticker} · ${x.sector || 'Non classé'} · ${x.exchange || code || '—'}`,
        meta: x,
      };
    });
  } catch {
    return [];
  }
}

/* Fusionne les deux sources distantes (fournisseurs payants + catalogue
   mondial importé) : searchProviders() passe en premier (couverture déjà
   éprouvée), searchCatalog() complète sans jamais dupliquer un id déjà
   trouvé. Ni l'un ni l'autre ne bloque si l'autre échoue (Promise.all sur
   des fonctions qui catchent déjà leurs propres erreurs). */
async function searchRemote(q){
  const t = q.trim();
  if (t.length < 2) return [];
  const [providers, catalogue] = await Promise.all([
    searchProviders(t),
    searchCatalog(t),
  ]);
  const vus = new Set();
  const fusion = [];
  for (const hit of [...providers, ...catalogue]){
    if (vus.has(hit.id)) continue;
    vus.add(hit.id);
    fusion.push(hit);
  }
  return fusion.slice(0, 8);
}
