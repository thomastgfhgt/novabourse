  'Cette entreprise est-elle très endettée ?',
  'Pourquoi les IA ne sont-elles pas d’accord ?',
  'Explique-moi cette entreprise comme si je débutais.',
];
/* Réponses construites à partir des données de la fiche : Nova ne peut pas
   inventer un chiffre, elle ne fait que lire ceux qui existent. */
function askNova(q, st){
  const f = st.fundamentals, sc = st.scores, ai = aiAnalyses(st), cons = consensus(ai);
  const p = profileOf(st.score);
  if (q.includes('score')){
    if (st.score === null) return `Aucun score n'est publié pour ${st.name} : la couverture des données atteint ${st.coverage} %, sous le seuil de 40 %.`;
    const top = COMPONENTS.filter(c=>sc[c.key]!==null).sort((a,b)=>sc[b.key]*b.weight-sc[a.key]*a.weight)[0];
    const low = COMPONENTS.filter(c=>sc[c.key]!==null).sort((a,b)=>sc[a.key]-sc[b.key])[0];
    return `${st.name} obtient ${st.score}/100, un profil « ${p.short.toLowerCase()} ». La composante qui tire le plus vers le haut est ${top.label.toLowerCase()} (${sc[top.key]}/100, poids ${top.weight} %), celle qui pèse le plus est ${low.label.toLowerCase()} (${sc[low.key]}/100). Couverture des données : ${st.coverage} %.`;
  }
  if (q.includes('PER')){
    return f.per === null ? `Le PER de ${st.name} n'est pas disponible dans nos données.`
      : `Le PER de ${st.name} est de ${f.per}. Cela signifie qu'en achetant aujourd'hui, vous payez ${f.per} fois le bénéfice annuel par action. Plus ce nombre est élevé, plus le marché anticipe de la croissance — et plus une déception coûte cher. Note de valorisation : ${sc.valuation ?? '—'}/100.`;
  }
  if (q.includes('risques')){
    const rs = [...new Set(ai.flatMap(a=>a.risks))];
    return rs.length ? `Principaux points de vigilance relevés sur les données disponibles :\n• ${rs.join('\n• ')}`
      : `Aucun risque marquant ne ressort des données disponibles pour ${st.name}. Cela ne signifie pas qu'il n'y en a pas : la gouvernance, les litiges ou la dépendance à un client n'entrent pas dans nos données.`;
  }
  if (q.includes('endettée')){
    return f.debtEquity === null ? `L'endettement de ${st.name} n'est pas disponible dans nos données.`
      : `La dette de ${st.name} représente ${f.debtEquity} % de ses fonds propres. ${f.debtEquity > 150 ? "C'est élevé : l'entreprise doit nettement plus qu'elle ne possède en propre." : f.debtEquity > 80 ? "C'est un niveau intermédiaire, courant dans plusieurs secteurs." : "C'est modéré : l'entreprise est peu dépendante de ses créanciers."} Note d'endettement : ${sc.debt ?? '—'}/100.`;
  }
  if (q.includes('accord')){
    if (!cons.published) return `Les modèles ne se prononcent pas : ${cons.message}`;
    return `${cons.label}. ${cons.agreementPoint || ''} ${cons.disagreementPoint || ''} Les trois modèles reçoivent exactement les mêmes chiffres : leurs écarts viennent de l'importance qu'ils accordent à chaque critère, pas d'informations différentes.`.trim();
  }
  return `${st.name} est une entreprise du secteur ${st.sector.toLowerCase()}, cotée à ${st.market}. ${st.score===null ? "Nous n'avons pas assez de données pour lui attribuer un score." : `Son Nova Score est de ${st.score}/100, ce qui correspond à un profil « ${p.short.toLowerCase()} » selon nos critères. Concrètement : ${sc.profit>=60?'elle gagne bien sa vie':'sa rentabilité est limitée'}, ${sc.debt>=60?'sa dette est maîtrisée':'sa dette est notable'}, et ${sc.volatility>=60?'son cours est plutôt calme':'son cours bouge beaucoup'}.`} Ce score décrit la situation mesurée aujourd'hui ; il ne prédit pas l'évolution du cours.`;
}

function absChange(st){
  const prev = st.price / (1 + st.change/100);
  const d = st.price - prev;
  return (d >= 0 ? '+' : '−') + fmt.num(Math.abs(d)) + ' ' + (CUR_SYMBOL[st.cur] || st.cur);
}

   ============================================================ */
/* Cours réellement reçu du serveur pour cette valeur, ou null.
   Aucun achat ne peut se faire sur un prix qui n'existe pas. */
function prixDe(st){
  const q = st && QUOTES.get(st.id);
  return q && typeof q.price === 'number' && q.price > 0 ? q.price : null;
}

function buyStock(id, amountEUR){
  const st = byId[id];
  if (!st) return { ok:false, msg:'Entreprise inconnue' };
  if (!(amountEUR > 0)) return { ok:false, msg:'Montant invalide' };
  if (amountEUR > state.wallet.cash) return { ok:false, msg:'Liquidités insuffisantes' };

  // Le cours vient des cotations réelles. Sans cours, pas d'achat.
  const prix = prixDe(st);
  if (prix === null) return { ok:false, msg:'Cours indisponible pour cette valeur' };
  const priceEUR = toEUR(prix, st.cur);
  const qty = amountEUR / priceEUR;                     // fractions autorisées
  const pos = state.wallet.positions.find(p => p.id === id);
  if (pos){
    const totalQty = pos.qty + qty;
    // Nouveau prix moyen, dans la devise du titre.
    pos.avg = ((pos.avg * pos.qty) + (prix * qty)) / totalQty;
    pos.qty = totalQty;
  } else {
    state.wallet.positions.push({ id, qty, avg: prix });
  }
  state.wallet.cash -= amountEUR;
  saveState();
  return { ok:true, qty, msg:`${fmt.num(qty,2)} titre(s) de ${st.name} achetés` };
}
function sellStock(id, part = 1){
  const i = state.wallet.positions.findIndex(p => p.id === id);
  if (i < 0) return { ok:false, msg:'Aucune position sur cette valeur' };
  const pos = state.wallet.positions[i], st = byId[id];
  const qty = pos.qty * part;
  const proceeds = toEUR(st.price * qty, st.cur);
  pos.qty -= qty;
  if (pos.qty <= 0.0001) state.wallet.positions.splice(i, 1);
  state.wallet.cash += proceeds;
  saveState();
  return { ok:true, msg:`Vente de ${fmt.num(qty,2)} titre(s) · ${fmt.eur(proceeds)} récupérés` };
}
const positionOf = (id) => state.wallet.positions.find(p => p.id === id) || null;

function areaChart(vals, { h = 200, color = 'var(--accent)', id = 'c', labels = null } = {}){
  const w = 800, pad = { t:16, b: labels ? 28 : 12, l:4, r:56 };
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const X = i => pad.l + (i / (vals.length - 1)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - min) / span) * (h - pad.t - pad.b);
  const d = vals.map((v,i) => `${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area = `${d} L${X(vals.length-1).toFixed(1)},${h-pad.b} L${pad.l},${h-pad.b} Z`;
  const grid = [0,.5,1].map(f => { const v = min + span*f; return `
    <line x1="${pad.l}" y1="${Y(v).toFixed(1)}" x2="${w-pad.r}" y2="${Y(v).toFixed(1)}"
      stroke="var(--line-2)" stroke-width="1"/>
    <text x="${w-pad.r+10}" y="${(Y(v)+4).toFixed(1)}" fill="var(--ink-4)" font-size="12"
      font-family="ui-monospace,monospace">${fmt.int(v)}</text>`; }).join('');
  const xl = labels ? labels.map(l => `<text x="${X(l.i).toFixed(1)}" y="${h-6}" fill="var(--ink-4)"
    font-size="12" text-anchor="middle">${esc(l.t)}</text>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution">
    <defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".20"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${id})"/>
    <path class="chart-line" d="${d}" fill="none" stroke="${color}" stroke-width="2.6"
      stroke-linejoin="round" stroke-linecap="round"/>${xl}</svg>`;
}
function spark(vals, color){
  const w=110,h=32,pad=3,min=Math.min(...vals),max=Math.max(...vals),sp=(max-min)||1;
  // On garde une marge verticale : sans elle, le trait touche les bords et
  // déborde visuellement de sa case.
  const d = vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*w).toFixed(1)},${(pad+(1-(v-min)/sp)*(h-pad*2)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function ring(score, size = 150){
  const R = size/2 - 12, C = 2*Math.PI*R, p = score === null ? 0 : score/100;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="bg" cx="${size/2}" cy="${size/2}" r="${R}"/>
      <circle class="fg" cx="${size/2}" cy="${size/2}" r="${R}" stroke="${scoreColor(score)}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-ring="${(C*(1-p)).toFixed(1)}"/>
    </svg>
    <div class="ring-c"><div>
      <div class="ring-v tabular-nums" style="color:${scoreColor(score)}">${score===null?'—':score}</div>
      <div class="ring-l">${score===null?'non calculable':'sur 100'}</div>
    </div></div></div>`;
}
function donut(parts, size = 150){
  const total = parts.reduce((s,p)=>s+p.v,0) || 1, R = size/2 - 13, C = 2*Math.PI*R;
  let acc = 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
    style="transform:rotate(-90deg)" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--bg-3)" stroke-width="17"/>
    ${parts.map(p=>{ const len=(p.v/total)*C, off=C-acc; acc+=len;
      return `<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="17"
        stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`;
    }).join('')}</svg>`;
}

/* Cotations et historiques réellement reçus du serveur. Vides au départ :
   les lignes affichent « — » jusqu'à la réponse. Rien n'est pré-rempli. */
const QUOTES = new Map();
const HIST = new Map();

/* Identifiant transmis au serveur : ticker + place. La conversion vers le
   format de chaque fournisseur appartient au backend, pas à cette page. */
const symboleDe = s => `${s.ticker}@${MARKET_CODE[s.market] || ''}`;
const MARKET_CODE = { NASDAQ:'NASDAQ', NYSE:'NYSE', 'Euronext Paris':'PA',
  'Euronext Amsterdam':'AS', Xetra:'DE', SIX:'SW', LSE:'L' };

async function chargerCotations(liste){
  const cibles = liste.filter(s => s && s.ticker);
  if (!cibles.length) return;
  try {
    const r = await fetch('/api/market/quotes?symbols='
      + encodeURIComponent(cibles.map(symboleDe).join(',')));
    const d = await r.json();
    if (!d.connected){ DATA.mode = 'unavailable'; DATA.reason = d.reason || null; return paintSource(); }
    const parId = new Map(cibles.map(s => [symboleDe(s), s]));
    for (const q of d.quotes || []){
      const s = parId.get(q.symbol);
      if (s) QUOTES.set(s.id, q);
    }
    DATA.mode = QUOTES.size ? 'live' : 'error';
    DATA.covered = QUOTES.size;
    DATA.provider = d.source || null;
    DATA.at = Date.now();
    paintSource();
    render();
  } catch {
    DATA.mode = 'unavailable'; DATA.reason = 'serveur_injoignable';
    paintSource();
  }
}

/* Historique : uniquement pour un petit nombre de valeurs (fiche, suivies).
   Jamais pour Explorer, qui déclencherait autant d'appels que de lignes. */
async function chargerHistorique(stock){
  if (!stock || HIST.has(stock.id)) return;
  try {
    const r = await fetch(`/api/market/company?ticker=${encodeURIComponent(stock.ticker)}`
      + `&exchange=${encodeURIComponent(MARKET_CODE[stock.market] || '')}`);
    const d = await r.json();
    const closes = (d.history?.ohlcv || []).map(x => x.close).filter(x => typeof x === 'number');
    if (closes.length >= 2){ HIST.set(stock.id, closes.slice(-60)); render(); }
  } catch {}
}

const PAGES = {};

/* Graphique d'ouverture : une courbe qui monte, se trace en boucle, et se
   termine par une flèche. Purement décoratif — aucune donnée n'y est lue, et
   il est marqué comme tel pour les lecteurs d'écran. Animation en CSS seul :
   aucune boucle JavaScript, donc aucun coût en continu. */
function heroChart(){
  /* Courbe de fond du hero : elle traverse tout le bloc en diagonale, passe
     DERRIÈRE le texte, et une flèche la parcourt en continu. La trajectoire
     monte globalement mais recule régulièrement, comme un cours suivi en
     direct — jamais une droite ascendante, qui ne ressemblerait à rien. */
  const W = 1000, H = 700;
  const r = rng(777);
  const n = 54;
  const pts = [];
  let v = 0;
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    // Tendance de fond, plus des reculs marqués à intervalles irréguliers.
    let step = 2.6 + (r() - 0.34) * 3.2;
    const nearEnd = i > n - 6;
    // Reculs réguliers, sauf sur les dernières séances : la courbe doit finir
    // en montée pour que la flèche pointe vers le haut.
    if (!nearEnd && i && i % 7 === 0) step -= 5.4 + r() * 4.2;   // repli net
    if (!nearEnd && i && i % 13 === 0) step -= 7.5 + r() * 3;     // décrochage franc
    if (nearEnd) step = 4.6 + r() * 2.4;                          // accélération finale
    v = Math.max(0, v + step);
    pts.push({ x: 30 + t * (W - 190), y: v });
  }
  const min = Math.min(...pts.map(p => p.y)), max = Math.max(...pts.map(p => p.y));
  const span = (max - min) || 1;
  // On projette du bas-gauche vers le haut-droit, en occupant toute la hauteur.
  pts.forEach(p => { p.y = H - 70 - ((p.y - min) / span) * (H - 190); });

  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < n; i++){
    const a = pts[i - 1], b = pts[i], cx = (a.x + b.x) / 2;
    d += ` C${cx.toFixed(1)},${a.y.toFixed(1)} ${cx.toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
  }

  const cols = 14, rows = 9;
  const grid = [
    ...Array.from({ length: cols + 1 }, (_, i) =>
      `<line x1="${((i / cols) * W).toFixed(1)}" y1="0" x2="${((i / cols) * W).toFixed(1)}" y2="${H}"/>`),
    ...Array.from({ length: rows + 1 }, (_, i) =>
      `<line x1="0" y1="${((i / rows) * H).toFixed(1)}" x2="${W}" y2="${((i / rows) * H).toFixed(1)}"/>`),
  ].join('');

  const area = `${d} L${pts[n - 1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;

  // Extrémité de la courbe et pente des derniers points : la flèche se pose
  // là où le tracé s'arrête, dans son prolongement exact.
  const last = pts[n - 1], before = pts[n - 4];
  const angle = Math.atan2(last.y - before.y, last.x - before.x) * 180 / Math.PI;

  return `<div class="hero-chart" aria-hidden="true">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="hcFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".16"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hcStroke" x1="0" x2="1" y1="1" y2="0">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>
          <stop offset="100%" stop-color="var(--accent)"/>
        </linearGradient>
      </defs>
      <g class="hc-grid">${grid}</g>
      <path class="hc-area" d="${area}" fill="url(#hcFill)"/>
      <path class="hc-line" d="${d}" fill="none" stroke="url(#hcStroke)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
      <g class="hc-tip" transform="translate(${last.x.toFixed(1)},${last.y.toFixed(1)})">
        <circle class="hc-halo" r="17" fill="var(--accent)" opacity=".16"/>
        <circle r="7" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"/>
        <g transform="rotate(${angle.toFixed(1)})">
          <path class="hc-arrow" d="M14 0 L52 0 M39 -12 L52 0 L39 12" fill="none"
            stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </svg>
  </div>`;
}

function parseNaturalQuery(q){
  const t = q.toLowerCase(), f = { radarRisk:'tous', radarMin:0, radarCountry:'tous', radarSector:'tous' };
  const applied = [];
  if (/peu risqu|pas trop risqu|s[ée]curis|prudent|stable/.test(t)){ f.radarRisk='Faible'; applied.push('risque faible'); }
  if (/tr[èe]s risqu|volatil|dynamique/.test(t)){ f.radarRisk='Élevé'; applied.push('risque élevé'); }
  if (/solide|s[ûu]r|qualit[ée]|rentable/.test(t)){ f.radarMin=70; applied.push('Nova Score de 70 et plus'); }
  if (/croissance|qui grandit|en forte hausse/.test(t)){ f.radarMin=Math.max(f.radarMin,60); applied.push('croissance recherchée'); }
  if (/am[ée]ricain|[ée]tats-unis|usa/.test(t)){ f.radarCountry='États-Unis'; applied.push('États-Unis'); }
  if (/fran[çc]ais|france/.test(t)){ f.radarCountry='France'; applied.push('France'); }
  if (/allemand|allemagne/.test(t)){ f.radarCountry='Allemagne'; applied.push('Allemagne'); }
  SECTORS.forEach(sec => { if (t.includes(sec.toLowerCase().slice(0,6))){ f.radarSector=sec; applied.push(sec.toLowerCase()); } });
  if (/grosse|grande|g[ée]ant|large/.test(t)) applied.push('grande capitalisation');
  return { filters:f, applied, big:/grosse|grande|g[ée]ant|large/.test(t) };
}

/* ============================================================
   ANALYSE NOVA — plusieurs modèles, une seule expertise
   Les modèles ne sont plus présentés séparément : on montre le
   résultat de leur confrontation, ce qui les rassemble et ce qui
   les sépare. L'utilisateur n'a pas à arbitrer entre trois avis.
   ============================================================ */
/* Sur quels terrains un modèle a fondé son avis. Déduit des facteurs qu'il a
   réellement cités, jamais déclaré d'avance. */
const FOCUS_MAP = [
  [/ROE|rentabilité/i,            'Rentabilité'],
  [/marge/i,                      'Rentabilité'],
  [/chiffre d'affaires|croissance/i, 'Croissance'],
  [/endettement|dette/i,          'Structure financière'],
  [/PER|valorisation/i,           'Valorisation'],
  [/volatil/i,                    'Volatilité'],
  [/six mois|tendance|momentum/i, 'Momentum'],
  [/couverture/i,                 'Qualité des données'],
];
function focusOf(analysis){
  const txt = [...analysis.positive, ...analysis.negative];
  const found = [];
  for (const line of txt){
    for (const [re, label] of FOCUS_MAP){
      if (re.test(line) && !found.includes(label)) found.push(label);
    }
  }
  return found.slice(0, 2);
}

function novaAnalysis(stock){
  const list = aiAnalyses(stock).map((a, i) => ({ ...a,
    focus: focusOf(a),
    // Les modèles restent anonymes : ce qui compte est leur nombre et leur
    // accord, pas la marque. On évite aussi de faire d'un fournisseur un
    // argument commercial.
    alias: 'Modèle ' + (i + 1),
  }));
  const cons = consensus(list);
  const usable = list.filter(a => a.verdict !== 'insuffisant');

  // Facteurs regroupés : ceux relevés par tous d'abord, puis les autres.
  const tally = new Map();
  usable.forEach(a => {
    [...a.positive.map(t => ['pos', t]), ...a.negative.map(t => ['neg', t])]
      .forEach(([sign, txt]) => {
        const key = sign + '|' + txt.split(' :')[0];
        const e = tally.get(key) || { sign, txt, n:0 };
        e.n++; tally.set(key, e);
      });
  });
  const all = [...tally.values()].sort((a,b) => b.n - a.n);
  const shared = all.filter(x => x.n === usable.length);
  const partial = all.filter(x => x.n < usable.length);

  // Niveau de confiance : accord entre modèles ET couverture des données.
  const agreement = cons.published
    ? (cons.label === 'Accord unanime' ? 3 : cons.label === 'Accord modéré' ? 2 : 1) : 0;
  const cov = stock.coverage >= 90 ? 3 : stock.coverage >= 70 ? 2 : stock.coverage >= 40 ? 1 : 0;
  const conf = Math.min(agreement, cov);
  const confLabel = ['insuffisante','limitée','correcte','élevée'][conf];

  return {
    list,
    published: cons.published,
    verdict: cons.majority,
    label: cons.label,
    models: usable.length,
    total: list.length,
    confidence: conf, confLabel,
    agreeCount: cons.published ? cons.count : 0,
    synthesis: buildSynthesis(stock, cons, shared, partial, usable.length),
    shared: shared.map(x => ({ ...x })),
    partial: partial.map(x => ({ ...x })),
    agreementPoint: cons.agreementPoint,
    disagreementPoint: cons.disagreementPoint,
    message: cons.message,
  };
}

/* Synthèse en une phrase, construite depuis les faits, jamais rédigée d'avance. */
function buildSynthesis(stock, cons, shared, partial, n){
  if (!cons.published) return cons.message;
  const pos = shared.filter(x => x.sign === 'pos').map(x => x.txt.split(' :')[0].toLowerCase());
  const neg = [...shared, ...partial].filter(x => x.sign === 'neg')
    .map(x => x.txt.split(' :')[0].toLowerCase());
  const parts = [];
  parts.push(`Les ${n} modèles ont examiné les mêmes chiffres`);
  if (pos.length) parts.push(`et relèvent tous ${pos.slice(0,2).join(' et ')}`);
  if (neg.length) parts.push(`${pos.length ? 'mais' : 'et'} signalent ${neg.slice(0,2).join(' et ')}`);
  let out = parts.join(' ') + '.';
  if (stock.coverage < 100) out += ` Couverture des données : ${stock.coverage} %.`;
  return out;
}

/* Moyennes de variation sur la période affichée. Calculées depuis la série,
   jamais saisies à la main. */
function averagesBlock(stock, periodId){
  const ser = stockSeries(stock, periodId);
  const v = ser.values, n = v.length;
  const total = (v[n-1] / v[0] - 1) * 100;
  const daysByPeriod = { '1J':1, '1S':5, '1M':21, '6M':126, '1A':252, '5A':1260 };
  const days = daysByPeriod[periodId] || 21;
  const perDay = (Math.pow(v[n-1]/v[0], 1/Math.max(1,days)) - 1) * 100;
  const rows = [
    ['Sur la période', total],
    ['Moyenne par jour', perDay],
    ['Moyenne par semaine', (Math.pow(1+perDay/100, 5) - 1) * 100],
    ['Moyenne par mois', (Math.pow(1+perDay/100, 21) - 1) * 100],
  ];
  return `<div class="avgs">
    ${rows.map(([k,val])=>`
      <div class="avg">
        <span class="avg-k">${esc(k)}</span>
        <span class="avg-v tabular-nums ${val>=0?'up-t':'down-t'}">${trendTxt(val, Math.abs(val)<1?2:1)}</span>
      </div>`).join('')}
  </div>`;
}

/* ============================================================
   RADAR À CINQ PILIERS
   Les quatre premiers reprennent des composantes du Nova Score ;
   le dividende est noté à part et n'entre PAS dans le score.
   Un pilier sans donnée n'est pas ramené à zéro : il est tracé
   au centre, marqué d'un tiret, et listé sous le graphique.
   ============================================================ */
const PILLARS = [
  { key:'valuation', label:'Valorisation', short:'Valo.',   get:s => s.scores.valuation },
  { key:'profit',    label:'Rentabilité',  short:'Rentab.', get:s => s.scores.profit },
  { key:'health',    label:'Santé financière', short:'Santé', get:s => s.scores.debt },
  { key:'growth',    label:'Croissance',   short:'Croiss.', get:s => s.scores.growth },
  { key:'dividend',  label:'Dividende',    short:'Divid.',
    get:s => s.fundamentals.dividend === null || s.fundamentals.dividend === undefined
      ? null : grade('dividend', s.fundamentals.dividend) },
];

function pillarsOf(stock){
  return PILLARS.map(p => ({ ...p, value: p.get(stock) }));
}

function radarSVG(stock){
  const P = pillarsOf(stock);
  const C = 130, R = 92, n = P.length;
  const angle = i => (Math.PI * 2 / n) * i - Math.PI / 2;
  const pt = (i, r) => [C + r * Math.cos(angle(i)), C + r * Math.sin(angle(i))];

  const known = P.filter(p => p.value !== null);
  const grille = [0.25, 0.5, 0.75, 1].map(f => {
    const pts = P.map((_, i) => pt(i, R * f).map(v => v.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${pts}" fill="none" stroke="var(--line)" stroke-width="1"
      ${f === 1 ? '' : 'stroke-dasharray="2 4"'}/>`;
  }).join('');

  const axes = P.map((p, i) => {
    const [x, y] = pt(i, R);
    const [lx, ly] = pt(i, R + 20);
    return `<line x1="${C}" y1="${C}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
        stroke="var(--line)" stroke-width="1"/>
      <text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="middle"
        font-size="11.5" font-weight="600" fill="${p.value === null ? 'var(--ink-4)' : 'var(--ink-3)'}"
        >${esc(p.short)}</text>
      <text x="${lx.toFixed(1)}" y="${(ly + 17).toFixed(1)}" text-anchor="middle"
        font-size="11" font-weight="700" fill="${p.value === null ? 'var(--ink-4)' : scoreColor(p.value)}"
        >${p.value === null ? '—' : p.value}</text>`;
  }).join('');

  // Le polygone ne relie que les piliers mesurés.
  const shape = known.length >= 3
    ? P.map((p, i) => p.value === null ? null : pt(i, (p.value / 100) * R).map(v => v.toFixed(1)).join(','))
        .filter(Boolean).join(' ')
    : null;

  const dots = P.map((p, i) => {
    if (p.value === null) return '';
    const [x, y] = pt(i, (p.value / 100) * R);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6"
      fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
  }).join('');

  return `<svg viewBox="0 0 260 260" class="radar-svg" role="img"
    aria-label="Profil sur cinq piliers : ${P.map(p => `${p.label} ${p.value === null ? 'indisponible' : p.value + ' sur 100'}`).join(', ')}">
    ${grille}${axes}
    ${shape ? `<polygon class="radar-shape" points="${shape}"
      fill="rgba(0,166,81,.18)" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>` : ''}
    ${dots}
  </svg>`;
}

/* ============================================================
   AUTHENTIFICATION — Supabase Auth avec le fournisseur Google.
   La clé anon est publique par conception : elle ne donne accès qu'à ce que
   les politiques RLS autorisent. Aucun secret ne se trouve dans cette page.
   ============================================================ */
let sbClient = null;
let AUTH_ERROR = null;   // message affiché sur l'écran de connexion en cas d'échec
let CONFIG = { supabaseUrl:null, supabaseAnonKey:null, marketConnected:false,
  aiConnected:false, annualBilling:false };

async function loadConfig(){
  try { CONFIG = { ...CONFIG, ...(await fetch('/api/config').then(r => r.json())) }; }
  catch { /* le serveur n'est pas joignable : on reste sur les valeurs par défaut */ }
  return CONFIG;
}

async function initAuth(){
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseAnonKey){
    renderGate(); return null;
  }
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sbClient = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true,
            flowType:'pkce', storage:window.localStorage,
            storageKey:'novabourse-auth' },
  });

  /* Retour de Google. Deux formes possibles selon le flux :
       ?code=...            flux PKCE  → il faut échanger le code
       #access_token=...    flux implicite → getSession() suffit
     Sans cet échange explicite, la session n'est jamais créée et l'écran de
     connexion réapparaît alors que Google a bien répondu. */
  try {
    const url = new URL(window.location.href);
    // Google ou Supabase peuvent renvoyer une erreur explicite : on l'affiche
    // plutôt que de retomber silencieusement sur l'écran de connexion.
    const err = url.searchParams.get('error_description') || url.searchParams.get('error')
      || new URLSearchParams(window.location.hash.slice(1)).get('error_description');
    if (err){
      AUTH_ERROR = decodeURIComponent(err).replace(/\+/g, ' ');
      url.searchParams.delete('error'); url.searchParams.delete('error_description');
      window.history.replaceState({}, '', url.pathname);
    }
    if (url.searchParams.get('code')){
      const { error } = await sbClient.auth.exchangeCodeForSession(window.location.href);
      if (error) console.warn('[auth] échange du code :', error.message);
      url.searchParams.delete('code');
      url.searchParams.delete('state');
      window.history.replaceState({}, '', url.pathname + url.search + url.hash);
    } else if (window.location.hash.includes('access_token')){
      await new Promise(r => setTimeout(r, 60));       // laisse le SDK traiter le fragment
      window.history.replaceState({}, '', url.pathname + url.search);
    }
  } catch (e){
    console.warn('[auth]', e);
    AUTH_ERROR = "L'échange du code de connexion a échoué : " + (e.message || e);
  }

  sbClient.auth.onAuthStateChange((_e, session) => { applySession(session); });
  // Les navigateurs intégrés suspendent la page pendant la redirection : au
  // retour au premier plan, on relit la session.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && sbClient && !state.auth.signedIn){
      const { data } = await sbClient.auth.getSession();
      if (data.session) applySession(data.session);
    }
  });
  const { data } = await sbClient.auth.getSession();
  await applySession(data.session);
  return sbClient;
}

/* Le jeton de session accompagne chaque appel au serveur. */
async function authFetch(url, options = {}){
  const { data } = sbClient ? await sbClient.auth.getSession() : { data:{} };
  const token = data?.session?.access_token;
  return fetch(url, { ...options, headers: {
    'Content-Type':'application/json',
    ...(token ? { Authorization:'Bearer ' + token } : {}),
    ...(options.headers || {}),
  }});
}

async function applySession(session){
  if (!session){
    state.auth = { signedIn:false, name:null, email:null, since:null };
    state.settings.plan = 'free';
    saveState(); renderGate(); return;
  }
  state.auth = {
    signedIn: true,
    name: session.user.user_metadata?.full_name || session.user.email,
    email: session.user.email,
    avatar: session.user.user_metadata?.avatar_url || null,
    since: session.user.created_at || null,
  };
  saveState();
  await refreshAccount();          // plan ET parcours viennent du serveur

  /* Le parcours ne s'affiche qu'une fois, à la première connexion. Le serveur
     fait foi : un nouvel appareil ou un cache vidé ne le relance pas. */
  if (state.account && state.account.onboarded === false && !state.onboarding.done){
    state.onboarding.step = state.onboarding.step || 1;
    saveState(); renderGate(); return;
  }
  if (state.account && state.account.onboarded){
    state.onboarding.done = true;  // aligné sur le compte
    saveState();
  }
  renderApp();
}

/* Le plan est lu en base. Le navigateur ne peut pas se l'attribuer. */
/* Compteur d'analyses. Elite n'affiche aucun plafond : l'offre annonce des
   analyses incluses, le garde-fou anti-abus reste invisible. */
function quotaLigne(){
  const a = state.account;
  if (!a || typeof a.used !== 'number') return '';
  const nom = esc(a.planLabel || a.plan || '');
  if (a.unlimited) return `<div class="quota"><b>${nom}</b><span>Analyses incluses</span></div>`;
  const pct = a.limit ? Math.min(100, Math.round(a.used / a.limit * 100)) : 0;
  return `<div class="quota">
    <b>${nom}</b>
    <span class="tabular-nums">${a.used} / ${a.limit} analyses utilisées ce mois-ci</span>
    <i class="quota-bar"><em style="width:${pct}%"></em></i>
  </div>`;
}

async function refreshAccount(){
  try {
    const r = await authFetch('/api/me');
    if (!r.ok) return;
    const me = await r.json();
    state.settings.plan = me.plan || 'free';
    state.account = me;
    // Les réponses du parcours déjà enregistrées côté compte font autorité.
    if (me.profileSetup){
      const p = me.profileSetup;
      if (p.level) state.onboarding.level = p.level;
      if (p.goal) state.onboarding.goal = p.goal;
      if (p.interests) state.onboarding.interests = p.interests;
    }
    saveState();
  } catch {}
}

/* Le portefeuille démarre avec le montant choisi, et aucune position imposée. */
function setCapital(amount){
  const v = Math.max(100, Math.min(10000000, Math.round(amount)));
  state.wallet = { cash:v, invested:v, positions:[] };
  state.onboarding.capital = v;
  state.onboarding.step = 4;
  saveState();
  renderGate();
  toast(`Portefeuille ouvert avec ${fmt.eur(v)}`);
}

async function signIn(){
  if (!sbClient){
    toast("Connexion indisponible : configuration du serveur incomplète.");
    return;
  }
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/',
               queryParams: { prompt:'select_account' } },
  });
  if (error) toast('Connexion impossible : ' + error.message);
}

/* Paiement : le navigateur envoie seulement « pro » ou « elite ». */
/* ANALYSE RÉELLE
   Le ticker et le nom viennent de la fiche ouverte, jamais d'une valeur par
   défaut : sans entreprise identifiée, aucun appel ne part. Le contexte envoyé
   ne contient que des chiffres mesurés ; le modèle n'a rien à inventer. */
async function runAnalysis(stockId){
  const st = byId[stockId];
  if (!st || !st.ticker){ toast("Entreprise non identifiée."); return; }
  if (!state.auth.signedIn){ toast('Connectez-vous pour lancer une analyse.'); return; }

  openSheet(`<h3 id="sheetTitle">${esc(st.name)}</h3>
    <div id="aiOut"><div class="spin-wrap">
      <span class="brand-spin">${svg(ICON.brand)}</span>
      <span class="spin-txt">Analyse IA par Grok en cours…</span></div></div>`);

  /* Le navigateur n'envoie que l'identité. Les chiffres sont récupérés par le
     serveur auprès des fournisseurs : leur origine est ainsi garantie. */
  let d;
  try {
    const r = await authFetch('/api/analyze', { method:'POST',
      body: JSON.stringify({ ticker: st.ticker, exchange: st.market || null }) });
    d = await r.json();
    if (!r.ok) throw Object.assign(new Error(d.error || 'erreur'), { data:d });
  } catch (e){
    const err = e.data || {};
    const msg = { non_connecte:'Votre session a expiré. Reconnectez-vous.',
      quota_exceeded: err.message || 'Quota mensuel atteint.',
      aucun_modele_configure:"Aucun modèle n'est configuré sur le serveur.",
      entreprise_non_identifiee:"Entreprise non identifiée.",
      delai_depasse:"Le modèle n'a pas répondu à temps.",
      fournisseur_en_erreur:`Le fournisseur a répondu ${err.status || ''}.`,
      donnees_indisponibles:"Les données financières de cette société n'ont pas pu être récupérées.",
    }[err.error] || "L'analyse n'a pas abouti.";
    const out = document.getElementById('aiOut');
    if (out) out.innerHTML = `<div class="notice" style="margin-top:8px"><b>${esc(msg)}</b>
      ${err.detail ? `<br><span class="tiny">${esc(String(err.detail).slice(0,180))}</span>` : ''}</div>`;
    return;
  }

  if (d.quota && state.account) Object.assign(state.account, d.quota);
  const a = d.analysis || {};
  const out = document.getElementById('aiOut');
  if (!out) return;
  out.innerHTML = `
    ${novascoreBloc(d.novascore)}
    ${d.marketConnected === false ? `<div class="notice" style="margin-bottom:18px">
      <b>Validation technique.</b> Aucun fournisseur de données de marché n'est encore
      connecté : les chiffres transmis au modèle ne sont pas des cotations réelles.
      Cette réponse sert à vérifier la chaîne, elle ne constitue pas une analyse financière.
    </div>` : ''}
    <div class="ai-head">
      <span class="bias bias-${esc(a.verdict || 'neutre')}">${esc(BIAS_LABEL[a.verdict] || 'Analyse')}</span>
      <span class="tiny">Incertitude : ${esc(a.uncertainty || '—')}</span>
    </div>
    <p class="small" style="margin-top:14px">${esc(a.summary || '')}</p>
    ${(a.positive || []).length ? `<p class="nova-t">Forces</p><ul class="pts good">
      ${a.positive.slice(0,4).map(x => `<li><i>+</i><span>${esc(x)}</span></li>`).join('')}</ul>` : ''}
    ${(a.negative || []).length ? `<p class="nova-t">Risques</p><ul class="pts bad">
      ${a.negative.slice(0,4).map(x => `<li><i>−</i><span>${esc(x)}</span></li>`).join('')}</ul>` : ''}
    ${d.sources ? `<p class="tiny" style="margin-top:16px">Données :
      cotation ${esc(d.sources.quote || '—')} ·
      fondamentaux ${esc(d.sources.fundamentals || '—')} ·
      historique ${esc(d.sources.history || '—')}
      ${d.missing && d.missing.length ? `<br>Indisponible : ${esc(d.missing.join(', '))}` : ''}</p>` : ''}
    <p class="tiny" style="margin-top:8px">Modèle ${esc(d.model || '')} ·
      ${d.quota && !d.quota.unlimited ? `${d.quota.used}/${d.quota.limit} analyses ce mois` : ''}
      ${d.numericStripped && d.numericStripped.length
        ? ` · ${d.numericStripped.length} champ(s) chiffré(s) retiré(s)` : ''}</p>
    <div class="notice" style="margin-top:16px">Aucun objectif de cours, aucune probabilité.
      Les chiffres proviennent de nos données, jamais du modèle.</div>`;
}

/* NovaScore : rendu tel que le serveur l'a calculé. Aucune note n'est
   fabriquée ici, et rien n'est lu dans la réponse du modèle. */
function novascoreBloc(n){
  if (!n) return '';
  if (n.score === null){
    return `<div class="notice" style="margin-bottom:18px">
      <b>NovaScore non calculable.</b> Couverture des données : ${n.coverage} %.
      Sous 40 %, aucune note n'est produite.</div>`;
  }
  const familles = Object.values(n.families || {}).filter(f => f.score !== null)
    .sort((a, b) => b.score - a.score);
  return `<div class="nsc">
    <div class="nsc-head">
      <span class="nsc-val tabular-nums">${n.score}<small>/100</small></span>
      <span class="nsc-meta">
        <b>NovaScore</b>
        <span>Couverture ${n.coverage} %${n.coherence !== null
          ? ` · Cohérence ${n.coherence} %` : ''} · Confiance ${esc(n.confidence)}</span>
      </span>
    </div>
    ${n.comparable ? '' : `<p class="tiny" style="margin-top:10px">Score partiel :
      la couverture est insuffisante pour comparer cette société à une autre.</p>`}
    <div class="nsc-fam">
      ${familles.map(f => `<div class="nsc-line">
        <span>${esc(f.label)}</span>
        <i><em style="width:${f.score}%"></em></i>
        <b class="tabular-nums">${f.score}</b>
      </div>`).join('')}
    </div>
    <p class="tiny" style="margin-top:12px">Calculé par NovaBourse
      (${esc(n.engine)}) à partir des données du dossier. Le modèle l'explique,
      il ne le produit pas.</p>
  </div>`;
}

async function startCheckout(plan){
  if (plan === 'free'){ toast("L'offre Découverte est déjà active."); return; }
  if (!state.auth.signedIn){ toast('Connectez-vous pour souscrire.'); return; }
  toast('Ouverture du paiement sécurisé…');

      method:'POST', body: JSON.stringify({ plan }),

    if (d.url){ window.location.href = d.url; return; }

      : d.error === 'stripe_non_configure' ? 'Paiement indisponible pour le moment.'
      : 'Paiement impossible.');

}

/* Entreprises proposées : les mieux notées dans les secteurs retenus. Aucun
   classement caché, aucune mise en avant payée. */
function suggestedStocks(){
  const want = state.onboarding.interests || [];
  let list = scored.filter(s => want.includes(s.sector));
  if (list.length < 4) list = list.concat(scored.filter(s => !want.includes(s.sector)));
  return [...new Set(list)].sort((a,b) => b.score - a.score).slice(0, 5);
}

/* Rendu : toute erreur est confinée à la page, le reste continue de fonctionner. */
function render(){
  /* Filet : dès qu'une session existe et que le parcours est terminé, la
     navigation doit réapparaître. Un rendu déclenché par l'arrivée des
     cotations laissait sinon l'écran sans en-tête ni barre du bas. */
  if (state.auth.signedIn && state.onboarding.done) document.body.classList.remove('gated');
  const view = document.getElementById('view');
  let html;
  try {
    html = route.page === 'stock' ? PAGES.stock(route.arg) : (PAGES[route.page] || PAGES.home)();
  } catch (err){
    console.error('[NovaBourse]', err);
    // La cause technique est affichée : sans elle, un écran d'erreur ne dit
    // rien et le diagnostic prend des heures.
    html = `<div class="card">${emptyState('Cette section n’a pas pu s’afficher',
      'Le reste de l’application reste utilisable.', { go:'home', label:'Revenir à l’accueil' })}
      <p class="tiny" style="margin-top:18px;text-align:center;word-break:break-word">
        ${esc(route.page)} · ${esc(err && err.message ? err.message : String(err))} · ${esc(BUILD)}</p>
    </div>`;
  }
  view.innerHTML = html;
  document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  paintNav();
  if (route.page === 'watchlist' || route.page === 'home'){
    // Peu de lignes : un historique par valeur suivie reste raisonnable.
    state.watchlist.slice(0, 6).map(id => byId[id]).filter(Boolean).forEach(chargerHistorique);
  }
  if (route.page === 'stock' && byId[route.arg]) chargerHistorique(byId[route.arg]);
  if (route.page === 'radar')   document.getElementById('radarOut').innerHTML = radarResults();
  if (route.page === 'explore') document.getElementById('exploreOut').innerHTML = exploreRows();
  animate();
}
function animate(){
  const view = document.getElementById('view');
  requestAnimationFrame(() => {
    view.querySelectorAll('.bar-fill[data-w]').forEach(b => b.style.width = b.dataset.w + '%');
    view.querySelectorAll('.ring .fg[data-ring]').forEach(c => c.style.strokeDashoffset = c.dataset.ring);
  });
  if (!('IntersectionObserver' in window)){
    view.querySelectorAll('.rise').forEach(e => e.classList.add('seen')); return;
  }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('seen'); io.unobserve(e.target); }
  }), { rootMargin:'0px 0px -8% 0px' });
  view.querySelectorAll('.rise').forEach(e => io.observe(e));
}
function go(page, arg){
  if (route.page !== page || route.arg !== arg) history_.push({ ...route });
  route = { page, arg: arg ?? null };
  state.page = page; state.stockId = arg ?? null; saveState();
  render();
}
function back(){ const prev = history_.pop(); route = prev || { page:'home', arg:null }; render(); }

/* ---------- thème ---------- */
/* Applique tous les réglages d'un coup : thème, taille, animations, format. */
function applySettings(){
  applyTheme();
  const r = document.documentElement;
  r.style.fontSize = state.settings.fontSize === 'large' ? '17.5px' : '';
  r.classList.toggle('no-anim', state.settings.animations === false);
  document.body.classList.toggle('no-spark', state.settings.sparklines === false);
}

function applyTheme(){
  // « auto » suit la préférence du système, les deux autres l'imposent.
  const wanted = state.settings.theme === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : (state.settings.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', wanted);
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content', wanted === 'dark' ? '#0c0e10' : '#ffffff');
}

/* ---------- recherche ---------- */
let searchTimer = null, hits = [], hi = 0;
function openSearch(){
  openSheet(`<h3 id="sheetTitle">Rechercher</h3>
    <input class="field" id="sq" type="search" placeholder="Entreprise, symbole, secteur…"
      autocomplete="off" aria-label="Rechercher" style="margin-top:16px">
    <div id="sqOut"></div>`);
  const i = document.getElementById('sq');
  i.focus(); paintSearch('');
  i.addEventListener('input', () => {
    clearTimeout(searchTimer);
    document.getElementById('sqOut').innerHTML =
      `<div style="margin-top:16px">${'<div class="sk" style="height:56px;margin-top:8px"></div>'.repeat(3)}</div>`;
    searchTimer = setTimeout(() => paintSearch(i.value), 170);
  });
  i.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault(); hi = Math.max(0, Math.min(hits.length-1, hi + (e.key==='ArrowDown'?1:-1)));
      document.querySelectorAll('#sqOut .row').forEach((el,n)=>el.style.background = n===hi?'var(--bg-2)':'');
    } else if (e.key === 'Enter' && hits[hi]) pick(hits[hi]);
  });
}
function paintSearch(q){
  const out = document.getElementById('sqOut'); if (!out) return;
  hits = searchAll(q); hi = 0;
  if (!q.trim()){
    out.innerHTML = state.recent.length
      ? `<p class="tiny" style="margin:18px 0 6px;display:flex;justify-content:space-between">
          <span>Recherches récentes</span>
          <button class="tiny" data-clear-recent style="color:var(--accent);font-weight:600">Effacer</button></p>
         ${state.recent.map(r=>`<button class="row" data-recent="${esc(r)}">
           <span style="color:var(--ink-4)">${svg(ICON.search)}</span>
           <span class="row-main"><span class="row-t">${esc(r)}</span></span></button>`).join('')}`
      : `<p class="small" style="margin-top:16px">Essayez « Apple », « AAPL », « Luxe » ou « CAC 40 ».</p>`;
    return;
  }
  if (!hits.length){
    out.innerHTML = `<p class="small" style="margin-top:18px">Aucun résultat pour « ${esc(q)} ».</p>`;
    return;
  }
  out.innerHTML = `<div class="rows" style="margin-top:12px">${hits.map((h,i)=>{
    const st = h.type === 'action' ? byId[h.id] : null;
    return `<button class="row" data-hit="${i}" style="${i===0?'background:var(--bg-2)':''}">
      ${st ? avatar(st) : `<span class="av" style="background:var(--ink-4)">IX</span>`}
      <span class="row-main"><span class="row-t">${esc(h.title)}</span>
        <span class="row-s">${esc(h.sub)}</span></span>

    </button>`; }).join('')}</div>`;
}
function pick(h){
  pushRecent(h.title); closeSheet();
  if (h.type === 'action') go('stock', h.id);
  else toast(`${h.title} : page indice bientôt disponible.`);
}

/* Écran 1 : un seul objectif, choisir un montant. Un chiffre dominant, un
   curseur, rien d'autre. */
function openBuyAmount(st, initial){
  const max = Math.floor(state.wallet.cash);
  const v = Math.min(initial || Math.min(100, max), max);
  openSheet(`<div class="buy">
    <p class="buy-co">${esc(st.name)} · ${fmt.cur(st.price, st.cur)}</p>
    <h3 id="sheetTitle" class="sr">Acheter ${esc(st.name)}</h3>
    <div class="buy-big"><span id="buyBig">${fmt.int(v)}</span><small>€</small></div>
    <p class="buy-sub" id="buyShares">—</p>
    <input class="buy-range" id="buyAmt" type="range" min="10" max="${Math.max(10,max)}"
      step="10" value="${v}" aria-label="Montant à investir">
    <div class="buy-chips">
      ${[50,100,250,500].filter(a=>a<=max).map(a=>
        `<button class="chip" data-amount="${a}" data-stock="${esc(st.id)}">${a} €</button>`).join('')}
      <button class="chip" data-amount="${max}" data-stock="${esc(st.id)}">Max</button>
    </div>
    <p class="buy-cash">${fmt.eur(state.wallet.cash)} disponibles</p>
    <button class="btn btn-a btn-lg buy-cta" data-buy-next="${esc(st.id)}">Continuer</button>
  </div>`);
  const input = document.getElementById('buyAmt');
  const sync = () => setBuyAmount(st, +input.value, false);
  input.addEventListener('input', sync);
  sync();
}
function setBuyAmount(st, value, moveSlider = true){
  const input = document.getElementById('buyAmt');
  if (!input) return;
  const v = Math.max(0, Math.min(+input.max, value));
  if (moveSlider) input.value = v;
  document.getElementById('buyBig').textContent = fmt.int(v);
  const qty = v / toEUR(st.price, st.cur);
  document.getElementById('buyShares').textContent = `≈ ${fmt.num(qty, 4)} action(s)`;
  document.querySelectorAll('[data-amount]').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.amount === v)));
}

/* Écran 2 : vérifier l'ordre. Une ligne par information, rien de plus. */
function openBuyReview(st, amount){
  const priceEUR = toEUR(st.price, st.cur);
  const qty = amount / priceEUR;
  const fx = st.cur === 'EUR' ? null : FX[st.cur];
  openSheet(`<div class="buy">
    <p class="buy-co">${esc(st.name)}</p>
    <h3 id="sheetTitle" class="buy-title">Vérifiez votre ordre</h3>
    <dl class="buy-rows">
      <div><dt>Type d'ordre</dt><dd>Achat au marché</dd></div>
      <div><dt>Nombre d'actions</dt><dd>≈ ${fmt.num(qty, 4)}</dd></div>
      <div><dt>Cours</dt><dd>${fmt.cur(st.price, st.cur)}</dd></div>
      ${fx ? `<div><dt>Taux de change</dt><dd>1 ${esc(st.cur)} = ${fx} €</dd></div>` : ''}
      <div><dt>Commission</dt><dd>Aucune</dd></div>
      <div class="buy-total"><dt>Total</dt><dd>${fmt.eur(amount)}</dd></div>
    </dl>
    <p class="buy-note">Portefeuille virtuel.</p>
    <button class="btn btn-a btn-lg buy-cta" data-buy-ok="${esc(st.id)}" data-value="${amount}">
      Confirmer l'achat</button>
    <button class="btn btn-g" style="width:100%;margin-top:10px"
      data-buy-back="${esc(st.id)}" data-value="${amount}">Modifier le montant</button>
  </div>`);
}

function previewBuy(st){
  const el = document.getElementById('buyPrev'); if (!el) return;
  const a = parseFloat(document.getElementById('buyAmt').value);
  if (!(a > 0)){ el.textContent = 'Saisissez un montant.'; return; }
  if (a > state.wallet.cash){ el.textContent = 'Montant supérieur à vos liquidités.'; return; }
  const qty = a / toEUR(st.price, st.cur);
  el.innerHTML = `Vous obtiendrez <b style="color:var(--ink)">${fmt.num(qty,2)} titre(s)</b>.
    Liquidités restantes : ${fmt.eur(state.wallet.cash - a)}.`;
}

/* ---------- événements ---------- */
document.addEventListener('click', e => {
  const q = sel => e.target.closest(sel);

  if (q('[data-signin]')){ signIn(); return; }
  if (q('[data-signout]')){ signOut(); toast('Vous êtes déconnecté'); return; }
  const lvl = q('[data-level]');
  if (lvl){
    state.onboarding.level = lvl.dataset.level;
    state.settings.mode = lvl.dataset.level === 'expert' ? 'expert' : 'debutant';
    state.onboarding.step = 2; saveState(); renderGate(); return;
  }
  const gl = q('[data-goal]');
  if (gl){ state.onboarding.goal = gl.dataset.goal; state.onboarding.step = 3; saveState(); renderGate(); return; }
  if (q('[data-onb-back]')){ state.onboarding.step = 1; saveState(); renderGate(); return; }

  const cap = q('[data-capital]');
  if (cap){ setCapital(+cap.dataset.capital); return; }
  const stepBtn = q('[data-onb-step]');
  if (stepBtn){
    const target = +stepBtn.dataset.onbStep;
    // Sortie de l'écran capital : on tient compte d'un montant saisi à la main.
    if (state.onboarding.step === 3 && target === 4){
      const free = parseFloat(document.getElementById('capFree')?.value);
      if (free > 0) return setCapital(free);
    }
    if (target === 5 && !(state.onboarding.interests||[]).length){
      toast('Choisissez au moins un secteur'); return;
    }
    state.onboarding.step = target; saveState(); renderGate(); return;
  }
  const inter = q('[data-interest]');
  if (inter){
    const id = inter.dataset.interest;
    const list = state.onboarding.interests || (state.onboarding.interests = []);
    const i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1);
    else if (list.length >= 3) return toast('Trois secteurs au maximum');
    else list.push(id);
    saveState(); renderGate(); return;
  }
  if (q('[data-onb-done]')){
    state.onboarding.done = true; saveState();
    // Enregistré une fois pour toutes, côté compte.
    authFetch('/api/me', { method:'POST', body: JSON.stringify({
      completed: true,
      level: state.onboarding.level, goal: state.onboarding.goal,
      interests: state.onboarding.interests || [],
      startCapital: state.onboarding.capital ?? null,
    })}).catch(() => {});
    const dest = { comprendre:'method', trouver:'radar', suivre:'watchlist', portefeuille:'portfolio' };
    renderApp();
    const target = dest[state.onboarding.goal];
    if (target && target !== 'home') go(target);
    toast('Tout est prêt. Bonne exploration.');
    return;
  }
  if (q('[data-guide]')){ state.onboarding.step = 6; saveState(); renderGate(); return; }
  if (q('[data-refaire-parcours]')){
    state.onboarding = { done:false, step:1, level:null, goal:null, interests:[] };
    saveState(); renderGate(); return;
  }

  const nav = q('[data-go]'); if (nav){ e.preventDefault(); go(nav.dataset.go); return; }
  if (q('[data-back]')){ back(); return; }
  if (q('[data-close]')){ closeSheet(); return; }
  if (q('[data-search]')){ openSearch(); return; }

  const st = q('[data-stock]'); if (st && !q('[data-star]')){ go('stock', st.dataset.stock); return; }

  const star = q('[data-star]');
  if (star){
    e.stopPropagation(); toggleWatch(star.dataset.star);
    document.querySelectorAll(`[data-star="${CSS.escape(star.dataset.star)}"]`).forEach(b=>{
      const on = state.watchlist.includes(star.dataset.star);
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('svg')?.setAttribute('fill', on ? 'currentColor' : 'none');
    });
    if (['watchlist','home'].includes(route.page)) render();
    return;
  }

  // Attention : l'attribut data-theme est porté par <html>. Les boutons
  // utilisent donc data-set-theme, sinon closest() intercepterait tous les clics.
  const setBtn = q('[data-set]');
  if (setBtn){
    const key = setBtn.dataset.set, val = setBtn.dataset.val;
    if (setBtn.dataset.soon){ toast('Cette langue arrive bientôt'); return; }
    if (key === 'period'){ state.ui.period = val; }
    else state.settings[key] = val;
    saveState(); applySettings(); render(); return;
  }
  const swBtn = q('[data-toggle-set]');
  if (swBtn){
    const key = swBtn.dataset.toggleSet;
    const cur = state.settings[key] !== false && state.settings[key] !== undefined
      ? state.settings[key] : (['animations','sparklines','showCoverage'].includes(key));
    state.settings[key] = !cur;
    saveState(); applySettings();
    swBtn.setAttribute('aria-checked', String(state.settings[key]));
    swBtn.classList.toggle('on', state.settings[key]);
    return;
  }
  if (q('[data-export]')){
    const data = JSON.stringify({ watchlist:state.watchlist, wallet:state.wallet,
      settings:state.settings }, null, 2);
    openSheet(`<h3 id="sheetTitle">Vos données</h3>
      <p>Tout ce que NovaBourse conserve dans ce navigateur. Rien n'est envoyé ailleurs.</p>
      <pre class="export">${esc(data)}</pre>`);
    return;
  }

  const th = q('[data-set-theme]');
  if (th){ state.settings.theme = th.dataset.setTheme; saveState(); applyTheme(); render(); return; }
  if (q('[data-theme-toggle]')){
    const order = ['light','dark','auto'];
    state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
    saveState(); applySettings(); paintNav();
    toast({ light:'Thème clair', dark:'Thème sombre', auto:'Thème système' }[state.settings.theme]);
    return;
  }

  const md = q('[data-mode]');
  if (md){ state.settings.mode = md.dataset.mode; saveState(); render(); return; }

  const per = q('[data-period]');
  if (per){
    state.ui.period = per.dataset.period; saveState();
    document.querySelectorAll('[data-period]').forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.period === state.ui.period)));
    const s2 = byId[route.arg], ser = stockSeries(s2, state.ui.period);
    document.getElementById('chart').innerHTML = areaChart(ser.values,
      { id:'px'+Date.now(), color: s2.change>=0?'var(--up)':'var(--down)' });
    const av = document.getElementById('avgs');
    if (av) av.innerHTML = averagesBlock(s2, state.ui.period);
    return;
  }
  const pfp = q('[data-pf]'); if (pfp){ state.ui.pfPeriod = pfp.dataset.pf; saveState(); render(); return; }

  const flt = q('[data-filter]');
  if (flt){
    state.filters[flt.dataset.filter] = isNaN(flt.dataset.val) ? flt.dataset.val : +flt.dataset.val;
    saveState();
    document.querySelectorAll(`[data-filter="${flt.dataset.filter}"]`).forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.val === flt.dataset.val)));
    if (route.page === 'radar') document.getElementById('radarOut').innerHTML = radarResults();
    if (route.page === 'explore') document.getElementById('exploreOut').innerHTML = exploreRows();
    return;
  }
  const nl = q('[data-nl]');
  if (nl){
    const r = parseNaturalQuery(nl.dataset.nl);
    Object.assign(state.filters, r.filters, { radarBig:r.big, radarQ:'' });
    saveState(); render();
    toast(r.applied.length ? 'Filtres appliqués : ' + r.applied.join(', ') : 'Aucun filtre reconnu');
    return;
  }

  const term = q('[data-term]');
  if (term){
    const g = GLOSSARY[term.dataset.term] || { court:'Aucune explication disponible.' };
    openSheet(`<h3 id="sheetTitle">${esc(term.dataset.term)}</h3><p>${esc(g.court)}</p>
      ${g.long?`<div class="notice" style="margin-top:18px;background:var(--bg-2);color:var(--ink-2)">
        <b style="color:var(--ink)">Pour aller plus loin.</b> ${esc(g.long)}</div>`:''}`);
    return;
  }

  if (q('[data-pulse]')){
    const p = marketPulse();
    openSheet(`<h3 id="sheetTitle">Pourquoi ${p.score} sur 100 ?</h3>
      <p>Cinq facteurs, tous calculés à partir des données affichées, à poids égaux.</p>
      <div class="bars" style="margin-top:16px">${p.factors.map(f=>`
        <div class="bar"><div class="bar-t"><span class="bar-n">${esc(f.k)}</span>
          <span class="bar-v" style="color:${scoreColor(f.v)}">${f.v}</span></div>
          <span class="bar-track"><i class="bar-fill" style="width:${f.v}%;background:${scoreColor(f.v)}"></i></span>
          <p class="bar-h">${esc(f.d)}</p></div>`).join('')}</div>
      <div class="notice" style="margin-top:18px">Ce score décrit le jeu de données affiché.
        Ce n'est pas une prévision de marché.</div>`);
    return;
  }

  const buy = q('[data-buy]');
  if (buy){ const st = byId[buy.dataset.buy];
    if (!st) { toast('Entreprise introuvable.'); return; }
    if (!prixDe(st)){ toast('Cours indisponible : achat impossible.'); return; }
    openBuyAmount(st); return; }

  const sell = q('[data-sell]');
  if (sell){ sellStock(sell.dataset.sell); return; }

  const nova = q('[data-nova]');
  if (nova){ runAnalysis(nova.dataset.nova); return; }

  const cmp = q('[data-cmp]');
  if (cmp){
    const id = cmp.dataset.cmp;
    if (state.compare.includes(id)) toast('Déjà dans le comparateur');
    else if (state.compare.length >= 3) toast('Trois entreprises au maximum');
    else { state.compare.push(id); saveState(); toast('Ajouté au comparateur'); }
    return;
  }
  const uncmp = q('[data-uncmp]');
  if (uncmp){ state.compare = state.compare.filter(x=>x!==uncmp.dataset.uncmp); saveState(); render(); return; }

  const cyc = q('[data-cycle]');
  if (cyc){ state.settings.cycle = cyc.dataset.cycle; saveState(); render(); return; }
  const pl = q('[data-plan]');
  if (pl){ startCheckout(pl.dataset.plan); return; }
  if (q('[data-portal]')){ openPortal(); return; }

  const hit = q('[data-hit]'); if (hit){ pick(hits[+hit.dataset.hit]); return; }
  const rec = q('[data-recent]');
  if (rec){ const i = document.getElementById('sq'); i.value = rec.dataset.recent; paintSearch(i.value); return; }
  if (q('[data-clear-recent]')){ state.recent = []; saveState(); paintSearch(''); return; }

  if (q('[data-reset]')){
    openSheet(`<h3 id="sheetTitle">Effacer les données locales ?</h3>
      <p>Votre liste de suivi et vos préférences seront effacées de ce navigateur.</p>
      <div class="btns" style="margin-top:22px">
        <button class="btn btn-s" data-close style="flex:1">Annuler</button>
        <button class="btn btn-a" data-reset-ok style="flex:1">Réinitialiser</button></div>`);
    return;
  }
  if (q('[data-reset-ok]')){ closeSheet(); resetDemo(); applySettings(); return; }
});

document.getElementById('sheetBg').addEventListener('click', e => {
  if (e.target.id === 'sheetBg') closeSheet();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); openSearch();
  }
});

/* ---------- démarrage ---------- */
function boot(){
  if (!state.settings.theme) state.settings.theme = 'light';
  if (!state.filters.radarRisk) Object.assign(state.filters,
    { radarRisk:'tous', radarMin:0, radarCountry:'tous', radarSector:'tous', exploreSector:'tous' });
  applySettings();
  if (window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
      if (state.settings.theme === 'auto') applyTheme();
    });
  }
  /* On ne montre l'écran de connexion qu'APRÈS avoir vérifié la session :
     l'afficher d'abord faisait clignoter le login au retour de Google. */
  document.getElementById('view').innerHTML =
    '<div class="gate"><div class="gate-card"><p class="lead">Chargement…</p></div></div>';
  document.body.classList.add('gated');
  loadConfig().then(async () => {
    // Une panne de l'authentification ne doit pas empêcher les cours de charger.
    try { await initAuth(); } catch (e){ console.warn('[auth]', e); renderGate(); }
    loadRealQuotes();
  }).catch(() => renderGate());

  /* Dernier filet : si dix secondes après le démarrage une session existe et
     que le parcours est fait, la navigation doit être visible. Aucun chemin
     d'exécution ne doit pouvoir laisser l'écran amputé. */
  setTimeout(() => {
    if (state.auth.signedIn && state.onboarding.done
        && document.body.classList.contains('gated')){
      console.warn('[NovaBourse] navigation restaurée');
      renderApp();
    }
  }, 10000);
}
boot();
