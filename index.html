let lastFocus = null;
function openSheet(html){
  lastFocus = document.activeElement;
  document.getElementById('sheet').innerHTML =
    `<div class="sheet-h"><div style="min-width:0;flex:1">${html}</div>
      <button class="x" data-close aria-label="Fermer">${svg(ICON.x, 2.2)}</button></div>`;
  const bg = document.getElementById('sheetBg');
  bg.hidden = false; bg.classList.add('on');
  document.body.style.overflow = 'hidden';
  (bg.querySelector('input,button:not([data-close])') || bg.querySelector('[data-close]'))?.focus();
}
function closeSheet(){
  const bg = document.getElementById('sheetBg');
  bg.classList.remove('on'); bg.hidden = true;
  const corps = document.getElementById('sheet');
  if (corps) corps.innerHTML = '';
  document.body.style.overflow = '';
  lastFocus?.focus?.(); lastFocus = null;
}

/* --- graphiques ---
   areaChart/spark ne fabriquent jamais de point : elles se contentent de
   refuser de dessiner quand l'entrée est vide, unique ou non finie (NaN /
   Infinity), au lieu de produire un path SVG invalide. */
function areaChart(vals, { h = 200, color = 'var(--accent)', id = 'c', labels = null } = {}){
  if (!Array.isArray(vals) || vals.length < 2
      || !vals.every(v => typeof v === 'number' && Number.isFinite(v))) return '';
  const w = 800, pad = { t:16, b: labels ? 28 : 12, l:4, r:56 };
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const X = i => pad.l + (i / (vals.length - 1)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - min) / span) * (h - pad.t - pad.b);
  const d = vals.map((v,i) => `${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area = `${d} L${X(vals.length-1).toFixed(1)},${h-pad.b} L${pad.l},${h-pad.b} Z`;
  const grid = [0,.5,1].map(f => { const v = min + span*f; return `
    <line x1="${pad.l}" y1="${Y(v).toFixed(1)}" x2="${w-pad.r}" y2="${Y(v).toFixed(1)}"
      stroke="var(--line-2)" stroke-width="1"/>
    <text x="${w-pad.r+10}" y="${(Y(v)+4).toFixed(1)}" fill="var(--ink-4)" font-size="12"
      font-family="ui-monospace,monospace">${fmt.int(v)}</text>`; }).join('');
  const xl = labels ? labels.map(l => `<text x="${X(l.i).toFixed(1)}" y="${h-6}" fill="var(--ink-4)"
    font-size="12" text-anchor="middle">${esc(l.t)}</text>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution">
    <defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".20"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${id})"/>
    <path class="chart-line" d="${d}" fill="none" stroke="${color}" stroke-width="2.6"
      stroke-linejoin="round" stroke-linecap="round"/>${xl}</svg>`;
}
function spark(vals, color){
  if (!Array.isArray(vals) || vals.length < 2
      || !vals.every(v => typeof v === 'number' && Number.isFinite(v))) return '';
  const w=110,h=32,pad=3,min=Math.min(...vals),max=Math.max(...vals),sp=(max-min)||1;
  const d = vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*w).toFixed(1)},${(pad+(1-(v-min)/sp)*(h-pad*2)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function ring(score, size = 150){
  const R = size/2 - 12, C = 2*Math.PI*R, p = (score === null || score === undefined) ? 0 : score/100;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="bg" cx="${size/2}" cy="${size/2}" r="${R}"/>
      <circle class="fg" cx="${size/2}" cy="${size/2}" r="${R}" stroke="${scoreColor(score)}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-ring="${(C*(1-p)).toFixed(1)}"/>
    </svg>
    <div class="ring-c"><div>
      <div class="ring-v tabular-nums" style="color:${scoreColor(score)}">${(score===null||score===undefined)?'—':score}</div>
      <div class="ring-l">${(score===null||score===undefined)?'non calculable':'sur 100'}</div>
    </div></div></div>`;
}
/* Motion des graphiques — donut (§43 du brief design system, 2026-09-21) :
   chaque arc a son propre stroke-dasharray/dashoffset CALCULÉ à partir
   des données (longueurs différentes par part) — contrairement à
   .chart-line (une seule ligne, un seul dasharray constant), une vraie
   animation "balayage" par segment demanderait de passer une valeur de
   départ différente par cercle. Plus sûr et toujours une vraie
   apparition progressive plutôt qu'un pop instantané : le donut entier
   se matérialise (fondu + échelle), en CSS pur, sans dépendre des
   valeurs data par segment. */
function donut(parts, size = 150){
  const clean = (parts || []).filter(p => Number.isFinite(p.v) && p.v >= 0);
  const total = clean.reduce((s,p)=>s+p.v,0) || 1, R = size/2 - 13, C = 2*Math.PI*R;
  let acc = 0;
  return `<svg class="donut-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
    aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--bg-3)" stroke-width="17"/>
    ${clean.map(p=>{ const len=(p.v/total)*C, off=C-acc; acc+=len;
      return `<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="17"
        stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`;
    }).join('')}</svg>`;
}

/* --- ligne d'entreprise, réutilisée partout ---
   Uniquement ce que QUOTES/HIST ont réellement renvoyé : cours, variation, et
   un mini-graphe seulement si un historique existe. Aucune note, aucun score. */
function stockRow(s, opts = {}){
  const q = QUOTES.get(s.id) || null;
  const prix = q && Number.isFinite(q.price) ? q.price : null;
  const varPct = q && Number.isFinite(q.changePercent) ? q.changePercent : null;
  /* Sparkline = séance du JOUR (période "1j", intraday 5min — voir
     chargerGraphiquePeriode() dans render()), jamais le HIST par défaut
     (~1 an quotidien, réservé à Comparer/volatilité) : une courbe d'un an
     pourrait monter alors que le titre est en baisse aujourd'hui,
     contredisant visuellement sa propre couleur verte/rouge.
     CORRECTIF (retour utilisateur explicite : "je veux que les courbes
     soient effectivement celle d'aujourd'hui, ne mets pas des courbes qui
     ne sont pas celle de l'action") — vérifié en direct sur la vraie
     réponse EODHD (fresh=1) : le fournisseur d'historique intraday de ce
     forfait a un décalage d'environ 1 jour calendaire (la requête "1j"
     redescend bien la fenêtre glissante des dernières 24h, mais EODHD n'a
     pas encore publié les barres du jour même — dernier point observé à
     la clôture d'HIER, pas la séance en cours). Twelve Data (fournisseur
     de repli) était aussi à quota épuisé au moment du test. Plutôt que
     d'afficher silencieusement une courbe d'hier comme si c'était
     aujourd'hui, on vérifie explicitement que le DERNIER point reçu
     tombe bien à la date du jour (UTC) avant de la considérer valide —
     sinon aucune courbe n'est affichée pour cette ligne (même état
     honnête que "pas encore chargé"), jamais une courbe du mauvais jour.
     Dès qu'EODHD publiera les barres du jour (généralement après un
     certain délai, parfois le lendemain), cette vérification laissera
     la courbe réapparaître automatiquement, sans aucun changement de
     code supplémentaire. */
  const hEntry = opts.spark === true ? HISTP.get(cleHISTP(s.id, '1j')) : null;
  const dernierPointEstAujourdhui = hEntry && hEntry.status === 'ready' && hEntry.data.length
    && hEntry.data[hEntry.data.length - 1].date.slice(0, 10) === new Date().toISOString().slice(0, 10);
  const hist = dernierPointEstAujourdhui ? hEntry.data.map(p => p.close) : null;
  /* Fraîcheur (voir api/market/_freshness.js / FRESHNESS_LABEL) : n'affiche
     rien tant qu'aucune cotation n'a été reçue pour cette ligne (prix = —
     déjà suffisamment honnête) ; sinon montre TOUJOURS le libellé exact
     renvoyé par le serveur, y compris "Fraîcheur inconnue" — jamais un
     silence qui laisserait sous-entendre du temps réel par défaut. */
  const labelFraicheur = (prix !== null && q) ? (FRESHNESS_LABEL[q.freshness] || '') : '';
  /* AnimatedFinancialNumber, même mécanisme que la fiche action
     (voir PRICE_FLASH plus bas) — mais une ligne peut apparaître dans
     plusieurs listes à la fois (ex. "Ma liste" ET "Marché" sur l'accueil) ;
     consommé (supprimé) seulement à la PREMIÈRE lecture, les occurrences
     suivantes de rendu ne rejouent pas le flash, c'est acceptable : la
     donnée reste correcte, seule l'animation ne se répète pas partout. */
  const flashRow = PRICE_FLASH.get(s.id);
  if (flashRow) PRICE_FLASH.delete(s.id);

  return `<div class="row">
    <button style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left"
      data-stock="${esc(s.id)}">
      ${avatar(s, opts.logo !== false)}
      <span class="row-main">
        <span class="row-t">${esc(s.ticker)}</span>
        <span class="row-s">${esc(s.name)}</span>
      </span>
    </button>
    ${hist && hist.length >= 2
      ? `<span class="row-spark">${spark(hist, varPct !== null && varPct < 0 ? 'var(--down)' : 'var(--up)')}</span>`
      : ''}
    <span class="row-end">
      <span class="row-px tabular-nums${flashRow ? ` flash-${flashRow}` : ''}">${prix === null ? '—' : fmt.num(prix)}</span>
      <span class="row-var tabular-nums ${varPct === null ? 'na' : varPct >= 0 ? 'up-t' : 'down-t'}">
        ${varPct === null ? '—' : fmt.pct(varPct)}</span>
      ${labelFraicheur ? `<span class="tiny" style="color:var(--ink-4);display:block;text-align:right">${esc(labelFraicheur)}</span>` : ''}
    </span>
  </div>`;
}

/* Cotations et historiques réellement reçus du serveur. Vides au départ :
   les lignes affichent « — » jusqu'à la réponse. Rien n'est pré-rempli. */
const QUOTES = new Map();
/* HIST stocke un état explicite par société :
     { status:'loading' | 'ready' | 'empty' | 'error', data:[{date,close}] }
   'loading'  -> requête en cours ou pas encore lancée
   'ready'    -> data contient au moins 2 points réels, datés
   'empty'    -> le serveur a répondu mais sans historique exploitable
   'error'    -> la requête a échoué (réseau/HTTP) ; on retente au prochain appel */
const HIST = new Map();

/* Priorité à exchangeCode (code exact renvoyé par le backend/search), avec
   repli sur l'ancienne table MARKET_CODE pour compatibilité descendante.
   Avant cette correction, symboleDe passait TOUJOURS par MARKET_CODE[s.market],
   qui ne connaît que des libellés lisibles ("Euronext Paris") : toute société
   dont `market` contenait déjà un code brut ("PA") tombait sur `undefined`
   puis une chaîne vide, cassant silencieusement le symbole envoyé au backend.
   CORRECTIF (audit routage multi-actifs) : le type est désormais TOUJOURS
   transmis (3e segment "@type") à /api/market/quotes — sans lui, le backend
   traitait tout symbole comme une action, envoyant crypto/forex/index/
   commodity à EODHD avec un symbole d'action invalide (cause racine
   confirmée du bug "ALGO/USD cours indisponible" en production). */
const symboleDe = s => `${s.ticker}@${s.exchangeCode || MARKET_CODE[s.market] || ''}@${s.type || 'stock'}`;
/* Le backend (voir api/market/_providers.js, idDe()) identifie toujours
   une cotation par SEULEMENT ticker+exchange (2 segments), jamais le type
   — chaque `quote.symbol` renvoyé par /api/market/quotes a cette forme.
   symboleDe() ci-dessus a 3 segments (ticker@exchange@type) UNIQUEMENT
   pour que le backend sache router la requête ; il ne faut donc PAS
   l'utiliser pour faire correspondre une réponse à sa société d'origine
   (ça ne matcherait jamais, 3 segments ≠ 2) — idDeCotation() reproduit
   exactement le format 2-segments attendu en retour. */
const idDeCotation = s => `${s.ticker}@${s.exchangeCode || MARKET_CODE[s.market] || ''}`;
const MARKET_CODE = { NASDAQ:'NASDAQ', NYSE:'NYSE', 'Euronext Paris':'PA',
  'Euronext Amsterdam':'AS', Xetra:'DE', SIX:'SW', LSE:'L' };

/* --------------------------------------------------------------------
   RAFRAÎCHISSEMENT VIVANT — "quelques secondes de retard", pas du vrai
   streaming WebSocket (qu'on n'a pas). Budget calibré prudemment sur le
   palier d'ENTRÉE de Twelve Data Grow : 55 crédits/minute (confirmé par
   leur documentation officielle — les paliers supérieurs de Grow, 144 et
   377 crédits/min, ont simplement plus de marge, jamais moins).
   Chaque symbole interrogé consomme 1 crédit PAR APPEL — et ce cycle
   utilise `fresh=1` volontairement : sans ça, le cache serveur d'1 minute
   (voir _cache.js, TTL.quote=60000) renverrait le même prix à chaque
   tick pendant la minute en cours, rendant ce rafraîchissement inutile.
   Budget respecté : (nb symboles) × (cycles/minute) ≤ 55.
   Calibrage retenu : 7 symboles maximum, toutes les 8 secondes
   → 7 × 7,5 = 52,5 crédits/min, marge de sécurité incluse.
   Ne suit QUE les instruments réellement visibles sur la page courante
   (fiche ouverte, Comparer, Marchés/Watchlist visibles, positions du
   portefeuille) — jamais tout le catalogue. Coupé quand l'onglet est
   masqué (aucun crédit consommé pendant ce temps), repris à la reprise
   de visibilité. */
const LIVE_INTERVALLE_MS = 8000;
const LIVE_MAX_SYMBOLES = 7;
let liveTimer = null;
let liveIds = [];
/* AnimatedFinancialNumber : direction du dernier changement RÉEL de prix
   par société ('up'/'down'), lue une seule fois par PAGES.stock() puis
   effacée — jamais réappliquée à un render() qui suit sans nouveau
   changement de cours. Jamais posée au premier chargement d'une cotation
   (ancien === undefined) : ce n'est pas une variation, juste l'arrivée
   de la donnée. */
const PRICE_FLASH = new Map();
/* Même idée pour le curseur des segmented controls (voir syncSegPill()
   plus bas) : position de départ, par clé de .seg, posée juste avant le
   changement d'état qui déclenche le prochain render(). */
const SEG_FROM = new Map();

/* Vérifie les alertes de prix actives sur ce titre à chaque cotation
   reçue par le rafraîchissement vivant (voir liveTick ci-dessous et
   l'ajout de leurs stockId à idsVisibles, plus bas dans render()).
   Déclenchée au FRANCHISSEMENT du seuil, pas à chaque tick où le prix
   reste au-delà/en-deçà — sinon la même alerte redéclencherait un toast
   toutes les ~8s tant que le cours ne revient pas sous le seuil. */
function verifierAlertes(stockId, price){
  if (!Number.isFinite(price)) return;
  const st = byId[stockId];
  let touched = false;
  for (const a of state.alerts){
    if (a.triggered || a.stockId !== stockId) continue;
    const franchie = a.direction === 'above' ? price >= a.target : price <= a.target;
    if (!franchie) continue;
    a.triggered = true;
    touched = true;
    toast(`Alerte : ${st ? st.name : stockId} ${a.direction === 'above' ? 'a dépassé' : 'est passé sous'} ${fmt.cur(a.target, st?.cur || 'EUR')}`);
  }
  if (touched) saveState();
}
async function liveTick(){
  const cibles = liveIds.map(id => byId[id]).filter(s => s && s.ticker);
  if (!cibles.length) return;
  try {
    const r = await fetch('/api/market/quotes?fresh=1&symbols='
      + encodeURIComponent(cibles.map(symboleDe).join(',')));
    if (!r.ok) return;
    const d = await r.json();
    const parId = new Map(cibles.map(s => [idDeCotation(s), s]));
    let misAJour = false;
    for (const q of d.quotes || []){
      const s = parId.get(q.symbol);
      if (!s || !Number.isFinite(q.price) || q.price <= 0) continue;
      /* CORRECTIF (page qui "recharge" toutes les 8s) : recevoir une
         réponse HTTP valide ne signifie pas que la donnée a changé — un
         cours différé/EOD reste souvent identique d'un cycle à l'autre.
         Avant ce correctif, misAJour passait à true dès qu'UN SEUL cycle
         réussissait, quel que soit son contenu, ce qui déclenchait un
         render() complet (view.innerHTML remplacé en entier) toutes les
         8 secondes même sans aucun changement réel — exactement le
         symptôme "la page se recharge toutes les quelques secondes"
         rapporté. Le render() complet n'a plus de raison d'être appelé
         que lorsqu'au moins une valeur RÉELLEMENT affichée diffère. */
      const ancien = QUOTES.get(s.id);
      const aChange = !ancien
        || ancien.price !== q.price
        || ancien.changePercent !== q.changePercent
        || ancien.change !== q.change
        || ancien.timestamp !== q.timestamp;
      if (ancien && Number.isFinite(ancien.price) && q.price !== ancien.price){
        PRICE_FLASH.set(s.id, q.price > ancien.price ? 'up' : 'down');
      }
      QUOTES.set(s.id, q);
      if (aChange) misAJour = true;
      verifierAlertes(s.id, q.price);
    }
    if (misAJour){ state.ui.liveAt = Date.now(); render(); }
  } catch { /* un cycle raté n'interrompt pas les suivants, le prochain tick réessaiera */ }
}

/* Remplace tout abonnement précédent — jamais deux minuteurs en parallèle
   (ex. navigation rapide entre deux fiches). `ids` au-delà de
   LIVE_MAX_SYMBOLES est tronqué, jamais étendu.
   GARDE-FOU ESSENTIEL : si la liste demandée est EXACTEMENT celle déjà
   suivie, ne rien faire — ni redémarrer le minuteur, ni retirer un tick
   immédiat. Sans ce garde-fou, un tick réussi déclenche render(), qui
   rappelle cette fonction avec les mêmes ids (puisque render() relit la
   même route), qui relance un tick immédiat, qui réussit, qui rappelle
   render()... : une boucle non bornée, confirmée en test réel, où le
   rafraîchissement se déclenche en continu au lieu de toutes les 8
   secondes. Ce garde-fou la supprime sans changer le comportement
   attendu (nouveaux ids -> toujours un tick immédiat + minuteur relancé). */
function demarrerRafraichissementVivant(ids){
  const nouveaux = [...new Set(ids.filter(Boolean))].slice(0, LIVE_MAX_SYMBOLES);
  const inchange = nouveaux.length === liveIds.length
    && nouveaux.every(id => liveIds.includes(id));
  if (inchange && liveTimer) return;
  arreterRafraichissementVivant();
  liveIds = nouveaux;
  if (!liveIds.length) return;
  /* Premier tick IMMÉDIAT (pas d'attente des 8 premières secondes) : une
     société fraîchement ajoutée par recherche, ou tout simplement la
     fiche qu'on vient d'ouvrir, obtient un prix tout de suite plutôt que
     d'attendre le premier cycle programmé. */
  liveTick();
  liveTimer = setInterval(liveTick, LIVE_INTERVALLE_MS);
}
function arreterRafraichissementVivant(){
  if (liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  liveIds = [];
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    if (liveTimer){ clearInterval(liveTimer); liveTimer = null; }
  } else if (liveIds.length && !liveTimer){
    liveTimer = setInterval(liveTick, LIVE_INTERVALLE_MS);
  }
});

/* Chargement en masse (catalogue entier au démarrage) : contrairement au
   rafraîchissement vivant ci-dessus (déjà sûr par construction, 7 symboles
   max), CE chargement peut porter sur ~70 instruments d'un coup — bien
   au-delà du palier d'ENTRÉE de Twelve Data Grow (55 crédits/minute).
   Sans précaution, `Promise.all` sur tous les lots partirait en une seule
   salve et dépasserait le budget dès le premier appel. On regroupe donc
   les lots en VAGUES dont la somme de symboles reste sûre, avec une pause
   d'une minute entre deux vagues si le catalogue en réclame plusieurs —
   jamais un pic qui dépasse le crédit disponible. */
const CHARGEMENT_MASSE_MAX_SYMBOLES = 50;
const CHARGEMENT_MASSE_PAUSE_MS = 61000;

/* Enveloppe de déduplication : NE demande jamais une cotation déjà connue
   (QUOTES.has), NI une cotation dont la dernière tentative a échoué il y
   a moins de COTATION_COOLDOWN_MS — sans ce délai de recul, un symbole
   qui ne se résout JAMAIS (ticker invalide, fournisseur en panne)
   redéclencherait une tentative à chaque render(), donc une boucle sans
   fin (confirmé en test réel). Le délai laisse une chance de réessayer
   plus tard sans marteler un symbole cassé à chaque rendu.
   C'est ELLE qu'il faut appeler partout dans l'application — jamais
   chargerCotations() directement — pour que "catalogue large" ne rime
   jamais avec "tout charger". */
const COTATION_COOLDOWN_MS = 30000;
const derniereTentativeEchouee = new Map();

function assurerCotations(liste){
  const maintenant = Date.now();
  const manquantes = liste.filter(s => {
    if (!s || !s.ticker || QUOTES.has(s.id)) return false;
    const derniere = derniereTentativeEchouee.get(s.id);
    return !derniere || (maintenant - derniere) > COTATION_COOLDOWN_MS;
  });
  if (!manquantes.length) return Promise.resolve();
  return chargerCotations(manquantes);
}

async function chargerCotations(liste){
  const cibles = liste.filter(s => s && s.ticker);
  if (!cibles.length) return;

  const TAILLE_LOT = 8;
  const lots = [];
  for (let i = 0; i < cibles.length; i += TAILLE_LOT) lots.push(cibles.slice(i, i + TAILLE_LOT));

  const vagues = [];
  let vagueCourante = [], compteurCourant = 0;
  for (const lot of lots){
    if (compteurCourant + lot.length > CHARGEMENT_MASSE_MAX_SYMBOLES && vagueCourante.length){
      vagues.push(vagueCourante); vagueCourante = []; compteurCourant = 0;
    }
    vagueCourante.push(lot); compteurCourant += lot.length;
  }
  if (vagueCourante.length) vagues.push(vagueCourante);

  let reçus = 0, source = null, echecs = 0, totalLots = 0;

  for (let v = 0; v < vagues.length; v++){
    if (v > 0) await new Promise(res => setTimeout(res, CHARGEMENT_MASSE_PAUSE_MS));
    totalLots += vagues[v].length;
    await Promise.all(vagues[v].map(async lot => {
      try {
        const r = await fetch('/api/market/quotes?symbols='
          + encodeURIComponent(lot.map(symboleDe).join(',')));
        if (!r.ok){ echecs++; return; }
        const d = await r.json();
        const parId = new Map(lot.map(s => [idDeCotation(s), s]));
        for (const q of d.quotes || []){
          const s = parId.get(q.symbol);
          if (s && Number.isFinite(q.price) && q.price > 0){ QUOTES.set(s.id, q); reçus++; }
        }
        if (d.source) source = d.source;
        if (!d.quotes || !d.quotes.length) echecs++;
      } catch { echecs++; }
    }));
    /* Dès la 1ère vague reçue, on affiche déjà ce qu'on a — l'utilisateur
       voit des prix réels tout de suite plutôt que d'attendre la fin de
       toutes les vagues (pertinent seulement si le catalogue en réclame
       plusieurs). */
    if (vagues.length > 1) render();
  }

  /* Enregistre un délai de recul pour tout symbole demandé qui reste
     inconnu après cette tentative — voir COTATION_COOLDOWN_MS ci-dessus,
     c'est ce qui empêche une boucle sans fin sur un symbole qui ne se
     résout jamais. */
  const maintenant = Date.now();
  for (const s of cibles){
    if (!QUOTES.has(s.id)) derniereTentativeEchouee.set(s.id, maintenant);
  }

  if (!reçus){
    DATA.mode = 'unavailable';
    DATA.reason = echecs === totalLots ? 'fournisseur_indisponible' : null;
  } else {
    DATA.mode = 'live';
    DATA.covered = QUOTES.size;
    DATA.provider = source;
    DATA.at = Date.now();
  }
  paintSource();
  /* CORRECTIF — bug réel trouvé en test : appeler render() sans condition
     ici, même quand reçus===0, recrée exactement la liste "encore
     manquante" à l'identique au prochain rendu -> assurerCotations()
     la redemande -> chargerCotations() la re-échoue -> render() de
     nouveau : une boucle sans fin dès qu'un symbole ne se résout jamais
     (fournisseur en panne, ticker invalide, ou — comme dans ce test —
     un mock qui ne le satisfait jamais). Un aller simple sans rien de
     nouveau à afficher ne doit jamais redéclencher un rendu. */
  if (reçus) render();
}

/* Séances par période, sur des données journalières uniquement. 1J/1S
   intraday ne sont pas proposés (voir PERIODS_DISPO) : aucune donnée
   intraday n'est chargée par ce fichier. */
const SEANCES = { '1S':5, '1M':21, '3M':63, '6M':126, '1A':252 };

/* Filtre l'historique réel par période. Ne complète JAMAIS artificiellement :
   si moins de deux points réels existent pour la période demandée, retourne
   null et laisse l'appelant afficher "données insuffisantes". */
function histPeriode(stockId, periodId){
  const entry = HIST.get(stockId);
  if (!entry || entry.status !== 'ready' || !Array.isArray(entry.data) || entry.data.length < 2) return null;
  /* AAJ (année à ce jour) : filtre par date réelle plutôt qu'un nombre de
     séances fixe — calculable immédiatement à partir de l'historique
     quotidien déjà chargé, sans appel supplémentaire. Contrairement à un
     graphique "à la seconde", ceci n'exige aucune infrastructure de
     streaming : c'est un simple filtre sur des données déjà en main. */
  if (periodId === 'AAJ'){
    const debutAnnee = `${new Date().getFullYear()}-01-01`;
    const pts = entry.data.filter(p => p.date >= debutAnnee);
    return pts.length >= 2 ? pts : null;
  }
  const n = SEANCES[periodId];
  if (!n) return null;
  const pts = entry.data.slice(-n);
  return pts.length >= 2 ? pts : null;
}

const HIST_ENCOURS = new Set();

/* Historique réel, daté. Conserve tous les points renvoyés par le serveur
   (aucune troncature arbitraire à 60) et distingue explicitement : en cours,
   prêt, vide, en erreur. Une requête déjà en cours n'est jamais dupliquée. */
/* --------------------------------------------------------------------
   CHARGEMENT À LA DEMANDE — historique et fondamentaux sont désormais
   deux appels réseau INDÉPENDANTS, déclenchés uniquement par une action
   explicite de l'utilisateur ("Voir le graphique" / "Voir les chiffres"
   / ouverture de Comparer), plus jamais automatiquement à l'ouverture
   d'une fiche ou de l'accueil/watchlist. Chacun a son propre état
   explicite à 4 valeurs (idle/loading/loaded/error), sur le modèle déjà
   existant de HIST, pour permettre d'étendre facilement à d'autres
   catégories de données plus tard.
   -------------------------------------------------------------------- */

/* Historique réel, daté. Conserve tous les points renvoyés par le serveur
   (aucune troncature arbitraire à 60) et distingue explicitement : en cours,
   prêt, vide, en erreur. Une requête déjà en cours n'est jamais dupliquée.
   N'appelle plus que /api/market/history (jamais /company) : les
   fondamentaux sont désormais chargés séparément par chargerFondamentaux(). */
async function chargerGraphique(stock){
  if (!stock) return;
  const existing = HIST.get(stock.id);
  if (existing && existing.status !== 'error') return;   // déjà chargé ou en cours
  if (HIST_ENCOURS.has(stock.id)) return;

  HIST_ENCOURS.add(stock.id);
  HIST.set(stock.id, { status:'loading', data:[] });
  render();
  try {
    /* exchangeCode (code brut attendu par le backend, ex. "PA", "DE",
       "NASDAQ") en priorité, MARKET_CODE[stock.market] en repli — voir
       correctif exchangeCode documenté ailleurs dans ce fichier. */
    const exch = stock.exchangeCode || MARKET_CODE[stock.market] || '';
    const r = await fetch(`/api/market/history?ticker=${encodeURIComponent(stock.ticker)}`
      + `&exchange=${encodeURIComponent(exch)}&type=${encodeURIComponent(stock.type || 'stock')}`);
    if (!r.ok){
      HIST.set(stock.id, { status:'error', data:[] });
      return;
    }
    const d = await r.json();
    const points = (d.history?.ohlcv || [])
      .filter(x => x && typeof x.date === 'string' && Number.isFinite(x.close) && x.close > 0)
      .map(x => ({ date:x.date, close:x.close }));
    HIST.set(stock.id, points.length >= 2
      ? { status:'ready', data:points }
      : { status:'empty', data:[] });
  } catch {
    HIST.set(stock.id, { status:'error', data:[] });
  } finally {
    HIST_ENCOURS.delete(stock.id);
    render();
  }
}

/* ============================================================
   GRAPHIQUE PROFESSIONNEL — historique paramétré par période
   ============================================================
   Distinct de HIST/chargerGraphique ci-dessus (qui reste utilisé tel quel
   par Comparer/le score de volatilité/les sparklines de ligne). Cache
   client par COUPLE instrument+période — ouvrir 1M puis 5A charge deux
   séries différentes, indépendamment mises en cache ; rouvrir 1M ensuite
   ne redéclenche aucune requête tant que l'entrée est déjà 'ready'.
   OHLCV complet conservé (pas seulement `close`) pour permettre chandeliers,
   volume et statistiques réelles de période. */
const HISTP = new Map();          // clé "stockId::period" -> {status,kind,interval,source,data}
const HISTP_ENCOURS = new Set();

function cleHISTP(stockId, period){ return `${stockId}::${period}`; }

async function chargerGraphiquePeriode(stock, period){
  if (!stock || !period) return;
  const cle = cleHISTP(stock.id, period);
  const existing = HISTP.get(cle);
  if (existing && existing.status !== 'error') return;   // déjà chargé ou en cours
  if (HISTP_ENCOURS.has(cle)) return;

  HISTP_ENCOURS.add(cle);
  HISTP.set(cle, { status:'loading', data:[] });
  render();
  try {
    const exch = stock.exchangeCode || MARKET_CODE[stock.market] || '';
    const r = await fetch(`/api/market/history?ticker=${encodeURIComponent(stock.ticker)}`
      + `&exchange=${encodeURIComponent(exch)}&type=${encodeURIComponent(stock.type || 'stock')}`
      + `&period=${encodeURIComponent(period)}`);
    if (!r.ok){
      HISTP.set(cle, { status:'error', data:[] });
      return;
    }
    const d = await r.json();
    const points = (d.history?.ohlcv || [])
      .filter(x => x && typeof x.date === 'string' && Number.isFinite(x.close) && x.close > 0)
      .map(x => ({ date:x.date, open:x.open, high:x.high, low:x.low, close:x.close, volume:x.volume }));
    HISTP.set(cle, points.length >= 2
      ? { status:'ready', kind:d.kind || 'daily', interval:d.interval || null, source:d.source || null, data:points }
      : { status:'empty', data:[] });
  } catch {
    HISTP.set(cle, { status:'error', data:[] });
  } finally {
    HISTP_ENCOURS.delete(cle);
    render();
  }
}

/* Ensemble des sociétés dont les fondamentaux sont en cours de chargement,
   sur le modèle de HIST_ENCOURS : protège contre une double requête
   identique (ex. clic répété sur "Voir les chiffres"). */
const FUND_ENCOURS = new Set();

/* Fondamentaux réels, chargés uniquement à la demande (bouton "Voir les
   chiffres"). `stock.fundamentalsStatus` reflète explicitement l'état :
   'idle' (jamais demandé) | 'loading' | 'loaded' | 'error'. Contrat des
   champs confirmé par test réel (MSFT via Finnhub) : revenue,
   revenuePerShare, revenueSeries, epsSeries, fcfSeries, netIncome, eps,
   profitMargin, operatingMargin, roe, debt, cash, freeCashFlow, pe,
   forwardPE, priceToBook, evToEbitda, dividendYield, marketCap. */
async function chargerFondamentaux(stock){
  if (!stock) return;
  if (stock.fundamentalsStatus === 'loaded' || stock.fundamentalsStatus === 'loading') return;
  if (FUND_ENCOURS.has(stock.id)) return;

  FUND_ENCOURS.add(stock.id);
  stock.fundamentalsStatus = 'loading';
  render();
  try {
    const exch = stock.exchangeCode || MARKET_CODE[stock.market] || '';
    const r = await fetch(`/api/market/fundamentals?ticker=${encodeURIComponent(stock.ticker)}`
      + `&exchange=${encodeURIComponent(exch)}&type=${encodeURIComponent(stock.type || 'stock')}`);
    if (!r.ok){
      stock.fundamentals = null;
      stock.hasFundamentals = false;
      stock.fundamentalsStatus = 'error';
      return;
    }
    const d = await r.json();
    stock.fundamentals = d.fundamentals ?? null;
    stock.hasFundamentals = Boolean(d.fundamentals);
    stock.fundamentalsSource = d.source ?? null;
    /* Ajout (audit "fiche entreprise") : description/site web/effectifs,
       chargés par le même appel, sans requête supplémentaire. */
    stock.companyIdentity = d.identity ?? null;
    /* 'loaded' dès que la requête a abouti, que des données exploitables
       existent ou non — symétrique à l'historique (ready/empty relèvent
       tous deux de "loaded", la nuance est affichée séparément via
       hasFundamentals). 'error' reste réservé à un échec réel de la
       requête (ci-dessus et dans le catch), jamais à "chargé mais vide". */
    stock.fundamentalsStatus = 'loaded';
  } catch {
    stock.fundamentals = null;
    stock.hasFundamentals = false;
    stock.fundamentalsStatus = 'error';
  } finally {
    FUND_ENCOURS.delete(stock.id);
    render();
  }
}

/* Actualités réelles, chargées uniquement à la demande (bouton "Voir les
   actualités"). Même modèle à 4 états que chargerFondamentaux ci-dessus :
   'idle' | 'loading' | 'loaded' | 'error'. Un fournisseur unique aujourd'hui
   (EODHD, voir NEWS dans _providers.js) — stock/etf uniquement, le backend
   répond directement articles:null pour les autres types sans appel réseau
   (déjà géré côté serveur, pas besoin de le reproduire ici). */
const NEWS_ENCOURS = new Set();
async function chargerActualites(stock){
  if (!stock) return;
  if (stock.newsStatus === 'loaded' || stock.newsStatus === 'loading') return;
  if (NEWS_ENCOURS.has(stock.id)) return;

  NEWS_ENCOURS.add(stock.id);
  stock.newsStatus = 'loading';
  render();
  try {
    const exch = stock.exchangeCode || MARKET_CODE[stock.market] || '';
    const r = await fetch(`/api/market/extra?kind=news&ticker=${encodeURIComponent(stock.ticker)}`
      + `&exchange=${encodeURIComponent(exch)}&type=${encodeURIComponent(stock.type || 'stock')}&limit=8`);
    if (!r.ok){
      stock.news = null;
      stock.newsStatus = 'error';
      return;
    }
    const d = await r.json();
    stock.news = Array.isArray(d.articles) ? d.articles : null;
    stock.newsSource = d.source ?? null;
    stock.newsStatus = 'loaded';
  } catch {
    stock.news = null;
    stock.newsStatus = 'error';
  } finally {
    NEWS_ENCOURS.delete(stock.id);
    render();
  }
}

/* Générateur pseudo-aléatoire PUREMENT DÉCORATIF, local à cette fonction :
   il dessine la courbe animée d'illustration du bandeau d'accueil et ne lit,
   n'écrit ni ne touche à aucune donnée financière (QUOTES/HIST/portefeuille).
   Ce n'est pas le rng()/series() supprimé ailleurs : celui-ci n'a jamais
   existé dans ce fichier et n'a pas été recréé. Renommé sans ambiguïté. */
function heroChart(){
  const W = 1000, H = 700;
  let heroSeed = 777;
  const r = () => { heroSeed = (heroSeed * 1103515245 + 12345) % 2147483648; return heroSeed / 2147483648; };
  const n = 54;
  const pts = [];
  let v = 0;
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    let step = 2.6 + (r() - 0.34) * 3.2;
    const nearEnd = i > n - 6;
    if (!nearEnd && i && i % 7 === 0) step -= 5.4 + r() * 4.2;
    if (!nearEnd && i && i % 13 === 0) step -= 7.5 + r() * 3;
    if (nearEnd) step = 4.6 + r() * 2.4;
    v = Math.max(0, v + step);
    pts.push({ x: 30 + t * (W - 190), y: v });
  }
  const min = Math.min(...pts.map(p => p.y)), max = Math.max(...pts.map(p => p.y));
  const span = (max - min) || 1;
  pts.forEach(p => { p.y = H - 70 - ((p.y - min) / span) * (H - 190); });

  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < n; i++){
    const a = pts[i - 1], b = pts[i], cx = (a.x + b.x) / 2;
    d += ` C${cx.toFixed(1)},${a.y.toFixed(1)} ${cx.toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
  }

  const cols = 14, rows = 9;
  const grid = [
    ...Array.from({ length: cols + 1 }, (_, i) =>
      `<line x1="${((i / cols) * W).toFixed(1)}" y1="0" x2="${((i / cols) * W).toFixed(1)}" y2="${H}"/>`),
    ...Array.from({ length: rows + 1 }, (_, i) =>
      `<line x1="0" y1="${((i / rows) * H).toFixed(1)}" x2="${W}" y2="${((i / rows) * H).toFixed(1)}"/>`),
  ].join('');

  const area = `${d} L${pts[n - 1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;
  const last = pts[n - 1], before = pts[n - 4];
  const angle = Math.atan2(last.y - before.y, last.x - before.x) * 180 / Math.PI;

  return `<div class="hero-chart" aria-hidden="true">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="hcFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".16"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hcStroke" x1="0" x2="1" y1="1" y2="0">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>
          <stop offset="100%" stop-color="var(--accent)"/>
        </linearGradient>
      </defs>
      <g class="hc-grid">${grid}</g>
      <path class="hc-area" d="${area}" fill="url(#hcFill)"/>
      <path class="hc-line" d="${d}" fill="none" stroke="url(#hcStroke)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
      <g class="hc-tip" transform="translate(${last.x.toFixed(1)},${last.y.toFixed(1)})">
        <circle class="hc-halo" r="17" fill="var(--accent)" opacity=".16"/>
        <circle r="7" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"/>
        <g transform="rotate(${angle.toFixed(1)})">
          <path class="hc-arrow" d="M14 0 L52 0 M39 -12 L52 0 L39 12" fill="none"
            stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </svg>
  </div>`;
}

/* Nova Review (LOT H, Étape 3, 2026-09-24) : plus une page de présentation
   ("bientôt disponible") mais une vraie revue, construite uniquement à
   partir de données réelles déjà en base — state.transactions (chaque
   vente réelle, voir sellStock()/enregistrerTransaction()) et la thèse
   Nova Memory éventuellement renseignée à l'achat (openBuyReview,
   "Pourquoi cet achat ?", §27). Esprit "chess.com" du cahier des charges :
   séparer la QUALITÉ DU PROCESSUS (a-t-on tenu l'horizon qu'on s'était
   soi-même fixé ?) du RÉSULTAT (gain/perte réalisé) — jamais un jugement
   "bonne/mauvaise décision" inventé, seulement des faits comparés à ce que
   l'utilisateur avait lui-même déclaré. Aucune vente -> état honnête,
   jamais un faux contenu de démonstration. */
const HORIZON_JOURS = { court:90, moyen:365, long:Infinity };
const HORIZON_LABEL = { court:'court terme', moyen:'moyen terme', long:'long terme' };
/* Dernière thèse d'ACHAT renseignée pour ce titre, AVANT cette vente —
   même logique que derniereThese() (scripts/test-nova-memory.js), bornée
   dans le temps pour ne jamais faire remonter la thèse d'un rachat
   POSTÉRIEUR à la vente en cours de revue. */
function theseAvantVente(stockId, dateVente){
  const avant = state.transactions
    .filter(t => t.type === 'buy' && t.stockId === stockId && t.thesisReason
      && new Date(t.date) < new Date(dateVente))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  return avant[0] || null;
}
/* CORRECTIF (2026-09-26, moteur de verdict Nova Review) : même principe
   que theseAvantVente() mais SANS exiger de thèse renseignée — sert à
   retrouver l'achat réel qui a constitué la position (pour en évaluer la
   concentration au moment de la décision), qu'une thèse ait été
   renseignée ou non. theseAvantVente() reste utilisée séparément pour le
   récit ("qu'aviez-vous déclaré ?") ; ce n'est PAS la même question que
   "quel achat concret a créé cette position ?" — les confondre aurait
   rendu la concentration invisible pour toute vente sans thèse
   enregistrée, alors qu'elle reste mesurable indépendamment. */
function dernierAchatAvant(stockId, date){
  const avant = state.transactions
    .filter(t => t.type === 'buy' && t.stockId === stockId && new Date(t.date) < new Date(date))
    .sort((a, b) => new Date(b.date) - new Date(a.date));
  return avant[0] || null;
}
/* Seuils "court/moyen/long terme" (en jours) : une convention NovaTitre
   propre, jamais un fait de marché établi — sert uniquement à comparer la
   durée de détention réelle à l'horizon que l'UTILISATEUR LUI-MÊME avait
   choisi à l'achat (chips court/moyen/long d'openBuyReview), jamais
   affichée comme une vérité universelle de gestion de portefeuille. */
function compareHorizon(joursDetention, horizonKey){
  const seuil = HORIZON_JOURS[horizonKey];
  const label = HORIZON_LABEL[horizonKey];
  if (!Number.isFinite(seuil) && horizonKey !== 'long') return null;
  const j = Math.max(0, Math.round(joursDetention));
  if (horizonKey === 'long'){
    return j >= 365 ? { aligne:true, texte:`Conservé ${j} j — cohérent avec l'horizon « ${label} » annoncé.` }
                     : { aligne:false, texte:`Vendu après ${j} j — plus tôt que l'horizon « ${label} » annoncé.` };
  }
  return j <= seuil ? { aligne:true, texte:`Conservé ${j} j — cohérent avec l'horizon « ${label} » annoncé.` }
                     : { aligne:false, texte:`Conservé ${j} j — au-delà de l'horizon « ${label} » annoncé.` };
}

/* ============================================================
   MOTEUR DE VERDICT — Nova Review (2026-09-26, retour utilisateur :
   esprit "chess.com", séparer la qualité de la décision du résultat)
   ------------------------------------------------------------
   Chaque verdict ci-dessous est une étiquette parmi 6 (demandées
   explicitement : Excellent coup/Bon coup/Intéressant/Risqué/Erreur à
   étudier/Occasion manquée), choisie par un ARBRE DE DÉCISION
   DÉTERMINISTE sur des grandeurs RÉELLEMENT CALCULÉES — jamais une
   opinion de modèle de langage, aucun appel réseau ici, mêmes
   garanties que _novascore.js (moteur NovaTitre propre, barèmes
   documentés, reproductible). Les 3 seuils ci-dessous sont une
   convention NovaTitre assumée, pas un fait de marché établi — jamais
   présentés comme plus rigoureux qu'ils ne le sont. */
const VERDICT_CONCENTRATION_RISQUEE = .35; // part du CAPITAL INVESTI (coût, jamais une valeur de marché historique qu'on ne connaît pas)
const VERDICT_GAIN_EXCELLENT = .10;
const VERDICT_REGRET_MANQUE = .15;

/* Part (en coût, jamais en valeur de marché — l'historique de prix
   n'est pas conservé à chaque instant passé) que cet achat représentait
   dans le capital total déjà engagé au moment où il a eu lieu.
   Reconstruit en rejouant le journal RÉEL jusqu'à (sans l'inclure)
   cette transaction — réutilise rejouerTransactions(), déjà écrit pour
   la fusion du portefeuille (LOT D) et vérifié par ses propres tests.
   Renvoie null si le coût total (avant + cet achat) est nul (jamais une
   division par zéro déguisée en 0 %). */
function concentrationAuMomentDe(txAchat){
  if (!txAchat) return null;
  const avant = state.transactions.filter(t => new Date(t.date) < new Date(txAchat.date));
  const rejoue = rejouerTransactions(avant);
  const coutAvant = rejoue.positions.reduce((s, p) => s + toEUR(p.avg * p.qty, byId[p.id]?.cur || 'EUR'), 0);
  const total = coutAvant + txAchat.amountEUR;
  return total > 0 ? txAchat.amountEUR / total : null;
}

/* Verdict d'une VENTE réelle — décision fermée, résultat définitivement
   connu. */
function evaluerVente(tx){
  const cout = Number.isFinite(tx.realizedGain) ? tx.amountEUR - tx.realizedGain : null;
  const gainPct = (cout !== null && cout > 0) ? tx.realizedGain / cout : null;
  const q = queSiRienFait(tx);
  const regretPct = q && q.differencePct !== null ? q.differencePct / 100 : null;
  const theseAchat = theseAvantVente(tx.stockId, tx.date);
  let processAligne = null;
  if (theseAchat && theseAchat.thesisHorizon){
    const jours = (new Date(tx.date) - new Date(theseAchat.date)) / 86400000;
    const cmp = compareHorizon(jours, theseAchat.thesisHorizon);
    processAligne = cmp ? cmp.aligne : null;
  }
  const concentration = concentrationAuMomentDe(dernierAchatAvant(tx.stockId, tx.date));

  const raisons = [];
  if (gainPct !== null) raisons.push(`${gainPct >= 0 ? 'Gain' : 'Perte'} réalisé${gainPct >= 0 ? '' : 'e'} de ${fmt.pctRatio(Math.abs(gainPct), 1)}.`);
  if (regretPct !== null && Math.abs(regretPct) >= .03){
    raisons.push(regretPct >= 0
      ? `Conserver aurait rapporté ${fmt.pct(regretPct * 100, 1)} de plus à ce jour.`
      : `Vendre a évité ${fmt.pctRatio(Math.abs(regretPct), 1)} de baisse supplémentaire (valeur actuelle plus basse que le montant récupéré).`);
  }
  /* HORIZON_LABEL non ré-échappé ici (même correctif que `lecon`
     ci-dessous) : raisons[] est échappé UNE SEULE FOIS, au rendu, dans
     carteDecisionNovaReview() ("<li>${esc(r)}</li>"). */
  if (processAligne === true) raisons.push(`Horizon « ${HORIZON_LABEL[theseAchat.thesisHorizon]} » annoncé à l'achat respecté.`);
  if (processAligne === false) raisons.push(`Vendu en dehors de l'horizon « ${HORIZON_LABEL[theseAchat.thesisHorizon]} » annoncé à l'achat.`);
  if (!theseAchat) raisons.push(`Aucune thèse enregistrée pour l'achat correspondant.`);
  if (concentration !== null && concentration >= VERDICT_CONCENTRATION_RISQUEE){
    raisons.push(`Cet achat représentait ${fmt.pctRatio(concentration, 0)} du capital investi à l'époque — position concentrée.`);
  }

  let verdict;
  if (regretPct !== null && regretPct >= VERDICT_REGRET_MANQUE) verdict = 'Occasion manquée';
  else if (gainPct === null) verdict = 'Intéressant';
  else if (gainPct >= VERDICT_GAIN_EXCELLENT && processAligne !== false) verdict = 'Excellent coup';
  else if (gainPct >= 0 && processAligne !== false) verdict = 'Bon coup';
  else if (gainPct >= 0 && processAligne === false) verdict = 'Intéressant';
  else if (gainPct < 0 && concentration !== null && concentration >= VERDICT_CONCENTRATION_RISQUEE) verdict = 'Risqué';
  else verdict = 'Erreur à étudier';

  return { verdict, raisons, gainPct, regretPct, processAligne, concentration };
}

/* Verdict d'une position OUVERTE (achat non encore soldé) — résultat
   PAS encore connu, seulement une lecture provisoire au cours actuel.
   Jamais "Occasion manquée" (n'a de sens que pour un titre qu'on ne
   détient plus, voir queSiRienFait) ni un jugement définitif — la
   position reste ouverte, le verdict peut changer demain. */
function evaluerPositionOuverte(pos){
  const st = byId[pos.id];
  const prix = st ? prixDe(st) : null;
  if (!st || prix === null) return null;
  const gainPct = (prix - pos.avg) / pos.avg;
  const theseAchat = theseAvantVente(pos.id, new Date().toISOString());
  const concentration = concentrationAuMomentDe(dernierAchatAvant(pos.id, new Date().toISOString()));

  const raisons = [`Position ouverte : ${gainPct >= 0 ? 'gain' : 'perte'} latent${gainPct >= 0 ? '' : 'e'} de ${fmt.pctRatio(Math.abs(gainPct), 1)}, pas encore un résultat définitif.`];
  if (theseAchat?.thesisReason) raisons.push(`Thèse déclarée à l'achat toujours en cours.`);
  else raisons.push(`Aucune thèse enregistrée pour cet achat.`);
  if (concentration !== null && concentration >= VERDICT_CONCENTRATION_RISQUEE){
    raisons.push(`Représente ${fmt.pctRatio(concentration, 0)} du capital investi à l'achat — position concentrée.`);
  }

  let verdict;
  if (concentration !== null && concentration >= VERDICT_CONCENTRATION_RISQUEE) verdict = 'Risqué';
  else if (gainPct >= VERDICT_GAIN_EXCELLENT) verdict = 'Excellent coup';
  else if (gainPct >= 0) verdict = 'Bon coup';
  else if (gainPct >= -.10) verdict = 'Intéressant';
  else verdict = 'Erreur à étudier';

  return { verdict, raisons, gainPct, regretPct:null, processAligne:null, concentration, ouverte:true };
}

const VERDICT_STYLE = {
  'Excellent coup':   { accent:'#16a34a', rgb:'22,163,74'  },
  'Bon coup':         { accent:'#45D69A', rgb:'69,214,154' },
  'Intéressant':      { accent:'#8d95a4', rgb:'141,149,164' },
  'Risqué':           { accent:'#f59e0b', rgb:'245,158,11' },
  'Erreur à étudier': { accent:'#FF647C', rgb:'255,100,124' },
  'Occasion manquée': { accent:'#8b5cf6', rgb:'139,92,246' },
};

/* Bilan hebdomadaire (retour utilisateur : "performance, meilleure
   décision, décision la plus risquée, diversification, leçon de la
   semaine") — uniquement des faits déjà calculés ailleurs dans ce
   fichier (walletHistory pour la performance réelle, portfolioValue()
   pour la diversification), jamais une statistique recalculée en
   double avec une formule différente qui pourrait diverger. null si
   aucune transaction dans les 7 derniers jours — jamais un bilan vide
   présenté comme une fonctionnalité active. */
function bilanHebdomadaireNovaReview(){
  const depuis = Date.now() - 7 * 86400000;
  const ventes = state.transactions.filter(t => t.type === 'sell' && new Date(t.date).getTime() >= depuis);
  const achats = state.transactions.filter(t => t.type === 'buy' && new Date(t.date).getTime() >= depuis);
  if (!ventes.length && !achats.length) return null;

  const evals = ventes.map(tx => ({ tx, ev: evaluerVente(tx) }));

  const meilleure = evals.filter(e => e.ev.gainPct !== null).sort((a, b) => b.ev.gainPct - a.ev.gainPct)[0] || null;
  const plusRisquee = evals.filter(e => e.ev.concentration !== null).sort((a, b) => b.ev.concentration - a.ev.concentration)[0] || null;
  const aEtudier = evals.filter(e => e.ev.verdict === 'Erreur à étudier' || e.ev.verdict === 'Occasion manquée')
    .sort((a, b) => new Date(b.tx.date) - new Date(a.tx.date))[0] || null;

  const pointsRecents = state.walletHistory.filter(p => p.t >= depuis);
  let performance = null;
  if (pointsRecents.length >= 2){
    const premier = pointsRecents[0], dernier = pointsRecents[pointsRecents.length - 1];
    if (premier.totalValue > 0){
      performance = { variation: dernier.totalValue - premier.totalValue,
        variationPct: (dernier.totalValue / premier.totalValue - 1) * 100 };
    }
  }

  const pf = portfolioValue();
  const bySector = {};
  for (const l of pf.lines){ if (l.priceAvailable && l.value > 0){ const sect = l.stock?.sector || 'Non classé'; bySector[sect] = (bySector[sect] || 0) + l.value; } }
  const secteursDistincts = Object.keys(bySector).length;
  const maxPositionPct = pf.value ? Math.round(Math.max(0, ...pf.lines.filter(l => l.priceAvailable).map(l => l.value)) / pf.value * 100) : 0;

  /* CORRECTIF (2026-09-28, retour utilisateur : "&" s'affiche "&amp;") :
     `lecon` reste du TEXTE BRUT ici, jamais pré-échappé — esc() n'est
     appliqué QU'UNE SEULE FOIS, au moment du rendu (voir
     `${esc(bilan.lecon)}` dans PAGES.novareview). Avant ce correctif,
     esc(aEtudier.tx.name) était déjà appliqué ICI, puis bilan.lecon
     (contenant donc déjà "&amp;" pour une société comme "AT&T") était
     échappé UNE SECONDE FOIS au rendu — "&" devenait "&amp;" puis
     "&amp;amp;", que le navigateur affiche littéralement "&amp;"
     (un seul niveau de déséchappement HTML). Même règle que partout
     ailleurs dans ce fichier : esc() uniquement à la frontière finale
     HTML, jamais sur une valeur intermédiaire réutilisée ensuite. */
  let lecon = null;
  if (aEtudier){
    lecon = aEtudier.ev.verdict === 'Occasion manquée'
      ? `Sur ${aEtudier.tx.name}, conserver aurait rapporté plus — vérifiez si l'horizon annoncé à l'achat était vraiment respecté avant de vendre.`
      : `Sur ${aEtudier.tx.name}, revoyez ${aEtudier.ev.processAligne === false ? "l'écart entre l'horizon annoncé et la durée réelle de détention" : "la thèse (ou son absence) au moment de l'achat"}.`;
  } else if (maxPositionPct >= Math.round(VERDICT_CONCENTRATION_RISQUEE * 100)){
    lecon = `Une position représente ${maxPositionPct} % de votre portefeuille actuel — envisagez de diversifier davantage.`;
  }

  return { ventes, achats, meilleure, plusRisquee, performance, secteursDistincts, maxPositionPct, lecon };
}

/* Commentaire IA du bilan (2026-09-26, retour utilisateur : "je veux
   vraiment que ce soit complet et que ce soit réalisé avec l'IA") —
   réutilise EXACTEMENT le même mécanisme que Nova AI sur une fiche
   action (authFetch('/api/analyze'), même quota, même identité "Nova
   AI" unique côté utilisateur) : un NOUVEAU mode ('novareview') plutôt
   qu'un appel par décision (20 décisions = 20 appels aurait épuisé le
   quota d'analyses pour rien) — UN seul appel commente TOUT le bilan de
   la semaine. Le verdict de chaque décision reste calculé par le moteur
   déterministe ci-dessus (evaluerVente/evaluerPositionOuverte) : le
   modèle ne fait QUE commenter ces verdicts déjà tranchés, jamais en
   produire lui-même (verrou identique côté serveur). État module-level,
   jamais persisté : un commentaire se régénère à chaque bilan différent. */
let NOVA_REVIEW_IA = { status:'idle', commentaire:null };
function construireBilanPourIA(bilan){
  const decisions = [];
  for (const tx of bilan.ventes){
    const ev = evaluerVente(tx);
    decisions.push({ nom: tx.name, type:'vente', verdict: ev.verdict,
      gainPct: ev.gainPct !== null ? Math.round(ev.gainPct * 1000) / 10 : null,
      regretPct: ev.regretPct !== null ? Math.round(ev.regretPct * 1000) / 10 : null,
      concentrationPct: ev.concentration !== null ? Math.round(ev.concentration * 1000) / 10 : null,
      raisons: ev.raisons });
  }
  for (const tx of bilan.achats){
    const pos = state.wallet.positions.find(p => p.id === tx.stockId);
    if (!pos) continue;   // déjà revendue : sa vente (si dans la fenêtre) est déjà comptée ci-dessus, jamais compter deux fois la même position
    const ev = evaluerPositionOuverte(pos);
    if (!ev) continue;
    decisions.push({ nom: tx.name, type:'position_ouverte', verdict: ev.verdict,
      gainPct: ev.gainPct !== null ? Math.round(ev.gainPct * 1000) / 10 : null,
      regretPct: null, concentrationPct: ev.concentration !== null ? Math.round(ev.concentration * 1000) / 10 : null,
      raisons: ev.raisons });
  }
  return { decisions,
    performanceVariationPct: bilan.performance ? Math.round(bilan.performance.variationPct * 10) / 10 : null,
    secteursDistincts: bilan.secteursDistincts,
    maxPositionPct: bilan.maxPositionPct };
}

    }[key] || "Le commentaire IA n'a pas abouti.";

/* `silencieux` (2026-09-25, retour utilisateur : "possibilité d'avoir les
   news en temps réel") : un rafraîchissement en arrière-plan (voir
   NOVA_NEWS_REFRESH_MS plus bas) ne doit JAMAIS faire clignoter l'écran

   qu'une vraie réponse plus récente arrive ; un échec silencieux
   réessaiera simplement au prochain cycle. Seul le premier chargement
   (silencieux:false, déclenché par go(), voir plus bas) affiche l'état
   "Chargement…"/l'erreur explicite. */
async function chargerNovaNewsMonde({ silencieux = false } = {}){
  if (!silencieux && (WORLD_NEWS.status === 'loaded' || WORLD_NEWS.status === 'loading')) return;
  if (!silencieux){ WORLD_NEWS = { ...WORLD_NEWS, status: 'loading' }; render(); }
  try {
    const r = await fetch('/api/market/extra?kind=worldnews');
    if (!r.ok){ if (!silencieux) WORLD_NEWS = { ...WORLD_NEWS, status: 'error' }; return; }
    const d = await r.json();
    if (Array.isArray(d.items) && d.items.length){
      WORLD_NEWS = {
        status: 'loaded',
        items: d.items,
        sourcesUtilisees: Array.isArray(d.sourcesUtilisees) ? d.sourcesUtilisees : [],
        asOf: d.asOf || null,
      };
    } else if (!silencieux){
      WORLD_NEWS = { ...WORLD_NEWS, status: 'error' };
    }
  } catch (e){
    if (!silencieux) WORLD_NEWS = { ...WORLD_NEWS, status: 'error' };
  }
  render();
}

   solliciter les flux RSS sources plus souvent que le cache serveur ne

function filterRow(label, key, options){
  const cur = String(state.filters[key]);
  return `<div style="margin-top:14px">
    <p class="tiny" style="margin-bottom:8px;font-weight:600;color:var(--ink-3)">${esc(label)}</p>

        aria-pressed="${cur===String(v)}">${esc(l)}</button>`).join('')}</div>
  </div>`;
}
function parseNaturalQuery(q){
  const t = q.toLowerCase(), f = { radarMin:0, radarCountry:'tous', radarSector:'tous' };
  const applied = [];
  /* "Risque" retiré (audit "screener sans effet", 2026-09-17) : aucune
     métrique de risque n'est réellement calculée nulle part dans NovaTitre
     à ce jour (s.volRisk n'est jamais assigné) — le filtre correspondant a
     été retiré de l'UI pour la même raison. Ne pas en réintroduire un ici
     sans construire d'abord le calcul réel derrière. */
  if (/solide|s[ûu]r|qualit[ée]|rentable/.test(t)){ f.radarMin=70; applied.push('Nova Score de 70 et plus'); }
  if (/croissance|qui grandit|en forte hausse/.test(t)){ f.radarMin=Math.max(f.radarMin,60); applied.push('croissance recherchée'); }
  if (/am[ée]ricain|[ée]tats-unis|usa/.test(t)){ f.radarCountry='États-Unis'; applied.push('États-Unis'); }
  if (/fran[çc]ais|france/.test(t)){ f.radarCountry='France'; applied.push('France'); }
  if (/allemand|allemagne/.test(t)){ f.radarCountry='Allemagne'; applied.push('Allemagne'); }
  SECTORS.forEach(sec => { if (t.includes(sec.toLowerCase().slice(0,6))){ f.radarSector=sec; applied.push(sec.toLowerCase()); } });
  if (/grosse|grande|g[ée]ant|large/.test(t)) applied.push('grande capitalisation');
  return { filters:f, applied, big:/grosse|grande|g[ée]ant|large/.test(t) };
}
function radarResults(){
  const f = state.filters;
  let list = [...stocks];
  if (f.radarCountry !== 'tous') list = list.filter(s => paysAffiche(s.country) === f.radarCountry);
  if (f.radarSector !== 'tous')  list = list.filter(s => s.sector === f.radarSector);
  if (f.radarQ){ const q = f.radarQ.toLowerCase();
    list = list.filter(s => (s.name + ' ' + s.ticker + ' ' + s.sector).toLowerCase().includes(q)); }
  /* CORRECTIF (audit "screener sans effet", 2026-09-17) : ce filtre existait
     dans state.filters et dans le sélecteur ci-dessus mais n'était encore
     appliqué nulle part ici — activer "60+" ne changeait donc jamais la
     liste. Ne porte QUE sur les valeurs ayant un score RÉELLEMENT calculé
     (Number.isFinite) : jamais un score à 0/deviné pour une valeur jamais
     analysée, qui serait simplement exclue plutôt que faussement notée. */
  if (f.radarMin > 0) list = list.filter(s => Number.isFinite(s.score) && s.score >= f.radarMin);

  /* CORRECTIF (audit "tri Radar", 2026-09-17) : radarSort existait dans
     state.filters (valeur par défaut 'score') depuis le début, sans aucun
     contrôle UI ni lecture ici — le tri était TOUJOURS par variation du
     jour, quelle que soit sa valeur. Ajout d'un vrai sélecteur (voir
     filterRow ci-dessous dans PAGES.radar) + application réelle ici. */
  const varDe = s => { const q = QUOTES.get(s.id);
    return q && Number.isFinite(q.changePercent) ? q.changePercent : null; };
  const sortKey = f.radarSort || 'perf';
  list.sort((a, b) => {
    if (sortKey === 'score') {
      const sa = Number.isFinite(a.score) ? a.score : null, sb = Number.isFinite(b.score) ? b.score : null;
      if (sa === null && sb === null) return a.name.localeCompare(b.name, 'fr');
      if (sa === null) return 1;
      if (sb === null) return -1;
      return sb - sa;
    }
    if (sortKey === 'name') return a.name.localeCompare(b.name, 'fr');
    const va = varDe(a), vb = varDe(b);
    if (va === null && vb === null) return a.name.localeCompare(b.name, 'fr');
    if (va === null) return 1;
    if (vb === null) return -1;
    return vb - va;
  });

  if (!list.length) return `<div class="card">${emptyState('Aucune entreprise ne correspond',
    'Élargissez un critère : le Radar n’ajoute jamais de résultat approchant.')}</div>`;

  return `
    <p class="small" style="margin-bottom:12px">${list.length} résultat${list.length>1?'s':''}</p>
    <div class="card"><div class="rows rows-grid">
      ${list.slice(0, 40).map(s => stockRow(s)).join('')}
    </div></div>`;
}

/* ---------- MARCHÉS ----------
   Fusionnée avec Explorer le 2026-09-23 (voir NAV plus bas) : Explorer
   affichait en permanence un "mur" de puces secteur/pays au-dessus d'un

/* Types du catalogue mondial réellement utiles à une catégorie Marchés

   actifs, voir plus haut), 'tous' réclame donc les deux types couverts.
   Secteur/pays n'ont de sens que pour les actions (voir plus bas) : pas
   besoin d'étendre cette liste pour eux, un secteur/pays sélectionné sur
   une autre catégorie donne simplement 0 résultat (aucune société ETF/
   forex/crypto n'a de secteur ou de pays renseigné — comportement logique,
   pas un bug). */
function typesCatalogueUtiles(cat){
  if (cat === 'stock') return ['stock'];
  if (cat === 'etf') return ['etf'];
  if (cat === 'tous') return ['stock', 'etf'];
  return [];
}
let marketsCatalogGen = 0;
async function garantirCatalogueMarkets(){
  const gen = ++marketsCatalogGen;
  const cat = state.filters.marketsCategory || 'tous';
  const minimum = Math.max(20, state.filters.marketsVisibles || 20);
  const resultats = await Promise.all(
    typesCatalogueUtiles(cat).map(type => assurerCatalogueSuffisant(type, minimum))
  );
  const changement = resultats.some(Boolean);
  if (changement && gen === marketsCatalogGen && route.page === 'markets'){
    const out = document.getElementById('marketsOut');
    if (out) out.innerHTML = marketsRows();

   commentaire). Recalculée à chaque ouverture du panneau plutôt que mise
   en cache : le catalogue mondial grandit au fil du chargement. */
function marketsPaysDisponibles(){
  return [...new Set(stocks.filter(s=>s.type==='stock').map(x=>paysAffiche(x.country)))]
    .filter(Boolean).sort((a,b)=>a.localeCompare(b,'fr'));
}
/* Valeurs "connues" (2026-09-29, retour utilisateur explicite : "je
   voudrais que les actions qu'on puisse voir en premier soit les plus
   connues"). Un premier essai de tri par PLACE prioritaire (NASDAQ, NYSE,
   Euronext...) a été testé en direct contre l'API réelle et écarté : il

   que les trous de couverture sont dispersés société par société, pas
   liés à la place elle-même. Liste ci-dessous testée différemment :
   chaque ticker+place vérifié un à un dans le catalogue (aucune
   substitution devinée), PUIS testé en direct contre /api/market/quotes
   (21 échantillon testés, 21/21 avec un prix réel) — les grandes
   capitalisations mondialement reconnues sont quasiment toujours
   couvertes, contrairement aux petites capitalisations obscures qui
   dominaient le tri alphabétique précédent. Ce n'est PAS une mesure de
   popularité réelle (aucune donnée d'usage/volume de consultation
   n'existe dans ce catalogue) : une sélection éditoriale honnête,
   utilisée UNIQUEMENT pour l'ordre d'affichage — chaque société affiche

   du catalogue. Tri alphabétique conservé pour tout le reste. */
const MARKETS_VALEURS_CONNUES = [

/* Accepte un jeu de filtres optionnel (le brouillon du panneau, voir
   marketsFilterDraft) pour calculer un compte de résultats "en direct"
   SANS toucher state.filters ni re-rendre la page derrière le panneau —
   state.filters par défaut pour tous les appels existants (liste
   affichée, pagination, rafraîchissement vivant). */
/* CORRECTIF PERF (2026-09-29, mesuré en direct) : render() appelle
   marketsListeFiltree() (via marketsListeFiltree()) TROIS FOIS pour un
   seul rendu de la page Marchés — une fois dans marketsRows() (affichage),
   une fois via listesParRoute.markets (cotations à combler) et une fois
   via liveParRoute.markets (rafraîchissement vivant), toutes les trois
   avec EXACTEMENT les mêmes filtres. Confirmé par compteur d'appels en
   direct : 3 appels par navigation vers Marchés, donc 3× le coût du tri
   (déjà optimisé, voir plus bas) pour un résultat strictement identique
   à chaque fois. Mémoïsé ici par valeur de filtres (jamais par identité
   d'objet, `state.filters` pouvant être muté sans être remplacé) — clé
   incluant `stocks.length` pour invalider automatiquement si le
   catalogue s'enrichit en cours de session (recherche/catalogue runtime),
   jamais un résultat obsolète. Uniquement pour l'appel SANS argument
   explicite (les filtres RÉELLEMENT actifs) : un appel avec un brouillon
   de filtres (panneau Filtres, aperçu "en direct") n'est jamais mis en
   cache, car chaque frappe y change potentiellement le résultat. */
let _marketsListeCache = null;
function marketsListeFiltree(f){
  const utiliseFiltresCourants = !f;
  f = f || state.filters;
  const cat = f.marketsCategory || 'tous';
  const region = f.marketsRegion || 'Monde';
  const sector = f.marketsSector || 'tous';
  const country = f.marketsCountry || 'tous';
  if (utiliseFiltresCourants){
    const cle = `${cat}|${region}|${sector}|${country}|${stocks.length}`;
    if (_marketsListeCache && _marketsListeCache.cle === cle) return _marketsListeCache.resultat;
  }
  let list = cat === 'tous' ? [...stocks] : stocks.filter(s => s.type === cat);
  if (region !== 'Monde') list = list.filter(s => REGION_OF_COUNTRY[s.country] === region);
  if (sector !== 'tous') list = list.filter(s => s.sector === sector);
  if (country !== 'tous') list = list.filter(s => paysAffiche(s.country) === country);
  /* CORRECTIF PERF (2026-09-29, mesuré en direct) : recalculer
     `${ticker}@${exchangeCode}` + interroger MARKETS_RANG_CONNU À
     CHAQUE COMPARAISON coûtait 739ms sur les ~46 000 valeurs du
     catalogue (comparateur appelé O(n log n) fois, soit ~1,4 M
     concaténations de chaînes) — un vrai temps de blocage synchrone à
     chaque ouverture de Marchés, ironiquement introduit par le
     correctif de tri précédent. Rang précalculé UNE FOIS par élément
     (transformation de Schwartz) avant le tri : 177ms mesuré, retombe
     quasiment au coût du tri alphabétique d'origine (134ms). */
  const decore = list.map(s => ({
    s,
    rang: MARKETS_RANG_CONNU.get(`${s.ticker}@${s.exchangeCode}`) ?? Infinity,
  }));
  decore.sort((a,b) => a.rang !== b.rang ? a.rang - b.rang : a.s.name.localeCompare(b.s.name,'fr'));
  const resultat = decore.map(d => d.s);
  if (utiliseFiltresCourants){
    _marketsListeCache = { cle: `${cat}|${region}|${sector}|${country}|${stocks.length}`, resultat };
  }
  return resultat;
}
/* Exactement les instruments actuellement révélés à l'écran (après

  const visibles = state.filters.marketsVisibles || 20;

  return page.map((s,i)=>stockRow(s, {spark:true, logo: i < CHARGEMENT_MASSE_MAX_SYMBOLES})).join('') + (list.length > page.length

   dans les pays") — ne filtre QUE les puces affichées dans le panneau,
   jamais la liste de résultats elle-même (aucun pays n'est sélectionné
   tant qu'on n'a pas cliqué une puce). Écouteur direct sur l'input
   (même schéma que la recherche globale, #sq) plutôt que la délégation
   de clic générique : ré-attaché à chaque re-rendu de #mfBody. */
function wireMarketsPaysSearch(){
  const input = document.getElementById('mfPaysQ');
  if (!input) return;
  input.addEventListener('input', () => {
    marketsFilterDraft._paysQ = input.value;
    const paysQ = input.value.toLowerCase();
    const paysTous = marketsPaysDisponibles();
    const paysVisibles = paysQ ? paysTous.filter(p => p.toLowerCase().includes(paysQ)) : paysTous;
    document.getElementById('mfPaysChips').innerHTML = `
      <button class="chip" data-mf="marketsCountry" data-mf-val="tous"
        aria-pressed="${marketsFilterDraft.marketsCountry==='tous'}">Tous les pays</button>
      ${paysVisibles.map(p=>`<button class="chip" data-mf="marketsCountry" data-mf-val="${esc(p)}"
        aria-pressed="${marketsFilterDraft.marketsCountry===p}">${esc(p)}</button>`).join('')}`;
  });
}

      <p class="small" style="margin-top:4px">${[s.ticker, s.market, s.sector].filter(Boolean).map(esc).join(' · ')}</p>
    </div>
    <div style="text-align:right">
      ${(() => {
        const q = QUOTES.get(s.id);
        if (!q || !Number.isFinite(q.price))
          return `<div class="price" style="color:var(--ink-4)">—</div>
            <div class="tiny" style="margin-top:6px">Cours indisponible pour cette place</div>`;
        const v = Number.isFinite(q.changePercent) ? q.changePercent : null;
        /* Indicateur honnête : n'apparaît qu'après un vrai cycle de
           rafraîchissement vivant sur CETTE fiche (state.ui.liveAt posé
           par liveTick), jamais une horloge qui tourne toute seule sans
           donnée réelle derrière. */
        /* Préfixe de fraîcheur (voir FRESHNESS_LABEL, constante partagée
           avec stockRow() plus haut) : évite que "Actualisé à HH:MM:SS" ne

           réalité différée (cas par défaut aujourd'hui, EODHD documentant

        const labelFraicheur = FRESHNESS_LABEL[q.freshness] || '';

        const labelSeance = MARKET_STATUS_LABEL[q.marketStatus] || '';

  ${(() => {

    if (!pos) return '';

      .find(t => t.type === 'buy' && t.stockId === s.id && t.thesisReason);

    return `<div class="notice" style="margin-top:14px;background:var(--bg-2);color:var(--ink-2)">

  const tabApercu = `

  ${(s.type === 'stock' && s.fundamentalsStatus === 'loaded' && s.companyIdentity?.description) ? `

  <section class="section">
