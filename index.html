function openBuyAmount(st, initial){
  const max = Math.floor(state.wallet.cash);
  const v = Math.min(initial || Math.min(100, max), max);
  openSheet(`<div class="buy">
    <p class="buy-co">${esc(st.name)} · ${fmt.cur(prixDe(st), st.cur)}</p>
    <h3 id="sheetTitle" class="sr">Acheter ${esc(st.name)}</h3>
    <div class="buy-big"><span id="buyBig">${fmt.int(v)}</span><small>€</small></div>
    <p class="buy-sub" id="buyShares">—</p>
    <input class="buy-range" id="buyAmt" type="range" min="10" max="${Math.max(10,max)}"
      step="10" value="${v}" aria-label="Montant à investir">
    <div class="buy-chips">
      ${[50,100,250,500].filter(a=>a<=max).map(a=>
        `<button class="chip" data-amount="${a}" data-stock="${esc(st.id)}">${a} €</button>`).join('')}
      <button class="chip" data-amount="${max}" data-stock="${esc(st.id)}">Max</button>
    </div>
    <p class="buy-cash">${fmt.eur(state.wallet.cash)} disponibles</p>
    <button class="btn btn-a btn-lg buy-cta" data-buy-next="${esc(st.id)}">Continuer</button>
  </div>`);
  const input = document.getElementById('buyAmt');
  const sync = () => setBuyAmount(st, +input.value, false);
  input.addEventListener('input', sync);
  sync();
}
function setBuyAmount(st, value, moveSlider = true){
  const input = document.getElementById('buyAmt');
  if (!input) return;
  const v = Math.max(0, Math.min(+input.max, value));
  if (moveSlider) input.value = v;
  document.getElementById('buyBig').textContent = fmt.int(v);
  const prix = prixDe(st);
  const qty = prix ? v / toEUR(prix, st.cur) : 0;
  document.getElementById('buyShares').textContent = prix ? `≈ ${fmt.num(qty, 4)} action(s)` : 'Cours indisponible';
  document.querySelectorAll('[data-amount]').forEach(b =>
    b.setAttribute('aria-pressed', String(+b.dataset.amount === v)));
}
function openBuyReview(st, amount){
  const prix = prixDe(st);
  if (prix === null){ toast('Cours indisponible : achat impossible.'); return; }
  const priceEUR = toEUR(prix, st.cur);
  const qty = amount / priceEUR;
  const fx = st.cur === 'EUR' ? null : FX[st.cur];
  openSheet(`<div class="buy">
    <p class="buy-co">${esc(st.name)}</p>
    <h3 id="sheetTitle" class="buy-title">Vérifiez votre ordre</h3>
    <dl class="buy-rows">
      <div><dt>Type d'ordre</dt><dd>Achat au marché</dd></div>
      <div><dt>Nombre d'actions</dt><dd>≈ ${fmt.num(qty, 4)}</dd></div>
      <div><dt>Cours</dt><dd>${fmt.cur(prix, st.cur)}</dd></div>
      ${fx ? `<div><dt>Taux de change</dt><dd>1 ${esc(st.cur)} = ${fx} €</dd></div>` : ''}
      <div><dt>Commission</dt><dd>Aucune</dd></div>
      <div class="buy-total"><dt>Total</dt><dd>${fmt.eur(amount)}</dd></div>
    </dl>
    <p class="buy-note">Portefeuille virtuel.</p>
    <!-- Nova Memory (§27 du PRD, ajouté 2026-09-17) : entièrement optionnel,
         jamais un champ requis pour confirmer — la friction irait à
         l'encontre du principe "rien n'est obligatoire à configurer". Ce
         qui est saisi ici est ce que Nova Review pourra un jour comparer
         au comportement réel, au lieu de juger uniquement le résultat. -->
    <details style="margin-top:14px">
      <summary class="small" style="cursor:pointer;color:var(--ink-3)">Pourquoi cet achat ? (optionnel)</summary>
      <textarea id="buyThesis" class="field" rows="2" maxlength="240" style="margin-top:10px;width:100%"
        placeholder="Ex. croissance solide, valorisation raisonnable après la baisse récente…"></textarea>
      <div class="chips" style="margin-top:10px">
        ${[['court','Court terme'],['moyen','Moyen terme'],['long','Long terme']].map(([v,l])=>`
          <button type="button" class="chip" data-thesis-horizon="${v}" aria-pressed="false">${l}</button>`).join('')}
      </div>
    </details>
    <button class="btn btn-a btn-lg buy-cta" data-buy-ok="${esc(st.id)}" data-value="${amount}">
      Confirmer l'achat</button>
    <button class="btn btn-g" style="width:100%;margin-top:10px"
      data-buy-back="${esc(st.id)}" data-value="${amount}">Modifier le montant</button>
  </div>`);
}

/* CORRECTIF (incohérence UX réelle, audit complet 2026-09-17) : "Vendre"
   liquidait la position ENTIÈRE instantanément au clic (voir le handler
   [data-sell] plus bas, avant ce correctif) — sans montant à choisir, sans
   récapitulatif, sans possibilité d'annuler — alors qu'"Acheter" passe
   par deux écrans réfléchis (montant puis vérification). Un simulateur
   reste un simulateur, mais l'asymétrie restait un vrai risque de clic
   accidentel. Ajoute l'écran de vérification manquant, symétrique à
   openBuyReview, avant tout appel réel à sellStock(). */
function openSellReview(st){
  const pos = positionOf(st.id);
  if (!pos){ toast('Aucune position sur cette valeur'); return; }
  const prix = prixDe(st);
  if (prix === null){ toast('Cours indisponible : vente impossible.'); return; }
  const proceeds = toEUR(prix * pos.qty, st.cur);
  const costBasis = toEUR(pos.avg * pos.qty, st.cur);
  const gain = proceeds - costBasis;
  openSheet(`<div class="buy">
    <p class="buy-co">${esc(st.name)}</p>
    <h3 id="sheetTitle" class="buy-title">Vérifiez votre vente</h3>
    <dl class="buy-rows">
      <div><dt>Type d'ordre</dt><dd>Vente au marché</dd></div>
      <div><dt>Nombre d'actions</dt><dd>${fmt.num(pos.qty, 4)} (position entière)</dd></div>
      <div><dt>Cours</dt><dd>${fmt.cur(prix, st.cur)}</dd></div>
      <div><dt>Gain/perte réalisé estimé</dt><dd class="${gain>=0?'up-t':'down-t'}">${gain>=0?'+':''}${fmt.eur(gain)}</dd></div>
      <div class="buy-total"><dt>Vous recevrez</dt><dd>${fmt.eur(proceeds)}</dd></div>
    </dl>
    <p class="buy-note">Portefeuille virtuel.</p>
    <button class="btn btn-a btn-lg buy-cta" data-sell-ok="${esc(st.id)}">Confirmer la vente</button>
    <button class="btn btn-g" style="width:100%;margin-top:10px" data-close>Annuler</button>
  </div>`);
}

/* ---------- événements ---------- */
document.addEventListener('click', e => {
  const q = sel => e.target.closest(sel);

  /* Curseur glissant des segmented controls (motion system, 2026-09-21) :
     capture la position de DÉPART avant que le clic ne déclenche le
     changement d'état + render() plus bas dans ce même handler (chaque
     data-chart-period/data-mode/etc. gère son propre state, celle-ci ne
     fait qu'enregistrer d'où partir — générique, aucune des 8 poignées
     de .seg n'a besoin d'être modifiée individuellement). */
  const segBtn = q('.seg button');
  if (segBtn){
    const seg = segBtn.closest('.seg');
    const key = seg?.dataset.seg;
    const avant = seg?.querySelector('button[aria-pressed="true"]');
    if (key && avant && avant !== segBtn){
      SEG_FROM.set(key, { left: avant.offsetLeft, width: avant.offsetWidth });
    }
  }

  const amt = q('[data-amount]');
  if (amt){ const st = byId[amt.dataset.stock];
    if (st) setBuyAmount(st, +amt.dataset.amount); return; }

  const next = q('[data-buy-next]');
  if (next){ const st = byId[next.dataset.buyNext];
    const v = +(document.getElementById('buyAmt')?.value || 0);
    if (!st) return;
    if (!(v > 0)) { toast('Choisissez un montant.'); return; }
    if (v > state.wallet.cash){ toast('Liquidités insuffisantes.'); return; }
    openBuyReview(st, v); return; }

  const backBtn = q('[data-buy-back]');
  if (backBtn){ const st = byId[backBtn.dataset.buyBack];
    if (st) openBuyAmount(st, +backBtn.dataset.value || 0); return; }

  const thesisHorizon = q('[data-thesis-horizon]');
  if (thesisHorizon){
    document.querySelectorAll('[data-thesis-horizon]').forEach(b =>
      b.setAttribute('aria-pressed', String(b === thesisHorizon && b.getAttribute('aria-pressed') !== 'true')));
    return;
  }

  const okBuy = q('[data-buy-ok]');
  if (okBuy){
    if (okBuy.disabled) return;
    okBuy.disabled = true;
    /* Nova Memory : lu ici, jamais avant confirmation (l'utilisateur peut
       changer d'avis sur le texte jusqu'au dernier moment). Chaîne vide/
       horizon non choisi -> undefined, jamais une valeur par défaut
       inventée dans le journal. */
    const texteThese = document.getElementById('buyThesis')?.value.trim() || null;
    const horizonBtn = document.querySelector('[data-thesis-horizon][aria-pressed="true"]');
    const these = (texteThese || horizonBtn) ? { reason: texteThese, horizon: horizonBtn?.dataset.thesisHorizon || null } : null;
    const r = buyStock(okBuy.dataset.buyOk, +okBuy.dataset.value, these);
    toast(r.msg);
    if (r.ok){ haptics.success(); closeSheet(); render(); } else { haptics.error(); okBuy.disabled = false; }
    return;
  }

  if (q('[data-signin]')){ signIn(); return; }
  if (q('[data-signin-apple]')){ signInApple(); return; }
  const gateOpen = q('[data-gate-email-open]'); if (gateOpen){ openGateEmail(gateOpen.dataset.gateEmailOpen); return; }
  if (q('[data-gate-email-close]')){ closeGateEmail(); return; }
  if (q('[data-gate-email-toggle]')){ toggleGateEmailMode(); return; }
  if (q('[data-gate-email-reset]')){ openGateEmailReset(); return; }
  if (q('[data-gate-email-submit]')){ submitGateEmail(); return; }
  if (q('[data-signout]')){ signOut(); toast('Vous êtes déconnecté'); return; }
  const lvl = q('[data-level]');
  if (lvl){
    state.onboarding.level = lvl.dataset.level;
    /* CORRECTIF : conservait auparavant seulement 'expert'/'debutant'
       (aplatissait 'intermediaire' -> 'debutant') — voir novaLevel()
       ci-dessus. ONB_LEVELS n'a que 3 ids valides (debutant/
       intermediaire/expert), portés tels quels désormais. */
    state.settings.mode = lvl.dataset.level;
    state.onboarding.introSlide = 0;
    state.onboarding.step = lvl.dataset.level === 'debutant' ? 1.5 : 2;
    saveState(); renderGate(); return;
  }
  if (q('[data-onb-intro-next]')){
    const i = state.onboarding.introSlide || 0;
    if (i < ONB_SLIDES.length - 1){ state.onboarding.introSlide = i + 1; saveState(); renderGate(); return; }
    state.onboarding.step = 2; saveState(); renderGate(); return;
  }
  if (q('[data-onb-intro-prev]')){
    state.onboarding.introSlide = Math.max(0, (state.onboarding.introSlide || 0) - 1);
    saveState(); renderGate(); return;
  }
  const gl = q('[data-goal]');
  if (gl){ state.onboarding.goal = gl.dataset.goal; state.onboarding.step = 3; saveState(); renderGate(); return; }

  const cap = q('[data-capital]');
  if (cap){ setCapital(+cap.dataset.capital); return; }
  const stepBtn = q('[data-onb-step]');
  if (stepBtn){
    const target = +stepBtn.dataset.onbStep;
    if (target === 6 && !(state.onboarding.interests||[]).length){
      toast('Choisissez au moins un secteur'); return;
    }
    state.onboarding.step = target; saveState(); renderGate(); return;
  }
  const inter = q('[data-interest]');
  if (inter){
    const id = inter.dataset.interest;
    const list = state.onboarding.interests || (state.onboarding.interests = []);
    const i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1);
    else if (list.length >= 3) return toast('Trois secteurs au maximum');
    else list.push(id);
    saveState(); renderGate(); return;
  }
  if (q('[data-onb-done]')){
    state.onboarding.done = true; saveState();
    authFetch('/api/me', { method:'POST', body: JSON.stringify({
      completed: true,
      level: state.onboarding.level, goal: state.onboarding.goal,
      interests: state.onboarding.interests || [],
      startCapital: state.onboarding.capital ?? null,
    })}).catch(() => {});
    const dest = { comprendre:'method', trouver:'radar', suivre:'watchlist', portefeuille:'portfolio' };
    renderApp();
    const target = dest[state.onboarding.goal];
    if (target && target !== 'home') go(target);
    toast('Tout est prêt. Bonne exploration.');
    return;
  }
  if (q('[data-guide]')){ state.onboarding.step = 6; saveState(); renderGate(); return; }
  if (q('[data-refaire-parcours]')){
    state.onboarding = { done:false, step:1, level:null, goal:null, interests:[], capital:state.onboarding.capital, introSlide:0 };
    saveState(); renderGate(); return;
  }

  const nav = q('[data-go]'); if (nav){ e.preventDefault(); go(nav.dataset.go, nav.dataset.arg); return; }
  if (q('[data-back]')){ back(); return; }
  /* data-soon (2026-09-23, passe "architecture visuelle Nova") : pour
     un point d'accès qui n'a délibérément AUCUNE page/moteur derrière à
     ce stade (Nova AI, "+ Ajouter des fonds"...) — un simple toast
     honnête plutôt qu'une navigation vers du contenu qui n'existe pas
     encore ou, pire, un faux résultat. */
  const soon = q('[data-soon]'); if (soon){ toast(soon.dataset.soon || 'Bientôt disponible.'); return; }
  if (q('[data-close]')){ closeSheet(); return; }
  const searchOrigin = q('[data-search]');
  if (searchOrigin){
    searchIntent = searchOrigin.dataset.searchIntent || null;
    openSearch(searchOrigin);
    return;
  }

  const st = q('[data-stock]'); if (st && !q('[data-star]')){ go('stock', st.dataset.stock); return; }

  const star = q('[data-star]');
  if (star){
    e.stopPropagation(); haptics.light(); toggleWatch(star.dataset.star);
    document.querySelectorAll(`[data-star="${CSS.escape(star.dataset.star)}"]`).forEach(b=>{
      const on = state.watchlist.includes(star.dataset.star);
      b.setAttribute('aria-pressed', String(on));
      b.querySelector('svg')?.setAttribute('fill', on ? 'currentColor' : 'none');
    });
    if (['watchlist','home'].includes(route.page)) render();
    return;
  }

  const setBtn = q('[data-set]');
  if (setBtn){
    const key = setBtn.dataset.set, val = setBtn.dataset.val;
    if (setBtn.dataset.soon){ toast('Cette langue arrive bientôt'); return; }
    state.settings[key] = val;
    saveState(); applySettings(); render(); return;
  }
  const swBtn = q('[data-toggle-set]');
  if (swBtn){
    const key = swBtn.dataset.toggleSet;
    const cur = state.settings[key] !== false && state.settings[key] !== undefined
      ? state.settings[key] : (['animations','sparklines','showCoverage'].includes(key));
    state.settings[key] = !cur;
    saveState(); applySettings();
    swBtn.setAttribute('aria-checked', String(state.settings[key]));
    return;
  }
  if (q('[data-novabot-toggle]')){
    state.novabot.enabled = !state.novabot.enabled;
    saveState();
    toast(state.novabot.enabled ? 'NovaBot activé — simulation uniquement' : 'NovaBot désactivé');
    render();
    return;
  }
  if (q('[data-novabot-run]')){
    if (!state.novabot.enabled){ toast('Activez NovaBot avant de lancer une évaluation.'); return; }
    if (!state.watchlist.length){ toast('Ajoutez des valeurs à votre watchlist.'); return; }
    toast('NovaBot évalue vos règles…');
    evaluerNovaBot();
    return;
  }
  if (q('[data-export]')){
    const data = JSON.stringify({ watchlist:state.watchlist, wallet:state.wallet,
      settings:state.settings }, null, 2);
    openSheet(`<h3 id="sheetTitle">Vos données</h3>
      <p>Tout ce que NovaTitre conserve dans ce navigateur. Rien n'est envoyé ailleurs.</p>
      <pre class="export">${esc(data)}</pre>`);
    return;
  }

  const th = q('[data-set-theme]');
  if (th){ state.settings.theme = th.dataset.setTheme; saveState(); applyTheme(); render(); return; }
  if (q('[data-theme-toggle]')){
    const order = ['light','dark','auto'];
    state.settings.theme = order[(order.indexOf(state.settings.theme) + 1) % 3];
    saveState(); applySettings(); paintNav();
    /* applySettings() ne repasse pas par render() (bascule volontairement
       légère, sans reconstruire toute la page) : le graphique professionnel,
       lui, dessine sur un canvas avec des couleurs déjà résolues au moment
       de sa création — il ne suivrait donc pas le changement de thème tout
       seul comme le fait le CSS. Remonté explicitement ici, sans passer par
       un render() complet. */
    mountChartPro();
    toast({ light:'Thème clair', dark:'Thème sombre', auto:'Thème système' }[state.settings.theme]);
    return;
  }

  const md = q('[data-mode]');
  if (md){ state.settings.mode = md.dataset.mode; saveState(); render(); return; }

  /* Sélecteur de période de la courbe Portefeuille — purement local
     (walletHistoryPourPeriode filtre l'historique déjà en mémoire), jamais
     de requête réseau : contrairement au graphique d'un titre, aucune
     donnée supplémentaire à charger à la demande ici. */
  const pfp = q('[data-pf-period]');
  if (pfp){ state.ui.pfPeriod = pfp.dataset.pfPeriod; saveState(); render(); return; }

  /* Sélecteur de période du graphique professionnel (fiche instrument).
     chargerGraphiquePeriode() ne relance une requête que si cette période
     n'est pas déjà en cache pour cet instrument — sinon render() seul
     suffit à l'afficher instantanément. */
  const cp = q('[data-chart-period]');
  if (cp){
    const period = cp.dataset.chartPeriod;
    state.ui.chartPeriod = period; saveState();
    const s2 = byId[route.arg];
    if (s2) chargerGraphiquePeriode(s2, period);
    render();
    return;
  }
  /* Onglets de la fiche action (2026-09-28, pivot NovaTitre) — même
     mécanique que data-chart-period ci-dessus (état UI global, persisté,
     jamais par titre précis, cohérent avec chartPeriod/chartMode déjà
     ainsi). */
  const st2 = q('[data-stock-tab]');
  if (st2){ state.ui.stockTab = st2.dataset.stockTab; saveState(); render(); return; }
  const cm = q('[data-chart-mode]');
  if (cm){ state.ui.chartMode = cm.dataset.chartMode; saveState(); render(); return; }

  const retryChart = q('[data-retry-chart]');
  if (retryChart){
    const s2 = byId[retryChart.dataset.retryChart];
    const period = CHART_PERIODS.some(p => p.api === state.ui.chartPeriod) ? state.ui.chartPeriod : '3m';
    if (s2) chargerGraphiquePeriode(s2, period);
    return;
  }

  const marketsPlus = q('[data-markets-plus]');
  if (marketsPlus){
    /* +20 seulement — jamais tout le reste d'un coup, même si l'utilisateur
       clique plusieurs fois de suite ("Voir plus" progressif, pas une
       bascule "tout charger"). render() relance PAGES.markets(), qui
       redéclenche garantirCatalogueMarkets() avec le nouveau seuil : si le
       catalogue local est insuffisant, une page catalogue supplémentaire
       est chargée automatiquement. */
    state.filters.marketsVisibles = (state.filters.marketsVisibles || 20) + 20;
    saveState();
    render();
    return;
  }

  /* Panneau Filtres de Marchés (fusion Explorer, 2026-09-23) — voir
     openMarketsFilters()/marketsFilterDraft plus haut. data-mf-* est
     volontairement distinct de [data-filter] (Radar) : ces puces
     modifient un BROUILLON, jamais state.filters directement. */
  if (q('[data-open-market-filters]')){ openMarketsFilters(); return; }
  const mf = q('[data-mf]');
  if (mf && marketsFilterDraft){
    marketsFilterDraft[mf.dataset.mf] = mf.dataset.mfVal;
    paintMarketsFilters();
    return;
  }
  if (q('[data-mf-reset]')){
    marketsFilterDraft = { ...MARKETS_FILTER_DEFAULTS, _paysQ:'' };
    paintMarketsFilters();
    return;
  }
  if (q('[data-mf-apply]') && marketsFilterDraft){
    state.filters.marketsCategory = marketsFilterDraft.marketsCategory;
    state.filters.marketsRegion = marketsFilterDraft.marketsRegion;
    state.filters.marketsSector = marketsFilterDraft.marketsSector;
    state.filters.marketsCountry = marketsFilterDraft.marketsCountry;
    state.filters.marketsVisibles = 20;
    saveState();
    closeSheet();
    marketsFilterDraft = null;
    if (route.page === 'markets') render();
    return;
  }
  const mfRemove = q('[data-mf-remove]');
  if (mfRemove){
    const key = mfRemove.dataset.mfRemove;
    state.filters[key] = MARKETS_FILTER_DEFAULTS[key];
    state.filters.marketsVisibles = 20;
    saveState();
    render();
    return;
  }

  const flt = q('[data-filter]');
  if (flt){
    state.filters[flt.dataset.filter] = isNaN(flt.dataset.val) ? flt.dataset.val : +flt.dataset.val;
    saveState();
    document.querySelectorAll(`[data-filter="${flt.dataset.filter}"]`).forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.val === flt.dataset.val)));
    if (route.page === 'radar') document.getElementById('radarOut').innerHTML = radarResults();
    return;
  }
  const nl = q('[data-nl]');
  if (nl){
    const r = parseNaturalQuery(nl.dataset.nl);
    Object.assign(state.filters, r.filters, { radarBig:r.big, radarQ:'' });
    saveState(); render();
    toast(r.applied.length ? 'Filtres appliqués : ' + r.applied.join(', ') : 'Aucun filtre reconnu');
    return;
  }

  if (q('[data-describe-search]')){
    openSheet(`<h3 id="sheetTitle">Décrire ce que vous cherchez</h3>
      <input class="field" id="radarNlInput" type="text" maxlength="300"
        placeholder="Ex. entreprises européennes rentables et peu endettées" style="margin-top:16px">
      <p class="tiny" style="margin-top:10px;color:var(--ink-4)">
        L'interprétation locale est instantanée mais reconnaît peu de formulations.
        « Interpréter avec l'IA » comprend des requêtes plus complexes (compte dans vos analyses mensuelles).</p>
      <div id="radarNlOut"></div>
      <div class="btns" style="margin-top:18px">

document.getElementById('sheetBg').addEventListener('click', e => {
  if (e.target.id === 'sheetBg') closeSheet();
});
/* CORRECTIF (accessibilité, §57 du brief design system, 2026-09-21) :
   .sheet a bien role="dialog"/aria-modal="true" et restaure le focus à
   la fermeture (lastFocus), mais rien n'empêchait Tab de faire sortir
   le focus clavier VERS LA PAGE DERRIÈRE la feuille ouverte — invisible
   à l'écran (recouverte par l'overlay) mais toujours dans le DOM et
   donc toujours atteignable au clavier. Un utilisateur au clavier ou
   lecteur d'écran pouvait ainsi interagir avec du contenu qu'il ne
   voit pas. Piège de focus minimal : Tab/Shift+Tab ne fait boucler le
   focus qu'ENTRE le premier et le dernier élément focusable de la
   feuille ouverte, jamais au-delà. */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); openSearch();
  }
  /* Entrée valide le formulaire e-mail de connexion (2026-09-24) —
     ids propres au formulaire (voir gateEmailFormHTML), jamais un
     comportement Entrée générique sur tout input de l'app. */
  if (e.key === 'Enter' && ['gateEmail','gatePassword'].includes(document.activeElement?.id)){
    e.preventDefault(); submitGateEmail();
  }
  if (e.key === 'Tab'){
    const bg = document.getElementById('sheetBg');
    if (bg.hidden) return;
    const sheet = document.getElementById('sheet');
    const focusables = sheet.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

const DATA = { mode:'unavailable', at:null, covered:0, provider:null, reason:null };

async function loadRealQuotes(){
  if (!CONFIG.marketConnected){
    DATA.mode = 'unavailable'; DATA.reason = 'source_non_connectee';
    return paintSource();
  }
  /* CORRECTIF ARCHITECTURE : plus question de charger les 70 instruments
     du catalogue au démarrage simplement parce qu'ils existent
     ("catalogue large ≠ tout charger"). On ne charge ici que ce dont
     l'écran d'accueil a RÉELLEMENT besoin pour s'afficher : la liste
     suivie + le petit aperçu marché ("marche", 6 valeurs) que PAGES.home
     affiche systématiquement. Tout le reste (Marchés par catégorie,
     Comparer, une fiche...) se charge à l'ouverture de la page
     correspondante, via assurerCotations() — jamais avant.
     CORRECTIF (audit performance, 2026-09-29) : `stocks` n'est plus
     rempli au démarrage (voir boot()) — sans ce await, ce tout premier
     appel tombait quasi systématiquement AVANT que le catalogue léger
     de l'accueil (assurerApercuAccueil(), 6 valeurs) ait fini de charger,
     donc `stocks.slice(0,6)` était vide et cette toute première tentative
     ne cotait rien pour l'aperçu — corrigé au rendu SUIVANT seulement
     (route-hook de render(), voir son propre commentaire), au prix d'un
     bref "Marché non connecté" evitable. Attendre ici élimine ce délai
     pour le tout premier rendu de la session. */
  await assurerApercuAccueil();
  const besoinsAccueil = [
    ...state.watchlist.map(id => byId[id]),
    ...stocks.slice(0, 6),
  ].filter(Boolean);
  await assurerCotations(besoinsAccueil);
}

    return `<div class="notice" style="margin-bottom:18px">

  const familles = Object.values(n.families || {}).filter(f => f.score !== null)
    .sort((a, b) => b.score - a.score);
  return `<div class="nsc">
    <div class="nsc-head">
      <span class="nsc-val tabular-nums">${n.score}<small>/100</small></span>
      <span class="nsc-meta">
        <b>NovaScore</b>

          ? ` · Cohérence ${n.coherence} %` : ''} · Confiance ${esc(n.confidence)}</span>

    </div>
    ${n.comparable ? '' : `<p class="tiny" style="margin-top:10px">Score partiel :
      la couverture est insuffisante pour comparer cette société à une autre.</p>`}
    <div class="nsc-fam">
      ${familles.map(f => `<div class="nsc-line">
        <span>${esc(f.label)}</span>
        <i><em style="width:${f.score}%"></em></i>
        <b class="tabular-nums">${f.score}</b>
      </div>`).join('')}
    </div>
    <p class="tiny" style="margin-top:12px">Calculé par NovaTitre
      (${esc(n.engine)}) à partir des données du dossier. Le modèle l'explique,
      il ne le produit pas.</p>
  </div>`;
}

async function runAnalysis(stockId){
  const st = byId[stockId];
  if (!st || !st.ticker){ toast("Entreprise non identifiée."); return; }
  if (state.auth.status !== 'authenticated'){ toast('Connectez-vous pour lancer une analyse.'); return; }

  /* NovaOrb (§53 du brief design system) : état "thinking" pendant
     l'attente de la réponse IA — remplace le spinner générique
     .brand-spin (logo qui tourne, déjà utilisé ailleurs pour le
     chargement de l'app) par .nova-orb (3 halos orange/bleu/vert qui
     flottent), trouvé déjà implémenté en CSS mais jamais branché à
     aucun balisage avant cet audit. C'est le seul endroit de l'app où
     l'IA "réfléchit" réellement à une question posée par l'utilisateur —
     l'endroit le plus honnête pour donner à NovaOrb un sens, plutôt que
     de l'ajouter à un endroit arbitraire juste pour l'utiliser. */
  openSheet(`<h3 id="sheetTitle">${esc(st.name)}</h3>
    <div id="aiOut"><div class="spin-wrap">
      <span class="nova-orb"><i></i><i></i><i></i></span>
      <span class="spin-txt">Analyse en cours…</span></div></div>`);

  let d;
  try {
    /* Identité déjà connue de NovaTitre (catalogue local, société créée via
       /api/market/search, ou retrouvée après refresh via runtimeCatalog) :
       transmise telle quelle pour que le dossier d'analyse ne reparte pas de
       zéro sur des champs que le frontend connaît déjà. `exchange` envoie le
       code canonique (exchangeCode), plus cohérent avec /api/market/company
       et /api/market/quotes qui l'utilisent déjà ailleurs — auparavant ce
       payload envoyait encore st.market (parfois un libellé lisible, ex.
       "Euronext Paris", au lieu du code "PA"). Aucun champ financier
       (fundamentals/score/prix) n'est envoyé ici : seule l'identité. */
    const r = await authFetch('/api/analyze', { method:'POST',
      body: JSON.stringify({
        ticker: st.ticker,
        exchange: st.exchangeCode || st.market || null,
        name: st.name || null,
        country: (st.country && st.country !== '—') ? st.country : null,
        sector: (st.sector && st.sector !== 'Non classé') ? st.sector : null,
        industry: st.industry || null,
        currency: st.cur || null,
        /* Niveau de langage (§45) : ajuste le ton de la réponse IA au mode
           actuel de l'utilisateur — jamais un second appel, jamais un
           champ financier supplémentaire. */
        mode: isExpert() ? 'expert' : 'debutant',
      }) });
    d = await r.json();
    if (!r.ok) throw Object.assign(new Error(d.error || d.code || 'erreur'), { data:d });
  } catch (e){
    const err = e.data || {};
    const key = err.code || err.error;

    /* Cas spécifique : couverture de données insuffisante pour produire un
       NovaScore. Le serveur ne devrait dans ce cas ni avoir appelé le
       modèle ni consommé de quota (voir rapport) — le frontend, lui, se
       contente d'afficher honnêtement cet état, sans jamais présenter la
       tentative comme une analyse IA aboutie (pas de nom de modèle ici). */
    if (key === 'insufficient_data' || key === 'donnees_insuffisantes' || key === 'coverage_insuffisante'){
      const out = document.getElementById('aiOut');
      const cov = Number.isFinite(err.coverage) ? err.coverage : null;
      const missing = Array.isArray(err.missing) ? err.missing : [];
      if (out) out.innerHTML = `<div class="notice" style="margin-top:8px">
        <b>Analyse impossible : données financières insuffisantes.</b>
        ${cov !== null ? `<p class="tiny" style="margin-top:8px">Couverture : ${cov} % · Minimum requis : 40 %</p>` : ''}
        ${missing.length ? `<p class="tiny" style="margin-top:6px">Données manquantes : ${missing.map(esc).join(', ')}</p>` : ''}
      </div>`;
      return;
    }

    const msg = { non_connecte:'Votre session a expiré. Reconnectez-vous.',
      quota_exceeded: err.message || 'Quota mensuel atteint.',
      aucun_modele_configure:"Aucun modèle n'est configuré sur le serveur.",
      entreprise_non_identifiee:"Entreprise non identifiée.",
      delai_depasse:"Le modèle n'a pas répondu à temps.",
      fournisseur_en_erreur:`Le fournisseur a répondu ${err.status || ''}.`,
      donnees_indisponibles:"Les données financières de cette société n'ont pas pu être récupérées.",
    }[key] || "L'analyse n'a pas abouti.";
    const out = document.getElementById('aiOut');
    if (out) out.innerHTML = `<div class="notice" style="margin-top:8px"><b>${esc(msg)}</b></div>`;
    return;
  }

  if (d.quota && state.account) Object.assign(state.account, d.quota);
  /* CORRECTIF (audit "screener sans effet", 2026-09-17) : le NovaScore
     calculé par /api/analyze n'était jusqu'ici affiché QUE dans ce panneau,
     jamais reporté sur st.score/st.scores — si bien que toute fonction
     s'appuyant sur ces champs (le filtre "Nova Score minimum" du Radar,
     notamment) restait aveugle même pour une valeur qu'on vient d'analyser.
     Écrit ici, immédiatement après l'analyse, jamais ailleurs deviné. */
  if (st && d.novascore){
    st.score = Number.isFinite(d.novascore.score) ? d.novascore.score : null;
    st.scores = Object.fromEntries(Object.entries(d.novascore.families || {})
      .map(([k, v]) => [k, v.score]));
    st.coverage = Number.isFinite(d.novascore.coverage) ? d.novascore.coverage : 0;
    st.partial = !d.novascore.comparable;
  }
  const a = d.analysis || {};
  const out = document.getElementById('aiOut');
  if (!out) return;
  out.innerHTML = `
    ${novascoreBloc(d.novascore)}
    ${d.marketConnected === false ? `<div class="notice" style="margin-bottom:18px">
      <b>Validation technique.</b> Aucun fournisseur de données de marché n'est encore
      connecté : cette réponse sert à vérifier la chaîne, elle ne constitue pas une analyse financière.
    </div>` : ''}
    ${a.whatItDoes ? `<p class="small" style="color:var(--ink-3)">${esc(a.whatItDoes)}</p>` : ''}
    <p class="small" style="margin-top:14px">${esc(a.summary || '')}</p>
    ${(a.positive || []).length ? `<p class="nova-t">Forces</p><ul class="pts good">
      ${a.positive.slice(0,3).map(x => `<li><i>+</i><span>${esc(x)}</span></li>`).join('')}</ul>` : ''}
    ${(a.negative || []).length ? `<p class="nova-t">Risques</p><ul class="pts bad">
      ${a.negative.slice(0,3).map(x => `<li><i>−</i><span>${esc(x)}</span></li>`).join('')}</ul>` : ''}
    <p class="tiny" style="margin-top:8px">Modèle ${esc(d.model || '')} ·
      ${d.quota && !d.quota.unlimited ? `${d.quota.used}/${d.quota.limit} analyses ce mois` : ''}</p>
    <div class="notice" style="margin-top:16px">Aucun objectif de cours, aucune probabilité.
      Les chiffres proviennent de nos données, jamais du modèle.</div>`;
}

/* ---------- démarrage ---------- */
/* Charge le catalogue depuis /catalog.json (2026-09-24, voir la note sur
   `const stocks = []` plus haut pour le pourquoi). Remplit stocks/byId
   EN PLACE (push()/affectation de propriété, jamais stocks = ... ni
   byId = ...) : les deux gardent la même identité d'objet du début à la
   fin, donc tout code qui a déjà capturé une référence à l'un ou l'autre
   (avant même que cette fonction ait fini) voit les bonnes données dès
   qu'elles arrivent, sans rien recâbler.
   `if (byId[s.id]) continue` : une société "hors catalogue" déjà
   restaurée par restoreRuntimeCatalog() (positions/Comparer d'une
   session précédente) a pu arriver EN PREMIER, avant ce fetch — jamais
   la dupliquer ni écraser cette référence déjà potentiellement tenue
   ailleurs (une position du portefeuille, par exemple).
   Délai maximum de 6s (AbortController) : un fetch lent ne doit jamais
   bloquer indéfiniment le premier rendu — l'app démarre alors avec un
   catalogue vide/partiel plutôt que de ne jamais démarrer. */
async function loadCatalog(){
  try {
    const controller = new AbortController();
    /* CORRECTIF (2026-09-24, expansion mondiale du catalogue, 11 243 ->
       36 765 entreprises) : catalog.json est passé d'environ 4,7 à 15,75 Mo
       non compressés (compressé côté Vercel, mais une connexion lente
       reste plus longue à charger) — délai relevé de 6 à 12s pour éviter
       un abandon prématuré sur mobile/3G, toujours dégradé gracieusement
       (catalogue vide/partiel, voir le catch ci-dessous) si dépassé. */
    const timeout = setTimeout(() => controller.abort(), 12000);
    const r = await fetch('/catalog.json', { signal: controller.signal });
    clearTimeout(timeout);
    if (!r.ok) return;
    const data = await r.json();
    for (const s of data){
      if (byId[s.id]) continue;
      stocks.push(s);
      byId[s.id] = s;
    }
  } catch (e){ console.warn('[catalog] chargement impossible, l\'app continue avec un catalogue vide/partiel', e); }
}

/* Déclenche loadCatalog() (le bloc complet, ~930 Ko compressés) AU PLUS
   UNE FOIS, uniquement depuis les routes qui en ont réellement l'usage
   (Marchés, Radar — voir render()) : Marchés a déjà sa propre pagination
   fine (garantirCatalogueMarkets()/assurerCatalogueSuffisant()) et n'a
   donc pas STRICTEMENT besoin du bloc complet, mais le déclencher ici
   aussi ne coûte rien de plus (même résultat final, juste disponible
   d'un coup plutôt que par pages de 20) et profite à Radar, qui lui n'a
   pas sa propre pagination et a besoin d'un éventail large pour que son
   filtre Pays et son tri par score restent utiles. Jamais appelé pour
   Accueil/Auth/Compte/Portefeuille (voir assurerApercuAccueil()
   ci-dessous pour Accueil, qui n'a besoin que de 6 valeurs). */
let catalogueGlobalPromise = null;
let catalogueGlobalRenderArme = false;
function assurerCatalogueGlobal(){
  if (!catalogueGlobalPromise) catalogueGlobalPromise = loadCatalog();
  /* "Armé" une seule fois, jamais un .then() par appel : render() appelle
     cette fonction à chaque affichage de Marchés/Radar tant que le
     catalogue charge encore, réarmer un .then() à chaque fois causerait
     une rafale de render() redondants à la résolution (même risque que
     le livelock des logos, déjà corrigé plus haut — évité ici en amont). */
  if (!catalogueGlobalRenderArme){
    catalogueGlobalRenderArme = true;
    catalogueGlobalPromise.then(() => {
      if (route.page === 'markets' || route.page === 'radar') render();
    });
  }
  return catalogueGlobalPromise;
}

/* Aperçu "Marché" de l'accueil (6 valeurs, voir PAGES.home et
   loadRealQuotes()) : n'a besoin que d'un tout petit nombre d'entrées,
   jamais du catalogue complet — utilise la pagination existante
   (assurerCatalogueSuffisant(), déjà utilisée par Marchés) plutôt que
   assurerCatalogueGlobal(). Un seul appel réseau léger (20 résultats
   max, voir CATALOG_PAGE_SIZE), jamais répété une fois satisfait. Même
   garde-fou "armé une seule fois" que ci-dessus. */
let accueilApercuRenderArme = false;
function assurerApercuAccueil(){
  const p = assurerCatalogueSuffisant('stock', 6);
  if (!accueilApercuRenderArme){
    accueilApercuRenderArme = true;
    p.then(changement => { if (changement && route.page === 'home') render(); });
  }
  return p;
}

function boot(){
  /* Rejoue le catalogue des sociétés hors catalogue déjà rencontrées
     (positions, sélection Comparer) AVANT tout rendu, pour que byId soit
     complet dès la première fois que portfolioValue()/PAGES.compare() en
     ont besoin. */
  restoreRuntimeCatalog();

  if (!state.settings.theme) state.settings.theme = 'light';
  applySettings();
  if (window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
      if (state.settings.theme === 'auto') applyTheme();
    });
  }

  /* Filet de sécurité : si une écriture debouncée est encore en attente au
     moment où l'onglet/l'app se ferme ou passe en arrière-plan, on la force
     immédiatement plutôt que de risquer qu'elle ne se déclenche jamais.
     Couvre tous les saveState() debouncés (watchlist, réglages, etc.), pas
     seulement le portefeuille. */
  window.addEventListener('pagehide', flushSaveState);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSaveState();
  });

  /* auth.status = 'loading' dès le boot (voir DEFAULT_STATE/loadState) :
     l'écran neutre s'affiche immédiatement, avant toute résolution réseau,
     et rien de privé ne peut apparaître avant qu'initAuth()/applySession()
     n'ait tranché entre 'guest' et 'authenticated'. */
  document.body.classList.add('gated');
  document.getElementById('view').innerHTML = loadingScreen();

  /* CORRECTIF (audit performance, 2026-09-29 : catalog.json — 46 404
     entreprises, 20,8 Mo décompressés / ~930 Ko réellement transférés —
     était chargé en ENTIER et INCONDITIONNELLEMENT ici, et le tout
     premier rendu authentifié ATTENDAIT explicitement ce chargement
     (voir l'ancien commentaire "attend que le catalogue soit prêt")
     avant même de lancer initAuth(). Mesuré en direct : ~230-950ms
     ajoutés au démarrage de CHAQUE session, pour Accueil/Auth/Compte/
     Portefeuille qui n'ont jamais besoin des 46 000 entreprises pour
     s'afficher (Accueil n'utilise que 6 valeurs + la liste suivie de
     l'utilisateur, Compte/Portefeuille/Auth aucune du tout).
     Le catalogue n'est plus chargé ici : chaque route qui en a
     RÉELLEMENT besoin (Marchés, Radar, Accueil pour son aperçu 6
     valeurs) le déclenche elle-même depuis render() — voir
     assurerCatalogueGlobal()/assurerApercuAccueil() plus bas, même
     philosophie "à la demande" que assurerCotations()/chargerGraphique().
     L'authentification, elle, n'a jamais eu besoin du catalogue : elle
     démarre donc immédiatement, sans plus rien attendre. */
  loadConfig().then(async () => {
    try { await initAuth(); } catch (e){ console.warn('[auth]', e); state.auth.status = 'guest'; renderGate(); }
    loadRealQuotes();
  }).catch(async () => { state.auth.status = 'guest'; renderGate(); });
}
boot();

</script>
