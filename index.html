<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NovaBourse — Trois IA analysent les marchés. Vous décidez.</title>
<meta name="description" content="NovaBourse analyse les entreprises cotées avec trois intelligences artificielles et un score de qualité et de risque expliqué en clair.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<noscript><link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
<style>
:root{
  color-scheme:light;
  --bg:#ffffff;
  --bg-2:#f4f5f8;
  --bg-3:#eceef3;
  --bg-4:#e3e6ed;
  --ink:#0d1117;
  --ink-2:#3d4453;
  --ink-3:#6b7385;
  --ink-4:#9aa1b1;
  --accent:#3557f6;
  --accent-hover:#2a48d8;
  --accent-press:#2440c0;
  --accent-soft:#eef2ff;
  --accent-ink:#ffffff;
  --up:#16a34a;   --up-soft:#e9f7ee;
  --down:#dc2626; --down-soft:#fdecec;
  --warn:#b45309; --warn-soft:#fdf4e7;
  --line:#e6e9f0;
  --line-2:#eef0f5;
  --r-xs:8px; --r-s:12px; --r-m:18px; --r-l:24px; --r-xl:32px; --r-pill:999px;
  --shadow-1:none;
  --shadow-2:0 1px 2px rgba(13,17,23,.04), 0 8px 24px rgba(13,17,23,.05);
  --shadow-3:0 2px 6px rgba(13,17,23,.06), 0 24px 48px rgba(13,17,23,.08);
  --shadow-accent:0 8px 24px rgba(53,87,246,.24);
  --space-2:8px;  --space-3:12px; --space-4:16px; --space-5:24px;
  --space-6:32px; --space-7:48px; --space-8:64px; --space-9:96px;
  --sp-1:8px; --sp-2:16px; --sp-3:24px; --sp-4:32px; --sp-5:48px; --sp-6:80px;
  --space-xs:8px; --space-sm:16px; --space-md:24px; --space-lg:32px;
  --t-display:clamp(38px,7vw,60px);
  --t-title:clamp(26px,4vw,36px);
  --t-h2:21px;
  --t-h3:17px;
  --t-body:15.5px;
  --t-small:13.5px;
  --t-label:12.5px;
  --t-micro:11.5px;
  --lh-tight:1.06; --lh-title:1.15; --lh-body:1.6;
  --icon-box:44px; --icon-gap:16px; --card-pad:24px;
  --font:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.32,.72,0,1);
  --fast:.14s; --slow:.28s;
  --tap:44px;
}
[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1116; --bg-2:#161a21; --bg-3:#1d222b; --bg-4:#252b36;
  --ink:#f2f4f8; --ink-2:#c3c9d4; --ink-3:#8d95a4; --ink-4:#646c7c;
  --accent:#5b7cff; --accent-hover:#7590ff; --accent-press:#4568f0;
  --accent-soft:#161d33; --accent-ink:#0e1116;
  --up:#3ecf7f; --up-soft:#11251a; --down:#f87171; --down-soft:#2a1416;
  --warn:#e0a63a; --warn-soft:#2a2110;
  --line:#242a34; --line-2:#1b2028;
  --shadow-2:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --shadow-3:0 2px 6px rgba(0,0,0,.45), 0 24px 48px rgba(0,0,0,.45);
  --shadow-accent:0 8px 24px rgba(91,124,255,.22);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html{background:var(--bg)}
[data-theme="xxx"] body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(60% 40% at 50% -8%, rgba(120,140,255,.07), transparent 70%),
    radial-gradient(50% 35% at 90% 12%, rgba(0,200,140,.05), transparent 70%),
    radial-gradient(70% 50% at 8% 60%, rgba(140,120,255,.035), transparent 70%);
}
body{
  background:var(--bg);color:var(--ink);max-width:100vw;
  forced-color-adjust:none;font-family:var(--font);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;letter-spacing:-.011em;
  transition:background .3s var(--spring),color .3s var(--spring);
}
button,input,select{font:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;transition:all .2s var(--spring)}
button:active{transform:scale(.97)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:10px}
.mono,.tabular-nums{font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  font-feature-settings:'tnum' 1,'cv01' 1}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
.cap-i,.trio-i,.onb-i,.gate-i,.quick-ic,.empty-i,.ai-d,.flow-n,.onb-n,
.logo-m,.icon-btn,.star,.info,.x,.av,.sq-ic{
  display:flex;
  align-items:center;
  justify-content:center;
  line-height:0;
  flex-shrink:0;
  overflow:hidden;
  padding:0;
  text-align:center
}
.cap-i>svg,.trio-i>svg,.onb-i>svg,.gate-i>svg,.quick-ic>svg,.empty-i>svg,
.logo-m>svg,.icon-btn>svg,.star>svg,.x>svg,.sq-ic>svg,.ai-d>svg{
  display:block;
  margin:auto;
  flex:0 0 auto
}
.flow-n,.onb-n,.av,.ai-d,.info{line-height:1}
.top{
  position:sticky;top:0;z-index:50;background:rgba(255,255,255,.72);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line-2);
  padding-top:env(safe-area-inset-top);
}
[data-theme="dark"] .top{background:rgba(8,9,12,.72);border-bottom-color:rgba(255,255,255,.06)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;
  gap:12px;min-width:0}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;
  letter-spacing:-.03em;flex:0 0 auto;white-space:nowrap}
.logo-m{width:28px;height:28px;border-radius:8px;background:var(--ink);display:flex;align-items:center;justify-content:center;color:var(--bg)}
.logo-m svg{width:16px;height:16px}
.top-nav{display:flex;gap:2px;margin-left:var(--sp-3)}
.top-nav a{padding:8px 14px;border-radius:100px;font-size:14.5px;font-weight:500;color:var(--ink-3)}
.top-nav a:hover{color:var(--ink);background:var(--bg-2)}
.top-nav a[aria-current]{color:var(--ink);font-weight:600;background:var(--bg-2)}
.top-act{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
#srcBadge{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.icon-btn:hover{background:var(--bg-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px}
.dock{display:none}
@media (max-width:900px){
  .top-nav{display:none}
  .dock{
    display:flex;position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
    background:rgba(248,249,251,.86);backdrop-filter:saturate(180%) blur(24px);
    -webkit-backdrop-filter:saturate(180%) blur(24px);
    border:.5px solid rgba(0,0,0,.07);border-radius:100px;
    padding:7px;gap:2px;box-shadow:var(--shadow-3);max-width:calc(100vw - 24px)
  }
  [data-theme="dark"] .dock{background:rgba(28,31,35,.88);border-color:rgba(255,255,255,.09)}
  .dock button{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-width:60px;padding:8px 6px 7px;border-radius:100px;color:var(--ink-3);
    font-size:10.5px;font-weight:600;letter-spacing:-.01em
  }
  .dock button svg{width:22px;height:22px}
  .dock button[aria-current]{background:var(--bg);color:var(--accent);box-shadow:var(--shadow-1)}
  [data-theme="dark"] .dock button[aria-current]{background:rgba(255,255,255,.1);color:var(--accent-2)}
}
.wrap{max-width:1120px;margin:0 auto;padding:var(--sp-4) 22px calc(var(--sp-6) + 40px)}
.section{margin-top:96px}
.section:first-child{margin-top:0}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-2);margin-bottom:var(--sp-3)}
.display{font-size:var(--t-display);font-weight:700;letter-spacing:-.04em;line-height:var(--lh-tight)}
.title{font-size:var(--t-title);font-weight:700;letter-spacing:-.032em;line-height:var(--lh-title)}
.h2{font-size:var(--t-h2);font-weight:650;letter-spacing:-.024em}
.h3{font-size:var(--t-h3);font-weight:600;letter-spacing:-.018em}
.lead{font-size:17px;color:var(--ink-3);line-height:var(--lh-body);letter-spacing:-.01em}
.small{font-size:var(--t-small);color:var(--ink-3);line-height:var(--lh-body)}
.tiny{font-size:var(--t-micro);color:var(--ink-4);line-height:1.5}
.eyebrow{font-size:var(--t-label);font-weight:600;letter-spacing:.02em;color:var(--accent);text-transform:none}
.center{text-align:center}
.measure{max-width:34ch}
.measure-l{max-width:58ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:var(--tap);padding:13px 26px;border-radius:var(--r-pill);
  font-size:var(--t-body);font-weight:600;letter-spacing:-.012em;white-space:nowrap;
  transition:background var(--fast) ease,color var(--fast) ease,
    box-shadow var(--fast) ease,transform var(--fast) ease,opacity var(--fast) ease}
.btn:active{transform:scale(.985)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn svg{width:17px;height:17px}
.btn-a{background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-accent)}
.btn-a:hover{background:var(--accent-hover)}
.btn-a:active{background:var(--accent-press)}
.btn-s{background:var(--bg-2);color:var(--ink)}
.btn-s:hover{background:var(--bg-3)}
.btn-g,.btn-ghost{background:transparent;color:var(--ink-2);
  box-shadow:inset 0 0 0 1px var(--line)}
.btn-g:hover,.btn-ghost:hover{background:var(--bg-2);color:var(--ink)}
.btn-p{background:var(--ink);color:var(--bg)}
.btn-p:hover{opacity:.88}
.btn-sm{min-height:38px;padding:9px 18px;font-size:var(--t-small)}
.btn-lg{min-height:54px;padding:16px 32px;font-size:16.5px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--bg-2);border:none;border-radius:var(--r-l);
  padding:var(--card-pad);box-shadow:none}
.card-flat{background:var(--bg-2);border-radius:var(--r-l);padding:var(--card-pad)}
.card-lift{transition:background var(--slow) var(--ease)}
.card-lift:hover{background:var(--bg-3)}
.card-white{background:var(--bg);box-shadow:var(--shadow-2)}
.grid{display:grid;gap:var(--space-4)}
.g-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g-4{grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.field{width:100%;padding:15px 18px;border-radius:var(--r-s);background:var(--bg-2);
  border:1.5px solid transparent;min-height:var(--tap);font-size:var(--t-body);
  transition:border-color var(--fast) ease,background var(--fast) ease}
.field:focus{outline:none;border-color:var(--accent);background:var(--bg)}
.field::placeholder{color:var(--ink-4)}
.field[aria-invalid="true"]{border-color:var(--down)}
.seg{display:inline-flex;padding:4px;background:var(--bg-2);border-radius:var(--r-pill);
  gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:9px 18px;border-radius:var(--r-pill);font-size:var(--t-small);
  font-weight:550;color:var(--ink-3);white-space:nowrap;min-height:38px;
  transition:background var(--fast) ease,color var(--fast) ease}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:600;
  box-shadow:var(--shadow-2)}
.sw{width:50px;height:30px;border-radius:var(--r-pill);background:var(--bg-4);
  position:relative;flex:0 0 auto;transition:background var(--slow) var(--ease)}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;box-shadow:var(--shadow-2);transition:transform var(--slow) var(--ease)}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"] i{transform:translateX(20px)}
.divider{height:1px;background:var(--line-2);margin:var(--space-5) 0;border:none}
.sk{background:linear-gradient(90deg,var(--bg-2) 25%,var(--bg-3) 50%,var(--bg-2) 75%);
  background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:var(--r-s);display:block}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:var(--r-xs)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:100px;
  font-size:12.5px;font-weight:600;white-space:nowrap;letter-spacing:-.01em}
.tag-up{background:var(--up-soft);color:var(--up)}
.tag-down{background:var(--down-soft);color:var(--down)}
.tag-warn{background:var(--warn-soft);color:var(--warn)}
.tag-neutral{background:var(--bg-3);color:var(--ink-3)}
.tag-accent{background:var(--accent-soft);color:var(--accent)}
.tag-violet{background:var(--violet-soft);color:var(--violet)}
.up-t{color:var(--up)} .down-t{color:var(--down)}
.hero{padding:var(--sp-5) 0 var(--sp-4);text-align:center}
.hero .display{margin:0 auto;max-width:16ch}
.hero .lead{margin:var(--sp-3) auto 0;max-width:52ch}
.hero-btns{margin-top:var(--sp-4);display:flex;gap:var(--sp-1);justify-content:center;flex-wrap:wrap}
.hero-note{margin-top:var(--sp-2);font-size:12.5px;color:var(--ink-4)}
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-2);
  margin-top:var(--sp-5)}
.trio-c{padding:var(--sp-3);border-radius:var(--r-m);background:var(--bg-2);text-align:center}
.trio-i{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-1);
  background:var(--bg);box-shadow:var(--shadow-1);color:var(--accent)}
.trio-i svg{width:21px;height:21px}
.trio-c b{display:block;font-size:15px;font-weight:650;letter-spacing:-.02em}
.trio-c span{display:block;font-size:13px;color:var(--ink-3);margin-top:4px;line-height:1.45}
.search-btn{display:flex;align-items:center;gap:11px;width:100%;max-width:520px;margin:var(--sp-3) auto 0;
  padding:15px 20px;border-radius:100px;background:var(--bg-2);color:var(--ink-4);font-size:15.5px;
  text-align:left;border:1px solid transparent;transition:all .25s var(--spring)}
.search-btn:hover{background:var(--bg);border-color:var(--line);box-shadow:var(--shadow-2);
  transform:translateY(-2px)}
.search-btn:active{transform:scale(.99)}
.search-btn svg{width:18px;height:18px;flex:0 0 auto}
.search-btn span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search-btn kbd{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:7px;
  background:var(--bg-3);color:var(--ink-4)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--sp-2);width:100%;padding:14px 0;text-align:left;
  border-bottom:1px solid var(--line-2);min-height:var(--tap);min-width:0}
.row:last-child{border-bottom:none}
.row:hover{background:var(--bg-2);border-radius:var(--r-s);padding-left:10px;padding-right:10px;
  margin-left:-10px;margin-right:-10px;border-color:transparent}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  font-size:13px;font-weight:700;letter-spacing:-.03em;color:#fff}
.row-main{flex:1;min-width:0}
.row-t{font-size:15px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-s{font-size:12.5px;color:var(--ink-4);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{flex:0 0 auto;text-align:right;display:flex;align-items:center;gap:10px;min-width:0}
.row-spark{flex:0 0 auto;width:78px;height:26px;overflow:hidden;display:block}
.row-spark svg{display:block;width:100%;height:100%}
@media (max-width:560px){ .row-spark{display:none} }
.score-hero{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap}
.ring{position:relative;width:150px;height:150px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12;stroke-linecap:round}
.ring .bg{stroke:var(--bg-3)}
.ring .fg{transition:stroke-dashoffset 1.4s var(--spring)}
.ring-c{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}
.ring-v{font-size:42px;font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.ring-l{font-size:11.5px;color:var(--ink-4);margin-top:3px}
.bars{margin-top:var(--sp-3)}
.bar{padding:13px 0;border-bottom:1px solid var(--line-2)}
.bar:last-child{border-bottom:none}
.bar-t{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.bar-n{font-size:14.5px;font-weight:550;letter-spacing:-.02em}
.bar-v{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;flex:0 0 auto}
.bar-track{height:6px;border-radius:100px;background:var(--bg-3);margin-top:9px;overflow:hidden}
.bar-fill{display:block;height:100%;width:0;border-radius:100px;transition:width 1.1s var(--spring)}
.bar-h{font-size:12.5px;color:var(--ink-4);margin-top:7px;line-height:1.45}
.bar.off .bar-n,.bar.off .bar-v{color:var(--ink-4)}
.pts{list-style:none}
.pts li{display:flex;gap:10px;padding:8px 0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.pts li i{flex:0 0 auto;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-style:normal;font-size:13px;font-weight:700;margin-top:1px}
.pts.good li i{background:var(--up-soft);color:var(--up)}
.pts.bad li i{background:var(--down-soft);color:var(--down)}
.pts b{color:var(--ink);font-weight:600}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:var(--sp-2);
  margin-top:var(--sp-3)}
.plan{position:relative;padding:var(--sp-3);border-radius:var(--r-l);border:1.5px solid var(--line);
  display:flex;flex-direction:column;background:var(--bg);transition:all .3s var(--spring)}
.plan:hover{border-color:var(--ink-4)}
.plan.hot{border-color:var(--ink);box-shadow:var(--shadow-2)}
.plan-b{position:absolute;top:-11px;left:50%;transform:translateX(-50%);padding:5px 14px;border-radius:100px;
  background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:650;white-space:nowrap}
.plan-n{font-size:15px;font-weight:650;letter-spacing:-.02em}
.plan-p{font-size:40px;font-weight:700;letter-spacing:-.05em;margin-top:var(--sp-1);line-height:1}
.plan-p small{font-size:14.5px;font-weight:500;color:var(--ink-4);letter-spacing:-.01em}
.plan-d{font-size:13.5px;color:var(--ink-3);margin-top:8px;line-height:1.45;min-height:40px}
.plan ul{list-style:none;margin:var(--sp-3) 0;flex:1}
.plan li{display:flex;gap:9px;padding:6px 0;font-size:14px;color:var(--ink-2);line-height:1.45}
.plan li svg{width:16px;height:16px;flex:0 0 auto;margin-top:3px;color:var(--accent)}
.plan li.off{color:var(--ink-4)}
.plan li.off svg{color:var(--ink-4)}

<script>
"use strict";
const BUILD = 'v2-9';
console.log('%cNovaBourse ' + BUILD, 'color:#00a651;font-weight:700');

/* ============================================================
   0. FONDATIONS RESTAURÉES
   ------------------------------------------------------------
   Ce bloc était manquant dans le fichier reçu (state, esc, fmt,
   toEUR, catalogue, PERIODS, etc. n'existaient nulle part alors
   que tout le reste du fichier les appelle). Il a été reconstruit
   ici a minima pour rendre le fichier exécutable, SANS fabriquer
   de données financières : le catalogue ci-dessous ne contient que
   des métadonnées stables (nom, ticker, place, secteur, devise).
   Aucun prix, variation, NovaScore, fondamentaux, volatilité ou
   momentum statique n'y figure — ces valeurs doivent provenir de
   QUOTES / HIST / d'un futur cache COMPANY alimenté par
   /api/market/company, jamais du catalogue.
   ============================================================ */

/* ---- échappement HTML ---- */
function esc(v){
  return String(v ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

/* ---- devises ---- */
const CUR_SYMBOL = { EUR:'€', USD:'$', GBP:'£', CHF:'CHF', JPY:'¥', HKD:'HK$' };
/* Taux indicatifs et fixes, utilisés uniquement pour agréger le portefeuille
   virtuel en euros. Ce ne sont PAS des taux de change en temps réel : le
   portefeuille reste une simulation et l'affiche comme telle. */
const FX = { EUR:1, USD:0.92, GBP:1.17, CHF:1.04, JPY:0.0061, HKD:0.118 };
function toEUR(amount, cur){
  if (!Number.isFinite(amount)) return 0;
  const rate = FX[cur];
  return Number.isFinite(rate) ? amount * rate : amount;
}

/* ---- formatage ---- */
const fmt = {
  num(v, d = 0){
    return Number.isFinite(v) ? v.toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d }) : '—';
  },
  int(v){
    return Number.isFinite(v) ? Math.round(v).toLocaleString('fr-FR') : '—';
  },
  eur(v){
    return Number.isFinite(v) ? v.toLocaleString('fr-FR', { minimumFractionDigits:0, maximumFractionDigits:0 }) + ' €' : '—';
  },
  cur(v, cur){
    if (!Number.isFinite(v)) return '—';
    const sym = CUR_SYMBOL[cur] || (cur ? cur + ' ' : '');
    return v.toLocaleString('fr-FR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + ' ' + sym;
  },
  pct(v, d = 2){
    return Number.isFinite(v) ? (v >= 0 ? '+' : '') + v.toLocaleString('fr-FR', { minimumFractionDigits:d, maximumFractionDigits:d }) + ' %' : '—';
  },
};

/* ---- état applicatif ---- */
const STORAGE_KEY = 'novabourse_state_v1';
const deepClone = (o) => JSON.parse(JSON.stringify(o));

/* auth est TOUJOURS ré-initialisé à 'loading' au démarrage (voir loadState) :
   aucune valeur restaurée depuis le stockage local ne doit pouvoir authentifier
   quelqu'un. Supabase est la seule source de vérité de la session. */
const DEFAULT_STATE = {
  page:'home',
  stockId:null,

  watchlist:[],
  recent:[],
  compare:[],

  wallet:{
    cash:15480,
    invested:110000,
    positions:[]
  },

  auth:{
    status:'loading',   // 'loading' | 'guest' | 'authenticated'
    signedIn:false,
    name:null,
    email:null,
    since:null
  },

  account:null,

  onboarding:{
    done:false,
    step:0,
    level:null,
    goal:null,
    interests:[],
    capital:null
  },

  settings:{
    level:'debutant',
    mode:'debutant',
    theme:'light',
    currency:'EUR',
    lang:'fr',
    plan:'free',
    cycle:'mensuel',
    animations:true,
    sparklines:true,
    showCoverage:true,
    fontSize:'normal',
    numFormat:'fr',
    notifScore:false,
    notifPrice:false,
    notifWeekly:false,
  },

  filters:{
    radarSort:'score',
    radarSector:'tous',
    radarQ:'',
    radarRisk:'tous',
    radarMin:0,
    radarCountry:'tous',
    exploreQ:'',
    exploreSector:'tous',
    exploreCountry:'tous'
  },

  ui:{
    period:'1M',
    pfPeriod:'1A'
  },
};

function loadState(){
  let merged;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw){
      merged = deepClone(DEFAULT_STATE);
    } else {
      const saved = JSON.parse(raw);
      merged = {
        ...deepClone(DEFAULT_STATE),
        ...saved,
        settings:{ ...DEFAULT_STATE.settings, ...(saved.settings || {}) },
        filters:{ ...DEFAULT_STATE.filters, ...(saved.filters || {}) },
        ui:{ ...DEFAULT_STATE.ui, ...(saved.ui || {}) },
        wallet:{ ...DEFAULT_STATE.wallet, ...(saved.wallet || {}) },
        onboarding:{ ...DEFAULT_STATE.onboarding, ...(saved.onboarding || {}) },
      };
    }
  } catch {
    merged = deepClone(DEFAULT_STATE);
  }

  /* Correction du bug d'authentification : même si un ancien
     novabourse_state_v1 contient un auth.signedIn=true, il ne doit JAMAIS
     être considéré comme une preuve de connexion. On repart toujours en
     'loading' ; seule la confirmation Supabase (voir applySession) peut
     ensuite passer l'état à 'authenticated' ou 'guest'. */
  merged.auth = {
    status:'loading',
    signedIn:false,
    name:null,
    email:null,
    since:null
  };

  if (!Array.isArray(merged.wallet.positions)) merged.wallet.positions = [];

  return merged;
}

let saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        watchlist:state.watchlist,
        recent:state.recent,
        compare:state.compare,
        settings:state.settings,
        filters:state.filters,
        ui:state.ui,
        onboarding:state.onboarding,
        /* Le portefeuille virtuel est un état utilisateur réel (positions
           qu'il a lui-même prises), pas une donnée de marché : il est
           légitime de le conserver localement pour qu'il survive à un
           rechargement. Aucune valeur de marché n'est stockée ici, ni la
           session (voir auth, jamais sauvegardé). */
        wallet:state.wallet,
      }));
    } catch {}
  }, 200);
}

const state = loadState();

/* ---- catalogue : métadonnées stables uniquement ----
   Volontairement réduit et honnête : aucun prix, variation, NovaScore,
   fondamentaux, volatilité ou momentum statique n'est inclus. Ces champs
   n'existent que lorsqu'ils proviennent réellement de QUOTES / HIST / d'un
   dossier company chargé depuis le backend. Une fiche sans ces données
   affichera « indisponible », jamais une valeur inventée. */
const SECTORS = ['Technologie','Finance','Santé','Industrie','Énergie','Consommation','Automobile','Luxe','Télécommunications'];

const BLANK_FIELDS = () => ({
  /* Explicitement null/false plutôt qu'absents : le reste du fichier (tests,
     strengths/weaknesses, radar) distingue "donnée absente" (null) de
     "donnée à zéro". Rien ici n'est une valeur de marché. */
  score:null, scores:{}, coverage:0, partial:true,
  fundamentals:null, hasFundamentals:false,
  volatility:null, volRisk:null, momentum:null,
  marketCapEUR:null,
});

const stocks = [
  { id:'AAPL-NAS', name:'Apple Inc.', ticker:'AAPL', market:'NASDAQ', sector:'Technologie', country:'États-Unis', cur:'USD', curSymbol:'$', ...BLANK_FIELDS() },
  { id:'MSFT-NAS', name:'Microsoft Corp.', ticker:'MSFT', market:'NASDAQ', sector:'Technologie', country:'États-Unis', cur:'USD', curSymbol:'$', ...BLANK_FIELDS() },
  { id:'GOOGL-NAS', name:'Alphabet Inc.', ticker:'GOOGL', market:'NASDAQ', sector:'Technologie', country:'États-Unis', cur:'USD', curSymbol:'$', ...BLANK_FIELDS() },
  { id:'AMZN-NAS', name:'Amazon.com Inc.', ticker:'AMZN', market:'NASDAQ', sector:'Consommation', country:'États-Unis', cur:'USD', curSymbol:'$', ...BLANK_FIELDS() },
  { id:'NVDA-NAS', name:'NVIDIA Corp.', ticker:'NVDA', market:'NASDAQ', sector:'Technologie', country:'États-Unis', cur:'USD', curSymbol:'$', ...BLANK_FIELDS() },
  { id:'JPM-NYS', name:'JPMorgan Chase & Co.', ticker:'JPM', market:'NYSE', sector:'Finance', country:'États-Unis', cur:'USD', curSymbol:'$', ...BLANK_FIELDS() },
  { id:'MC-PA', name:'LVMH', ticker:'MC', market:'Euronext Paris', sector:'Luxe', country:'France', cur:'EUR', curSymbol:'€', ...BLANK_FIELDS() },
  { id:'OR-PA', name:"L'Oréal", ticker:'OR', market:'Euronext Paris', sector:'Consommation', country:'France', cur:'EUR', curSymbol:'€', ...BLANK_FIELDS() },
  { id:'SAP-DE', name:'SAP SE', ticker:'SAP', market:'Xetra', sector:'Technologie', country:'Allemagne', cur:'EUR', curSymbol:'€', ...BLANK_FIELDS() },
  { id:'SIE-DE', name:'Siemens AG', ticker:'SIE', market:'Xetra', sector:'Industrie', country:'Allemagne', cur:'EUR', curSymbol:'€', ...BLANK_FIELDS() },
];
const byId = Object.fromEntries(stocks.map(s => [s.id, s]));

/* Identifiant stable pour une société, qu'elle vienne du catalogue local ou
   d'un résultat /api/market/search. Même convention que le catalogue
   (TICKER-CODE_MARCHÉ) pour que les deux sources produisent le même id pour
   la même société et ne créent jamais de doublon. */
function remoteId(ticker, exchangeCode){
  const t = String(ticker || '').toUpperCase().trim();
  const e = String(exchangeCode || '').toUpperCase().trim();
  return e ? `${t}-${e}` : t;
}

/* Transforme un résultat de recherche externe (métadonnées seulement) en
   objet "stock" exploitable par le reste du fichier (fiche, achat, watchlist,
   comparateur…), sans jamais fabriquer de prix, score ou fondamentaux : ces
   champs restent BLANK_FIELDS() et ne se rempliront que si QUOTES/HIST ou un
   futur cache COMPANY reçoivent une vraie réponse serveur pour cet id.
   Le catalogue local n'est donc plus une limite : c'est un noyau de départ,
   pas un plafond — toute société renvoyée par /api/market/search peut
   rejoindre `stocks`/`byId` à la demande. */
function ensureRuntimeStock(meta){
  if (!meta || !meta.ticker) return null;
  const id = meta.id || remoteId(meta.ticker, meta.exchangeCode || meta.exchange);
  if (byId[id]) return byId[id];
  const s = {
    id,
    name: meta.name || meta.ticker,
    ticker: String(meta.ticker).toUpperCase(),
    market: meta.market || meta.exchange || meta.exchangeCode || '—',
    sector: meta.sector || 'Non classé',
    country: meta.country || '—',
    cur: meta.currency || meta.cur || 'USD',
    curSymbol: CUR_SYMBOL[meta.currency || meta.cur] || (meta.currency || meta.cur || ''),
    ...BLANK_FIELDS(),
  };
  stocks.push(s);
  byId[s.id] = s;
  return s;
}

/* Profil textuel dérivé d'un NovaScore réel (fourni par le backend). Gère
   explicitement l'absence de score : jamais de profil par défaut inventé. */
function profileOf(score){
  if (score === null || score === undefined || !Number.isFinite(score))
    return { short:'Non calculable', detail:"Données insuffisantes pour produire un NovaScore." };
  if (score >= 80) return { short:'Très solide',  detail:'Profil très solide sur les critères mesurés.' };
  if (score >= 65) return { short:'Solide',       detail:'Profil solide sur les critères mesurés.' };
  if (score >= 50) return { short:'Équilibré',    detail:'Profil équilibré, sans signal dominant.' };
  if (score >= 35) return { short:'Prudent',      detail:'Profil prudent : plusieurs points de vigilance.' };
  return { short:'Risque élevé', detail:'Profil marqué par un risque élevé sur les critères mesurés.' };
}

function marketOpen(ix){
  const now = new Date();
  const day = now.getUTCDay();
  if (day === 0 || day === 6) return { open:false, why:'week-end' };
  const mins = now.getUTCHours() * 60 + now.getUTCMinutes();
  const o = ix.open[0] * 60 + ix.open[1], c = ix.close[0] * 60 + ix.close[1];
  return { open: mins >= o && mins < c, why: mins < o ? 'avant ouverture' : 'après clôture' };
}
function localTime(tz){
  try { return new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:tz}).format(new Date()); }
  catch { return '—'; }
}

/* Market Pulse : agrégat des seules données réellement disponibles (QUOTES).
   Si aucune quote n'est encore arrivée, chaque facteur reste indisponible et
   le score global est null plutôt que calculé sur du vide. */
function marketPulse(){
  const avg = (list, get) => {
    const vals = list.map(get).filter(v => Number.isFinite(v));
    return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  };
  const clamp = v => v === null ? null : Math.max(0, Math.min(100, Math.round(v)));

  const changesOf = s => { const q = QUOTES.get(s.id); return q && Number.isFinite(q.changePercent) ? q.changePercent : null; };
  const rated = stocks.map(changesOf).filter(v => v !== null);
  const advancing = rated.filter(v => v > 0).length;
  const breadth = rated.length ? clamp(advancing / rated.length * 100) : null;

  const factors = [
    { k:'Largeur du marché', v:breadth,
      d: breadth === null ? 'Cotations pas encore reçues.' : `${advancing} sociétés en hausse sur ${rated.length}.` },
  ].filter(f => f.v !== null);

  const score = factors.length ? Math.round(factors.reduce((a, f) => a + f.v, 0) / factors.length) : null;
  return { score, factors };
}

/* Recherche : catalogue local uniquement dans ce fichier. La recherche
   mondiale via /api/market/search n'est pas câblée ici (voir rapport) ; ce
   n'est pas une régression introduite par cette passe, la fonctionnalité
   n'existait déjà pas dans le fichier reçu. */
function searchAll(q){
  const t = q.trim().toLowerCase();
  if (!t) return [];
  const hits = [];
  for (const s of stocks){
    const hay = (s.name+' '+s.ticker+' '+s.sector+' '+s.market).toLowerCase();
    if (hay.includes(t)) hits.push({ type:'action', id:s.id, title:s.name,
      sub:`${s.ticker} · ${s.sector} · ${s.market}` });
  }
  for (const ix of INDICES){
    if ((ix.name+' '+ix.place).toLowerCase().includes(t))
      hits.push({ type:'indice', id:ix.id, title:ix.name, sub:`Indice · ${ix.place}` });
  }
  return hits.slice(0, 8);
}

/* Recherche distante : /api/market/search permet d'ouvrir une société absente
   du catalogue local, qui ne sert plus que de noyau rapide et hors-ligne.
   Contrat ASSUMÉ d'après la documentation de passation (non vérifié en
   exécution, aucun backend disponible ici) : GET /api/market/search?q=...
   -> { results: [{ ticker, name, exchange, exchangeCode, country, currency,
   sector }] }. Lecture défensive : accepte aussi `matches`/`items`, ignore
   tout élément sans ticker, et échoue silencieusement (recherche locale
   seule) si l'endpoint est absent, en erreur, ou renvoie autre chose. */
async function searchRemote(q){
  if (!CONFIG.marketConnected) return [];
  const t = q.trim();
  if (t.length < 2) return [];
  try {
    const r = await fetch('/api/market/search?q=' + encodeURIComponent(t));
    if (!r.ok) return [];
    const d = await r.json();
    const list = Array.isArray(d.results) ? d.results
      : Array.isArray(d.matches) ? d.matches
      : Array.isArray(d.items) ? d.items
      : [];
    return list.filter(x => x && x.ticker).slice(0, 8).map(x => ({
      type:'action', remote:true,
      id: remoteId(x.ticker, x.exchangeCode || x.exchange),
      title: x.name || x.ticker,
      sub: `${x.ticker} · ${x.sector || 'Non classé'} · ${x.exchange || x.exchangeCode || '—'}`,
      meta: x,
    }));
  } catch {
    return [];   // recherche locale conservée en repli, aucune erreur affichée
  }
}

function portfolioValue(){
  let value = 0, cost = 0;
  const lines = state.wallet.positions.map(pos => {
    const st = byId[pos.id];
    if (!st) return null;
    const cours = prixDe(st);
    if (cours === null) return null;
    const localValue = cours * pos.qty;
    const localCost  = pos.avg  * pos.qty;
    const eurValue = toEUR(localValue, st.cur);
    const eurCost  = toEUR(localCost,  st.cur);
    value += eurValue; cost += eurCost;
    return { ...pos, stock:st, localValue, localCost, cur:st.cur,
      value:eurValue, cost:eurCost, gain:eurValue-eurCost,
      gainPct: eurCost ? (eurValue/eurCost-1)*100 : 0,
      fx: FX[st.cur] };
  }).filter(Boolean);
  const total = value + state.wallet.cash;
  const invested = cost + state.wallet.cash;
  const gain = total - invested;
  return { lines, value, cost, total, cash:state.wallet.cash, invested,
    gain, gainPct: invested > 0 ? (gain / invested) * 100 : 0 };
}

function measureText(st, key){
  const f = st.fundamentals;
  if (!f) return '';
  switch(key){
    case 'quality':    return `marge opérationnelle de ${f.margin} %`;
    case 'growth':     return `chiffre d'affaires ${f.revenueGrowth > 0 ? '+' : ''}${f.revenueGrowth} %, bénéfice ${f.epsGrowth > 0 ? '+' : ''}${f.epsGrowth} %`;
    case 'profit':     return `ROE de ${f.roe} %`;
    case 'debt':       return `dette à ${f.debtEquity} % des fonds propres`;
    case 'valuation':  return `PER de ${f.per}`;
    case 'volatility': return `volatilité de ${f.volatility} % par an`;
    case 'momentum':   return `${f.momentum > 0 ? '+' : ''}${f.momentum} % sur six mois`;
    case 'regularity': return `${f.upMonths} % de mois en hausse`;
    default: return '';
  }
}
function plainFundamentals(st){
  const f = st.fundamentals;
  if (!f) return '';
  const bits = [];
  if (f.margin !== null && f.margin !== undefined) bits.push(`sur 100 € de ventes, il reste environ ${Math.round(f.margin)} € avant impôts et frais financiers`);
  if (f.debtEquity !== null && f.debtEquity !== undefined) bits.push(f.debtEquity > 150
    ? `la dette dépasse largement les fonds propres, ce qui limite la marge de manœuvre`
    : f.debtEquity > 80 ? `la dette est du même ordre que les fonds propres` : `la dette reste modérée`);
  if (f.per !== null && f.per !== undefined) bits.push(`vous payez ${Math.round(f.per)} années de bénéfices au cours actuel`);
  return esc(bits.join(' ; ')) + '.';
}

/* Diagnostic manuel (console : runNovaTests()). Les anciennes assertions
   portant sur consensus()/aiAnalyses() ont été retirées : ces fonctions
   appartenaient au sous-système de "consensus multi-IA" simulé côté client
   qui a disparu avec le bloc de code manquant, et ne doivent de toute façon
   pas être recréées côté frontend (le NovaScore et l'analyse doivent venir
   du serveur, jamais d'une simulation locale). */
function runNovaTests(){
  const results = [];
  const ok = (name, cond, detail='') => results.push({ name, pass:Boolean(cond), detail });

  ok('les poids somment à 100', WEIGHT_TOTAL === 100, 'total = ' + WEIGHT_TOTAL);
  ok('tous les scores sont dans 0-100 ou null',
    stocks.every(s => s.score === null || (s.score >= 0 && s.score <= 100)));
  ok('les composantes absentes valent null, jamais 0',
    stocks.every(s => COMPONENTS.every(c => s.scores[c.key] === null || s.scores[c.key] === undefined || s.scores[c.key] > 0)));

  ok('conversion USD vers EUR', Math.abs(toEUR(100, 'USD') - 92) < 0.01);
  ok('la devise EUR reste inchangée', toEUR(100, 'EUR') === 100);
  const pf = portfolioValue();
  ok('le portefeuille additionne des euros', pf.lines.every(l => l.value === toEUR(l.localValue, l.cur)));
  ok('la valeur totale inclut les liquidités', Math.abs(pf.total - (pf.value + pf.cash)) < 0.01);

  const snapshot = [...state.watchlist];
  state.watchlist.length = 0;
  toggleWatch('AAPL-NAS'); const added = state.watchlist.length === 1;
  toggleWatch('AAPL-NAS'); const removed = state.watchlist.length === 0;
  state.watchlist.push(...snapshot);
  ok('la watchlist ajoute puis retire', added && removed);

  ok('areaChart ne plante pas sur un tableau vide', areaChart([]) === '');
  ok('areaChart ne plante pas sur un seul point', areaChart([100]) === '');
  ok('spark ne plante pas sur des NaN', spark([100, NaN, 102]) === '');

  const passed = results.filter(r => r.pass).length;
  console.group(`NovaBourse — tests internes : ${passed}/${results.length}`);
  results.forEach(r => console[r.pass ? 'log' : 'error'](
    `${r.pass ? '✔' : '✘'} ${r.name}${r.detail ? ' — ' + r.detail : ''}`));
  console.groupEnd();
  return { passed, total:results.length, results };
}
window.runNovaTests = runNovaTests;

const arrow = (v) => v > 0 ? '▲' : v < 0 ? '▼' : '■';
function absChange(st){
  const q = QUOTES.get(st.id);
  if (!q || !Number.isFinite(q.price) || !Number.isFinite(q.changePercent)) return '—';
  const prev = q.price / (1 + q.changePercent/100);
  const d = q.price - prev;
  return (d >= 0 ? '+' : '−') + fmt.num(Math.abs(d)) + ' ' + (CUR_SYMBOL[st.cur] || st.cur);
}
const trendTxt = (v,d=2) => Number.isFinite(v) ? `${arrow(v)} ${fmt.pct(v,d)}` : '—';

/* Cours réellement reçu du serveur pour cette valeur, ou null. Number.isFinite
   exclut aussi NaN et +/-Infinity, qu'un simple test "> 0" laisserait passer
   (Infinity > 0 est vrai). Aucun achat/valorisation ne peut se faire sur un
   prix qui n'existe pas ou n'est pas fini. */
function prixDe(st){
  const q = st && QUOTES.get(st.id);
  return q && Number.isFinite(q.price) && q.price > 0 ? q.price : null;
}

function buyStock(id, amountEUR){
  const st = byId[id];
  if (!st) return { ok:false, msg:'Entreprise inconnue' };
  if (!(amountEUR > 0)) return { ok:false, msg:'Montant invalide' };
  if (amountEUR > state.wallet.cash) return { ok:false, msg:'Liquidités insuffisantes' };

  const prix = prixDe(st);
  if (prix === null) return { ok:false, msg:'Cours indisponible pour cette valeur' };
  const priceEUR = toEUR(prix, st.cur);
  const qty = amountEUR / priceEUR;
  const pos = state.wallet.positions.find(p => p.id === id);
  if (pos){
    const totalQty = pos.qty + qty;
    pos.avg = ((pos.avg * pos.qty) + (prix * qty)) / totalQty;
    pos.qty = totalQty;
  } else {
    state.wallet.positions.push({ id, qty, avg: prix });
  }
  state.wallet.cash -= amountEUR;
  saveState();
  return { ok:true, qty, msg:`${fmt.num(qty,2)} titre(s) de ${st.name} achetés` };
}
function sellStock(id, part = 1){
  const i = state.wallet.positions.findIndex(p => p.id === id);
  if (i < 0) return { ok:false, msg:'Aucune position sur cette valeur' };
  const pos = state.wallet.positions[i], st = byId[id];
  const prix = prixDe(st);
  if (prix === null) return { ok:false, msg:'Cours indisponible : vente impossible' };
  const qty = pos.qty * Math.max(0, Math.min(1, part));
  if (!(qty > 0)) return { ok:false, msg:'Quantité invalide' };
  const proceeds = toEUR(prix * qty, st.cur);
  pos.qty -= qty;
  if (pos.qty <= 0.0001) state.wallet.positions.splice(i, 1);
  state.wallet.cash += proceeds;
  saveState();
  return { ok:true, msg:`Vente de ${fmt.num(qty,2)} titre(s) · ${fmt.eur(proceeds)} récupérés` };
}

/* --- graphiques ---
   areaChart/spark ne fabriquent jamais de point : elles se contentent de
   refuser de dessiner quand l'entrée est vide, unique ou non finie (NaN /
   Infinity), au lieu de produire un path SVG invalide. */
function areaChart(vals, { h = 200, color = 'var(--accent)', id = 'c', labels = null } = {}){
  if (!Array.isArray(vals) || vals.length < 2
      || !vals.every(v => typeof v === 'number' && Number.isFinite(v))) return '';
  const w = 800, pad = { t:16, b: labels ? 28 : 12, l:4, r:56 };
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const X = i => pad.l + (i / (vals.length - 1)) * (w - pad.l - pad.r);
  const Y = v => pad.t + (1 - (v - min) / span) * (h - pad.t - pad.b);
  const d = vals.map((v,i) => `${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  const area = `${d} L${X(vals.length-1).toFixed(1)},${h-pad.b} L${pad.l},${h-pad.b} Z`;
  const grid = [0,.5,1].map(f => { const v = min + span*f; return `
    <line x1="${pad.l}" y1="${Y(v).toFixed(1)}" x2="${w-pad.r}" y2="${Y(v).toFixed(1)}"
      stroke="var(--line-2)" stroke-width="1"/>
    <text x="${w-pad.r+10}" y="${(Y(v)+4).toFixed(1)}" fill="var(--ink-4)" font-size="12"
      font-family="ui-monospace,monospace">${fmt.int(v)}</text>`; }).join('');
  const xl = labels ? labels.map(l => `<text x="${X(l.i).toFixed(1)}" y="${h-6}" fill="var(--ink-4)"
    font-size="12" text-anchor="middle">${esc(l.t)}</text>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Évolution">
    <defs><linearGradient id="g${id}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".20"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${grid}<path d="${area}" fill="url(#g${id})"/>
    <path class="chart-line" d="${d}" fill="none" stroke="${color}" stroke-width="2.6"
      stroke-linejoin="round" stroke-linecap="round"/>${xl}</svg>`;
}
function spark(vals, color){
  if (!Array.isArray(vals) || vals.length < 2
      || !vals.every(v => typeof v === 'number' && Number.isFinite(v))) return '';
  const w=110,h=32,pad=3,min=Math.min(...vals),max=Math.max(...vals),sp=(max-min)||1;
  const d = vals.map((v,i)=>`${i?'L':'M'}${(i/(vals.length-1)*w).toFixed(1)},${(pad+(1-(v-min)/sp)*(h-pad*2)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function ring(score, size = 150){
  const R = size/2 - 12, C = 2*Math.PI*R, p = (score === null || score === undefined) ? 0 : score/100;
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle class="bg" cx="${size/2}" cy="${size/2}" r="${R}"/>
      <circle class="fg" cx="${size/2}" cy="${size/2}" r="${R}" stroke="${scoreColor(score)}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}" data-ring="${(C*(1-p)).toFixed(1)}"/>
    </svg>
    <div class="ring-c"><div>
      <div class="ring-v tabular-nums" style="color:${scoreColor(score)}">${(score===null||score===undefined)?'—':score}</div>
      <div class="ring-l">${(score===null||score===undefined)?'non calculable':'sur 100'}</div>
    </div></div></div>`;
}
function donut(parts, size = 150){
  const clean = (parts || []).filter(p => Number.isFinite(p.v) && p.v >= 0);
  const total = clean.reduce((s,p)=>s+p.v,0) || 1, R = size/2 - 13, C = 2*Math.PI*R;
  let acc = 0;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"
    style="transform:rotate(-90deg)" aria-hidden="true">
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(--bg-3)" stroke-width="17"/>
    ${clean.map(p=>{ const len=(p.v/total)*C, off=C-acc; acc+=len;
      return `<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${p.c}" stroke-width="17"
        stroke-dasharray="${len.toFixed(1)} ${(C-len).toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>`;
    }).join('')}</svg>`;
}

/* Cotations et historiques réellement reçus du serveur. Vides au départ :
   les lignes affichent « — » jusqu'à la réponse. Rien n'est pré-rempli. */
const QUOTES = new Map();
/* HIST stocke un état explicite par société :
     { status:'loading' | 'ready' | 'empty' | 'error', data:[{date,close}] }
   'loading'  -> requête en cours ou pas encore lancée (chartBloc distingue via HIST.has)
   'ready'    -> data contient au moins 2 points réels, datés
   'empty'    -> le serveur a répondu mais sans historique exploitable
   'error'    -> la requête a échoué (réseau/HTTP) ; on retente au prochain appel */
const HIST = new Map();

const symboleDe = s => `${s.ticker}@${MARKET_CODE[s.market] || ''}`;
const MARKET_CODE = { NASDAQ:'NASDAQ', NYSE:'NYSE', 'Euronext Paris':'PA',
  'Euronext Amsterdam':'AS', Xetra:'DE', SIX:'SW', LSE:'L' };

async function chargerCotations(liste){
  const cibles = liste.filter(s => s && s.ticker);
  if (!cibles.length) return;

  const TAILLE_LOT = 8;
  const lots = [];
  for (let i = 0; i < cibles.length; i += TAILLE_LOT) lots.push(cibles.slice(i, i + TAILLE_LOT));

  let reçus = 0, source = null, echecs = 0;

  await Promise.all(lots.map(async lot => {
    try {
      const r = await fetch('/api/market/quotes?symbols='
        + encodeURIComponent(lot.map(symboleDe).join(',')));
      if (!r.ok){ echecs++; return; }
      const d = await r.json();
      const parId = new Map(lot.map(s => [symboleDe(s), s]));
      for (const q of d.quotes || []){
        const s = parId.get(q.symbol);
        if (s && Number.isFinite(q.price) && q.price > 0){ QUOTES.set(s.id, q); reçus++; }
      }
      if (d.source) source = d.source;
      if (!d.quotes || !d.quotes.length) echecs++;
    } catch { echecs++; }
  }));

  if (!reçus){
    DATA.mode = 'unavailable';
    DATA.reason = echecs === lots.length ? 'fournisseur_indisponible' : null;
  } else {
    DATA.mode = 'live';
    DATA.covered = QUOTES.size;
    DATA.provider = source;
    DATA.at = Date.now();
  }
  paintSource();
  render();
}

/* Séances par période, sur des données journalières uniquement. 1J/1S
   intraday ne sont pas proposés (voir PERIODS_DISPO) : aucune donnée
   intraday n'est chargée par ce fichier. */
const SEANCES = { '1M':21, '3M':63, '6M':126, '1A':252 };

/* Filtre l'historique réel par période. Ne complète JAMAIS artificiellement :
   si moins de deux points réels existent pour la période demandée, retourne
   null et laisse l'appelant afficher "données insuffisantes". */
function histPeriode(stockId, periodId){
  const entry = HIST.get(stockId);
  if (!entry || entry.status !== 'ready' || !Array.isArray(entry.data) || entry.data.length < 2) return null;
  const n = SEANCES[periodId];
  if (!n) return null;
  const pts = entry.data.slice(-n);
  return pts.length >= 2 ? pts : null;
}

const HIST_ENCOURS = new Set();

/* Historique réel, daté. Conserve tous les points renvoyés par le serveur
   (aucune troncature arbitraire à 60) et distingue explicitement : en cours,
   prêt, vide, en erreur. Une requête déjà en cours n'est jamais dupliquée. */
async function chargerHistorique(stock){
  if (!stock) return;
  const existing = HIST.get(stock.id);
  if (existing && existing.status !== 'error') return;   // déjà chargé ou en cours
  if (HIST_ENCOURS.has(stock.id)) return;

  HIST_ENCOURS.add(stock.id);
  try {
    const r = await fetch(`/api/market/company?ticker=${encodeURIComponent(stock.ticker)}`
      + `&exchange=${encodeURIComponent(MARKET_CODE[stock.market] || '')}`);
    if (!r.ok){
      HIST.set(stock.id, { status:'error', data:[] });
      return;
    }
    const d = await r.json();
    const points = (d.history?.ohlcv || [])
      .filter(x => x && typeof x.date === 'string' && Number.isFinite(x.close) && x.close > 0)
      .map(x => ({ date:x.date, close:x.close }));
    HIST.set(stock.id, points.length >= 2
      ? { status:'ready', data:points }
      : { status:'empty', data:[] });
  } catch {
    HIST.set(stock.id, { status:'error', data:[] });
  } finally {
    HIST_ENCOURS.delete(stock.id);
    render();
  }
}

const PAGES = {};

/* Générateur pseudo-aléatoire PUREMENT DÉCORATIF, local à cette fonction :
   il dessine la courbe animée d'illustration du bandeau d'accueil et ne lit,
   n'écrit ni ne touche à aucune donnée financière (QUOTES/HIST/portefeuille).
   Ce n'est pas le rng()/series() supprimé ailleurs : celui-ci n'a jamais
   existé dans ce fichier et n'a pas été recréé. Renommé sans ambiguïté. */
function heroChart(){
  const W = 1000, H = 700;
  let heroSeed = 777;
  const r = () => { heroSeed = (heroSeed * 1103515245 + 12345) % 2147483648; return heroSeed / 2147483648; };
  const n = 54;
  const pts = [];
  let v = 0;
  for (let i = 0; i < n; i++){
    const t = i / (n - 1);
    let step = 2.6 + (r() - 0.34) * 3.2;
    const nearEnd = i > n - 6;
    if (!nearEnd && i && i % 7 === 0) step -= 5.4 + r() * 4.2;
    if (!nearEnd && i && i % 13 === 0) step -= 7.5 + r() * 3;
    if (nearEnd) step = 4.6 + r() * 2.4;
    v = Math.max(0, v + step);
    pts.push({ x: 30 + t * (W - 190), y: v });
  }
  const min = Math.min(...pts.map(p => p.y)), max = Math.max(...pts.map(p => p.y));
  const span = (max - min) || 1;
  pts.forEach(p => { p.y = H - 70 - ((p.y - min) / span) * (H - 190); });

  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 1; i < n; i++){
    const a = pts[i - 1], b = pts[i], cx = (a.x + b.x) / 2;
    d += ` C${cx.toFixed(1)},${a.y.toFixed(1)} ${cx.toFixed(1)},${b.y.toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;
  }

  const cols = 14, rows = 9;
  const grid = [
    ...Array.from({ length: cols + 1 }, (_, i) =>
      `<line x1="${((i / cols) * W).toFixed(1)}" y1="0" x2="${((i / cols) * W).toFixed(1)}" y2="${H}"/>`),
    ...Array.from({ length: rows + 1 }, (_, i) =>
      `<line x1="0" y1="${((i / rows) * H).toFixed(1)}" x2="${W}" y2="${((i / rows) * H).toFixed(1)}"/>`),
  ].join('');

  const area = `${d} L${pts[n - 1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;
  const last = pts[n - 1], before = pts[n - 4];
  const angle = Math.atan2(last.y - before.y, last.x - before.x) * 180 / Math.PI;

  return `<div class="hero-chart" aria-hidden="true">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="hcFill" x1="0" x2="0" y1="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".16"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="hcStroke" x1="0" x2="1" y1="1" y2="0">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".3"/>
          <stop offset="100%" stop-color="var(--accent)"/>
        </linearGradient>
      </defs>
      <g class="hc-grid">${grid}</g>
      <path class="hc-area" d="${area}" fill="url(#hcFill)"/>
      <path class="hc-line" d="${d}" fill="none" stroke="url(#hcStroke)" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
      <g class="hc-tip" transform="translate(${last.x.toFixed(1)},${last.y.toFixed(1)})">
        <circle class="hc-halo" r="17" fill="var(--accent)" opacity=".16"/>
        <circle r="7" fill="var(--accent)" stroke="var(--bg)" stroke-width="3"/>
        <g transform="rotate(${angle.toFixed(1)})">
          <path class="hc-arrow" d="M14 0 L52 0 M39 -12 L52 0 L39 12" fill="none"
            stroke="var(--accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>
    </svg>
  </div>`;
}

function parseNaturalQuery(q){
  const t = q.toLowerCase(), f = { radarRisk:'tous', radarMin:0, radarCountry:'tous', radarSector:'tous' };
  const applied = [];
  if (/peu risqu|pas trop risqu|s[ée]curis|prudent|stable/.test(t)){ f.radarRisk='Faible'; applied.push('risque faible'); }
  if (/tr[èe]s risqu|volatil|dynamique/.test(t)){ f.radarRisk='Élevé'; applied.push('risque élevé'); }
  if (/solide|s[ûu]r|qualit[ée]|rentable/.test(t)){ f.radarMin=70; applied.push('Nova Score de 70 et plus'); }
  if (/croissance|qui grandit|en forte hausse/.test(t)){ f.radarMin=Math.max(f.radarMin,60); applied.push('croissance recherchée'); }
  if (/am[ée]ricain|[ée]tats-unis|usa/.test(t)){ f.radarCountry='États-Unis'; applied.push('États-Unis'); }
  if (/fran[çc]ais|france/.test(t)){ f.radarCountry='France'; applied.push('France'); }
  if (/allemand|allemagne/.test(t)){ f.radarCountry='Allemagne'; applied.push('Allemagne'); }
  SECTORS.forEach(sec => { if (t.includes(sec.toLowerCase().slice(0,6))){ f.radarSector=sec; applied.push(sec.toLowerCase()); } });
  if (/grosse|grande|g[ée]ant|large/.test(t)) applied.push('grande capitalisation');
  return { filters:f, applied, big:/grosse|grande|g[ée]ant|large/.test(t) };
}
function radarResults(){
  const f = state.filters;
  let list = [...stocks];
  if (f.radarCountry !== 'tous') list = list.filter(s => s.country === f.radarCountry);
  if (f.radarSector !== 'tous')  list = list.filter(s => s.sector === f.radarSector);
  if (f.radarQ){ const q = f.radarQ.toLowerCase();
    list = list.filter(s => (s.name + ' ' + s.ticker + ' ' + s.sector).toLowerCase().includes(q)); }

  const varDe = s => { const q = QUOTES.get(s.id);
    return q && Number.isFinite(q.changePercent) ? q.changePercent : null; };
  list.sort((a, b) => {
    const va = varDe(a), vb = varDe(b);
    if (va === null && vb === null) return a.name.localeCompare(b.name, 'fr');
    if (va === null) return 1;
    if (vb === null) return -1;
    return vb - va;
  });

  if (!list.length) return `<div class="card">${emptyState('Aucune entreprise ne correspond',
    'Élargissez un critère : le Radar n’ajoute jamais de résultat approchant.')}</div>`;

  const cotees = list.filter(s => varDe(s) !== null).length;
  return `
    <p class="small" style="margin-bottom:12px">${list.length} entreprise${list.length>1?'s':''} ·
      ${cotees} cotation${cotees>1?'s':''} disponible${cotees>1?'s':''}</p>
    <div class="card"><div class="rows">
      ${list.slice(0, 40).map(s => stockRow(s)).join('')}
    </div></div>`;
}

/* Graphique de cours : trois états possibles, aucun quatrième. */
function chartBloc(stock, periodId){
  const entry = HIST.get(stock.id);
  if (!entry || entry.status === 'loading')
    return `<p class="small" style="padding:28px 0;text-align:center">Chargement de l'historique…</p>`;
  if (entry.status === 'error')
    return `<p class="small" style="padding:28px 0;text-align:center">Impossible de charger l'historique pour le moment.</p>`;
  if (entry.status === 'empty' || !entry.data.length)
    return `<p class="small" style="padding:28px 0;text-align:center">Données historiques indisponibles.</p>`;

  const pts = histPeriode(stock.id, periodId);
  if (!pts) return `<p class="small" style="padding:28px 0;text-align:center">
    Historique insuffisant pour la période ${esc(periodId)}.</p>`;

  const v = pts.map(x => x.close);
  const hausse = v[v.length - 1] >= v[0];
  return areaChart(v, { id:'px', color: hausse ? 'var(--up)' : 'var(--down)' });
}

function averagesBlock(stock, periodId){
  const pts = histPeriode(stock.id, periodId);
  if (!pts) return `<p class="small" style="margin-top:14px">Données insuffisantes pour
    calculer les moyennes sur cette période.</p>`;

  const v = pts.map(x => x.close);
  const n = v.length;
  const total = (v[n-1] / v[0] - 1) * 100;
  const perDay = (Math.pow(v[n-1] / v[0], 1 / Math.max(1, n - 1)) - 1) * 100;
  const rows = [
    ['Sur la période', total],
    ['Moyenne par séance', perDay],
  ];
  return `<div class="avgs">
    ${rows.map(([k, val]) => `
      <div class="avg">
        <span class="avg-k">${esc(k)}</span>
        <span class="avg-v tabular-nums ${val >= 0 ? 'up-t' : 'down-t'}">${trendTxt(val, Math.abs(val) < 1 ? 2 : 1)}</span>
      </div>`).join('')}
  </div>
  <p class="tiny" style="margin-top:10px">${n} séances réelles ·
    du ${esc(pts[0].date)} au ${esc(pts[n-1].date)}</p>`;
}

/* ============================================================
   AUTHENTIFICATION — état à trois valeurs
   ------------------------------------------------------------
   auth.status vaut 'loading' | 'guest' | 'authenticated'.
   Supabase est la SEULE source de vérité de la session : aucune donnée
   restaurée depuis novabourse_state_v1 ne peut faire passer ce statut à
   'authenticated' (voir loadState, qui réinitialise systématiquement auth).
   Tant que status !== 'authenticated', renderGate/renderApp/render
   refusent explicitement d'afficher quoi que ce soit de privé.
   ============================================================ */
let sbClient = null;
let AUTH_ERROR = null;
let CONFIG = { supabaseUrl:null, supabaseAnonKey:null, marketConnected:false,
  aiConnected:false, annualBilling:false };

async function loadConfig(){
  try {
    const r = await fetch('/api/config');
    if (r.ok) CONFIG = { ...CONFIG, ...(await r.json()) };
  } catch { /* configuration indisponible : on reste en mode invité strict */ }
  return CONFIG;
}

async function initAuth(){
  if (!CONFIG.supabaseUrl || !CONFIG.supabaseAnonKey){
    state.auth.status = 'guest'; state.auth.signedIn = false;
    renderGate();
    return null;
  }
  const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
  sbClient = createClient(CONFIG.supabaseUrl, CONFIG.supabaseAnonKey, {
    auth: { persistSession:true, autoRefreshToken:true, detectSessionInUrl:true,
            flowType:'pkce', storage:window.localStorage,
            storageKey:'novabourse-auth' },
  });

  try {
    const url = new URL(window.location.href);
    const err = url.searchParams.get('error_description') || url.searchParams.get('error')
      || new URLSearchParams(window.location.hash.slice(1)).get('error_description');
    if (err){
      AUTH_ERROR = decodeURIComponent(err).replace(/\+/g, ' ');
      url.searchParams.delete('error'); url.searchParams.delete('error_description');
      window.history.replaceState({}, '', url.pathname);
    }
    if (url.searchParams.get('code')){
      const { error } = await sbClient.auth.exchangeCodeForSession(window.location.href);
      if (error) console.warn('[auth] échange du code :', error.message);
      url.searchParams.delete('code');
      url.searchParams.delete('state');
      window.history.replaceState({}, '', url.pathname + url.search + url.hash);
    } else if (window.location.hash.includes('access_token')){
      await new Promise(r => setTimeout(r, 60));
      window.history.replaceState({}, '', url.pathname + url.search);
    }
  } catch (e){
    console.warn('[auth]', e);
    AUTH_ERROR = "L'échange du code de connexion a échoué : " + (e.message || e);
  }

  /* applySession peut être invoquée par onAuthStateChange ET par le premier
     getSession() ci-dessous. Elle est rendue idempotente via un jeton de
     "génération" : seul le dernier appel en cours a le droit d'écrire l'état
     et de déclencher le rendu, ce qui évite les doubles /api/me et les
     rendus contradictoires en cas d'appels quasi simultanés. */
  sbClient.auth.onAuthStateChange((_e, session) => { applySession(session); });
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && sbClient && state.auth.status !== 'authenticated'){
      const { data } = await sbClient.auth.getSession();
      if (data.session) applySession(data.session);
    }
  });
  const { data } = await sbClient.auth.getSession();
  await applySession(data.session);
  return sbClient;
}

async function authFetch(url, options = {}){
  const { data } = sbClient ? await sbClient.auth.getSession() : { data:{} };
  const token = data?.session?.access_token;
  return fetch(url, { ...options, headers: {
    'Content-Type':'application/json',
    ...(token ? { Authorization:'Bearer ' + token } : {}),
    ...(options.headers || {}),
  }});
}

let _sessionGen = 0;
async function applySession(session){
  const gen = ++_sessionGen;

  if (!session){
    if (gen !== _sessionGen) return;
    state.auth = { status:'guest', signedIn:false, name:null, email:null, since:null };
    state.settings.plan = 'free';
    state.account = null;
    saveState(); renderGate(); return;
  }

  state.auth = {
    status:'authenticated',
    signedIn: true,
    name: session.user.user_metadata?.full_name || session.user.email,
    email: session.user.email,
    avatar: session.user.user_metadata?.avatar_url || null,
    since: session.user.created_at || null,
  };
  saveState();
  await refreshAccount();
  if (gen !== _sessionGen) return;   // une session plus récente a déjà pris le relais

  if (state.account && state.account.onboarded === false && !state.onboarding.done){
    state.onboarding.step = state.onboarding.step || 1;
    saveState(); renderGate(); return;
  }
  if (state.account && state.account.onboarded){
    state.onboarding.done = true;
    saveState();
  }
  renderGate();
}

function quotaLigne(){
  const a = state.account;
  if (!a || typeof a.used !== 'number') return '';
  const nom = esc(a.planLabel || a.plan || '');
  if (a.unlimited) return `<div class="quota"><b>${nom}</b><span>Analyses incluses</span></div>`;
  const pct = a.limit ? Math.min(100, Math.round(a.used / a.limit * 100)) : 0;
  return `<div class="quota">
    <b>${nom}</b>
    <span class="tabular-nums">${a.used} / ${a.limit} analyses utilisées ce mois-ci</span>
    <i class="quota-bar"><em style="width:${pct}%"></em></i>
  </div>`;
}

async function refreshAccount(){
  try {
    const r = await authFetch('/api/me');
    if (!r.ok) return;
    const me = await r.json();
    state.settings.plan = me.plan || 'free';
    state.account = me;
    if (me.profileSetup){
      const p = me.profileSetup;
      if (p.level) state.onboarding.level = p.level;
      if (p.goal) state.onboarding.goal = p.goal;
      if (p.interests) state.onboarding.interests = p.interests;
    }
    saveState();
  } catch {}
}

function setCapital(amount){
  const v = Math.max(100, Math.min(10000000, Math.round(amount)));
  state.wallet = { cash:v, invested:v, positions:[] };
  state.onboarding.capital = v;
  state.onboarding.step = 4;
  saveState();
  renderGate();
  toast(`Portefeuille ouvert avec ${fmt.eur(v)}`);
}

async function signIn(){
  if (!sbClient){
    toast("Connexion indisponible : configuration du serveur incomplète.");
    return;
  }
  const { error } = await sbClient.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/',
               queryParams: { prompt:'select_account' } },
  });
  if (error) toast('Connexion impossible : ' + error.message);
}

async function startCheckout(plan){
  if (plan === 'free'){ toast("L'offre Découverte est déjà active."); return; }
  if (state.auth.status !== 'authenticated'){ toast('Connectez-vous pour souscrire.'); return; }
  toast('Ouverture du paiement sécurisé…');
  try {
    const r = await authFetch('/api/stripe/create-checkout-session', {
      method:'POST', body: JSON.stringify({ plan }),
    });
    const d = await r.json();
    if (d.url){ window.location.href = d.url; return; }
    toast(d.error === 'prix_absent' ? "Cette offre n'est pas encore configurée."
      : d.error === 'stripe_non_configure' ? 'Paiement indisponible pour le moment.'
      : 'Paiement impossible.');
  } catch { toast('Paiement indisponible pour le moment.'); }
}

async function openPortal(){
  try {
    const r = await authFetch('/api/stripe/create-portal-session', { method:'POST' });
    const d = await r.json();
    if (d.url){ window.location.href = d.url; return; }
    toast(d.error === 'aucun_abonnement' ? "Aucun abonnement rattaché à ce compte."
      : 'Espace de gestion indisponible.');
  } catch { toast('Espace de gestion indisponible.'); }
}

async function signOut(){
  _sessionGen++;   // invalide toute résolution de session encore en vol
  if (sbClient) await sbClient.auth.signOut();
  state.auth = { status:'guest', signedIn:false, name:null, email:null, since:null };
  state.settings.plan = 'free';
  state.account = null;
  saveState(); renderGate();
}

function renderGate(){
  document.body.classList.add('gated');
  const el = document.getElementById('view');
  if (state.auth.status === 'loading'){
    el.innerHTML = loadingScreen();
  } else if (state.auth.status === 'guest'){
    el.innerHTML = gateScreen();
  } else if (!state.onboarding.done){
    el.innerHTML = onboardingScreen();
  } else {
    renderApp();
    return;
  }
  animate();
}
function renderApp(){
  /* Garde-fou : l'application privée ne s'ouvre jamais tant que la session
     n'est pas confirmée par Supabase, quel que soit l'appelant. */
  if (state.auth.status !== 'authenticated' || !state.onboarding.done){
    renderGate();
    return;
  }
  document.body.classList.remove('gated');
  route = { page:'home', arg:null };
  render();
}

function paintNav(){

function render(navigated = false){
  /* Filet de sécurité : tant que la session n'est pas confirmée et
     l'onboarding terminé, jamais de contenu privé. */
  if (state.auth.status !== 'authenticated' || !state.onboarding.done){
    renderGate();
    return;
  }
  document.body.classList.remove('gated');

  const view = document.getElementById('view');
  let html;
  try {
    html = route.page === 'stock' ? PAGES.stock(route.arg) : (PAGES[route.page] || PAGES.home)();
  } catch (err){
    console.error('[NovaBourse]', err);
    html = `<div class="card">${emptyState('Cette section n’a pas pu s’afficher',
      'Le reste de l’application reste utilisable.', { go:'home', label:'Revenir à l’accueil' })}
      <p class="tiny" style="margin-top:18px;text-align:center;word-break:break-word">
        ${esc(route.page)} · ${esc(err && err.message ? err.message : String(err))} · ${esc(BUILD)}</p>
    </div>`;
  }
  view.innerHTML = html;
  /* Le scroll ne repart en haut que lors d'une VRAIE navigation (go()/back()),
     jamais lors d'un simple rafraîchissement déclenché par l'arrivée d'une
     quote ou d'un historique en tâche de fond. */
  if (navigated){
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
  paintNav();
  if (route.page === 'watchlist' || route.page === 'home'){
    state.watchlist.slice(0, 6).map(id => byId[id]).filter(Boolean).forEach(chargerHistorique);
  }
  if (route.page === 'stock' && byId[route.arg]) chargerHistorique(byId[route.arg]);
  if (route.page === 'radar')   document.getElementById('radarOut').innerHTML = radarResults();
  if (route.page === 'explore') document.getElementById('exploreOut').innerHTML = exploreRows();
  animate();
}
function animate(){
  const view = document.getElementById('view');
  requestAnimationFrame(() => {
    view.querySelectorAll('.bar-fill[data-w]').forEach(b => b.style.width = b.dataset.w + '%');
    view.querySelectorAll('.ring .fg[data-ring]').forEach(c => c.style.strokeDashoffset = c.dataset.ring);
  });
  if (!('IntersectionObserver' in window)){
    view.querySelectorAll('.rise').forEach(e => e.classList.add('seen')); return;
  }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('seen'); io.unobserve(e.target); }
  }), { rootMargin:'0px 0px -8% 0px' });
  view.querySelectorAll('.rise').forEach(e => io.observe(e));
}
function go(page, arg){
  if (route.page !== page || route.arg !== arg) history_.push({ ...route });
  route = { page, arg: arg ?? null };
  state.page = page; state.stockId = arg ?? null; saveState();
  render(true);
}
function back(){ const prev = history_.pop(); route = prev || { page:'home', arg:null }; render(true); }

function applySettings(){
  applyTheme();
  const r = document.documentElement;
  r.style.fontSize = state.settings.fontSize === 'large' ? '17.5px' : '';
  r.classList.toggle('no-anim', state.settings.animations === false);
  document.body.classList.toggle('no-spark', state.settings.sparklines === false);
