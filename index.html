<script>/* ============================================================
   NAVIGATION, ÉVÉNEMENTS, DÉMARRAGE
   ============================================================ */
/* Explorer fusionnée dans Marchés le 2026-09-23 (recherche + bouton
   Filtres remplacent le "mur" de puces secteur/pays affiché en
   permanence) — 6 destinations -> 5. Voir PAGES.markets(). */
const NAV = [
  { id:'home',      label:'Accueil',      icon:ICON.home },
  { id:'markets',   label:'Marchés',      icon:ICON.chart },
  { id:'radar',     label:'Radar',        icon:ICON.radar },
  { id:'portfolio', label:'Portefeuille', icon:ICON.wallet },
  { id:'account',   label:'Compte',       icon:ICON.user },
];
let route = { page:'home', arg:null };
let history_ = [];

/* Motion system — pilule glissante du dock (2026-09-21) : le dock lui-même
   n'est construit qu'UNE SEULE FOIS (dockBuilt). Le reconstruire à chaque
   render() (comme avant) détruisait et recréait la pilule à chaque fois :
   un nœud DOM tout neuf n'a pas d'état "avant" dont transitionner, la
   transition CSS ne pouvait donc jamais réellement s'animer — elle
   "sautait" directement à sa position finale. En ne touchant plus que
   aria-current + la position de la pilule persistante, le transform/width
   change sur un élément qui existait déjà l'instant d'avant, et la
   transition (.45s var(--spring)) s'exécute pour de vrai. */
let dockBuilt = false;
let topNavBuilt = false;
/* setAttribute/removeAttribute seulement quand l'état CHANGE vraiment
   (2026-09-23, ajouté avec les animations de la nav — "vraiment
   beaucoup d'animation") : paintNav() tourne à CHAQUE render(), pas
   seulement à la navigation (aussi à chaque tick de rafraîchissement
   vivant) — reposer aria-current inconditionnellement sur les 5/6
   boutons à chaque fois, même sur ceux qui ne changent pas, risquait de
   redéclencher les animations CSS liées à [aria-current] (rebond de
   l'icône, pilule) en continu plutôt que seulement au vrai changement
   d'onglet. Ne toucher l'attribut QUE quand il change réellement
   élimine ce risque à la source. */
function syncActiveAttr(el, shouldBeActive){
  const isActive = el.hasAttribute('aria-current');
  if (shouldBeActive && !isActive) el.setAttribute('aria-current', 'page');
  else if (!shouldBeActive && isActive) el.removeAttribute('aria-current');
}
function paintNav(){
  paintSource();
  /* Nova Explain (2026-09-28) : reflète le niveau choisi à l'onboarding
     sur <html>, pour toute règle CSS [data-nova-level="..."] future —
     paintNav() tourne à chaque render(), donc toujours à jour dès que
     state.settings.mode change (segmenté Simple/Détaillé compris). */
  document.documentElement.setAttribute('data-nova-level', novaLevel());
  const topNav = document.getElementById('topNav');
  if (!topNavBuilt){
    topNav.innerHTML = `<span class="top-nav-pill" aria-hidden="true"></span>` + NAV.map(n=>`
      <a href="#" data-go="${n.id}">${n.label}</a>`).join('');
    topNavBuilt = true;
  }
  topNav.querySelectorAll('a[data-go]').forEach(a => syncActiveAttr(a, a.dataset.go === route.page));
  positionTopNavPill();
  const dock = document.getElementById('dock');
  if (!dockBuilt){
    dock.innerHTML = `<span class="dock-pill" aria-hidden="true"></span>` + NAV.map(n=>`
      <button data-go="${n.id}" aria-label="${n.label}">${svg(n.icon)}<span>${n.label}</span></button>`).join('');
    dockBuilt = true;
  }
  dock.querySelectorAll('button[data-go]').forEach(b => syncActiveAttr(b, b.dataset.go === route.page));
  positionDockPill();
  document.querySelector('[data-search]').innerHTML = svg(ICON.search);
}
function positionDockPill(){
  const dock = document.getElementById('dock');
  const pill = dock.querySelector('.dock-pill');
  const active = dock.querySelector('button[aria-current]');
  if (!pill) return;
  if (!active){ pill.style.width = '0px'; return; }
  pill.style.transform = `translateX(${active.offsetLeft}px)`;
  pill.style.width = active.offsetWidth + 'px';
}
/* Même mécanique FLIP que .dock-pill juste au-dessus (nœud persistant,
   seules transform/width bougent d'un render à l'autre) appliquée à la
   nav du haut (desktop) — jusqu'ici elle recréait ses liens à chaque
   paintNav() (voir topNavBuilt plus haut, même correctif que dockBuilt
   en son temps) : une pilule sur des nœuds recréés en continu n'aurait
   jamais pu réellement glisser. */
function positionTopNavPill(){
  const topNav = document.getElementById('topNav');
  const pill = topNav.querySelector('.top-nav-pill');
  const active = topNav.querySelector('a[aria-current]');
  if (!pill) return;
  if (!active){ pill.style.width = '0px'; return; }
  pill.style.transform = `translateX(${active.offsetLeft}px)`;
  pill.style.width = active.offsetWidth + 'px';
}
/* La position mesurée en pixels ne survit pas à une rotation d'écran ou à
   l'ouverture du clavier (qui redimensionne le viewport sur mobile) —
   sans ce listener, la pilule resterait figée à ses anciennes coordonnées
   jusqu'au prochain changement d'onglet. */
window.addEventListener('resize', () => {
  const dockPill = document.querySelector('.dock-pill');
  if (dockPill){
    dockPill.classList.add('no-anim');
    positionDockPill();
    requestAnimationFrame(() => dockPill.classList.remove('no-anim'));
  }
  const topPill = document.querySelector('.top-nav-pill');
  if (topPill){
    topPill.classList.add('no-anim');
    positionTopNavPill();
    requestAnimationFrame(() => topPill.classList.remove('no-anim'));
  }
});

/* Fondus progressifs au scroll (2026-09-23, en 2 temps le même jour) —
   voir --top-fade dans le CSS de .top et --temple-fade dans celui de
   .nova-temple. Un seul écouteur/throttle partagé pour les deux plutôt
   que deux séparés : même coût qu'un seul.
   - Header : posé une fois au démarrage, jamais par page — le header
     (<header class="top">) est dans le HTML statique, en dehors de
     #view, donc déjà partagé par toutes les routes. Fondu simplement
     lié à la position de scroll globale (0 → 160px).
   - Temple : n'existe que sur l'accueil (PAGES.home), donc recherché à
     chaque calcul plutôt que mis en cache — absent ailleurs, la
     fonction sort tôt sans rien faire. Fondu lié à SA PROPRE position
     réelle (getBoundingClientRect) plutôt qu'à une distance de scroll
     fixe : "s'efface quand on le dépasse" doit rester correct quel que
     soit la hauteur du temple (mobile vs desktop, tailles d'écran
     différentes) — une distance fixe se serait déclenchée trop tôt ou
     trop tard selon l'écran.
   requestAnimationFrame plutôt qu'un calcul direct dans le handler de
   scroll : évite de recalculer le style à chaque événement natif (qui
   peut se déclencher bien plus souvent qu'une fois par frame), un seul
   throttling déjà éprouvé ailleurs dans ce fichier pour d'autres
   écouteurs fréquents. updateScrollFades() exposée (pas dans une IIFE)
   pour être aussi appelée depuis render() : sans ça, arriver sur
   l'accueil par navigation (scroll remis à 0 par render() lui-même)
   pourrait laisser le temple visuellement figé à l'ancien niveau de
   fondu jusqu'au prochain scroll. */
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function updateScrollFades(){
  const HEADER_FADE_DISTANCE = 160;  // px de scroll pour atteindre le minimum
  const HEADER_FADE_FLOOR = .15;     // jamais totalement invisible (lisibilité)
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  const ht = Math.min(1, y / HEADER_FADE_DISTANCE);
  const headerFade = 1 - ht * (1 - HEADER_FADE_FLOOR);
  document.documentElement.style.setProperty('--top-fade', headerFade.toFixed(3));

  const temple = document.querySelector('.nova-temple-section');
  if (temple){
    /* CORRECTIF (2026-09-25, retour utilisateur : "le temple ne s'efface
       pas entièrement") : plancher retiré (était .08, soit ~4,4% visible
       en permanence une fois défilé — .55 de base × .08). Le temple
       atteint maintenant réellement 0 à la fin de sa zone de fondu,
       jamais un résidu visible. */
    const TEMPLE_FADE_FLOOR = 0;
    const rect = temple.getBoundingClientRect();
    // Commence à s'effacer dès qu'il entame son ascension sous le
    // header (start), atteint le plancher une fois un peu plus de la
    // moitié de sa hauteur passée sous le haut de l'écran (end).
    const start = rect.height * .15;
    const end = -rect.height * .55;
    const tt = Math.min(1, Math.max(0, (start - rect.top) / (start - end)));
    const templeFade = 1 - tt * (1 - TEMPLE_FADE_FLOOR);
    document.documentElement.style.setProperty('--temple-fade', templeFade.toFixed(3));
    /* CORRECTIF (2026-09-25, retour utilisateur : "j'ai mal compris" — un
       zoom sur seulement 2 colonnes ne suffisait pas, "je voudrais que
       TOUT LE TEMPLE fasse un gros zoom") : gros zoom (jusqu'à 2×) sur le
       temple ENTIER, lié au MÊME `tt` que le fondu ci-dessus — remonter
       dézoome donc automatiquement à l'inverse, une seule variable
       continue pilote les deux sens. Combiné avec le parallaxe existant
       dans UN SEUL transform sur .nova-temple-section (le parent de
       .nova-temple), jamais sur .nova-temple lui-même qui a déjà sa
       propre animation CSS sur `transform` (deux sources sur le même
       nœud se marcheraient dessus). Sauté sous prefers-reduced-motion,
       même choix que le reste des effets purement décoratifs d'ici. */
    if (!REDUCED_MOTION){
      const TEMPLE_ZOOM_MAX = 2;
      const zoom = 1 + tt * (TEMPLE_ZOOM_MAX - 1);
      const parallax = Math.max(-26, -y * .08);
      temple.style.transform = `translateY(${parallax.toFixed(1)}px) scale(${zoom.toFixed(3)})`;
    }
  }
}
(function wireScrollFades(){
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; updateScrollFades(); });
  }, { passive:true });
  window.addEventListener('resize', updateScrollFades, { passive:true });
  updateScrollFades();
})();

/* Curseur glissant des .seg — technique FLIP (voir le commentaire CSS sur
   .seg-pill). SEG_FROM(key) posée par le handler de clic ci-dessus ;
   consommée une seule fois ici, jamais réappliquée à un render() qui
   suit sans nouveau clic sur ce .seg précis. */
function syncSegPill(seg){
  if (!seg) return;
  let pill = seg.querySelector(':scope > .seg-pill');
  if (!pill){
    pill = document.createElement('span');
    pill.className = 'seg-pill';
    pill.setAttribute('aria-hidden', 'true');
    seg.insertBefore(pill, seg.firstChild);
  }
  const active = seg.querySelector('button[aria-pressed="true"]');
  if (!active){ pill.style.width = '0px'; return; }
  const key = seg.dataset.seg;
  const depart = key ? SEG_FROM.get(key) : null;
  if (depart){
    SEG_FROM.delete(key);
    pill.style.transition = 'none';
    pill.style.transform = `translateX(${depart.left}px)`;
    pill.style.width = depart.width + 'px';
    pill.offsetHeight; // force le reflow avant d'écrire la position d'arrivée
    pill.style.transition = '';
  }
  pill.style.transform = `translateX(${active.offsetLeft}px)`;
  pill.style.width = active.offsetWidth + 'px';
}
function syncAllSegPills(){
  document.querySelectorAll('.seg[data-seg]').forEach(syncSegPill);
}

function render(navigated = false){
  /* Filet de sécurité : tant que la session n'est pas confirmée et
     l'onboarding terminé, jamais de contenu privé. */
  if (state.auth.status !== 'authenticated' || !state.onboarding.done){
    renderGate();
    return;
  }
  document.body.classList.remove('gated');

  const view = document.getElementById('view');
  let html;
  try {
    html = route.page === 'stock' ? PAGES.stock(route.arg)
      : route.page === 'listDetail' ? PAGES.listDetail(route.arg)
      : (PAGES[route.page] || PAGES.home)();
  } catch (err){
    console.error('[NovaTitre]', err);
    html = `<div class="card">${emptyState('Cette section n’a pas pu s’afficher',
      'Le reste de l’application reste utilisable.', { go:'home', label:'Revenir à l’accueil' })}
      <p class="tiny" style="margin-top:18px;text-align:center;word-break:break-word">
        ${esc(route.page)} · ${esc(err && err.message ? err.message : String(err))} · ${esc(BUILD)}</p>
    </div>`;
  }
  view.innerHTML = html;
  /* CORRECTIF (2026-09-23, signalé "je vois le temple sur mon PC mais pas
     sur mon téléphone") : bug WebKit/mobile connu — une animation CSS
     posée sur des éléments insérés d'un coup via innerHTML (comme ici)
     peut ne jamais démarrer si le navigateur ne recalcule pas la mise en
     page ENTRE l'insertion et l'application de l'animation ; l'élément
     reste alors figé à son état de départ (.temple-part part d'opacity:0
     pour l'effet d'apparition en cascade) — invisible en permanence sur
     les navigateurs concernés, alors que Chrome desktop ne montre pas ce
     souci. Lire une propriété de mise en page (offsetHeight) force ce
     recalcul avant que l'animation ne soit évaluée, ce qui est le
     correctif standard pour ce bug. */
  void view.offsetHeight;
  /* Fond ambiant par section (2026-09-21, palette officielle) : voir les
     règles body[data-bg=...] sur .aurora-bg — portfolio penche vert+orange,
     compte/réglages restent neutres, tout le reste garde le défaut
     orange+bleu. Un simple attribut plutôt qu'une classe : une seule
     source de vérité, jamais désynchronisée d'un toggle CSS séparé. */
  document.body.dataset.bg = (route.page === 'portfolio') ? 'portfolio'
    : (route.page === 'account' || route.page === 'settings') ? 'account'
    : 'default';
  /* Le scroll ne repart en haut que lors d'une VRAIE navigation (go()/back()),
     jamais lors d'un simple rafraîchissement déclenché par l'arrivée d'une
     quote ou d'un historique en tâche de fond. */
  if (navigated){
    document.documentElement.scrollTop = 0; document.body.scrollTop = 0;
  }
  /* Recalcule les fondus header/temple (voir updateScrollFades() plus
     bas) après CHAQUE rendu, pas seulement au scroll : sans ça, arriver
     sur l'accueil par navigation laisserait le temple visuellement figé
     au niveau de fondu de la page précédente jusqu'au prochain scroll
     (le DOM du temple vient d'être recréé, --temple-fade ne le "sait"
     pas tout seul). */
  updateScrollFades();
  /* Filet de sécurité (2026-09-23, même correctif "temple invisible sur
     téléphone" que ci-dessus) : au cas où le recalcul forcé plus haut ne
     suffirait pas sur un navigateur/appareil imprévu, force l'état final
     visible après le délai maximum que l'animation d'apparition peut
     prendre (dernier délai .42s + durée .35s ≈ 0,77s, marge prise à
     1000ms — cascade resserrée le 2026-09-29, voir templePartIn/CSS).
     Ne change rien de visible quand l'animation CSS a normalement joué
     (elle est déjà à opacity:1 à ce moment-là) ; rattrape seulement le
     cas où elle ne s'est jamais déclenchée. */
  if (document.querySelector('.temple-part')){
    setTimeout(() => {
      document.querySelectorAll('.temple-part').forEach(el => { el.style.opacity = '1'; });
    }, 1000);
  }
  paintNav();
  syncAllSegPills();
  /* Chargement à la demande : l'accueil/watchlist n'entraîne plus aucun
     appel history/fondamentaux (seules les quotes, déjà séparées, restent
     automatiques). L'ouverture d'une fiche n'en déclenche plus non plus —
     l'utilisateur doit cliquer "Voir le graphique"/"Voir les chiffres".
     Seul Comparer reste un déclenchement automatique légitime : ouvrir une
     comparaison EST une demande explicite de graphique et de chiffres pour
     les sociétés choisies (validé explicitement). Chaque fonction protège
     déjà contre une société déjà chargée ou en cours de chargement. */
  if (route.page === 'compare'){
    const comparees = state.compare.map(id => byId[id]).filter(Boolean);
    comparees.forEach(chargerGraphique);
    /* Les fondamentaux n'ont de sens que pour les actions (CMP_ROWS :
       PER/ROE/marge...) — inutile d'appeler /api/market/fundamentals pour
       une paire Forex ou une crypto, qui n'en auront jamais. Le tableau
       affiche déjà "indisponible" proprement dans ce cas ; ceci évite
       simplement l'appel réseau inutile. */
    comparees.filter(s => s.type === 'stock').forEach(chargerFondamentaux);
  }
  if (route.page === 'radar')   document.getElementById('radarOut').innerHTML = radarResults();
  /* Pose/complète le relevé du jour à chaque visite réelle de la page
     Portefeuille — jamais un minuteur en tâche de fond (voir
     assurerRelevéQuotidien). */
  if (route.page === 'portfolio') assurerRelevéQuotidien();

  /* Rafraîchissement vivant — uniquement les instruments réellement
     visibles sur la page courante, jamais tout le catalogue. Une page
     sans instrument pertinent (compte, réglages...) coupe le
     rafraîchissement. */
  /* Cotations : n'appeler assurerCotations() que sur ce qui est
     RÉELLEMENT affiché à l'écran pour cette route — jamais la catégorie
     entière, jamais tout le catalogue. C'est la même liste, scopée par
     page, qui sert aussi de base au rafraîchissement vivant juste après. */
  const listesParRoute = {
    stock: () => [byId[route.arg]].filter(Boolean),
    compare: () => state.compare.map(id => byId[id]).filter(Boolean),
    markets: () => marketsListeVisible(),
    watchlist: () => state.watchlist.map(id => byId[id]).filter(Boolean),
    home: () => [...state.watchlist.map(id => byId[id]), ...stocks.slice(0, 6)].filter(Boolean),
    portfolio: () => state.wallet.positions.map(p => byId[p.id]).filter(Boolean),
  };
  const liveParRoute = {
    stock: () => [route.arg],
    compare: () => state.compare,
    markets: () => marketsListeVisible().slice(0, LIVE_MAX_SYMBOLES).map(s => s.id),
    watchlist: () => state.watchlist,
    home: () => state.watchlist.slice(0, 6),
    portfolio: () => state.wallet.positions.map(p => p.id),
  };
  const listeVisible = (listesParRoute[route.page] || (() => []))();
  /* Alertes actives (2026-09-23) : ajoutées à la liste suivie en direct
     QUELLE QUE SOIT la page courante — une alerte doit continuer à être
     vérifiée même si l'utilisateur navigue ailleurs, pas seulement
     quand la fiche du titre concerné est affichée. demarrerRafraichis-
     sementVivant() déduplique déjà et plafonne à LIVE_MAX_SYMBOLES ;
     limite honnête assumée (voir DEFAULT_STATE.alerts) : au-delà de ce
     plafond partagé avec le reste de la page, les alertes en surplus
     patientent jusqu'à ce qu'une place se libère. */
  const idsAlertesActives = [...new Set(state.alerts.filter(a => !a.triggered).map(a => a.stockId))];
  const idsVisibles = [...(liveParRoute[route.page] || (() => []))(), ...idsAlertesActives];
  /* Ne jamais redemander via assurerCotations() ce que le rafraîchissement
     vivant s'apprête de toute façon à obtenir tout de suite (son tick
     immédiat) — sinon les mêmes premiers symboles partent deux fois dans
     le même cycle (confirmé en test : "OR@PA"/"MC@PA" comptés deux fois).
     assurerCotations() ne comble donc que le RESTE de la page visible,
     au-delà des LIVE_MAX_SYMBOLES suivis en direct. */
  const idsVivantsSet = new Set(idsVisibles);
  const resteACombler = listeVisible.filter(s => s && !idsVivantsSet.has(s.id));
  if (resteACombler.length) assurerCotations(resteACombler);
  if (idsVisibles.length) demarrerRafraichissementVivant(idsVisibles);
  else arreterRafraichissementVivant();

  /* Sparklines de la grille Marché (bug réel confirmé en test : stockRow()
     sait dessiner une mini-courbe depuis longtemps via opts.spark, mais
     RIEN dans toute l'application ne passait jamais spark:true — la
     grille Marché n'affichait donc jamais aucune courbe, quel que soit
     l'instrument). Même philosophie "à la demande" que assurerCotations()
     ci-dessus : uniquement les lignes RÉELLEMENT visibles de la page
     courante, jamais tout le catalogue.
     Période "1j" (intraday 5min, voir PERIOD_SPECS côté history.js) et
     non le défaut ~260 séances/1 an de chargerGraphique() (celui-ci
     reste réservé à Comparer/volatilité, voir son propre commentaire) :
     demande explicite de l'utilisateur, la mini-courbe doit représenter
     la séance du JOUR, jamais une tendance longue qui pourrait aller à
     l'encontre de sa propre couleur (verte/rouge selon varPct du jour).
     chargerGraphiquePeriode() dédoublonne déjà lui-même (HISTP_ENCOURS/
     HISTP) — un ré-appel sur un instrument déjà chargé ou en cours ne
     redéclenche aucune requête réseau.
     CORRECTIF (fluidité, bug réel trouvé en test) : marketsListeVisible()
     n'est PAS plafonnée à 20 — "Voir plus" fait grimper marketsVisibles
     sans limite (confirmé en test : 140 après quelques clics), et
     contrairement à assurerCotations() juste au-dessus (lots de 8, par
     vagues plafonnées), cette boucle partait sans AUCUN plafond : 140
     lignes visibles -> 140 requêtes /api/market/history simultanées.
     Plafonné à CHARGEMENT_MASSE_MAX_SYMBOLES (même constante que le
     chargement de masse ci-dessous) : au-delà, les lignes les plus bas
     dans la page restent simplement sans sparkline plutôt que de
     surcharger le réseau pour des cartes hors ou presque hors écran. */
  if (route.page === 'markets') marketsListeVisible().slice(0, CHARGEMENT_MASSE_MAX_SYMBOLES)
    .forEach(s => { if (s) chargerGraphiquePeriode(s, '1j'); });

  /* Chargement du catalogue mondial (audit performance, 2026-09-29) :
     plus jamais chargé au démarrage (voir boot()) — seules les routes
     qui en ont réellement besoin le déclenchent ici, à la demande. */
  if (route.page === 'markets' || route.page === 'radar') assurerCatalogueGlobal();
  if (route.page === 'home') assurerApercuAccueil();

  /* view.innerHTML vient de remplacer tout le DOM : #chart-pro (s'il existe
     dans la page courante) est un nouveau noeud, l'éventuelle instance
     Lightweight Charts précédente est donc déjà orpheline. requestAnimationFrame
     laisse le navigateur terminer la mise en page avant de mesurer le
     conteneur (nécessaire à `autoSize`). mountChartPro() se charge elle-même
     de détruire proprement toute instance ancienne. */
  requestAnimationFrame(() => mountChartPro());

  animate();
}
function animate(){
  const view = document.getElementById('view');
  requestAnimationFrame(() => {
    view.querySelectorAll('.bar-fill[data-w]').forEach(b => b.style.width = b.dataset.w + '%');
    view.querySelectorAll('.ring .fg[data-ring]').forEach(c => c.style.strokeDashoffset = c.dataset.ring);
  });
  if (!('IntersectionObserver' in window)){
    view.querySelectorAll('.rise').forEach(e => e.classList.add('seen')); return;
  }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting){ e.target.classList.add('seen'); io.unobserve(e.target); }
  }), { rootMargin:'0px 0px -8% 0px' });
  view.querySelectorAll('.rise').forEach(e => io.observe(e));
}
function go(page, arg){
  if (route.page !== page || route.arg !== arg) history_.push({ ...route });
  route = { page, arg: arg ?? null };
  state.page = page; state.stockId = arg ?? null; saveState();
  /* CORRECTIF (2026-09-25, retour utilisateur : "rien n'est affiché" sur
     Nova News) : chargerNovaNewsMonde() lui-même reste "chargé à la
     demande" (jamais appelé DEPUIS PAGES.novanews(), qui provoquerait un
     render() imbriqué — voir le commentaire à sa définition), mais un
     visiteur qui arrive sur la page voit sinon UNIQUEMENT un bouton
     "Voir les actualités", jamais un article, ce qui ressemble à une
     page vide/cassée pour une fonctionnalité demandée "en temps réel".
     Déclenché ICI, depuis la navigation elle-même (jamais depuis le
     rendu), donc sans risque de render() imbriqué : chargerNovaNewsMonde()
     gère déjà son propre idle/loading/loaded, un appel répété (ex.
     revenir sur la page) ne redéclenche rien tant que déjà chargé. */
  if (page === 'novanews'){ chargerNovaNewsMonde(); demarrerRafraichissementNovaNews(); }
  else arreterRafraichissementNovaNews();
  render(true);
}
function back(){
  const prev = history_.pop();
  route = prev || { page:'home', arg:null };
  if (route.page !== 'novanews') arreterRafraichissementNovaNews();
  render(true);
}

function applySettings(){
  applyTheme();
  const r = document.documentElement;
  r.style.fontSize = state.settings.fontSize === 'large' ? '17.5px' : '';
  r.classList.toggle('no-anim', state.settings.animations === false);

function applyTheme(){
  const wanted = state.settings.theme === 'auto'
    ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
    : (state.settings.theme === 'dark' ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', wanted);
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content', wanted === 'dark' ? '#0d0b14' : '#ffffff');
}

/* CORRECTIF (incohérence UX réelle, audit complet 2026-09-17) : "Vendre"
   liquidait la position ENTIÈRE instantanément au clic (voir le handler
   [data-sell] plus bas, avant ce correctif) — sans montant à choisir, sans
   récapitulatif, sans possibilité d'annuler — alors qu'"Acheter" passe
   par deux écrans réfléchis (montant puis vérification). Un simulateur
   reste un simulateur, mais l'asymétrie restait un vrai risque de clic
   accidentel. Ajoute l'écran de vérification manquant, symétrique à
   openBuyReview, avant tout appel réel à sellStock(). */
function openSellReview(st){
  const pos = positionOf(st.id);
  if (!pos){ toast('Aucune position sur cette valeur'); return; }
  const prix = prixDe(st);
  if (prix === null){ toast('Cours indisponible : vente impossible.'); return; }
  const proceeds = toEUR(prix * pos.qty, st.cur);
  const costBasis = toEUR(pos.avg * pos.qty, st.cur);
  const gain = proceeds - costBasis;
  openSheet(`<div class="buy">
    <p class="buy-co">${esc(st.name)}</p>
    <h3 id="sheetTitle" class="buy-title">Vérifiez votre vente</h3>
    <dl class="buy-rows">
      <div><dt>Type d'ordre</dt><dd>Vente au marché</dd></div>
      <div><dt>Nombre d'actions</dt><dd>${fmt.num(pos.qty, 4)} (position entière)</dd></div>
      <div><dt>Cours</dt><dd>${fmt.cur(prix, st.cur)}</dd></div>
      <div><dt>Gain/perte réalisé estimé</dt><dd class="${gain>=0?'up-t':'down-t'}">${gain>=0?'+':''}${fmt.eur(gain)}</dd></div>
      <div class="buy-total"><dt>Vous recevrez</dt><dd>${fmt.eur(proceeds)}</dd></div>
    </dl>
    <p class="buy-note">Portefeuille virtuel.</p>
    <button class="btn btn-a btn-lg buy-cta" data-sell-ok="${esc(st.id)}">Confirmer la vente</button>

  </div>`);
}

document.addEventListener('click', e => {
  const q = sel => e.target.closest(sel);

  /* Curseur glissant des segmented controls (motion system, 2026-09-21) :
     capture la position de DÉPART avant que le clic ne déclenche le
     changement d'état + render() plus bas dans ce même handler (chaque
     data-chart-period/data-mode/etc. gère son propre state, celle-ci ne

     de .seg n'a besoin d'être modifiée individuellement). */
  const segBtn = q('.seg button');
  if (segBtn){
    const seg = segBtn.closest('.seg');
    const key = seg?.dataset.seg;
    const avant = seg?.querySelector('button[aria-pressed="true"]');

    const v = +(document.getElementById('buyAmt')?.value || 0);

    if (!(v > 0)) { toast('Choisissez un montant.'); return; }
    if (v > state.wallet.cash){ toast('Liquidités insuffisantes.'); return; }
    openBuyReview(st, v); return; }

  const backBtn = q('[data-buy-back]');

  const thesisHorizon = q('[data-thesis-horizon]');

    return;
  }

  const okBuy = q('[data-buy-ok]');

  if (q('[data-gate-email-reset]')){ openGateEmailReset(); return; }
  if (q('[data-gate-email-submit]')){ submitGateEmail(); return; }
  if (q('[data-signout]')){ signOut(); toast('Vous êtes déconnecté'); return; }
  const lvl = q('[data-level]');
  if (lvl){
    state.onboarding.level = lvl.dataset.level;

       (aplatissait 'intermediaire' -> 'debutant') — voir novaLevel()

  const th = q('[data-set-theme]');

  const md = q('[data-mode]');
  if (md){ state.settings.mode = md.dataset.mode; saveState(); render(); return; }

  /* Sélecteur de période de la courbe Portefeuille — purement local
     (walletHistoryPourPeriode filtre l'historique déjà en mémoire), jamais
     de requête réseau : contrairement au graphique d'un titre, aucune
     donnée supplémentaire à charger à la demande ici. */
  const pfp = q('[data-pf-period]');
  if (pfp){ state.ui.pfPeriod = pfp.dataset.pfPeriod; saveState(); render(); return; }

  /* Sélecteur de période du graphique professionnel (fiche instrument).
     chargerGraphiquePeriode() ne relance une requête que si cette période
     n'est pas déjà en cache pour cet instrument — sinon render() seul
     suffit à l'afficher instantanément. */
  const cp = q('[data-chart-period]');
  if (cp){
    const period = cp.dataset.chartPeriod;
    state.ui.chartPeriod = period; saveState();
    const s2 = byId[route.arg];
    if (s2) chargerGraphiquePeriode(s2, period);
    render();
    return;
  }
  /* Onglets de la fiche action (2026-09-28, pivot NovaTitre) — même
     mécanique que data-chart-period ci-dessus (état UI global, persisté,
     jamais par titre précis, cohérent avec chartPeriod/chartMode déjà
     ainsi). */
  const st2 = q('[data-stock-tab]');
  if (st2){ state.ui.stockTab = st2.dataset.stockTab; saveState(); render(); return; }
  const cm = q('[data-chart-mode]');
  if (cm){ state.ui.chartMode = cm.dataset.chartMode; saveState(); render(); return; }

  const retryChart = q('[data-retry-chart]');
  if (retryChart){
    const s2 = byId[retryChart.dataset.retryChart];
    const period = CHART_PERIODS.some(p => p.api === state.ui.chartPeriod) ? state.ui.chartPeriod : '3m';
    if (s2) chargerGraphiquePeriode(s2, period);
    return;
  }

  const marketsPlus = q('[data-markets-plus]');
  if (marketsPlus){
    /* +20 seulement — jamais tout le reste d'un coup, même si l'utilisateur
       clique plusieurs fois de suite ("Voir plus" progressif, pas une
       bascule "tout charger"). render() relance PAGES.markets(), qui
       redéclenche garantirCatalogueMarkets() avec le nouveau seuil : si le
       catalogue local est insuffisant, une page catalogue supplémentaire
       est chargée automatiquement. */
    state.filters.marketsVisibles = (state.filters.marketsVisibles || 20) + 20;
    saveState();
    render();
    return;
  }

  /* Panneau Filtres de Marchés (fusion Explorer, 2026-09-23) — voir
     openMarketsFilters()/marketsFilterDraft plus haut. data-mf-* est
     volontairement distinct de [data-filter] (Radar) : ces puces
     modifient un BROUILLON, jamais state.filters directement. */
  if (q('[data-open-market-filters]')){ openMarketsFilters(); return; }
  const mf = q('[data-mf]');
  if (mf && marketsFilterDraft){
    marketsFilterDraft[mf.dataset.mf] = mf.dataset.mfVal;
    paintMarketsFilters();
    return;
  }
  if (q('[data-mf-reset]')){
    marketsFilterDraft = { ...MARKETS_FILTER_DEFAULTS, _paysQ:'' };
    paintMarketsFilters();
    return;
  }
  if (q('[data-mf-apply]') && marketsFilterDraft){
    state.filters.marketsCategory = marketsFilterDraft.marketsCategory;
    state.filters.marketsRegion = marketsFilterDraft.marketsRegion;
    state.filters.marketsSector = marketsFilterDraft.marketsSector;
    state.filters.marketsCountry = marketsFilterDraft.marketsCountry;
    state.filters.marketsVisibles = 20;
    saveState();
    closeSheet();
    marketsFilterDraft = null;
    if (route.page === 'markets') render();
    return;
  }
  const mfRemove = q('[data-mf-remove]');
  if (mfRemove){
    const key = mfRemove.dataset.mfRemove;
    state.filters[key] = MARKETS_FILTER_DEFAULTS[key];
    state.filters.marketsVisibles = 20;
    saveState();
    render();
    return;
  }

  /* Puces de filtre rapide Marchés (Tous/US/Europe/France/Allemagne/
     Royaume-Uni) : appliquées IMMÉDIATEMENT (comme [data-filter] sur
     Radar), jamais via le brouillon du panneau — voir MARKETS_QUICK_FILTERS
     dans page-markets.js pour la correspondance région/pays exacte. */
  const mfq = q('[data-mf-quick]');
  if (mfq){
    const cible = MARKETS_QUICK_FILTERS.find(f => f.id === mfq.dataset.mfQuick);
    if (cible){
      state.filters.marketsRegion = cible.region;
      state.filters.marketsCountry = cible.country;
      state.filters.marketsVisibles = 20;
      saveState();
      render();
    }
    return;
  }

  const flt = q('[data-filter]');
  if (flt){
    state.filters[flt.dataset.filter] = isNaN(flt.dataset.val) ? flt.dataset.val : +flt.dataset.val;
    saveState();
    document.querySelectorAll(`[data-filter="${flt.dataset.filter}"]`).forEach(b=>
      b.setAttribute('aria-pressed', String(b.dataset.val === flt.dataset.val)));
    if (route.page === 'radar') document.getElementById('radarOut').innerHTML = radarResults();
    return;
  }
  const nl = q('[data-nl]');
  if (nl){
    const r = parseNaturalQuery(nl.dataset.nl);
    Object.assign(state.filters, r.filters, { radarBig:r.big, radarQ:'' });
    saveState(); render();
    toast(r.applied.length ? 'Filtres appliqués : ' + r.applied.join(', ') : 'Aucun filtre reconnu');
    return;
  }

  if (q('[data-describe-search]')){
    openSheet(`<h3 id="sheetTitle">Décrire ce que vous cherchez</h3>
      <input class="field" id="radarNlInput" type="text" maxlength="300"
        placeholder="Ex. entreprises européennes rentables et peu endettées" style="margin-top:16px">
      <p class="tiny" style="margin-top:10px;color:var(--ink-4)">
        L'interprétation locale est instantanée mais reconnaît peu de formulations.
        « Interpréter avec l'IA » comprend des requêtes plus complexes (compte dans vos analyses mensuelles).</p>
      <div id="radarNlOut"></div>
      <div class="btns" style="margin-top:18px">
        <button class="btn btn-s" data-apply-nl-local style="flex:1">Interprétation locale</button>
        <button class="btn btn-a" data-apply-nl-ai style="flex:1">${svg(ICON.spark,2)} Interpréter avec l'IA</button>
      </div>`);
    document.getElementById('radarNlInput')?.focus();
    return;
  }
  if (q('[data-apply-nl-local]')){
    const texte = document.getElementById('radarNlInput')?.value || '';
    const r = parseNaturalQuery(texte);
    Object.assign(state.filters, r.filters, { radarBig:r.big, radarQ:texte.trim() });
    closeSheet(); saveState(); render();
    toast(r.applied.length ? 'Filtres appliqués : ' + r.applied.join(', ') : 'Aucun filtre local reconnu — essayez l’IA.');
    return;
  }
  const nlAi = q('[data-apply-nl-ai]');
  if (nlAi){
    if (nlAi.disabled) return;
    const texte = document.getElementById('radarNlInput')?.value || '';
    if (!texte.trim()){ toast('Décrivez d’abord ce que vous cherchez.'); return; }
    if (state.auth.status !== 'authenticated'){ toast('Connectez-vous pour utiliser l’IA.'); return; }
    nlAi.disabled = true;
    const out = document.getElementById('radarNlOut');
    if (out) out.innerHTML = `<p class="small" style="margin-top:12px">Interprétation en cours…</p>`;
    (async () => {
      try {
        const r = await authFetch('/api/analyze', { method:'POST', body: JSON.stringify({ mode:'screener', query: texte }) });
        const d = await r.json();
        if (!r.ok) throw Object.assign(new Error(d.error || 'erreur'), { data:d });
        if (d.quota && state.account) Object.assign(state.account, d.quota);
        const fl = d.filters || {};
        state.filters.radarSector = fl.sector || 'tous';
        state.filters.radarCountry = fl.country || 'tous';
        state.filters.radarMin = [0,50,60,70].includes(fl.scoreMin) ? fl.scoreMin : 0;
        state.filters.radarQ = texte.trim();
        closeSheet(); saveState(); render();
        toast(fl.explanation || 'Filtres appliqués.');
      } catch (e){
        const err = e.data || {};
        const msg = { quota_exceeded: err.message || 'Quota mensuel atteint.',
          non_connecte:'Votre session a expiré. Reconnectez-vous.',
          aucun_modele_configure:"Aucun modèle n'est configuré sur le serveur." }[err.error]
          || "L'interprétation n'a pas abouti — essayez l'interprétation locale.";
        const out2 = document.getElementById('radarNlOut');
        if (out2) out2.innerHTML = `<div class="notice" style="margin-top:10px"><b>${esc(msg)}</b></div>`;
      } finally {
        nlAi.disabled = false;
      }
    })();
    return;
  }

  const term = q('[data-term]');
  if (term){
    const g = GLOSSARY[term.dataset.term] || { court:'Aucune explication disponible.' };
    /* Nova Explain (2026-09-28, onboarding adaptatif) : un utilisateur
       "débutant" voit uniquement l'explication courte — le paragraphe
       "pour aller plus loin" (nuances, contre-exemples, mises en garde
       plus techniques) est réservé à intermédiaire/expert, qui l'ont
       déjà eu par défaut jusqu'ici. Rien n'est retiré pour les deux
       autres niveaux, seul le débutant voit une version plus courte. */
    const g2 = novaLevel() === 'debutant' ? { court:g.court, long:null } : g;
    openSheet(`<h3 id="sheetTitle">${esc(term.dataset.term)}</h3><p>${esc(g2.court)}</p>
      ${g2.long?`<div class="notice" style="margin-top:18px;background:var(--bg-2);color:var(--ink-2)">
        <b style="color:var(--ink)">Pour aller plus loin.</b> ${esc(g2.long)}</div>`:''}`);
    return;
  }

  const buy = q('[data-buy]');
  if (buy){ const st = byId[buy.dataset.buy];
    if (!st) { toast('Entreprise introuvable.'); return; }
    if (prixDe(st) === null){ toast('Cours indisponible : achat impossible.'); return; }
    openBuyAmount(st); return; }

  const sell = q('[data-sell]');
  if (sell){ const st = byId[sell.dataset.sell];
    if (!st) { toast('Entreprise introuvable.'); return; }
    openSellReview(st); return; }

  const sellOk = q('[data-sell-ok]');
  if (sellOk){
    if (sellOk.disabled) return;
    sellOk.disabled = true;
    const r = sellStock(sellOk.dataset.sellOk);
    toast(r.msg);
    if (r.ok){ haptics.success(); closeSheet(); render(); } else { haptics.error(); sellOk.disabled = false; }
    return;
  }

  const nova = q('[data-nova]');
  if (nova){
    if (nova.disabled) return;
    nova.disabled = true;
    runAnalysis(nova.dataset.nova).finally(() => { nova.disabled = false; });
    return;
  }

  const cmp = q('[data-cmp]');
  if (cmp){
    const id = cmp.dataset.cmp;
    if (state.compare.includes(id)){
      state.compare = state.compare.filter(x => x !== id);
      toast('Retirée de la comparaison');
    } else if (state.compare.length >= 4){
      toast('Quatre entreprises au maximum'); return;
    } else {
      state.compare.push(id);
      toast('Ajoutée à la comparaison' + (state.compare.length >= 2 ? ` (${state.compare.length})` : ''));
    }
    saveState();
    if (route.page === 'stock') render();   // rafraîchit le libellé du bouton + le lien "Voir la comparaison"
    return;
  }
  const uncmp = q('[data-uncmp]');
  if (uncmp){ state.compare = state.compare.filter(x=>x!==uncmp.dataset.uncmp); saveState(); render(); return; }

  const cperiod = q('[data-cperiod]');
  if (cperiod){ state.ui.pfPeriod = cperiod.dataset.cperiod; saveState(); render(); return; }

  /* Chargement à la demande : ces deux boutons déclenchent respectivement
     l'appel history et l'appel fundamentals pour la société affichée.
     chargerGraphique()/chargerFondamentaux() protègent déjà contre une
     société déjà chargée ou en cours de chargement — le second render()
     ici couvre le cas où les données étaient déjà en cache (ex. société
     déjà vue via Comparer) et où la fonction ne redéclenche donc aucun
     rendu interne. */
  const showChart = q('[data-show-chart]');
  if (showChart){
    const st = byId[showChart.dataset.showChart];
    if (st){
      /* Deux chargements distincts et complémentaires : chargerGraphique()
         (historique quotidien ~260 séances, inchangé) alimente encore
         Comparer/la volatilité/les sparklines de ligne ; chargerGraphiquePeriode()
         alimente le nouveau graphique professionnel à la période actuellement
         sélectionnée. Chacun a son propre cache et ne redemande jamais ce
         qu'il a déjà. */
      chargerGraphique(st);
      const period = CHART_PERIODS.some(p => p.api === state.ui.chartPeriod) ? state.ui.chartPeriod : '3m';
      chargerGraphiquePeriode(st, period);
      render();
    }
    return;
  }
  const showFund = q('[data-show-fundamentals]');
  if (showFund){
    const st = byId[showFund.dataset.showFundamentals];
    if (st){ chargerFondamentaux(st); render(); }
    return;
  }
  const showNews = q('[data-show-news]');
  if (showNews){
    const st = byId[showNews.dataset.showNews];
    if (st){ chargerActualites(st); render(); }
    return;
  }
  if (q('[data-show-worldnews]')){ chargerNovaNewsMonde(); render(); return; }
  if (q('[data-nova-review-ia]')){ genererCommentaireNovaReview(); return; }

  const cyc = q('[data-cycle]');
  if (cyc){ state.settings.cycle = cyc.dataset.cycle; saveState(); render(); return; }
  const pl = q('[data-plan]');
  if (pl){ startCheckout(pl.dataset.plan); return; }
  if (q('[data-portal]')){ openPortal(); return; }

  const hit = q('[data-hit]'); if (hit){ pick(hits[+hit.dataset.hit]); return; }
  const rec = q('[data-recent]');
  if (rec){ const i = document.getElementById('sq'); i.value = rec.dataset.recent; paintSearch(i.value); return; }
  if (q('[data-clear-recent]')){ state.recent = []; saveState(); paintSearch(''); return; }

  const newList = q('[data-new-list]');
  if (newList){
    openSheet(`<h3 id="sheetTitle">Nouvelle liste</h3>
      <input class="field" id="listName" type="text" placeholder="Ex. Dividendes, Technologie…" maxlength="60" style="margin-top:16px">
      <div class="chips" style="margin-top:14px">${LIST_COLORS.map((c,i)=>`
        <button class="chip" data-pick-color="${esc(c)}" aria-pressed="${i===0}"
          style="background:${esc(c)};width:28px;height:28px;padding:0;border-radius:50%"></button>`).join('')}</div>
      <div class="btns" style="margin-top:22px">
        <button class="btn btn-s" data-close style="flex:1">Annuler</button>
        <button class="btn btn-a" data-create-list-ok style="flex:1">Créer</button></div>`);
    const input = document.getElementById('listName');
    if (input) input.focus();
    return;
  }
  const pickColor = q('[data-pick-color]');
  if (pickColor){
    document.querySelectorAll('[data-pick-color]').forEach(b => b.setAttribute('aria-pressed', String(b === pickColor)));
    return;
  }
  if (q('[data-create-list-ok]')){
    const nom = document.getElementById('listName')?.value || '';
    const couleurBtn = document.querySelector('[data-pick-color][aria-pressed="true"]');
    const l = creerListe(nom, couleurBtn?.dataset.pickColor);
    if (!l){ toast('Donnez un nom à votre liste.'); return; }
    closeSheet(); toast(`Liste « ${l.name} » créée`);
    go('listDetail', l.id);
    return;
  }

  const alertDir = q('[data-alert-dir]');
  if (alertDir){
    document.querySelectorAll('[data-alert-dir]').forEach(b =>
      b.setAttribute('aria-pressed', String(b === alertDir)));
    return;
  }
  const createAlerte = q('[data-create-alerte]');
  if (createAlerte){
    const stockId = createAlerte.dataset.createAlerte;
    /* CORRECTIF (audit LOT F, 2026-09-24) : même correctif que
       toggleWatch() ci-dessus — LIMITS.alerts (api/me.js) n'était jamais
       vérifiée avant cette création. */
    const limits = state.account?.limits;
    if (limits && !limits.alertsUnlimited && state.alerts.length >= limits.alerts){
      toast(`Alertes limitées à ${limits.alerts} en offre ${state.account.planLabel || 'Découverte'} — passez à l'offre supérieure pour en créer plus.`);
      return;
    }
    const target = +document.getElementById('alertTarget')?.value;
    if (!Number.isFinite(target) || target <= 0){ toast('Indiquez un prix cible valide.'); return; }
    const dirBtn = document.querySelector('[data-alert-dir][aria-pressed="true"]');
    const direction = dirBtn?.dataset.alertDir === 'below' ? 'below' : 'above';
    state.alerts.push({ id:'al_'+Date.now().toString(36), stockId, target, direction,
      createdAt:Date.now(), triggered:false });
    saveState();
    closeSheet();
    toast('Alerte créée');
    if (route.page === 'home' || route.page === 'stock') render();
    return;
  }
  const deleteAlerte = q('[data-delete-alerte]');
  if (deleteAlerte){
    state.alerts = state.alerts.filter(a => a.id !== deleteAlerte.dataset.deleteAlerte);
    saveState();
    if (route.page === 'stock') render();
    return;
  }

  const renameList = q('[data-rename-list]');
  if (renameList){
    const l = state.lists.find(x => x.id === renameList.dataset.renameList);
    if (!l) return;
    openSheet(`<h3 id="sheetTitle">Renommer la liste</h3>
      <input class="field" id="listRename" type="text" value="${esc(l.name)}" maxlength="60" style="margin-top:16px">
      <div class="btns" style="margin-top:22px">
        <button class="btn btn-s" data-close style="flex:1">Annuler</button>
        <button class="btn btn-a" data-rename-list-ok="${esc(l.id)}" style="flex:1">Enregistrer</button></div>`);
    return;
  }
  const renameOk = q('[data-rename-list-ok]');
  if (renameOk){
    renommerListe(renameOk.dataset.renameListOk, document.getElementById('listRename')?.value || '');
    closeSheet(); render();
    return;
  }

  const recolorList = q('[data-recolor-list]');
  if (recolorList){
    const l = state.lists.find(x => x.id === recolorList.dataset.recolorList);
    if (!l) return;
    openSheet(`<h3 id="sheetTitle">Couleur et icône</h3>
      <p class="small" style="margin-top:6px">Couleur</p>
      <div class="chips" style="margin-top:8px">${LIST_COLORS.map(c=>`
        <button class="chip" data-set-color="${esc(c)}" aria-pressed="${c===l.color}"
          style="background:${esc(c)};width:28px;height:28px;padding:0;border-radius:50%"></button>`).join('')}</div>
      <p class="small" style="margin-top:16px">Icône</p>
      <div class="chips" style="margin-top:8px">${LIST_ICONS.map(ic=>`
        <button class="chip" data-set-icon="${esc(ic)}" aria-pressed="${ic===l.icon}">${svg(ICON[ic]||ICON.star,1.8)}</button>`).join('')}</div>
      <div class="btns" style="margin-top:22px">
        <button class="btn btn-a" data-recolor-list-ok="${esc(l.id)}" style="flex:1">Fermer</button></div>`);
    return;
  }
  const setColor = q('[data-set-color]');
  if (setColor){
    document.querySelectorAll('[data-set-color]').forEach(b => b.setAttribute('aria-pressed', String(b === setColor)));
    const l = state.lists.find(x => x.id === q('[data-recolor-list-ok]')?.dataset.recolorListOk);
    if (l) recolorerListe(l.id, setColor.dataset.setColor, l.icon);
    return;
  }
  const setIcon = q('[data-set-icon]');
  if (setIcon){
    document.querySelectorAll('[data-set-icon]').forEach(b => b.setAttribute('aria-pressed', String(b === setIcon)));
    const l = state.lists.find(x => x.id === q('[data-recolor-list-ok]')?.dataset.recolorListOk);
    if (l) recolorerListe(l.id, l.color, setIcon.dataset.setIcon);
    return;
  }
  if (q('[data-recolor-list-ok]')){ closeSheet(); render(); return; }

  const deleteList = q('[data-delete-list]');
  if (deleteList){
    const l = state.lists.find(x => x.id === deleteList.dataset.deleteList);
    if (!l) return;
    openSheet(`<h3 id="sheetTitle">Supprimer « ${esc(l.name)} » ?</h3>
      <p>Les ${l.items.length} valeur${l.items.length>1?'s':''} qu'elle contient ne seront pas suivies ailleurs.</p>
      <div class="btns" style="margin-top:22px">
        <button class="btn btn-s" data-close style="flex:1">Annuler</button>
        <button class="btn btn-a" data-delete-list-ok="${esc(l.id)}" style="flex:1">Supprimer</button></div>`);
    return;
  }
  if (q('[data-delete-list-ok]')){
    supprimerListe(q('[data-delete-list-ok]').dataset.deleteListOk);
    closeSheet(); go('lists');
    return;
  }

  const openAlerte = q('[data-open-alerte]');
  if (openAlerte){
    const st = byId[openAlerte.dataset.openAlerte];
    if (st) openCreateAlerte(st);
    return;
  }
  const addToList = q('[data-add-to-list]');
  if (addToList){
    const stockId = addToList.dataset.addToList;
    const st = byId[stockId];
    if (!st) return;
    const paint = () => `<h3 id="sheetTitle">Ajouter « ${esc(st.name)} » à une liste</h3>
      ${state.lists.length ? `<div class="rows" style="margin-top:14px">${state.lists.map(l => `
        <button class="row" data-toggle-in-list="${esc(l.id)}" data-toggle-stock="${esc(stockId)}">
          <span class="av" style="background:${esc(l.color)}">${svg(ICON[l.icon]||ICON.star,1.8)}</span>
          <span class="row-main"><span class="row-t">${esc(l.name)}</span></span>
          <span class="check-box" aria-pressed="${l.items.includes(stockId)}">${l.items.includes(stockId)?svg(ICON.check,2):''}</span>
        </button>`).join('')}</div>`
        : `<p class="small" style="margin-top:14px">Vous n'avez pas encore de liste.</p>`}
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:14px" data-new-list-from-sheet>
        ${svg(ICON.plus,2)} Nouvelle liste</button>`;
    openSheet(paint());
    return;
  }
  const toggleInList = q('[data-toggle-in-list]');
  if (toggleInList){
    toggleItemListe(toggleInList.dataset.toggleInList, toggleInList.dataset.toggleStock);
    const stockId = toggleInList.dataset.toggleStock;
    const st = byId[stockId];
    document.getElementById('sheetTitle')?.parentElement?.querySelectorAll('[data-toggle-in-list]').forEach(btn => {
      const l = state.lists.find(x => x.id === btn.dataset.toggleInList);
      const box = btn.querySelector('.check-box');
      if (l && box){ const on = l.items.includes(stockId); box.setAttribute('aria-pressed', String(on)); box.innerHTML = on ? svg(ICON.check,2) : ''; }
    });
    render();
    return;
  }
  if (q('[data-new-list-from-sheet]')){
    const l = creerListe('Nouvelle liste ' + (state.lists.length + 1));
    if (l) toast(`Liste « ${l.name} » créée — renommez-la depuis « Mes listes »`);
    closeSheet();
    return;
  }

  if (q('[data-reset]')){
    openSheet(`<h3 id="sheetTitle">Effacer les données locales ?</h3>
      <p>Votre liste de suivi, votre portefeuille virtuel et vos préférences seront effacés de ce navigateur.</p>
      <div class="btns" style="margin-top:22px">
        <button class="btn btn-s" data-close style="flex:1">Annuler</button>
        <button class="btn btn-a" data-reset-ok style="flex:1">Réinitialiser</button></div>`);
    return;
  }
  if (q('[data-reset-ok]')){
    closeSheet();
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
    window.location.reload();
    return;
  }
});

document.getElementById('sheetBg').addEventListener('click', e => {
  if (e.target.id === 'sheetBg') closeSheet();
});
/* CORRECTIF (accessibilité, §57 du brief design system, 2026-09-21) :
   .sheet a bien role="dialog"/aria-modal="true" et restaure le focus à
   la fermeture (lastFocus), mais rien n'empêchait Tab de faire sortir
   le focus clavier VERS LA PAGE DERRIÈRE la feuille ouverte — invisible
   à l'écran (recouverte par l'overlay) mais toujours dans le DOM et
   donc toujours atteignable au clavier. Un utilisateur au clavier ou
   lecteur d'écran pouvait ainsi interagir avec du contenu qu'il ne
   voit pas. Piège de focus minimal : Tab/Shift+Tab ne fait boucler le
   focus qu'ENTRE le premier et le dernier élément focusable de la
   feuille ouverte, jamais au-delà. */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSheet();
  if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)){
    e.preventDefault(); openSearch();
  }
  /* Entrée valide le formulaire e-mail de connexion (2026-09-24) —
     ids propres au formulaire (voir gateEmailFormHTML), jamais un
     comportement Entrée générique sur tout input de l'app. */
  if (e.key === 'Enter' && ['gateEmail','gatePassword'].includes(document.activeElement?.id)){
    e.preventDefault(); submitGateEmail();
  }
  if (e.key === 'Tab'){
    const bg = document.getElementById('sheetBg');
    if (bg.hidden) return;
    const sheet = document.getElementById('sheet');
    const focusables = sheet.querySelectorAll(
      'button:not([disabled]), [href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])');
    if (!focusables.length) return;
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});

/* ============================================================
   ANALYSE IA RÉELLE — appelle le serveur, n'invente rien côté client.
   ============================================================ */
const DATA = { mode:'unavailable', at:null, covered:0, provider:null, reason:null };

async function loadRealQuotes(){
  if (!CONFIG.marketConnected){
    DATA.mode = 'unavailable'; DATA.reason = 'source_non_connectee';
    return paintSource();
  }
  /* CORRECTIF ARCHITECTURE : plus question de charger les 70 instruments
     du catalogue au démarrage simplement parce qu'ils existent
     ("catalogue large ≠ tout charger"). On ne charge ici que ce dont
     l'écran d'accueil a RÉELLEMENT besoin pour s'afficher : la liste
     suivie + le petit aperçu marché ("marche", 6 valeurs) que PAGES.home
     affiche systématiquement. Tout le reste (Marchés par catégorie,
     Comparer, une fiche...) se charge à l'ouverture de la page
     correspondante, via assurerCotations() — jamais avant.
     CORRECTIF (audit performance, 2026-09-29) : `stocks` n'est plus
     rempli au démarrage (voir boot()) — sans ce await, ce tout premier
     appel tombait quasi systématiquement AVANT que le catalogue léger
     de l'accueil (assurerApercuAccueil(), 6 valeurs) ait fini de charger,
     donc `stocks.slice(0,6)` était vide et cette toute première tentative
     ne cotait rien pour l'aperçu — corrigé au rendu SUIVANT seulement
     (route-hook de render(), voir son propre commentaire), au prix d'un
     bref "Marché non connecté" evitable. Attendre ici élimine ce délai
     pour le tout premier rendu de la session. */
  await assurerApercuAccueil();
  const besoinsAccueil = [
    ...state.watchlist.map(id => byId[id]),
    ...stocks.slice(0, 6),
  ].filter(Boolean);
  await assurerCotations(besoinsAccueil);
}
function sourceBadge(){
  if (DATA.mode === 'live'){
    const t = new Date(DATA.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    return `<span class="src src-live" title="${DATA.covered} sociétés couvertes">
      <i></i><span class="src-txt">Cours réels · ${t}</span></span>`;
  }
  return `<span class="src src-err" title="Aucune source de marché connectée">
    <i></i><span class="src-txt">Marché non connecté</span></span>`;
}
function paintSource(){
  const el = document.getElementById('srcBadge');
  if (el) el.innerHTML = sourceBadge() + `<span class="build" title="Version">${esc(BUILD)}</span>`;
}
</script>
<script src="/js/nova-ai.js"></script>
<script>async function loadCatalog(){
  try {
    const controller = new AbortController();
    /* CORRECTIF (2026-09-24, expansion mondiale du catalogue, 11 243 ->
       36 765 entreprises) : catalog.json est passé d'environ 4,7 à 15,75 Mo
       non compressés (compressé côté Vercel, mais une connexion lente
       reste plus longue à charger) — délai relevé de 6 à 12s pour éviter
       un abandon prématuré sur mobile/3G, toujours dégradé gracieusement
       (catalogue vide/partiel, voir le catch ci-dessous) si dépassé. */
    const timeout = setTimeout(() => controller.abort(), 12000);
    const r = await fetch('/catalog.json', { signal: controller.signal });
    clearTimeout(timeout);
    if (!r.ok) return;
    const data = await r.json();
    for (const s of data){
      if (byId[s.id]) continue;
      stocks.push(s);
      byId[s.id] = s;
    }
  } catch (e){ console.warn('[catalog] chargement impossible, l\'app continue avec un catalogue vide/partiel', e); }
}

/* Déclenche loadCatalog() (le bloc complet, ~930 Ko compressés) AU PLUS
   UNE FOIS, uniquement depuis les routes qui en ont réellement l'usage
   (Marchés, Radar — voir render()) : Marchés a déjà sa propre pagination
   fine (garantirCatalogueMarkets()/assurerCatalogueSuffisant()) et n'a
   donc pas STRICTEMENT besoin du bloc complet, mais le déclencher ici
   aussi ne coûte rien de plus (même résultat final, juste disponible
   d'un coup plutôt que par pages de 20) et profite à Radar, qui lui n'a
   pas sa propre pagination et a besoin d'un éventail large pour que son
   filtre Pays et son tri par score restent utiles. Jamais appelé pour
   Accueil/Auth/Compte/Portefeuille (voir assurerApercuAccueil()
   ci-dessous pour Accueil, qui n'a besoin que de 6 valeurs). */
let catalogueGlobalPromise = null;
let catalogueGlobalRenderArme = false;
function assurerCatalogueGlobal(){
  if (!catalogueGlobalPromise) catalogueGlobalPromise = loadCatalog();
  /* "Armé" une seule fois, jamais un .then() par appel : render() appelle
     cette fonction à chaque affichage de Marchés/Radar tant que le
     catalogue charge encore, réarmer un .then() à chaque fois causerait
     une rafale de render() redondants à la résolution (même risque que
     le livelock des logos, déjà corrigé plus haut — évité ici en amont). */
  if (!catalogueGlobalRenderArme){
    catalogueGlobalRenderArme = true;
    catalogueGlobalPromise.then(() => {
      if (route.page === 'markets' || route.page === 'radar') render();
    });
  }
  return catalogueGlobalPromise;
}

/* Aperçu "Marché" de l'accueil (6 valeurs, voir PAGES.home et
   loadRealQuotes()) : n'a besoin que d'un tout petit nombre d'entrées,
   jamais du catalogue complet — utilise la pagination existante
   (assurerCatalogueSuffisant(), déjà utilisée par Marchés) plutôt que
   assurerCatalogueGlobal(). Un seul appel réseau léger (20 résultats
   max, voir CATALOG_PAGE_SIZE), jamais répété une fois satisfait. Même
   garde-fou "armé une seule fois" que ci-dessus. */
let accueilApercuRenderArme = false;
function assurerApercuAccueil(){
  const p = assurerCatalogueSuffisant('stock', 6);
  if (!accueilApercuRenderArme){
    accueilApercuRenderArme = true;
    p.then(changement => { if (changement && route.page === 'home') render(); });
  }
  return p;
}

function boot(){
  /* Rejoue le catalogue des sociétés hors catalogue déjà rencontrées
     (positions, sélection Comparer) AVANT tout rendu, pour que byId soit
     complet dès la première fois que portfolioValue()/PAGES.compare() en
     ont besoin. */
  restoreRuntimeCatalog();
  /* Indices boursiers réels (voir seedIndices(), js/core.js) : absents de
     catalog.json et non découvrables via /api/market/search — seule façon
     de les rendre accessibles (recherche locale, Marchés, fiche) est de
     les enregistrer ici, une fois, avant le premier rendu. */
  seedIndices();
  /* Même constat/mécanisme pour les 3 matières premières à convention
     EODHD vérifiée (voir seedCommodities(), js/core.js) — prix réel,
     jamais de graphique du jour (flux intraday EODHD vide pour ces
     symboles, vérifié empiriquement). */
  seedCommodities();

  if (!state.settings.theme) state.settings.theme = 'dark';
  applySettings();
  if (window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => {
      if (state.settings.theme === 'auto') applyTheme();
    });
  }

  /* Filet de sécurité : si une écriture debouncée est encore en attente au
     moment où l'onglet/l'app se ferme ou passe en arrière-plan, on la force
     immédiatement plutôt que de risquer qu'elle ne se déclenche jamais.
     Couvre tous les saveState() debouncés (watchlist, réglages, etc.), pas
     seulement le portefeuille. */
  window.addEventListener('pagehide', flushSaveState);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') flushSaveState();
  });

  /* auth.status = 'loading' dès le boot (voir DEFAULT_STATE/loadState) :
     l'écran neutre s'affiche immédiatement, avant toute résolution réseau,
     et rien de privé ne peut apparaître avant qu'initAuth()/applySession()
     n'ait tranché entre 'guest' et 'authenticated'. */
  document.body.classList.add('gated');
  document.getElementById('view').innerHTML = loadingScreen();

  /* Préchargement des 7 méga-capitalisations (voir son propre
     commentaire, data-services.js) : lancé tout de suite, en parallèle,
     jamais attendu ici -- les cotations, une fois reçues, profitent au
     cache 2 min pour TOUTE page qui affiche ensuite l'une de ces 7
     valeurs (Marchés, Radar, recherche...), pas seulement l'accueil. */
  prechargerTopSymboles();

  /* CORRECTIF (audit performance, 2026-09-29 : catalog.json — 46 404
     entreprises, 20,8 Mo décompressés / ~930 Ko réellement transférés —
     était chargé en ENTIER et INCONDITIONNELLEMENT ici, et le tout
     premier rendu authentifié ATTENDAIT explicitement ce chargement
     (voir l'ancien commentaire "attend que le catalogue soit prêt")
     avant même de lancer initAuth(). Mesuré en direct : ~230-950ms
     ajoutés au démarrage de CHAQUE session, pour Accueil/Auth/Compte/
     Portefeuille qui n'ont jamais besoin des 46 000 entreprises pour
     s'afficher (Accueil n'utilise que 6 valeurs + la liste suivie de
     l'utilisateur, Compte/Portefeuille/Auth aucune du tout).
     Le catalogue n'est plus chargé ici : chaque route qui en a
     RÉELLEMENT besoin (Marchés, Radar, Accueil pour son aperçu 6
     valeurs) le déclenche elle-même depuis render() — voir
     assurerCatalogueGlobal()/assurerApercuAccueil() plus bas, même
     philosophie "à la demande" que assurerCotations()/chargerGraphique().
     L'authentification, elle, n'a jamais eu besoin du catalogue : elle
     démarre donc immédiatement, sans plus rien attendre. */
  loadConfig().then(async () => {
    try { await initAuth(); } catch (e){ console.warn('[auth]', e); state.auth.status = 'guest'; renderGate(); }
    loadRealQuotes();
  }).catch(async () => { state.auth.status = 'guest'; renderGate(); });
}
boot();

</script>
